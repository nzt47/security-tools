# 【2026-10-02 删除 version: '3.8'】Compose V2 已废弃该字段（每次命令都会打印 obsolete 警告，
#   纯噪音且会淹没真正的警告）。删除不改变行为。回滚：加回 version: '3.8' 到本行位置。

services:
  prometheus:
    # 【2026-10-02 · 交付报告 §10 E-1】钉住 tag：原为 :latest，升级会静默改变行为。
    #   v2.51.0 是本部署实测跑通 155 条规则热加载的版本；回退=改回 :latest（不建议）。
    image: prom/prometheus:v2.51.0
    container_name: yunshu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      # [CHG-2026-0729] 挂载 rules 目录，使 reranker-alerts.yml 等子目录规则生效
      # [S6 2026-09-20] 该挂载点在容器内是 /etc/prometheus/rules，因此 prometheus.yml 里引用这些
      # 文件必须写 "rules/xxx.yml"（原写成 "prometheus/rules/xxx.yml" 解析到不存在的路径，
      # 导致本挂载长期未真正生效）。回退：恢复原前缀即可，但不建议。
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      # [2026-08-28] 健康度评估体系规则（记录规则 + 告警规则）
      - ./monitoring/health_recording_rules.yml:/etc/prometheus/health_recording_rules.yml:ro
      - ./monitoring/health_alerts.yml:/etc/prometheus/health_alerts.yml:ro
      # ── [S6 2026-09-20] 补齐 prometheus.yml 新增 rule_files 项的挂载 ──────────────
      # 为什么必须同时改这里：Prometheus 把 rule_files 的相对路径按【/etc/prometheus】解析，
      # 凡是在 prometheus.yml 里列了、但容器内不存在的规则文件，都会导致 Prometheus 启动/热加载
      # 失败（no such file），比不写更糟；只补 rule_files 不补挂载 = 直接把监控打挂。
      # 回退方式：与 monitoring/prometheus.yml 中新增的 10 条 rule_files 成对删除。
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./monitoring/alerts_production.yml:/etc/prometheus/alerts_production.yml:ro
      # 【2026-10-02 · §10 A-1】原 alerts_safe_file_reader.yml 挂载已删除（规则文件与
      #   monitoring/prometheus.yml 的 rule_files 项一并删除）：它的 9 条规则恒不触发（指标无产出方）。
      #   恢复 = 三处一起补回（文件 + rule_files + 本挂载）。
      - ./monitoring/circuit_breaker_alerts.yml:/etc/prometheus/circuit_breaker_alerts.yml:ro
      - ./monitoring/alerts/skill_retrieval_alerts.yml:/etc/prometheus/skill_retrieval_alerts.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      # 注：rules/ 前缀的 4 个新文件已由上面的 ./monitoring/prometheus/rules 目录挂载覆盖，无需再单挂。
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - yunshu-monitoring

  grafana:
    # 【2026-10-02 · 交付报告 §10 E-1】钉住 tag：10.4.0 实测 /metrics 可用（GrafanaDown 依赖它）。
    image: grafana/grafana:10.4.0
    container_name: yunshu-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      # 【2026-10-02 新增】显式打开 /metrics（与 aliyun 变体保持一致，理由见该文件同处注释）。
      #   prometheus.yml 的 job_name: grafana 与 alerts.yml 的 GrafanaDown 依赖它。
      - GF_METRICS_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      # [变易] 挂载 unified alerting 规则目录（Grafana 8+ 自动加载 *.yml）
      - ./monitoring/grafana/alerting:/etc/grafana/provisioning/alerting
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - yunshu-monitoring

  # ── 【2026-10-02 · 交付报告 §10 C-1】Alertmanager：告警**投递**链路（默认不启用）──
  #   【为什么默认不启用】它必须有真实的接收方（邮件/企微/钉钉/自建网关）才有意义，
  #     而接收方地址与凭据属部署方信息，不该由代码仓库假定。
  #   【已验证】链路本身可用：Prometheus → Alertmanager → webhook 全通（证据见
  #     docs/closeout/监控清理_evidence_20261002/alertmanager_delivery_received.jsonl）。
  #   【启用】① cp monitoring/alertmanager.example.yml monitoring/alertmanager.yml 并填接收方；
  #     ② 取消下面 8 行注释；③ 取消 monitoring/prometheus.yml 里 alerting 段的注释；④ docker compose up -d
  #   【回退】重新注释掉这三处即可（不影响 Prometheus/Grafana 本身）。
  # alertmanager:
  #   image: prom/alertmanager:v0.27.0
  #   container_name: yunshu-alertmanager
  #   ports:
  #     - "9093:9093"
  #   volumes:
  #     - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
  #   restart: unless-stopped
  #   networks:
  #     - yunshu-monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  yunshu-monitoring:
    driver: bridge
