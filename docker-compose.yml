version: '3.8'

services:
  digital-life:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-life-test
    restart: unless-stopped
    
    environment:
      - ERROR_REPORTING_CONSOLE_LEVEL=warning
      - ERROR_REPORTING_FILE_ENABLED=true
      - ERROR_REPORTING_FILE_PATH=/app/logs/digital_life_errors.log
      - ERROR_REPORTING_FILE_LEVEL=error
      - ERROR_REPORTING_WEBHOOK_ENABLED=false
      - ERROR_REPORTING_SLACK_ENABLED=false
      # 功能开关
      - YUNSHU_FEATURE_SANDBOX=${YUNSHU_FEATURE_SANDBOX:-false}
      # [CHG-2026-0801] Reranker 热重载配置（Linux Docker 环境可安全启用）
      - SKILL_RERANKER_ENABLED=${SKILL_RERANKER_ENABLED:-false}
      - SKILL_RERANKER_USE_ONNX=${SKILL_RERANKER_USE_ONNX:-true}
      - SKILL_RERANKER_ONNX_VARIANT=${SKILL_RERANKER_ONNX_VARIANT:-model_quantized.onnx}
      - SKILL_RERANKER_HOT_RELOAD_INTERVAL=${SKILL_RERANKER_HOT_RELOAD_INTERVAL:-30}

    ports:
      - "5678:5678"

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./.backups:/app/.backups
      # [CHG-2026-0801] HuggingFace 模型缓存（Linux 容器路径）
      - ~/.cache/huggingface:/root/.cache/huggingface
    
    networks:
      - digital-life-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  digital-life-network:
    driver: bridge
