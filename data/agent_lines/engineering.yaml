id: engineering
name: 自主编码与工程交付
description: 云枢作为可自主干活的工程 agent。读写代码、搜索、执行、验证为核心链路，self-modification 与长任务降为支撑层。
enabled: true
plane_weights:
  act: 1.0
  perceive: 1.0
  resident: 0.6
plane_floors:
  act: 4
  govern: 1
  perceive: 4
  resident: 3
boost:
- read_file
- grep
- search_files
- list_directory
- get_file_info
- write_file
- edit
- diff_files
- shell_execute
- code_review
- delegate
- submit_task
- get_task_status
- get_task_result
- todo_write
- search_memory
- remember
- session_search
- session_trace
# UI 规范守卫（2026-11-21 Owner 决定）：读工具默认可见；写工具默认停用（YAML enabled:false），
# 进 boost 是为了启用后仍稳定可见（停用期间不进可见集）。
- ui_guard_check
- ui_guard_fix
# E1-2b（2026-11-25）：goal 是长任务推进的唯一模型侧入口，boost 保证它不被名额截断；
# 同步把 max_tools 27→28（加一个仍保留 run_lint / run_sandbox，实测零丢失）。
- goal
# E3-2（2026-11-27）：.docx 正文/表格抽取。read_file 对 docx 只能回 binary，模型没有它就
# 读不到 Word；进 boost 是为了不被名额截断（与 ui_guard/goal 同一处置）。
- docx_read
# E3-2（2026-11-27）：.xlsx 取值矩阵抽取（同上；离线装配实测：max_tools 33 时零丢失）。
- xlsx_read
# E3-2 收口（2026-11-27）：.pptx 每页正文/表格抽取（同上；preview 实测 max_tools 34 零丢失）。
- pptx_read
# E4-1（2026-11-27）：脚本编排（默认关 CP_ORCH_SCRIPT_ENABLED=0）。进 boost 是为了
# 开关打开后**稳定可见**（与 ui_guard_fix 同一处置）；离线装配实测（排序候选池）：
#   只加 YAML 不动 boost：max_tools 34 时它挤掉 run_tests；
#   boost + max_tools 35：added=[run_tests]（找回）、lost=[]、总数 35=上限。
- run_orchestration_script
# E4-3（2026-11-27）：MCP resources/prompts 只读读取（YAML 默认停用观察）。进 boost 是
# 为了启用后**稳定可见**（与 ui_guard_fix 同一处置）；离线装配实测（排序候选池）：
#   只加 YAML 不动 boost：它不入选；
#   boost + max_tools 35：added=[mcp_resource]、lost=[run_tests]（挤掉）；
#   boost + max_tools 36：added=[mcp_resource]、lost=[]、总数 36=上限。
- mcp_resource
# E3-1 开关开通（2026-11-28 Owner 拍板）：持久终端（PTY）进 boost，开关打开后稳定可见；
#   preview 实测：max_tools 36 时它**挤掉 run_tests**，37 时 added=[terminal]、lost=[]（零丢失）。
- terminal
mute:
- web_extract
- web_batch
- web_search
tags:
- code
- orchestrate
# 26 → 27（2026-11-21）：加两个 ui_guard boost 后，实测 26 会挤掉 run_tests；27 实测零丢失。
# 30 → 32（2026-11-27）：/api/agent-lines/preview 实测 —— 加 docx_read 到 boost 时，
#   30 会挤掉 run_sandbox；31 零丢失；32 还能把此前已被挤掉的 run_tests 找回来
#   （实测 added=[docx_read, run_tests]，lost=[]）。
# 32 → 33（2026-11-27）：再加 xlsx_read 到 boost；离线装配实测 added=[xlsx_read]、lost=[]。
# 33 → 34（2026-11-27）：再加 pptx_read 到 boost；preview 实测 added=[pptx_read]、lost=[]。
# 34 → 35（2026-11-27 E4-1）：run_orchestration_script 进 boost。离线装配（排序候选池）实测：
#   34 时新工具挤掉 run_tests；35 时 added=[run_tests]（找回）、lost=[]、无截断。
# 35 → 36（2026-11-27 E4-3）：mcp_resource 进 boost；35 时它挤掉 run_tests，36 时零丢失。
# 36 → 37（2026-11-28 E3-1 开关开通）：terminal 进 boost；preview 实测 36 时挤掉 run_tests、37 时零丢失。
max_tools: 37
# 本分身默认上下文窗口（2026-11-15）：按任务类型的建议起点取中位 —— 代码 Agent / 跨文件理解：需要上下文，但推理比检索更怕噪声
context_window_tokens: 65536
effect_allow:
- read
- write
- execute
requires_approval:
- execute
allow_govern: false
skills:
- engineering-test-delivery
- code-observability
- testing-anti-patterns
- global-core-principles
- context_aware
- emotion_expression
- memory_summary
- proactive_suggestion
- safety_guard
- self_reflection
- voice_interaction
prompt_note: '本线的交付标准是"改完并验证"：改动前先 read_file/grep 摸清现状，

  改动用 edit 做最小替换，改完必须跑验证（测试/lint/复现脚本）并报告结果。

  不可跳过的边界：不得为了通过而放宽测试，不得留下未验证的改动。

  '
topics:
- general
- engineering
- ops
