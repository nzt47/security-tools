id: engineering
name: 自主编码与工程交付
description: 云枢作为可自主干活的工程 agent。读写代码、搜索、执行、验证为核心链路，self-modification 与长任务降为支撑层。
enabled: true
plane_weights:
  act: 1.0
  perceive: 1.0
  resident: 0.6
plane_floors:
  act: 4
  govern: 1
  perceive: 4
  resident: 3
boost:
- read_file
- grep
- search_files
- list_directory
- get_file_info
- write_file
- edit
- diff_files
- shell_execute
- code_review
- delegate
- submit_task
- get_task_status
- get_task_result
- todo_write
- search_memory
- remember
# UI 规范守卫（2026-11-21 Owner 决定）：读工具默认可见；写工具默认停用（YAML enabled:false），
# 进 boost 是为了启用后仍稳定可见（停用期间不进可见集）。
- ui_guard_check
- ui_guard_fix
# E1-2b（2026-11-25）：goal 是长任务推进的唯一模型侧入口，boost 保证它不被名额截断；
# 同步把 max_tools 27→28（加一个仍保留 run_lint / run_sandbox，实测零丢失）。
- goal
mute:
- web_extract
- web_batch
- web_search
tags:
- code
- orchestrate
# 26 → 27（2026-11-21）：加两个 ui_guard boost 后，实测 26 会挤掉 run_tests；27 实测零丢失。
max_tools: 28
# 本分身默认上下文窗口（2026-11-15）：按任务类型的建议起点取中位 —— 代码 Agent / 跨文件理解：需要上下文，但推理比检索更怕噪声
context_window_tokens: 65536
effect_allow:
- read
- write
- execute
requires_approval:
- execute
allow_govern: false
skills:
- engineering-test-delivery
- code-observability
- testing-anti-patterns
- global-core-principles
- context_aware
- emotion_expression
- memory_summary
- proactive_suggestion
- safety_guard
- self_reflection
- voice_interaction
prompt_note: '本线的交付标准是"改完并验证"：改动前先 read_file/grep 摸清现状，

  改动用 edit 做最小替换，改完必须跑验证（测试/lint/复现脚本）并报告结果。

  不可跳过的边界：不得为了通过而放宽测试，不得留下未验证的改动。

  '
topics:
- general
- engineering
- ops
