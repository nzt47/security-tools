name: list_mcp_connections
category: extension
description: 列出当前活跃的 MCP 服务连接（连接 ID、名称、传输方式、已注册工具数与工具名）。用于确认 MCP 服务是否接上、其工具是否已进入工具表。List
  active MCP connections
deprecated: false
version: 1.0.0
location: remote
location_reason: "调用链经 agent.tools.mcp_connector:list_connections 命中跨边界原语 urllib.request.Request"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [mcp]
schema:
  type: object
  properties: {}
# 【result_schema（2026-11-24，L2 low 批次）】
#   实调：{ok,connections[],count,note}。 required 只锁 ok（get_status / get_sensor_summary 例外，见各自文件）。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    connections:
      type: array
    count:
      type: integer
    note:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
