name: software_install
category: system
description: 受控安装软件（默认停用，需 Owner 启用）。只接受 config/software_allowlist.json 里精确等值的 package_id；必须显式传 confirm=true 才执行，否则只返回将要执行的命令；winget 优先、choco 备选；装完会再探测一次核对安装态与版本，对不上就如实返回 ok=false。Install software through a controlled allowlist
deprecated: false
enabled: false
version: 1.0.0
plane: act
effect: execute
risk: medium
tags: [software]
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: internal
sandbox_allowed: false
location: remote
location_reason: "调用链经 agent.tools.software_tools:software_install 命中跨边界原语 subprocess.run"
schema:
  type: object
  properties:
    package_id:
      type: string
      description: 白名单里的精确包 id（如 Git.Git）
    confirm:
      type: boolean
      description: 必须显式传 true 才会执行；缺省只返回将要执行的命令
  required:
  - package_id
# 【result_schema（2026-11-24，L2 扩面·medium 批次）】
#   实调失败分支：不在白名单 → 完整回执（ok/package_id/installer/exit_code/
#   installed_before/installed_after/version_before/version_after/changed/verified/
#   elapsed_ms/log_tail/denied_reason/allowlist_size）。成功分支键同形（denied_reason 为空），
#   confirm 缺省时另有 plan{installer,package_id,command}。required 只锁 ok。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    package_id:
      type: string
    installer:
      type: string
    exit_code:
      type: integer
    installed_before:
      type: boolean
    installed_after:
      type: boolean
    version_before:
      type: string
    version_after:
      type: string
    changed:
      type: boolean
    verified:
      type: boolean
    elapsed_ms:
      type: integer
    log_tail:
      type: string
    denied_reason:
      type: string
    allowlist_size:
      type: integer
    plan:
      type: object
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
