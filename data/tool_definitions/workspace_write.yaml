name: workspace_write
category: file
description: 把内容写入受保护工作区内的文件（自动创建父目录，覆盖同名文件）。相对路径越出工作区会被拒绝。Write a file inside the
  protected workspace
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.extra_tools:_workspace_write）在 6 跳内未命中任何跨边界原语；另有 19 个调用点静态无法解析（见 unresolved）"
plane: act
effect: write
risk: medium
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: internal
sandbox_allowed: false
tags: [workspace]
schema:
  type: object
  properties:
    path:
      type: string
      description: 工作区内的相对文件路径，如 notes/plan.md
    content:
      type: string
      description: 要写入的文本内容
  required:
  - path
  - content
# 【result_schema（2026-11-24，L2 扩面·medium 批次）】
#   实调：workspace_write(path, content) → {ok,path,size}（写入后已删除探针文件）；
#   缺 path/content → {ok:false,error}。实现见 agent/tools/workspace_tools.py::write_workspace。
#   required 只锁 ok。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    path:
      type: string
    size:
      type: integer
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
