name: web_search
category: web
description: 搜索互联网信息。默认单引擎搜索，设置 aggregate=true 启用多引擎聚合：并发调用 2-3 个搜索引擎，去重评分排序后返回最优结果（质量更高但稍慢）。preset='news' 进入新闻模式：用多条英文查询检索国际新闻，按来源（BBC、CNN、Reuters、AP 等）优先排序，query 作为新闻主题（留空取综合新闻），返回摘要式结果与发布时间。Search the web, find information online, internet search, latest news headlines
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.web_tools:_web_search）在 6 跳内未命中任何跨边界原语；另有 113 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: false
tags: [web]
schema:
  type: object
  properties:
    query:
      type: string
      description: 搜索关键词（必填）
    engine:
      type: string
      description: 指定搜索引擎名称（可选）。不指定按优先级自动选择。注意：aggregate=true 时此参数被忽略
    num_results:
      type: integer
      description: 期望返回的结果数量，默认 10，最大 50；preset='news' 时上限 15
    page:
      type: integer
      description: 页码（仅单引擎模式有效），默认 1
    aggregate:
      type: boolean
      description: 启用多引擎聚合搜索模式。true=并发多引擎去重评分排序（质量更高），false=单引擎快速搜索（默认）。preset='news' 时忽略
    preset:
      type: string
      enum: [default, news]
      description: 检索预设。default=常规网页搜索（默认）；news=新闻模式，用多条英文查询检索国际新闻并按来源（BBC、CNN、Reuters、AP 等）优先排序，query 作为新闻主题（留空取综合新闻）
  required:
  - query
examples: []
