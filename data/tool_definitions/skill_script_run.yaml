name: skill_script_run
category: code
description: 在沙箱里执行某个技能的 L3 脚本（scripts/*.py）：脚本代码不进上下文，只有执行结果（JSON）返回。参数：skill_id 技能 id（必填，必须有 scripts/*.py）、script_name 脚本文件名（默认 main.py，只能取该技能 scripts/ 下的文件）、params 传给脚本的 JSON（经 stdin，省略时用技能的 default_params）、timeout 超时秒数（默认 30，上限 120）。每次调用都需要人工确认且不自动重试；技能没有脚本返回「不适用」而不是执行失败。Run a skill script in sandbox, execute skill L3 script
deprecated: false
version: 1.0.0
enabled: false
location: remote
location_reason: 调用链经 agent.skills_mgmt.service:execute_skill_script 命中跨边界原语 subprocess.run（agent/skills_mgmt/executor.py）
plane: act
effect: execute
risk: high
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: restricted
sandbox_allowed: false
tags:
- skill
- script
- sandbox
schema:
  type: object
  properties:
    skill_id:
      type: string
      description: 技能 id（必须有可执行脚本 scripts/*.py）
    script_name:
      type: string
      description: 脚本文件名，默认 main.py；只能是该技能 scripts/ 目录下的文件
    params:
      type: object
      description: 传给脚本的 JSON 参数（经 stdin）；省略时用技能的 default_params
    timeout:
      type: integer
      description: 超时秒数，默认 30，最大 120
  required:
  - skill_id
# 【result_schema（2026-11-24，L2 high 批次；失败分支实调 + 实现 return 核对）】
#   成功/失败同形：ok/skill_id/script_name/success/exit_code/duration_ms/timed_out/
#   validation_status；成功另有 result，运行输出有 stdout_tail/stderr_tail，
#   失败有 error；缺参/不适用另有 applicable/available_scripts。只锁 ok。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    skill_id:
      type: string
    script_name:
      type: string
    success:
      type: boolean
    exit_code:
      type: integer
    duration_ms:
      type: number
    timed_out:
      type: boolean
    validation_status:
      type: string
    result:
      type: object
    stdout_tail:
      type: string
    stderr_tail:
      type: string
    applicable:
      type: boolean
    available_scripts:
      type: array
      items:
        type: string
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
