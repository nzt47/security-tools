name: diff_files
category: file
description: 比较两个文本文件的差异，返回 unified diff 格式（类似 git diff 输出）。自动统计新增行数、删除行数和总变更数。文件大小限制
  10MB
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.file_tools_reg:_diff_files）在 6 跳内未命中任何跨边界原语；另有 36 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [code]
schema:
  type: object
  properties:
    path1:
      type: string
      description: 第一个文件路径（必填，作为对比基准）
    path2:
      type: string
      description: 第二个文件路径（必填，作为对比目标）
    context_lines:
      type: integer
      description: 差异上下文显示行数，默认 3。设为 0 只显示变更行，设为较大值显示更多上下文
  required:
  - path1
  - path2
# 【result_schema（V2.0 §3.4「output_schema 不可或缺」）】
#   形状读 agent/diff_tools.py:26 `diff_files` 的两个返回分支得出：
#   · 成功 :139（ok/diff/path1/path2/changes/additions/deletions，四个计数均为 int）；
#   · 失败 :54/:59/:62/:67/:70/:100/:103/:110/:113（ok/error）；
#     另有两条**带额外字段**的失败分支：:79 附 path1+size1、:87 附 path2+size2
#     ⇒ size1/size2 必须声明为可选（也正因如此不能把它们放进 required）。
#   注意：docstring 里提到的 duration_ms **并不在返回值里**（仅日志用），
#   故**不**写进 schema —— 照文档而不照代码写就是典型的"假契约"。
#   实跑 diff_files(a.txt,b.txt) 复核：keys=[additions,changes,deletions,diff,ok,path1,path2]。
#   回退：删掉下面整段 result_schema，并把 "diff_files" 从
#   agent/capregistry/contract.py::RESULT_SCHEMA_REQUIRED_TOOLS 移除、
#   把 tests/unit/test_refactor_call_identity_and_recovery.py 的 FLOOR 调回 5。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    diff:
      type: string
    path1:
      type: string
    path2:
      type: string
    changes:
      type: integer
    additions:
      type: integer
    deletions:
      type: integer
    size1:
      type: integer
    size2:
      type: integer
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
