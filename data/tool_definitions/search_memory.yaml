name: search_memory
category: core
description: 搜索我的记忆。scope=all（默认）同时检索语义记忆与事件日志；scope=vector 只做语义（向量）检索；scope=logs 只查事件日志。
deprecated: false
version: 1.1.0
location: remote
location_reason: "调用链经 agent.monitoring.loki:query_logs 命中跨边界原语 requests.Session"
plane: resident
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [memory]
schema:
  type: object
  properties:
    query:
      type: string
      description: 搜索关键词
    scope:
      type: string
      enum:
      - all
      - vector
      - logs
      description: 检索范围：all=语义记忆+事件日志（默认），vector=仅语义记忆，logs=仅事件日志
    max_items:
      type: integer
      description: 返回条数上限，默认 all/logs=10，vector=5
  required:
  - query
examples: []
