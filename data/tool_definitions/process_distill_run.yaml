name: process_distill_run
category: knowledge
description: 过程蒸馏内部执行体（供 AsyncExecutor 后台调用，通常不直接使用）。参数同
  distill_process_from_knowledge，返回完整结果。
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.process_distill.tools:_run_handler）在 6 跳内未命中任何跨边界原语；另有 13 个调用点静态无法解析（见 unresolved）"
plane: act
effect: execute
risk: medium
tool_type: tool
llm_callable: false
callable_mode: manual
permission_level: internal
sandbox_allowed: false
reason: 内部执行体：仅由 AsyncDistill 后台链路按名调用（保留注册、不进模型可见集）
tags: [evolution, knowledge]
internal: true
schema:
  type: object
  properties:
    query:
      type: string
      description: 知识库 wiki 检索关键词（可空）
    paths:
      type: array
      items:
        type: string
      description: 素材文件/目录路径列表（可空，如 ['docs/xxx.md'] 或外部 SKILL.md 目录）
    artifacts:
      type: array
      items:
        type: string
        enum: [workflow, skill]
      description: 固化产物类型，默认 ['workflow','skill']
    top_k:
      type: integer
      description: wiki 检索召回数，默认 5
    max_workers:
      type: integer
      description: 并行子代理数，默认 4
# 【result_schema（2026-11-24，L2 扩面·medium 批次）】
#   实调失败分支：无 query/paths → {ok:false,error}。成功/空素材分支与
#   distill_process_from_knowledge 同源（agent/process_distill/service.py::distill），
#   但本工具是内部执行体（internal/manual），不做 materials 瘦身：
#   {ok,query,paths,llm_used,materials,process,artifacts}。required 只锁 ok。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    query:
      type: string
    paths:
      type: array
      items:
        type: string
    llm_used:
      type: boolean
    materials:
      type: array
    process:
      type: object
    artifacts:
      type: object
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
