name: kb_search
category: knowledge
description: 知识检索（语义融合检索知识卡片）
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.knowledge.tools:kb_search）在 6 跳内未命中任何跨边界原语；另有 27 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [knowledge, memory]
schema:
  type: object
  properties:
    query:
      type: string
      description: 检索问题/关键词
    top_k:
      type: integer
      description: 返回条数（默认 5）
  required:
  - query
# 【result_schema（2026-11-24，L2 low 批次）】
#   成功 {ok,hits[{slug,title,status,type,score,source_ref,snippet}]}；失败 {ok,error}。 required 只锁 ok（get_status / get_sensor_summary 例外，见各自文件）。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    hits:
      type: array
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
