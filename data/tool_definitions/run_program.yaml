name: run_program
category: system
description: 在本地运行白名单程序（如 notepad.exe, calc.exe, python.exe）。args 是参数列表，cwd 是工作目录
deprecated: false
version: 1.0.0
location: remote
location_reason: "调用链经 agent.tools.process_tools:start_process 命中跨边界原语 subprocess.Popen"
plane: act
effect: execute
risk: high
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: restricted
sandbox_allowed: false
tags: [process]
schema:
  type: object
  properties:
    program:
      type: string
      description: 程序名称，如 notepad.exe
    args:
      type: array
      items:
        type: string
      description: 参数列表
    cwd:
      type: string
      description: 工作目录
  required:
  - program
# 【result_schema（2026-11-24，L2 high 批次；实调非白名单程序）】
#   成功 {ok,pid,program}；失败 {ok:false,error[,blocked]}（agent/tools/process_tools.py）。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    pid:
      type: integer
    program:
      type: string
    blocked:
      type: boolean
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
