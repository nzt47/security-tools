name: get_task_result
category: async
description: 获取异步任务的执行结果。已完成的结果保留 1 小时后自动清理，未完成返回当前状态提示。通常流程：submit_task → get_task_status（轮询）
  → get_task_result
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.code_tools:_get_task_result）在 6 跳内未命中任何跨边界原语；另有 6 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [async]
schema:
  type: object
  properties:
    task_id:
      type: string
      description: 任务 ID（由 submit_task 返回）
  required:
  - task_id
# 【result_schema（2026-11-24，L2 low 批次）】
#   实调缺 id；成功键取自 agent/async_executor.py::get_result（task_id/status/result/completed_at，未完成有 message）。 required 只锁 ok（get_status / get_sensor_summary 例外，见各自文件）。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    task_id:
      type: string
    status:
      type: string
    result:
      type: object
    completed_at:
      type: string
    message:
      type: string
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
