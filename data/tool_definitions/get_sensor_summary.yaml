name: get_sensor_summary
category: core
description: 查看所有传感器状态
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.core_tools:_get_sensor_summary）在 6 跳内未命中任何跨边界原语；另有 6 个调用点静态无法解析（见 unresolved）"
plane: resident
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [sensor]
schema:
  type: object
  properties: {}
# 【result_schema（2026-11-24，L2 low 批次）】
#   本工具**直接返回 dl.body.get_sensor_summary()** 的原始摘要字典
#   （total_sensors/enabled_sensors/disabled_sensors/sensors/health[+error]，
#   见 sensor/body_sensor.py::get_sensor_summary），**没有 ok 键**。
#   故 required 为空数组（不伪造 ok）；只锁"是对象"。
result_schema:
  type: object
  properties:
    total_sensors:
      type: integer
    enabled_sensors:
      type: integer
    disabled_sensors:
      type: integer
    sensors:
      type: array
    health:
      type: object
    error:
      type: string
  additionalProperties: true
examples: []
