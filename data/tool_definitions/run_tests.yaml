name: run_tests
category: code
description: 运行项目测试（pytest）并返回结构化结果：通过数、失败数、错误数、耗时与输出摘要。可用 path 限定测试文件/目录，用 pattern
  做 -k 关键字过滤。Run the project test suite, run pytest, execute unit tests
deprecated: false
version: 1.0.0
location: remote
location_reason: "调用链经 agent.tools.test_tools:_run_tests 命中跨边界原语 subprocess.run"
plane: act
effect: execute
risk: medium
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: internal
sandbox_allowed: false
tags: [code, test]
schema:
  type: object
  properties:
    path:
      type: string
      description: 测试文件或目录（相对项目根目录，如 tests/unit/test_x.py）；不传则跑全部
    pattern:
      type: string
      description: pytest -k 过滤表达式，如 "login or logout"，只跑名称匹配的用例
    timeout_sec:
      type: integer
      description: 超时秒数，默认 300，最大 900
    max_output_chars:
      type: integer
      description: 输出尾部保留的字符数，默认 8000
# 【result_schema（2026-11-24，L2 扩面·medium 批次）】
#   实调失败分支：不存在的测试路径 → {ok:false,error:"测试路径不存在: ..."}；
#   pytest 缺失时还会带 pytest_available:false。成功分支键取自
#   agent/tools/test_tools.py::_run_tests 的 return 字面量：
#   {ok,returncode,passed,failed,errors,skipped,duration_sec,summary,output_tail,
#   command,cwd,timeout_sec}；超时分支另有 timeout_sec/duration_sec/output_tail。
#   required 只锁 ok。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    returncode:
      type: integer
    passed:
      type: integer
    failed:
      type: integer
    errors:
      type: integer
    skipped:
      type: integer
    duration_sec:
      type: number
    summary:
      type: string
    output_tail:
      type: string
    command:
      type: array
      items:
        type: string
    cwd:
      type: string
    timeout_sec:
      type: integer
    pytest_available:
      type: boolean
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
