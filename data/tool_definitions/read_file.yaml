name: read_file
category: file
description: 读取本地文件的全部内容（文本），支持指定编码。路径可以是绝对路径或相对路径。Read the content of a local text
  file, open a file
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.file_tools_reg:_read_file）在 6 跳内未命中任何跨边界原语；另有 44 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [code]
schema:
  type: object
  properties:
    path:
      type: string
      description: 文件路径
    encoding:
      type: string
      description: 文件编码，默认 utf-8
    max_size_mb:
      type: integer
      description: 最大读取大小（MB），默认 5
    range:
      type: string
      description: 可选，行范围，如 "1-50" 读取第1到50行
  required:
  - path
# 【result_schema（V2.0 §3.4「output_schema 不可或缺」）】
#   机制早已存在并已接线（agent/capregistry/contract.py + invoke.py 步骤⑦，
#   契约违约会**报告但不改变 status**），缺失的只是**声明覆盖**：
#   本次补前实测仅 3/91 个工具声明了 result_schema。
#   写法沿用仓内既有口径：required 只锁 ok，其余字段可选，additionalProperties: true
#   —— 宁可少检不可误报，避免把正常结果判成违约。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    content:
      type: string
    path:
      type: string
    size:
      type: integer
    encoding:
      type: string
    binary:
      type: boolean
    lines:
      type: integer
    range:
      type: string
    blocked_by:
      type: string
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
