name: kb_capture
category: knowledge
description: 收集素材入库（text 或 file_path → inbox/，敏感自动标记）
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.knowledge.tools:kb_capture）在 6 跳内未命中任何跨边界原语；另有 71 个调用点静态无法解析（见 unresolved）"
plane: act
effect: write
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: internal
sandbox_allowed: false
tags: [knowledge, memory]
schema:
  type: object
  properties:
    text:
      type: string
      description: 素材文本（与 file_path 二选一）
    file_path:
      type: string
      description: 素材文件路径（与 text 二选一）
    source_type:
      type: string
      description: 来源类型（文章/播客/会议…）
# 【result_schema（2026-11-24，L2 low 批次）】
#   实调缺参 + 临时知识库成功：{ok,slug,hint}。 required 只锁 ok（get_status / get_sensor_summary 例外，见各自文件）。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    slug:
      type: string
    hint:
      type: string
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
