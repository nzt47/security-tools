name: look_at_screen
category: system
description: 对当前屏幕（或指定区域）做 OCR，返回带坐标位置的文字。屏幕内容可能含敏感信息，请谨慎转述。需要 OCR 传感器已启用。Read the
  screen with OCR, see what is on screen
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.extra_tools:_look_at_screen）在 6 跳内未命中任何跨边界原语；另有 15 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: medium
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: internal
sandbox_allowed: false
tags: [vision, privacy]
schema:
  type: object
  properties:
    region:
      type: array
      items:
        type: integer
      description: 可选区域 [left, top, width, height]（4 个整数），不传则截取整个屏幕
# 【result_schema（2026-11-24，L2 扩面·按真实返回逐字段核对）】
#   实调失败分支：本机 dl.voice 不可用 → {ok:false,error:"语音/视觉模块不可用（dl.voice 未就绪）"}；
#   region 形状错 → {ok:false,error:"region 必须是 4 个整数的数组 [left, top, width, height]"}。
#   成功分支形状（2026-11-24 修复后实测）：{ok,reading:{timestamp,text,word_count,has_content,
#   char_count},text}。修复前该分支**不可达**（voice_vision 缺 Any 导入、且调了并不存在的
#   OcrSensor.capture_and_ocr）—— 现已改调 capture_and_recognize，接线守卫见
#   tests/unit/test_look_at_screen.py。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    text:
      type: string
    reading:
      type: object
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
