name: look_at_screen
category: system
description: 对当前屏幕（或指定区域）做 OCR，返回带坐标位置的文字。屏幕内容可能含敏感信息，请谨慎转述。需要 OCR 传感器已启用。Read the
  screen with OCR, see what is on screen
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.extra_tools:_look_at_screen）在 6 跳内未命中任何跨边界原语；另有 15 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: medium
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: internal
sandbox_allowed: false
tags: [vision, privacy]
schema:
  type: object
  properties:
    region:
      type: array
      items:
        type: integer
      description: 可选区域 [left, top, width, height]（4 个整数），不传则截取整个屏幕
# 【result_schema（2026-11-24，L2 扩面·按真实返回逐字段核对）】
#   实调失败分支：本机 dl.voice 不可用 → {ok:false,error:"语音/视觉模块不可用（dl.voice 未就绪）"}；
#   region 形状错 → {ok:false,error:"region 必须是 4 个整数的数组 [left, top, width, height]"}。
#   成功分支形状取自包装层 + VoiceVision.look_at_screen 的返回声明：{ok,reading,text}。
#   ！实测成功分支当前**不可达**（不是 schema 的错）：agent/orchestrator/voice_vision.py 只
#   "from typing import Optional" 却注解 Any ⇒ import 即 NameError；且它调用的
#   OcrSensor.capture_and_ocr 并不存在（sensor/ocr_sensor.py 只有 capture_and_recognize）。
#   两处断链已登记为独立缺陷，schema 按「修好后的契约」声明，失败分支照实可校验。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    text:
      type: string
    reading:
      type: object
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
