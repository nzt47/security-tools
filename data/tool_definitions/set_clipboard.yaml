name: set_clipboard
category: system
description: 把文本放进系统剪贴板（clipboard），最多 50000 字符。会覆盖用户剪贴板里已有的内容，属有副作用的写操作，需通过权限与内容安全检查。Set clipboard text.
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.extra_tools:_set_clipboard）在 6 跳内未命中任何跨边界原语；另有 19 个调用点静态无法解析（见 unresolved）"
plane: act
effect: write
risk: medium
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: internal
sandbox_allowed: false
tags: [clipboard]
schema:
  type: object
  properties:
    text:
      type: string
      description: 要写入剪贴板的文本内容（最长 50000 字符）
  required:
  - text
# 【result_schema（2026-11-24，L2 扩面·medium 批次）】
#   实调：空文本 → {ok:false,error:"请提供要写入剪贴板的文本（text）"}；
#   真实写入 → {ok:true}（写后已还原原剪贴板）。实现见 agent/system_tools.py::set_clipboard。
#   required 只锁 ok。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
