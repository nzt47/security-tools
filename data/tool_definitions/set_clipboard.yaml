deprecated: false
version: 1.0.0
plane: act
effect: write
risk: medium
tags: [clipboard]
schema:
  type: object
  properties:
    text:
      type: string
      description: 要写入剪贴板的文本内容（最长 50000 字符）
  required:
  - text
examples: []
