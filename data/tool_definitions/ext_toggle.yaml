name: ext_toggle
category: extension
description: 启用或禁用扩展。临时打开/关闭某个技能、MCP服务或通道。
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.ext_tools:_ext_toggle）在 6 跳内未命中任何跨边界原语；另有 34 个调用点静态无法解析（见 unresolved）"
plane: govern
effect: extend
risk: medium
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: restricted
sandbox_allowed: false
tags: [extension, self_modify]
schema:
  type: object
  properties:
    type:
      type: string
      enum:
      - skill
      - mcp
      - channel
      - plugin
      description: 扩展类型
    id:
      type: string
      description: 扩展ID
    enabled:
      type: boolean
      description: 是否启用（留空则切换当前状态）
  required:
  - type
  - id
examples: []
