name: humanize_zh
category: code
description: 检测中文文本中的 AI 写作痕迹并给出优化建议。基于 24 种 AI 写作模式检测规则（词汇/句式/结构/风格等），返回检测到的模式列表、问题数量和优化建议。aggressive=True
  启用更严格的检测模式
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.code_tools:_humanize_zh）在 6 跳内未命中任何跨边界原语；另有 41 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [text]
schema:
  type: object
  properties:
    text:
      type: string
      description: 待检测的中文文本
    aggressive:
      type: boolean
      description: 是否启用严格检测模式（检测更多边缘情况，如同长度连续句子等），默认 false
  required:
  - text
# 【result_schema（V2.0 §3.4「output_schema 不可或缺」）】
#   形状读**包装层 + 实现**两处得出：
#   · 包装 agent/tools/code_tools.py:95 `_humanize_zh`：
#     :99 失败 -> {ok:False, error}；:101 成功 -> {ok:True, **result}（把实现结果平铺）。
#   · 实现 agent/text_tools.py:408 `humanize_zh` 返回 :730
#     {detected_patterns, total_issues, score, suggestions, text_length, aggressive}
#     （:427 的空文本早退分支同形，且**只**在包装层才会被补上 ok）。
#   · detected_patterns 条目形状见 :443/:454/... 的检测块：
#     {pattern_id:int, name:str, count:int, matches:[str]}。
#   ⚠️ 实现本身**不含 ok**，ok 只由包装层补 —— 这也是必须读包装层的原因。
#   实跑复核：keys=[aggressive,detected_patterns,ok,score,suggestions,text_length,total_issues]。
#   回退：删掉下面整段 result_schema，并把 "humanize_zh" 从
#   agent/capregistry/contract.py::RESULT_SCHEMA_REQUIRED_TOOLS 移除、
#   把 tests/unit/test_refactor_call_identity_and_recovery.py 的 FLOOR 调回 5。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    detected_patterns:
      type: array
      items:
        type: object
        properties:
          pattern_id:
            type: integer
          name:
            type: string
          count:
            type: integer
          matches:
            type: array
            items:
              type: string
        additionalProperties: true
    total_issues:
      type: integer
    score:
      type: integer
    suggestions:
      type: array
      items:
        type: string
    text_length:
      type: integer
    aggressive:
      type: boolean
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
