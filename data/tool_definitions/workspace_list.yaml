name: workspace_list
category: file
description: 列出受保护工作区内的文件与子目录；传入文件路径则返回该文件的前 5000 字符内容。路径越出工作区会被拒绝。List files in the
  protected workspace
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.extra_tools:_workspace_list）在 6 跳内未命中任何跨边界原语；另有 10 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [workspace]
schema:
  type: object
  properties:
    path:
      type: string
      description: 工作区内的相对路径，留空表示工作区根目录
# 【result_schema（2026-11-24，L2 low 批次）】
#   实调：{ok,path,type,items[]}；读文件时另有 content。 required 只锁 ok（get_status / get_sensor_summary 例外，见各自文件）。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    path:
      type: string
    type:
      type: string
    items:
      type: array
    content:
      type: string
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
