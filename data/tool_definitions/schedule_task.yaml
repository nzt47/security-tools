name: schedule_task
category: schedule
description: 创建定时任务，按指定间隔或 cron 表达式周期性触发。必须提供 interval_minutes 或 cron_expr 之一（或两者）。cron
  为 5 字段格式：分 时 日 月 周。支持暂停/恢复/取消管理
deprecated: false
enabled: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.code_tools:_schedule_task）在 6 跳内未命中任何跨边界原语；另有 20 个调用点静态无法解析（见 unresolved）"
plane: act
effect: execute
risk: high
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: restricted
sandbox_allowed: false
tags: [schedule]
schema:
  type: object
  properties:
    name:
      type: string
      description: 任务名称（必填）
    interval_minutes:
      type: integer
      description: 执行间隔（分钟）。如 5 表示每 5 分钟执行一次
    cron_expr:
      type: string
      description: cron 表达式（5字段 分 时 日 月 周）。如 0 9 * * * 表示每天9点，*/5 * * * * 每5分钟
    action:
      type: string
      description: 任务操作描述，如 run_shell_command
    params:
      type: object
      description: '执行参数，如 {"command": "echo hello"}'
  required:
  - name
# 【result_schema（2026-11-24，L2 high 批次；实调 name+interval）】
#   当前动作执行未实现 ⇒ {ok:false,error_code:NOT_IMPLEMENTED,error,implemented:false,
#   action_execution_implemented:false,guidance}；实现后成功走调度器 add_task 的
#   {ok,task...} 并补 action_execution_implemented/note。required 只锁 ok。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    error_code:
      type: string
    error:
      type: string
    implemented:
      type: boolean
    action_execution_implemented:
      type: boolean
    action_execution_note:
      type: string
    guidance:
      type: string
    task:
      type: object
  required: [ok]
  additionalProperties: true
examples: []
