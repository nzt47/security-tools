name: read_spill
category: file
description: 按 locator 分段读取被落盘的大结果（工具结果超过阈值时会回 spilled=true 与 locator；offset/limit 以字符计）；locator 形如 image:... 的图片只回元数据与 OCR 文字。Read a spilled tool result by locator in segments
deprecated: false
version: 1.0.0
location: local
plane: perceive
effect: read
risk: low
tool_type: tool
# E0-2：随 spill 一起上线（只读工具；停用它会让 spill 信封里的 locator 无法取回）
enabled: true
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [code]
schema:
  type: object
  properties:
    locator:
      type: string
      description: 信封里的 locator：spill:0123456789abcdef（大文本，可分段读）或 image:0123456789abcdef（图片，只回元数据与 OCR）
    offset:
      type: integer
      description: 起始字符偏移，默认 0
    limit:
      type: integer
      description: 本次最多返回的字符数，默认 20000，上限 200000
  required:
  - locator
# 【result_schema】按实现 return 字面量声明（agent/context/spill.py::read_locator）：
#   文本成功 {ok,locator,offset,limit,chars_total,returned_chars,next_offset,content}；
#   【2026-11-26 E0-2③】图片 locator 分派到 agent/context/image_offload.py::read_image_locator
#   ⇒ {ok,locator,kind:"image",mime,bytes,width,height,tool,created_at,hint,ocr:{available,text?|note}}；
#   失败 {ok:false, locator?, error}。required 只锁 ok（与仓内口径一致，避免误报）。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    locator:
      type: string
    offset:
      type: integer
    limit:
      type: integer
    chars_total:
      type: integer
    returned_chars:
      type: integer
    next_offset:
      type: integer
    content:
      type: string
    error:
      type: string
    # 【E0-2③】图片 locator 分支的附加字段（文本分支不会出现）
    kind:
      type: string
    mime:
      type: string
    bytes:
      type: integer
    width:
      type: integer
    height:
      type: integer
    hint:
      type: string
    ocr:
      type: object
  required: [ok]
  additionalProperties: true
examples: []
