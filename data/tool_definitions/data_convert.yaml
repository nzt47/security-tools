name: data_convert
category: code
description: 将数据字符串在 JSON 与 YAML 格式之间双向转换：to 参数为 yaml 时把 JSON 转成 YAML，为 json 时把 YAML 转成 JSON（合并了原 json_to_yaml / yaml_to_json 两个方向的全部能力），返回转换结果字符串
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.code_tools:_data_convert）在 6 跳内未命中任何跨边界原语；另有 27 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [data]
schema:
  type: object
  properties:
    data:
      type: string
      description: 待转换的字符串：to=yaml 时为 JSON 文本，to=json 时为 YAML 文本
    to:
      type: string
      enum: [yaml, json]
      description: 目标格式（必填）：yaml = JSON→YAML，json = YAML→JSON
    indent:
      type: integer
      description: JSON 输出缩进空格数，仅 to=json 生效，默认 2
  required:
  - data
  - to
# 【result_schema（V2.0 §3.4「output_schema 不可或缺」）】
#   形状读 agent/data_process_tools.py:291 `data_convert` 得出（纯本地、无网络无模型）：
#   · 成功 :344（JSON→YAML）/ :376（YAML→JSON）-> {ok, data}，data 是结果**字符串**；
#   · 失败 :309/:319/:325/:333/:352/:356/:360/:366/:379/:382 -> {ok, error}。
#   · 包装层 agent/tools/code_tools.py:135 只加了参数校验（ok/error），未增字段。
#   ⚠️ data 的类型是 **string**（转换后的文本）而不是 object —— 若按"数据转换"的
#     字面直觉写成 object，每次成功调用都会被误判为违约。
#   实跑复核：data_convert('{"a":1}',"yaml") -> {ok:true, data:"a: 1\n"}。
#   回退：删掉下面整段 result_schema，并把 "data_convert" 从
#   agent/capregistry/contract.py::RESULT_SCHEMA_REQUIRED_TOOLS 移除、
#   把 tests/unit/test_refactor_call_identity_and_recovery.py 的 FLOOR 调回 5。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    data:
      type: string
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
