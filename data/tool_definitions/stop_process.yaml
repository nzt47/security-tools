name: stop_process
category: system
description: 终止指定 PID 的白名单程序
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.system_tools:_stop_process）在 6 跳内未命中任何跨边界原语；另有 20 个调用点静态无法解析（见 unresolved）"
plane: act
effect: execute
risk: medium
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: internal
sandbox_allowed: false
tags: [process]
schema:
  type: object
  properties:
    pid:
      type: integer
      description: 进程 PID
  required:
  - pid
# 【result_schema（2026-11-24，L2 扩面·medium 批次）】
#   实调失败分支：缺 pid → {ok:false,error:"请提供进程 PID"}；不存在的 pid →
#   {ok:false,error:"进程不存在"}。成功分支键取自 agent/tools/process_tools.py::stop_process：
#   {ok,pid,name}；权限拒绝时工具层返回 {ok:false,error,blocked:true}。required 只锁 ok。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    pid:
      type: integer
    name:
      type: string
    blocked:
      type: boolean
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
