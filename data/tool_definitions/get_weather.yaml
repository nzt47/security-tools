name: get_weather
category: system
description: 查询天气信息。使用 wttr.in 服务，无需 API Key。支持三种格式：text（简洁文本）、json（完整JSON数据）、full（完整文本预报）。Get
  weather forecast, temperature for a city
deprecated: false
version: 1.0.0
location: remote
location_reason: "调用链经 agent.system_tools:get_weather 命中跨边界原语 urllib.request.Request"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: false
tags: [web]
schema:
  type: object
  properties:
    city:
      type: string
      description: 城市名称，如 Beijing、Shanghai、Tokyo，留空自动查询当前IP所在地天气
    format:
      type: string
      enum:
      - text
      - json
      - full
      description: 返回格式：text=简洁文本, json=完整JSON数据, full=完整文本预报
# 【result_schema（2026-11-24，L2 low 批次）】
#   成功/失败键取自 agent/system_tools.py::get_weather（ok/data/format/city/error）。 required 只锁 ok（get_status / get_sensor_summary 例外，见各自文件）。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    data:
      type: string
    format:
      type: string
    city:
      type: string
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
