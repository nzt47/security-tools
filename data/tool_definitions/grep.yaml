name: grep
category: code
description: 按内容（正则表达式）检索文件，返回命中的相对路径、1-based 行号与该行原文。自动跳过 .git/data/node_modules
  等大目录、二进制文件与超过 2MB 的文件。Search file contents by regular expression, search in files,
  grep
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.search_tools:_grep）在 6 跳内未命中任何跨边界原语；另有 42 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [code]
schema:
  type: object
  properties:
    pattern:
      type: string
      description: 正则表达式（必填），如 \bdef\s+compose\b
    path:
      type: string
      description: 搜索根路径，默认当前工作目录
    include:
      type: string
      description: 文件名 glob 过滤，如 *.py 或 *.{md,txt}
    max_results:
      type: integer
      description: 结果条数上限，默认 200
    case_sensitive:
      type: boolean
      description: 是否大小写敏感，默认 false
    context_lines:
      type: integer
      description: 每命中行附加上下文的行数，默认 0
  required:
  - pattern
examples: []
