name: ext_install
category: extension
description: 安装扩展（技能/MCP服务/通道/插件），或按ID自动判别类型后从扩展市场安装。让我能自主获取新能力。
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.ext_tools:_ext_install）在 6 跳内未命中任何跨边界原语；另有 41 个调用点静态无法解析（见 unresolved）"
plane: govern
effect: extend
risk: high
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: restricted
sandbox_allowed: false
tags: [extension, self_modify]
schema:
  type: object
  properties:
    type:
      type: string
      enum:
      - skill
      - claude_skill
      - mcp
      - channel
      - plugin
      - auto
      description: 扩展类型：skill=应用层技能, claude_skill=Claude Code技能, mcp=MCP服务, channel=通信通道, plugin=插件, auto=按 tool_id/source 从内置注册表自动判别类型安装
    source:
      type: string
      description: 扩展来源。格式：内置ID(如 self_reflection / filesystem)，github:user/repo，url:https://...，local:/path，npm:package，pip:package；type=auto 且未给 tool_id 时此值即为待安装的工具/扩展ID
    tool_id:
      type: string
      description: 工具/扩展ID（type=auto 时使用，如 'yunshu-email-plugin'）；与 source 同时给出时 source 视为本次安装来源
    name:
      type: string
      description: 扩展名称（可选，自定义安装时使用）
    description:
      type: string
      description: 扩展描述（可选）
    params:
      type: object
      description: 额外参数（可选，如技能参数、通道配置等）
  required:
  - type
  - source
examples: []
