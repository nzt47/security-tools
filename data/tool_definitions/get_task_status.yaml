name: get_task_status
category: async
description: 查询异步任务的执行状态（pending/running/completed/failed/cancelled）
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.code_tools:_get_task_status）在 6 跳内未命中任何跨边界原语；另有 6 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [async]
schema:
  type: object
  properties:
    task_id:
      type: string
      description: 任务 ID（由 submit_task 返回）
  required:
  - task_id
# 【result_schema（2026-11-24，L2 low 批次）】
#   实调缺 id；成功键取自 agent/async_executor.py::get_status（ok/task_id/status/progress/elapsed）。 required 只锁 ok（get_status / get_sensor_summary 例外，见各自文件）。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    task_id:
      type: string
    status:
      type: string
    progress:
      type: string
    elapsed:
      type: number
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
