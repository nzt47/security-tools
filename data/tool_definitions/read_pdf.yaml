name: read_pdf
category: pdf
description: 读取 PDF 文件中的文本内容（支持指定页码范围）。Extract text from PDF files, parse PDF documents
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.pdf_tools:_read_pdf）在 6 跳内未命中任何跨边界原语；另有 13 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [document]
schema:
  type: object
  properties:
    path:
      type: string
      description: PDF 文件路径
    pages:
      type: array
      items:
        type: integer
      description: 要读取的页码列表（1-based），如 [1, 3, 5]，不传则读取全部页面
  required:
  - path
# 【result_schema（2026-11-24，L2 low 批次）】
#   实调不存在的文件：{ok,text,pages,extracted_pages,error}（失败也回这些键）。 required 只锁 ok（get_status / get_sensor_summary 例外，见各自文件）。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    text:
      type: string
    pages:
      type: integer
    extracted_pages:
      type: integer
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
