# 【E1-3a 分类说明】与 todo_write 一样，本工具只写“本会话的交互台账”
# （data/ask/<sha256(session)[:32]>/）。它不写用户数据、不碰外部系统 ⇒
# effect=read（L0，免摘要确认）：若判成 write 会让“提问”本身先弹审批，
# 用户看不到问题就要先批一次，属于把交互原语当危险动作。
name: ask_user_question
category: core
description: 向用户提出**结构化问题**（单选/多选/自定义），等用户回答后再继续。适用：需求有歧义、有多个可行方案需要用户拍板、缺少关键信息（路径/账号/口径）。options 最多 8 个（每项 {id?, label, description?}）；allow_multiple 允许多选；allow_custom 允许用户自己填。提交后本轮应结束等待；无交互界面时按默认继续并说明假设。Ask
  the user a structured question (single/multi choice or custom), then wait.
location_reason: 调用链（agent.tools.ask_tools:_ask_tool → agent.context.ask）在 6 跳内未命中任何跨边界原语；仅写本会话 data/ask 台账。
effect: read
schema:
  type: object
  properties:
    question:
      type: string
      description: 要问的问题（≤1000 字，一句话说清）
    options:
      type: array
      description: 可选项（最多 8 个）
      items:
        type: object
        properties:
          id:
            type: string
            description: 选项 id（可省略）
          label:
            type: string
            description: 选项文字（≤100 字）
          description:
            type: string
            description: 选项说明（可选）
        required:
        - label
    allow_multiple:
      type: boolean
      description: 是否允许多选（默认 false）
    allow_custom:
      type: boolean
      description: 是否允许自定义回答（默认 true）
    context:
      type: string
      description: 补充上下文（≤500 字）
  required:
  - question
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    error_code:
      type: string
    question_id:
      type: string
    question:
      type: string
    options:
      type: array
    allow_multiple:
      type: boolean
    allow_custom:
      type: boolean
    context:
      type: string
    guidance:
      type: string
    error:
      type: string
  required:
  - ok
  additionalProperties: true
examples: []
deprecated: false
version: 1.0.0
location: local
plane: resident
risk: low

tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: false