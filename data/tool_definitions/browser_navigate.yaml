name: browser_navigate
category: web
description: 用受控浏览器打开网页并返回标题与正文文本（最多 5000 字符）。仅允许 http/https，且拒绝 localhost 与内网地址。需要
  selenium，未安装时返回明确错误。Open a web page with a browser, browse URL
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.extra_tools:_browser_navigate）在 6 跳内未命中任何跨边界原语；另有 7 个调用点静态无法解析（见 unresolved）"
plane: act
effect: execute
risk: medium
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: internal
sandbox_allowed: false
tags: [web, browser]
schema:
  type: object
  properties:
    url:
      type: string
      description: 要打开的网址，必须以 http:// 或 https:// 开头
  required:
  - url
# 【result_schema（2026-11-24，L2 扩面·medium 批次）】
#   实调失败分支：browser_navigate("ftp://x") → {ok:false,error:"仅允许 http/https 协议"}；
#   成功/拦截分支的键取自 agent/tools/browser_tools.py::browser_navigate 的 return 字面量：
#   成功 {ok,title,url,text}；SSRF 拦截加 blocked/blocked_by/ssrf_category；落地复检加
#   ssrf_stage/requested_url/landed_host。required 只锁 ok。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    title:
      type: string
    url:
      type: string
    text:
      type: string
    blocked:
      type: boolean
    blocked_by:
      type: string
    ssrf_category:
      type: string
    ssrf_stage:
      type: string
    requested_url:
      type: string
    landed_host:
      type: string
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
