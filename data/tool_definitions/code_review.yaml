name: code_review
category: code
description: 执行结构化代码审查，检查代码在安全、性能、可维护性、API兼容性和测试方面的质量。支持审查文件或 git diff。基于 gstack review
  检查清单
deprecated: false
version: 1.0.0
location: local
location_reason: "调用链（agent.tools.code_tools:_code_review）在 6 跳内未命中任何跨边界原语；另有 5 个调用点静态无法解析（见 unresolved）"
plane: perceive
effect: read
risk: low
tool_type: tool
llm_callable: true
callable_mode: auto
permission_level: public
sandbox_allowed: true
tags: [code]
schema:
  type: object
  properties:
    path:
      type: string
      description: 要审查的文件路径（绝对路径），可选
    diff:
      type: string
      description: git diff 文本内容，可选。如果未提供 path 则使用此内容
    dimensions:
      type: array
      items:
        type: string
        enum:
        - 安全
        - 性能
        - 可维护性
        - API兼容性
        - 测试
      description: 审查维度列表，默认全部。安全(SQL注入/XSS/密钥泄露)、性能(N+1查询/算法复杂度)、可维护性(死代码/魔法数字)、API兼容性(破坏性变更)、测试(边界值/负路径)
# 【result_schema（2026-11-24，L2 low 批次）】
#   实调不存在的文件；成功/汇总键取自 agent/code_review.py::code_review 的返回声明（ok/findings/summary），无内容时 {ok,message}。 required 只锁 ok（get_status / get_sensor_summary 例外，见各自文件）。
result_schema:
  type: object
  properties:
    ok:
      type: boolean
    findings:
      type: array
    summary:
      type: object
    message:
      type: string
    available_dimensions:
      type: array
    error:
      type: string
  required: [ok]
  additionalProperties: true
examples: []
