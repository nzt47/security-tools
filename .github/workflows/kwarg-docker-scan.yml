# 关键字参数冲突扫描 CI 工作流（Docker 镜像版）
#
# 使用预构建的 kwarg-scanner Docker 镜像，无需安装 Python 依赖。
# 适用于跨项目复用、CI 环境隔离、以及非 Python 主项目的场景。
#
# 镜像构建: docker build -t kwarg-scanner:latest ./packages/kwarg_scanner
# 镜像推送: docker push ghcr.io/nzt47/kwarg-scanner:latest

name: 关键字参数冲突扫描 (Docker)

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - master
  workflow_dispatch:
    inputs:
      min_risk:
        description: '最低风险等级 (LOW/MEDIUM/HIGH)'
        required: false
        default: 'HIGH'
        type: choice
        options:
          - HIGH
          - MEDIUM
          - LOW
      scan_path:
        description: '扫描路径'
        required: false
        default: 'agent/'
        type: string

env:
  # 镜像地址（GHCR 私有仓库预构建镜像，避免 CI 每次本地构建）
  SCANNER_IMAGE: ghcr.io/nzt47/kwarg-scanner:latest
  # 拉取私有镜像需要 GHCR 登录；若 GHCR 镜像不可用，设置为 true 触发本地构建
  BUILD_LOCALLY: 'false'

jobs:
  # ============================================================================
  # 镜像发布: 构建并推送 GHCR（仅 main 分支 / 手动触发）
  # ============================================================================
  publish-image:
    name: 构建并推送镜像到 GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    # 【不易】GITHUB_TOKEN 默认 read-only，推 GHCR 必须显式授予 packages: write
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # 【不易】GITHUB_TOKEN 只能访问与仓库关联的包；用户空间私有包需 PAT
          username: nzt47
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 构建并推送镜像
        run: |
          docker build \
            -t ghcr.io/nzt47/kwarg-scanner:latest \
            -t ghcr.io/nzt47/kwarg-scanner:1.0.0 \
            -t ghcr.io/nzt47/kwarg-scanner:${{ github.sha }} \
            ./packages/kwarg_scanner
          docker push ghcr.io/nzt47/kwarg-scanner:latest
          docker push ghcr.io/nzt47/kwarg-scanner:1.0.0
          docker push ghcr.io/nzt47/kwarg-scanner:${{ github.sha }}
          echo "✓ 镜像已推送到 GHCR"

  # ============================================================================
  # 镜像准备: 登录 GHCR 或本地构建
  # 注意: 不依赖 publish-image（PR 场景 publish-image 会跳过，此处需独立运行）
  # ============================================================================
  prepare-image:
    name: 准备扫描器镜像
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.decide.outputs.image }}
      built_locally: ${{ steps.decide.outputs.built_locally }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 决定镜像来源
        id: decide
        run: |
          if [ "${{ env.BUILD_LOCALLY }}" = "true" ]; then
            echo "image=kwarg-scanner:local" >> $GITHUB_OUTPUT
            echo "built_locally=true" >> $GITHUB_OUTPUT
            echo "选择本地构建镜像"
          else
            echo "image=${{ env.SCANNER_IMAGE }}" >> $GITHUB_OUTPUT
            echo "built_locally=false" >> $GITHUB_OUTPUT
            echo "使用 GHCR 预构建镜像"
          fi

      - name: 本地构建镜像
        if: steps.decide.outputs.built_locally == 'true'
        run: |
          echo "=== 构建 kwarg-scanner 镜像 ==="
          docker build \
            -t kwarg-scanner:local \
            -t kwarg-scanner:${{ github.sha }} \
            ./packages/kwarg_scanner
          echo "✓ 镜像构建完成"
          docker images kwarg-scanner

      - name: 登录 GHCR（拉取私有镜像）
        if: steps.decide.outputs.built_locally == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # 【不易】用户空间私有包（ghcr.io/nzt47/*）GITHUB_TOKEN 无法读取，需 PAT
          username: nzt47
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 镜像健康检查
        run: |
          echo "=== 镜像健康检查 ==="
          docker run --rm ${{ steps.decide.outputs.image }} --health
          echo "✓ 镜像健康检查通过"

      - name: 显示镜像版本
        run: |
          docker run --rm ${{ steps.decide.outputs.image }} --version

  # ============================================================================
  # HIGH 风险扫描（阻断式）
  # ============================================================================
  high-risk-scan:
    name: HIGH 风险扫描 (Docker, 阻断)
    runs-on: ubuntu-latest
    needs: prepare-image
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 本地构建镜像（如需）
        if: needs.prepare-image.outputs.built_locally == 'true'
        run: |
          docker build -t kwarg-scanner:local ./packages/kwarg_scanner

      # 【不易】每个 job 独立 runner，prepare-image 的登录不共享；私有镜像需重新登录
      - name: 登录 GHCR（拉取私有镜像）
        if: needs.prepare-image.outputs.built_locally == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: nzt47
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 运行 HIGH 风险扫描
        id: scan
        run: |
          echo "=== Docker 容器内运行 HIGH 风险扫描 ==="
          # 【不易】容器内 scanner 用户对宿主挂载根目录无写权限,
          #   报告必须写入预创建的 777 临时目录(挂载为 /output)。
          # 【变易】/project 改为只读挂载(:ro),符合最小权限原则。
          mkdir -p scan-output && chmod 777 scan-output
          docker run --rm \
            -v "${{ github.workspace }}:/project:ro" \
            -v "${{ github.workspace }}/scan-output:/output" \
            -e MIN_RISK=HIGH \
            -e OUTPUT_FORMAT=json \
            -e OUTPUT_FILE=/output/kwarg-high-risk-report.json \
            -e ENABLE_LOGGING=true \
            ${{ needs.prepare-image.outputs.image }} \
            --path /project/agent 2>&1 | tee docker-scan-high.log
          # 【简易】报告落到宿主 scan-output/ 下,复制到 workspace 根目录供后续步骤读取
          if [ -f scan-output/kwarg-high-risk-report.json ]; then
            cp scan-output/kwarg-high-risk-report.json kwarg-high-risk-report.json
          fi
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 判断扫描结果
        if: steps.scan.outputs.exit_code != '0'
        run: |
          # 【不易】exit!=0 需区分: exit 1 = 真有 HIGH(报告为证); exit 3 = 扫描器异常
          if [ "${{ steps.scan.outputs.exit_code }}" = "1" ] && [ -f kwarg-high-risk-report.json ]; then
            # 【简易】单行 python3 -c:YAML run 块多行会因保留缩进致 IndentationError
            HIGH_COUNT=$(python3 -c "import json;print(json.load(open('kwarg-high-risk-report.json')).get('summary',{}).get('HIGH',0))" 2>/dev/null || echo 0)
            echo "::error::Docker 扫描检测到 ${HIGH_COUNT} 处 HIGH 风险,CI 已阻断"
            echo "::error::查看报告: kwarg-high-risk-report.json"
            echo "::error::修复提示: 在 **kwargs 展开前过滤保留键,使用 safe_ 前缀命名变量"
            exit 1
          else
            echo "::error::Docker 扫描器异常 (exit=${{ steps.scan.outputs.exit_code }}),请查看 docker-scan-high.log"
            exit 1
          fi

      - name: 上传 HIGH 风险报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kwarg-docker-high-risk-report
          path: |
            kwarg-high-risk-report.json
            docker-scan-high.log
          retention-days: 30

      - name: 扫描通过
        if: success()
        run: echo "✓ Docker HIGH 风险扫描通过"

  # ============================================================================
  # MEDIUM 风险扫描（非阻断，仅提醒）
  # ============================================================================
  medium-risk-scan:
    name: MEDIUM 风险扫描 (Docker, 提醒)
    runs-on: ubuntu-latest
    needs: prepare-image
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 本地构建镜像（如需）
        if: needs.prepare-image.outputs.built_locally == 'true'
        run: |
          docker build -t kwarg-scanner:local ./packages/kwarg_scanner

      # 【不易】每个 job 独立 runner，prepare-image 的登录不共享；私有镜像需重新登录
      - name: 登录 GHCR（拉取私有镜像）
        if: needs.prepare-image.outputs.built_locally == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: nzt47
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 运行 MEDIUM 风险扫描
        run: |
          echo "=== Docker 容器内运行 MEDIUM 风险扫描 ==="
          # 【不易】同 high-risk-scan:报告写入预创建 777 临时目录,/project 只读挂载
          mkdir -p scan-output && chmod 777 scan-output
          docker run --rm \
            -v "${{ github.workspace }}:/project:ro" \
            -v "${{ github.workspace }}/scan-output:/output" \
            -e MIN_RISK=MEDIUM \
            -e OUTPUT_FORMAT=json \
            -e OUTPUT_FILE=/output/kwarg-medium-risk-report.json \
            -e ENABLE_LOGGING=true \
            ${{ needs.prepare-image.outputs.image }} \
            --path /project/agent 2>&1 | tee docker-scan-medium.log || true
          # 【简易】报告复制到 workspace 根目录,供后续统计步骤读取
          [ -f scan-output/kwarg-medium-risk-report.json ] && \
            cp scan-output/kwarg-medium-risk-report.json kwarg-medium-risk-report.json || true

      - name: 统计 MEDIUM 风险数量
        run: |
          if [ -f kwarg-medium-risk-report.json ]; then
            # 【简易】单行 python3 -c:避免 YAML 缩进致 IndentationError
            COUNT=$(python3 -c "import json;print(json.load(open('kwarg-medium-risk-report.json')).get('summary',{}).get('MEDIUM',0))" 2>/dev/null || echo "0")
            echo "medium_count=$COUNT" >> $GITHUB_ENV
            if [ "$COUNT" -gt 0 ]; then
              echo "::warning::检测到 $COUNT 处 MEDIUM 级别风险（不阻断，建议审查）"
            else
              echo "✓ 无 MEDIUM 级别风险"
            fi
          fi

      - name: 上传 MEDIUM 风险报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kwarg-docker-medium-risk-report
          path: |
            kwarg-medium-risk-report.json
            docker-scan-medium.log
          retention-days: 30

  # ============================================================================
  # 手动触发的自定义扫描
  # ============================================================================
  custom-scan:
    name: 自定义扫描 (手动触发)
    runs-on: ubuntu-latest
    needs: prepare-image
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 本地构建镜像（如需）
        if: needs.prepare-image.outputs.built_locally == 'true'
        run: |
          docker build -t kwarg-scanner:local ./packages/kwarg_scanner

      # 【不易】每个 job 独立 runner，prepare-image 的登录不共享；私有镜像需重新登录
      - name: 登录 GHCR（拉取私有镜像）
        if: needs.prepare-image.outputs.built_locally == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: nzt47
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 运行自定义扫描
        run: |
          echo "=== 自定义扫描 ==="
          echo "路径: ${{ inputs.scan_path }}"
          echo "最低风险: ${{ inputs.min_risk }}"
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -e MIN_RISK=${{ inputs.min_risk }} \
            -e OUTPUT_FORMAT=text \
            ${{ needs.prepare-image.outputs.image }} \
            --path /project/${{ inputs.scan_path }}

      - name: 扫描结果
        run: |
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✓ 自定义扫描通过"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "::warning::自定义扫描发现风险 (exit=$EXIT_CODE)"
          else
            echo "::error::自定义扫描出错 (exit=$EXIT_CODE)"
            exit 1
          fi
