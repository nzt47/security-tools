# =====================================================================
# tlm-hook-failsafe PSGallery 发布 CI/CD 流水线
#
# 【不易】PSGallery API key 仅从 GitHub Secrets 读取（禁硬编码）
#          同版本不可重发（PSGallery 拒绝）→ 版本预检必先于 push
#          真相源 = scripts/dev/hook_fail_safe.psm1（sync 后才发布）
# 【变易】触发：push 主分支 → auto-tag 检查版本变化 → 自动打 tag → 触发发布
#                PR → 仅 dry-run 验证
#                手动 force_publish → dry-run + 真实发布
# 【简易】三 Job：auto-tag → dry-run-validate → publish（门控条件）
#
# 自动发布流程（方案 B：版本号变化自动打 tag）:
#   1. 开发者修改 .psd1 的 ModuleVersion（如 1.1.0 → 1.2.0）
#   2. push 到 master/main
#   3. auto-tag Job 检测到版本变化，用 gh api 创建 v1.2.0 tag
#   4. tag 创建触发新的工作流运行 → dry-run + 真实发布
#   5. 发布成功后自动创建 GitHub Release
#
# 触发条件:
#   - push 到 master/main（包/源/工作流变更时）→ auto-tag + dry-run 验证
#   - PR 到 master/main → 仅 dry-run 验证（不打 tag 不发布）
#   - push tag v*（auto-tag 创建或手动）→ dry-run + 真实发布
#   - 手动触发（force_publish=true）→ dry-run + 真实发布
#
# 依赖文件:
#   - packages/tlm-hook-failsafe/publish-to-psgallery.ps1
#   - packages/tlm-hook-failsafe/sync-from-source.ps1
#   - packages/tlm-hook-failsafe/tlm-hook-failsafe.psd1
#   - scripts/dev/hook_fail_safe.psm1
#
# 所需 Secrets:
#   - PSGALLERY_API_KEY: PSGallery NuGet API key（https://www.powershellgallery.com/account/api-keys）
# =====================================================================
name: Publish tlm-hook-failsafe

on:
  # 不易：branches 和 tags 同时定义时为 OR 关系（branch 推送或 tag 推送任一满足即触发）
  #        但 branches/tags 与 paths 为 AND 关系（必须同时满足）
  #        tag 推送时 paths 默认匹配所有文件（tag 不带 diff），故 v* tag 总会触发
  push:
    branches: [master, main]
    paths:
      - 'packages/tlm-hook-failsafe/**'
      - 'scripts/dev/hook_fail_safe.psm1'
      - '.github/workflows/publish-psgallery.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packages/tlm-hook-failsafe/**'
      - 'scripts/dev/hook_fail_safe.psm1'
      - '.github/workflows/publish-psgallery.yml'
  workflow_dispatch:
    inputs:
      force_publish:
        description: '真实发布到 PSGallery（需 PSGALLERY_API_KEY secret，输入 true 触发）'
        required: false
        default: 'false'
        type: string
      skip_version_check:
        description: '跳过版本预检（用于首次发布或调试，输入 true 跳过）'
        required: false
        default: 'false'
        type: string

env:
  MODULE_NAME: tlm-hook-failsafe
  POWERSHELL_VERSION: '5.1'

# 不易：GITHUB_TOKEN 默认 contents:read，无法创建 Release；显式声明所需权限
#        触发 workflow_dispatch 需要 actions:write
permissions:
  contents: write
  actions: write

jobs:
  # =====================================================================
  # Job 0: auto-tag（仅 master/main push 时运行）
  # 【不易】版本号是唯一真相源：.psd1 的 ModuleVersion 变化时自动打 v* tag
  #        tag 推送后触发 dry-run-validate + publish-to-psgallery Job
  # 【变易】仅在 master/main 分支检查；PR 时不执行（PR 仅 dry-run）
  # 【简易】用 gh api 创建 tag（通过 API 创建的 tag 会触发工作流，避免 GITHUB_TOKEN 循环限制）
  # =====================================================================
  auto-tag:
    name: 自动打 Tag（版本号变化时）
    runs-on: ubuntu-latest
    # 不易：仅 master/main 分支 push 时运行；PR 和 tag push 时不运行（避免循环）
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/') &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    timeout-minutes: 5
    outputs:
      tagged: ${{ steps.create-tag.outputs.tagged }}
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - name: 检出代码（fetch-depth=0 获取所有 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取 .psd1 版本号
        id: read-version
        shell: pwsh
        working-directory: packages/tlm-hook-failsafe
        run: |
          $manifest = Test-ModuleManifest -Path .\tlm-hook-failsafe.psd1 -ErrorAction Stop
          $version = $manifest.Version.ToString()
          Write-Host "ModuleVersion: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 检查对应 tag 是否已存在
        id: check-tag
        shell: pwsh
        env:
          VERSION: ${{ steps.read-version.outputs.version }}
        run: |
          $tagName = "v$env:VERSION"
          # 查询远程是否存在该 tag
          $exists = git ls-remote --tags origin "refs/tags/$tagName" 2>&1
          if ([string]::IsNullOrWhiteSpace($exists)) {
            Write-Host "Tag $tagName does not exist, will create"
            "exists=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Tag $tagName already exists, skip"
            "exists=true" >> $env:GITHUB_OUTPUT
          }

      - name: 创建并推送 tag
        id: create-tag
        if: steps.check-tag.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read-version.outputs.version }}
        run: |
          $tagName = "v$env:VERSION"
          $commitSha = "${{ github.sha }}"
          Write-Host "Creating tag $tagName at commit $commitSha"

          # 不易：用 gh api 创建 tag（GITHUB_TOKEN 创建的 tag 不会触发 on.push，防循环）
          # 简易：直接创建 lightweight tag（refs/tags/*），再用 gh workflow run 触发发布
          $result = gh api repos/${{ github.repository }}/git/refs `
            --method POST `
            -f "ref=refs/tags/$tagName" `
            -f "sha=$commitSha" 2>&1

          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Tag $tagName created via API"
            "tagged=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "❌ Failed to create tag: $result"
            "tagged=false" >> $env:GITHUB_OUTPUT
          }

      - name: 触发发布工作流（绕过 GITHUB_TOKEN 防循环）
        if: steps.create-tag.outputs.tagged == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read-version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # 不易：GITHUB_TOKEN 创建的 tag 不会触发 on.push.tags（GitHub 防循环机制）
          #        所以 auto-tag 创建 tag 后，必须主动触发发布工作流
          # 简易：用 Invoke-RestMethod 直接调用 API（gh workflow run 对 inputs 传递有 bug）
          Write-Host "Triggering publish workflow for v$env:VERSION..."
          $body = @{
            ref = "master"
            inputs = @{
              force_publish = "true"
              skip_version_check = "false"
            }
          } | ConvertTo-Json -Compress
          $token = gh auth token
          $headers = @{
            Authorization = "Bearer $token"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:REPO/actions/workflows/publish-psgallery.yml/dispatches"
          try {
            Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body $body -ContentType "application/json" -ErrorAction Stop
            Write-Host "✅ Publish workflow triggered"
          } catch {
            Write-Host "⚠️ Failed to trigger: $($_.Exception.Message)"
          }

      - name: auto-tag 总结
        if: always()
        shell: pwsh
        run: |
          $version = "${{ steps.read-version.outputs.version }}"
          $exists = "${{ steps.check-tag.outputs.exists }}"
          $tagged = "${{ steps.create-tag.outputs.tagged }}"
          "## 自动打 Tag 结果" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| 项目 | 值 |" >> $env:GITHUB_STEP_SUMMARY
          "|------|-----|" >> $env:GITHUB_STEP_SUMMARY
          "| 检测到的版本 | $version |" >> $env:GITHUB_STEP_SUMMARY
          "| Tag 已存在 | $exists |" >> $env:GITHUB_STEP_SUMMARY
          "| 本次已创建 | $tagged |" >> $env:GITHUB_STEP_SUMMARY
          if ($tagged -eq "true") {
            "" >> $env:GITHUB_STEP_SUMMARY
            "✅ Tag v$version 已创建，将触发 dry-run + 发布流程" >> $env:GITHUB_STEP_SUMMARY
          }

  # =====================================================================
  # Job 1: Dry-run 验证（always runs）
  # 【不易】sync + pack 验证发布产物可生成；不上传到 PSGallery
  # =====================================================================
  dry-run-validate:
    name: Dry-run 验证（sync + pack）
    needs: auto-tag
    # 不易：PR 时 auto-tag 被 if 跳过，needs 默认会跳过依赖 Job；
    #        但 dry-run 是 PR 的核心验证，必须运行 → 用 success() || skipped() 确保不被跳过
    if: ${{ success() || needs.auto-tag.result == 'skipped' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 PowerShell 环境
        shell: powershell
        run: |
          # 不易：TLS 1.2（PS 5.1 默认 TLS 1.0 已废弃）
          try {
            [Net.ServicePointManager]::SecurityProtocol =
              [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          } catch { }
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Sync 源码到包（验证 15 函数导出）
        shell: powershell
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          & .\sync-from-source.ps1
          if ($LASTEXITCODE -ne 0) { throw "sync-from-source failed: exit $LASTEXITCODE" }

      - name: Dry-run 发布（生成 .nupkg，不推送）
        shell: powershell
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          & .\publish-to-psgallery.ps1 -NuGetApiKey 'dummy' -DryRun -SkipVersionCheck
          if ($LASTEXITCODE -ne 0) { throw "dry-run failed: exit $LASTEXITCODE" }

      - name: 验证 .nupkg 生成
        shell: powershell
        working-directory: packages/tlm-hook-failsafe
        run: |
          $nupkg = Get-ChildItem -Filter "*.nupkg" | Select-Object -First 1
          if (-not $nupkg) { throw ".nupkg not found after dry-run" }
          $manifest = Test-ModuleManifest -Path .\tlm-hook-failsafe.psd1
          $expectedName = "tlm-hook-failsafe.$($manifest.Version).nupkg"
          if ($nupkg.Name -ne $expectedName) {
            throw "nupkg name mismatch: $($nupkg.Name) != $expectedName"
          }
          Write-Host "✅ .nupkg verified: $($nupkg.Name) ($($nupkg.Length) bytes)" -ForegroundColor Green

      - name: 上传 .nupkg 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tlm-hook-failsafe-nupkg
          path: packages/tlm-hook-failsafe/*.nupkg
          retention-days: 14

      - name: Dry-run 总结
        if: always()
        # 不易：pwsh(PS7) 默认 UTF-8；powershell(PS5.1) 用 Windows-1252 解码 UTF-8 中文，
        #      '结果' 的 UTF-8 字节 0x93 恰为 Windows-1252 左引号，破坏引号匹配导致语法错误
        shell: pwsh
        run: |
          $result = "${{ job.status }}"
          "## Dry-run 验证结果" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| 项目 | 状态 |" >> $env:GITHUB_STEP_SUMMARY
          "|------|------|" >> $env:GITHUB_STEP_SUMMARY
          "| sync-from-source | $result |" >> $env:GITHUB_STEP_SUMMARY
          "| nuget pack | $result |" >> $env:GITHUB_STEP_SUMMARY
          "| .nupkg 产物 | $result |" >> $env:GITHUB_STEP_SUMMARY

  # =====================================================================
  # Job 2: 真实发布到 PSGallery（门控：tag push 或 手动 force_publish）
  # 【不易】仅在 dry-run 通过后执行；API key 从 Secrets 读取
  # 【变易】触发条件：tag v* 或 workflow_dispatch.force_publish=true
  # =====================================================================
  publish-to-psgallery:
    name: 发布到 PSGallery
    runs-on: windows-latest
    needs: dry-run-validate
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_publish == 'true')
    timeout-minutes: 15
    environment: psgallery-publish
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证 PSGALLERY_API_KEY secret 已配置
        shell: powershell
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
            throw "PSGALLERY_API_KEY secret not set; configure it in repo Settings > Secrets > Actions"
          }
          Write-Host "✅ PSGALLERY_API_KEY is configured (length=$($env:PSGALLERY_API_KEY.Length))"
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}

      - name: 设置 PowerShell 环境
        shell: powershell
        run: |
          try {
            [Net.ServicePointManager]::SecurityProtocol =
              [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          } catch { }

      - name: Sync 源码到包
        shell: powershell
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          & .\sync-from-source.ps1
          if ($LASTEXITCODE -ne 0) { throw "sync-from-source failed: exit $LASTEXITCODE" }

      - name: 读取发布版本号
        id: version
        shell: powershell
        working-directory: packages/tlm-hook-failsafe
        run: |
          $manifest = Test-ModuleManifest -Path .\tlm-hook-failsafe.psd1
          $version = $manifest.Version.ToString()
          Write-Host "Publishing version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 发布到 PSGallery
        shell: powershell
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          $skipCheck = '${{ github.event.inputs.skip_version_check }}' -eq 'true'
          # 不易：PS 5.1 的 & $array 不会 splat 数组，整个数组被当作单命令名
          # 简易：直接显式调用脚本，用 if 拼接可选参数（最直白可读）
          if ($skipCheck) {
            & .\publish-to-psgallery.ps1 -NuGetApiKey $env:PSGALLERY_API_KEY -SkipVersionCheck
          } else {
            & .\publish-to-psgallery.ps1 -NuGetApiKey $env:PSGALLERY_API_KEY
          }
          if ($LASTEXITCODE -ne 0) {
            throw "publish failed: exit $LASTEXITCODE (check API key / network / PSGallery rate limit)"
          }
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}

      - name: 创建 GitHub Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: tlm-hook-failsafe v${{ steps.version.outputs.version }}
          body: |
            ## tlm-hook-failsafe v${{ steps.version.outputs.version }}

            已发布到 PSGallery: https://www.powershellgallery.com/packages/tlm-hook-failsafe/${{ steps.version.outputs.version }}

            ### 安装
            ```powershell
            Install-Module tlm-hook-failsafe -Repository PSGallery
            ```
          draft: false
          prerelease: false

      - name: 发布总结
        if: always()
        shell: pwsh
        run: |
          $result = "${{ job.status }}"
          $version = "${{ steps.version.outputs.version }}"
          "## PSGallery 发布结果" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| 项目 | 值 |" >> $env:GITHUB_STEP_SUMMARY
          "|------|-----|" >> $env:GITHUB_STEP_SUMMARY
          "| 版本 | $version |" >> $env:GITHUB_STEP_SUMMARY
          "| 状态 | $result |" >> $env:GITHUB_STEP_SUMMARY
          "| PSGallery | https://www.powershellgallery.com/packages/tlm-hook-failsafe/$version |" >> $env:GITHUB_STEP_SUMMARY
