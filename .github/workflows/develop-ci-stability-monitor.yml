# Develop 分支 CI 稳定性监控（限时 3 次推送）
#
# 目的：在 Docker kwarg 扫描误报修复（0055a3f8）合入 develop 后,
#       连续监控 3 次 develop 推送的关键 CI workflow 稳定性,
#       防止"修复后短暂转绿,后续推送又退化"的隐性回归。
#
# 退出条件：计数器 remaining_checks 归零后自动 skip,无需人工干预。
# 计数器文件: .github/monitoring/develop_stability_counter.json
# 监控脚本:   .github/scripts/develop_stability_monitor.py
#
# 监控范围（与 ci-failure-notify.yml 对齐 + 修复相关 workflow）:
#   - kwarg-docker-scan.yml      本次修复核心
#   - kwarg-conflict-check.yml   关键字参数冲突扫描（非 Docker）
#   - ci.yml                     云枢系统测试流程
#   - hardcoded-password-scan.yml 硬编码密码扫描
#   - hook-failsafe-e2e.yml      tlm-hook-failsafe E2E

name: Develop CI 稳定性监控

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      force_check:
        description: '强制执行一次检查(忽略计数器)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  actions: read
  contents: write
  issues: write

# 【不易】同一分支并发推送时,仅保留最新一次监控,避免计数器写冲突
concurrency:
  group: develop-ci-stability-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: 检查 develop CI 稳定性
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ── 1. 检出代码（含计数器文件 + 监控脚本） ──
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # ── 2. 等待关键 workflow 完成 ──
      # 【变易】关键 workflow 运行时长不一(5~30min),用轮询而非固定 sleep;
      #         脚本本身的 gh run list 会拿到 in_progress 状态,先等待再查询更准
      - name: 等待关键 workflow 启动
        if: github.event_name == 'push'
        run: |
          echo "等待 5 分钟,让本次 push 触发的关键 workflow 启动并运行..."
          sleep 300
          echo "等待结束,开始查询状态"

      # ── 3. 调用监控脚本 ──
      - name: 运行稳定性监控
        id: monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_CHECK: ${{ inputs.force_check }}
        run: |
          python3 .github/scripts/develop_stability_monitor.py

      # ── 4. 若脚本判定跳过,后续步骤不执行 ──
      - name: 提交计数器更新
        if: steps.monitor.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/monitoring/develop_stability_counter.json
          # 【不易】[skip ci] 必须,否则计数器 commit 会再次触发本 workflow
          git commit -m "chore(monitor): develop CI 稳定性监控计数器递减 [skip ci]" || echo "无变更可提交"
          git push

      # ── 5. 创建/更新 Issue 报告 ──
      - name: 创建稳定性报告 Issue
        if: steps.monitor.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportFile = '${{ steps.monitor.outputs.report_file }}';
            let stabilityRaw = '';
            try {
              stabilityRaw = fs.readFileSync(reportFile, 'utf8');
            } catch (e) {
              core.warning(`报告文件读取失败: ${e.message}`);
            }

            const isFinal = '${{ steps.monitor.outputs.is_final }}' === 'true';
            const stable = '${{ steps.monitor.outputs.stable }}' === 'true';
            const newRemaining = '${{ steps.monitor.outputs.new_remaining }}';
            const remainingBefore = '${{ steps.monitor.outputs.remaining_before }}';
            const commitSha = '${{ github.sha }}';
            const failureCount = '${{ steps.monitor.outputs.failure_count }}';
            const repo = context.repo;

            const checkNo = parseInt(remainingBefore) || 0;
            const title = isFinal
              ? `Develop CI 稳定性监控 - 最终报告 (3/3)`
              : `Develop CI 稳定性监控报告 (${3 - checkNo + 1}/3)`;

            const statusEmoji = stable ? '✅ 稳定' : '❌ 有失败';
            const finalNote = isFinal
              ? [
                  '',
                  '---',
                  '## 🏁 监控已结束',
                  '',
                  `已完成 3 次 develop 推送的 CI 稳定性监控。`,
                  stable
                    ? '所有检查均稳定,监控任务自动结束。'
                    : `本次检查有 ${failureCount} 个 workflow 失败,请人工排查。`,
                  '',
                  '如需重新启用监控,编辑 `.github/monitoring/develop_stability_counter.json` 将 `remaining_checks` 重置为 3。',
                ].join('\n')
              : '';

            const body = [
              '## CI 稳定性快照',
              '',
              `- **Commit**: ${commitSha}`,
              `- **状态**: ${statusEmoji}`,
              `- **失败数**: ${failureCount}`,
              `- **剩余检查**: ${newRemaining}`,
              '',
              '### 关键 Workflow 状态',
              '',
              '```markdown',
              stabilityRaw,
              '```',
              finalNote,
            ].join('\n');

            // 查找是否已有本次监控的 Issue（按标题前缀）
            const issues = await github.rest.issues.listForRepo({
              owner: repo.owner,
              repo: repo.repo,
              state: 'open',
              labels: 'ci-stability-monitor',
              per_page: 20,
            });

            const existing = issues.data.find(i => i.title.startsWith('Develop CI 稳定性监控'));
            if (existing && !isFinal) {
              // 非最终报告: 追加评论到现有 Issue
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`已追加评论到 Issue #${existing.number}`);
            } else {
              // 创建新 Issue（首次或最终报告）
              const issue = await github.rest.issues.create({
                owner: repo.owner,
                repo: repo.repo,
                title,
                body,
                labels: ['ci-stability-monitor', 'auto-generated'],
              });
              core.info(`已创建 Issue #${issue.data.number}`);
              // 最终报告且稳定 → 关闭 Issue
              if (isFinal && stable) {
                await github.rest.issues.update({
                  owner: repo.owner,
                  repo: repo.repo,
                  issue_number: issue.data.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`最终报告稳定,已关闭 Issue #${issue.data.number}`);
              }
            }
