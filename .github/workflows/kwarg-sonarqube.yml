# 关键字参数冲突扫描 → SonarQube 集成工作流
#
# 功能:
#   1. 运行 kwarg-scanner（Docker 镜像）生成 SonarQube GIIF 格式报告
#   2. 通过 sonar-scanner 将外部问题上传到 SonarQube
#   3. HIGH 风险同时阻断 CI
#
# 前置条件:
#   - CI 自包含: SonarQube LTS 容器在 job 内启动，无需外部服务器
#   - 仓库 Secrets 需配置 GHCR_TOKEN（拉取私有扫描镜像）
#
# 参考: https://docs.sonarqube.org/latest/analyzing-source-code/importing-external-issues/

name: kwarg 扫描 → SonarQube

on:
  push:
    branches: [master, main, develop, 'release/**']
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  MIN_RISK: MEDIUM            # SonarQube 报告收录 MEDIUM 及以上
  CI_BLOCK_RISK: HIGH         # CI 阻断等级

jobs:
  kwarg-sonarqube:
    name: kwarg 扫描 → SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 登录 GHCR（拉取私有镜像）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # 【不易】用户空间私有包（ghcr.io/nzt47/*）GITHUB_TOKEN 无法读取，需 PAT
          username: nzt47
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 生成 SonarQube GIIF 报告
        id: scan
        run: |
          echo "=== 生成 kwarg-scanner GIIF 报告 ==="
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -e MIN_RISK=${{ env.MIN_RISK }} \
            -e OUTPUT_FORMAT=sonarqube \
            -e OUTPUT_FILE=/project/kwarg-sonar-issues.json \
            ghcr.io/nzt47/kwarg-scanner:latest
          SCAN_EXIT=$?
          echo "扫描退出码: $SCAN_EXIT"
          echo "scan_exit=$SCAN_EXIT" >> $GITHUB_OUTPUT

      - name: 上传 GIIF 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwarg-sonar-issues
          path: kwarg-sonar-issues.json
          retention-days: 30

      - name: HIGH 风险阻断检查
        if: steps.scan.outputs.scan_exit != '0'
        run: |
          echo "::error::检测到 HIGH 风险，CI 已阻断 (exit=${{ steps.scan.outputs.scan_exit }})"
          echo "::error::请在 **kwargs 展开前过滤保留键，或查看 kwarg-sonar-issues.json"
          exit 1

      # ════════════════════════════════════════════════════════════
      # SonarQube 自包含: CI 内启动 LTS 容器（无需外部服务器）
      # 本机/runner 无需预配置 SONAR_HOST_URL / SONAR_TOKEN
      # ════════════════════════════════════════════════════════════
      - name: 启动 SonarQube 容器（LTS，CI 自包含）
        run: |
          docker run -d --name sonarqube-ci \
            --memory 3g --cpus 2 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            -p 9000:9000 \
            sonarqube:lts-community
          echo "SonarQube 容器已启动，等待就绪..."

      - name: 等待 SonarQube 就绪并生成访问 Token
        run: |
          # 轮询 /api/system/status 直到 UP（首次启动 ES 初始化约 1-3 分钟）
          STATUS="DOWN"
          for i in $(seq 1 90); do
            STATUS=$(curl -s http://localhost:9000/api/system/status | jq -r .status 2>/dev/null || echo DOWN)
            echo "SonarQube 状态: $STATUS (尝试 $i/90)"
            [ "$STATUS" = "UP" ] && break
            sleep 5
          done
          if [ "$STATUS" != "UP" ]; then
            echo "::error::SonarQube 未在 450s 内就绪，检查容器日志"
            docker logs --tail 50 sonarqube-ci || true
            exit 1
          fi
          # 生成分析 token（官方镜像初始凭据 admin/admin）
          TOKEN=$(curl -s -u admin:admin -d "name=ci-token" \
            http://localhost:9000/api/user_tokens/generate | jq -r .token)
          echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "SonarQube 就绪，token 已生成"

      - name: SonarQube 扫描（上传外部问题）
        if: always()
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.projectKey=kwarg-scanner
            -Dsonar.sources=agent,packages
            -Dsonar.externalIssuesReportPaths=kwarg-sonar-issues.json
            -Dsonar.qualitygate.wait=false

      - name: 清理 SonarQube 容器
        if: always()
        run: docker rm -f sonarqube-ci || true
