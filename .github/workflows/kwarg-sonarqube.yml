# 关键字参数冲突扫描 → SonarQube 集成工作流
#
# 功能:
#   1. 运行 kwarg-scanner（Docker 镜像）生成 SonarQube GIIF 格式报告
#   2. 通过 sonar-scanner 将外部问题上传到 SonarQube
#   3. HIGH 风险同时阻断 CI
#
# 前置条件:
#   - CI 自包含: SonarQube LTS 容器在 job 内启动，无需外部服务器
#   - 仓库 Secrets 需配置 GHCR_TOKEN（拉取私有扫描镜像）
#
# 参考: https://docs.sonarqube.org/latest/analyzing-source-code/importing-external-issues/

name: kwarg 扫描 → SonarQube

# 【变易·P2-4】concurrency: 同 workflow 同 ref 连续触发取消旧 run 只留最新（workflow 隔离组，2026-08-14）。
# 2026-08-08 排队风暴治理延伸: 全项目 workflow 批量统一。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main, develop, 'release/**']
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  MIN_RISK: MEDIUM            # SonarQube 报告收录 MEDIUM 及以上
  CI_BLOCK_RISK: HIGH         # CI 阻断等级

jobs:
  kwarg-sonarqube:
    name: kwarg 扫描 → SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 登录 GHCR（拉取私有镜像）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # 【不易】用户空间私有包（ghcr.io/nzt47/*）GITHUB_TOKEN 无法读取，需 PAT
          username: nzt47
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 生成 SonarQube GIIF 报告
        id: scan
        run: |
          # 【变易】容器内 scanner 用户为非 root（UID 100），runner workspace 属主为 runner（UID 1001），
          # 不放开写权限会导致报告写入 PermissionError 崩溃（exit 1），被入口脚本误判为 HIGH 阻断
          sudo chmod -R a+rwX "${{ github.workspace }}"
          echo "=== 生成 kwarg-scanner GIIF 报告 ==="
          # 【变易】&&/|| 捕获真实退出码（set -e 下 docker run 失败会直接中断步骤，scan_exit 无法落盘）
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -e MIN_RISK=${{ env.MIN_RISK }} \
            -e OUTPUT_FORMAT=sonarqube \
            -e OUTPUT_FILE=/project/kwarg-sonar-issues.json \
            ghcr.io/nzt47/kwarg-scanner:latest \
            && SCAN_EXIT=0 || SCAN_EXIT=$?
          echo "扫描退出码: $SCAN_EXIT"
          echo "scan_exit=$SCAN_EXIT" >> $GITHUB_OUTPUT

      - name: 上传 GIIF 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwarg-sonar-issues
          path: kwarg-sonar-issues.json
          retention-days: 30

      - name: HIGH 风险阻断检查
        if: steps.scan.outputs.scan_exit != '0'
        run: |
          echo "::error::检测到 HIGH 风险，CI 已阻断 (exit=${{ steps.scan.outputs.scan_exit }})"
          echo "::error::请在 **kwargs 展开前过滤保留键，或查看 kwarg-sonar-issues.json"
          exit 1

      # ════════════════════════════════════════════════════════════
      # SonarQube 自包含: CI 内启动 LTS 容器（无需外部服务器）
      # 本机/runner 无需预配置 SONAR_HOST_URL / SONAR_TOKEN
      # ════════════════════════════════════════════════════════════
      - name: 启动 SonarQube 容器（LTS，CI 自包含）
        # 【变易】GIIF 步骤失败（如 HIGH 阻断）后仍需启动 SonarQube 上传已生成的问题
        if: always()
        run: |
          docker rm -f sonarqube-ci >/dev/null 2>&1 || true
          docker run -d --name sonarqube-ci \
            --memory 3g --cpus 2 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            -p 9000:9000 \
            sonarqube:lts-community
          echo "SonarQube 容器已启动，等待就绪..."

      - name: 等待 SonarQube 就绪并生成访问 Token
        if: always()
        run: |
          # 轮询 /api/system/status 直到 UP（首次启动 ES 初始化约 1-3 分钟）
          STATUS="DOWN"
          for i in $(seq 1 90); do
            STATUS=$(curl -s http://localhost:9000/api/system/status | jq -r .status 2>/dev/null || echo DOWN)
            echo "SonarQube 状态: $STATUS (尝试 $i/90)"
            [ "$STATUS" = "UP" ] && break
            sleep 5
          done
          if [ "$STATUS" != "UP" ]; then
            echo "::error::SonarQube 未在 450s 内就绪，检查容器日志"
            docker logs --tail 50 sonarqube-ci || true
            exit 1
          fi
          # 生成分析 token（官方镜像初始凭据 admin/admin）
          TOKEN=$(curl -s -u admin:admin -d "name=ci-token" \
            http://localhost:9000/api/user_tokens/generate | jq -r .token)
          echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "SonarQube 就绪，token 已生成"

      - name: SonarQube 扫描（上传外部问题）
        # 【不易】sonarqube-scan-action 容器运行于 bridge 网络，localhost:9000 指向自身，
        # 无法访问同机 SonarQube 容器；且 cli:latest 已升级为 Scanner 8.0（仅支持 SonarQube Cloud）。
        # 改用 docker run --network host + 固定 cli:10.0（Scanner 5.0.1，兼容 9.9 LTS，本地实测通过）
        if: always() && hashFiles('kwarg-sonar-issues.json') != '' && env.SONAR_TOKEN != ''
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/usr/src" \
            -e SONAR_HOST_URL=http://localhost:9000 \
            -e SONAR_TOKEN=${{ env.SONAR_TOKEN }} \
            sonarsource/sonar-scanner-cli:10.0 \
            -D sonar.projectKey=kwarg-scanner \
            -D sonar.projectName=kwarg-scanner \
            -D sonar.projectBaseDir=/usr/src \
            -D sonar.sources=agent,packages \
            -D sonar.externalIssuesReportPaths=kwarg-sonar-issues.json \
            -D sonar.qualitygate.wait=false \
            -D sonar.scm.disabled=true

      - name: 清理 SonarQube 容器
        if: always()
        run: docker rm -f sonarqube-ci || true
