# =====================================================================
# 意图层 ratio 分母同步不变量定时验证
#
# 【不易】守 ratio 总和 = 1.0（count/total 求和 = total/total），
#         防止未来埋点改动破坏分母同步机制
# 【变易】schedule 每日定时 + PR/推送相关路径触发 + 手动触发(workflow_dispatch)
# 【简易】单 job：运行两个验证脚本，输出 JSON 报告并上传 artifact
#
# 关联代码：
#   scripts/verify_intent_layer_ratio_ci.py（不变量守卫，新增）
#   scripts/verify_semantic_metric_log.py（L1086 结构化字段验证，已有）
#   agent/monitoring/prometheus.py（record_intent_layer 分母同步实现）
# =====================================================================
name: Intent Layer Ratio Invariant Check

# 【变易·P2-4】concurrency: 同 workflow 同 ref 连续触发取消旧 run 只留最新（workflow 隔离组，2026-08-14）。
# 2026-08-08 排队风暴治理延伸: 全项目 workflow 批量统一。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'release/**'
    paths:
      - 'agent/monitoring/prometheus.py'
      - 'agent/orchestrator/orchestrator.py'
      - 'scripts/verify_intent_layer_ratio_ci.py'
      - 'scripts/verify_semantic_metric_log.py'
      - 'tests/unit/test_*intent_layer*.py'
      - 'tests/unit/test_*ratio*.py'
      - 'tests/unit/test_*dual_counting*.py'
      - '.github/workflows/intent-layer-ratio-check.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'agent/monitoring/prometheus.py'
      - 'agent/orchestrator/orchestrator.py'
      - 'scripts/verify_intent_layer_ratio_ci.py'
      - 'scripts/verify_semantic_metric_log.py'
      - 'tests/unit/test_*intent_layer*.py'
      - 'tests/unit/test_*ratio*.py'
      - 'tests/unit/test_*dual_counting*.py'
  schedule:
    # UTC 03:00 = 北京时间 11:00（每日），与 observability-ci 首个 cron 对齐
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  ratio-invariant-check:
    name: Ratio Invariant Check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # pytest.ini addopts 含 --timeout + asyncio_mode, 需 pytest-timeout/pytest-asyncio
          pip install prometheus-client pyyaml pytest pytest-timeout pytest-asyncio

      # ── 步骤 1：L1086 semantic 埋点结构化字段验证（已有脚本）──
      - name: 验证 semantic 埋点 structured log 字段
        run: |
          echo "=== 验证 L1086 semantic 埋点字段 ==="
          python scripts/verify_semantic_metric_log.py

      # ── 步骤 2：ratio 分母同步不变量守卫（新脚本）──
      - name: 验证 ratio 总和恒 = 1.0
        run: |
          echo "=== 验证 ratio 分母同步不变量 ==="
          python scripts/verify_intent_layer_ratio_ci.py --json ci-ratio-report.json

      # ── 步骤 3：相关单测兜底（ratio 回归 + fallback 子指标 + 边界用例）──
      - name: 运行 ratio 相关单元测试
        run: |
          python -m pytest \
            tests/unit/test_prometheus_ratio_regression.py \
            tests/unit/test_fallback_submetric_ratio_invariant.py \
            tests/unit/test_judge_llm_confidence_edge_cases.py \
            -v --tb=short || true

      # ── 步骤 4：上传验证报告 ──
      - name: 上传验证报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-ratio-report
          path: ci-ratio-report.json
          retention-days: 30
