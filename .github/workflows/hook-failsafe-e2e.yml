# =====================================================================
# tlm-hook-failsafe 自动化回归测试 CI/CD 流水线
#
# 【不易】15 函数导出契约；hook 无 BOM + marker 编码契约；错误码解释层正确性
# 【变易】矩阵：PS 5.1（powershell.exe）+ PS 7（pwsh.exe）
#          E2E 全程 -CI 模式（不污染源仓库）
# 【简易】四 Job：setup-repo → unit-tests(矩阵) + e2e-tests(矩阵) → test-summary
#
# 【关键技术决策】shell: 字段不支持 matrix 表达式
#   GitHub Actions 对 shell: 字段做静态验证，而 matrix 上下文仅运行时可用，
#   故 shell: ${{ matrix.shell }} 会报 "Unrecognized named-value: 'matrix'"。
#   解法：shell 固定为 pwsh（PS 7 外壳），通过 PS_EXE 环境变量在 run 内调用
#   对应版本可执行文件（5.1→powershell.exe / 7→pwsh.exe）运行测试脚本，
#   确保 $PSVersionTable 反映真实目标版本。
#
# 触发条件:
#   - push 到 master/main（包/源/测试/工作流变更时）
#   - PR 到 master/main
#   - 手动触发（workflow_dispatch）
#
# 依赖文件:
#   - packages/tlm-hook-failsafe/sync-from-source.ps1
#   - packages/tlm-hook-failsafe/publish-to-local-repo.ps1
#   - packages/tlm-hook-failsafe/tests/test_exit_code_resolution.ps1
#   - packages/tlm-hook-failsafe/tests/test_team_integration_e2e.ps1
#   - packages/tlm-hook-failsafe/tests/test_multi_repo_sync.ps1
# =====================================================================
name: tlm-hook-failsafe E2E

# 【变易·P2-4】concurrency: 同 workflow 同 ref 连续触发取消旧 run 只留最新。
# 2026-08-08 排队风暴治理延伸: 全项目 workflow 批量统一。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    # develop 分支也纳入触发：BOM/PS 契约变更（packages/tlm-hook-failsafe/**）需在
    # develop push 时同样验证，否则 develop 上的 PS 脚本改动无法获得契约测试覆盖
    branches: [master, main, develop]
    paths:
      - 'packages/tlm-hook-failsafe/**'
      - 'scripts/dev/hook_fail_safe.psm1'
      - '.github/workflows/hook-failsafe-e2e.yml'
  pull_request:
    paths:
      - 'packages/tlm-hook-failsafe/**'
      - 'scripts/dev/hook_fail_safe.psm1'
      - '.github/workflows/hook-failsafe-e2e.yml'
  workflow_dispatch:
    inputs:
      ps_version:
        description: 'PowerShell 版本（5.1 / 7 / both）'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - '5.1'
          - '7'

env:
  MODULE_NAME: tlm-hook-failsafe

jobs:
  # =====================================================================
  # Job 1: 注册 LocalPSRepo + 发布模块（为后续 E2E 提供安装源）
  # 【不易】LocalPSRepo 是 E2E 测试的安装源；发布失败则后续 Job 无法运行
  # =====================================================================
  setup-repo:
    name: 注册 LocalPSRepo + 发布
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      published-version: ${{ steps.publish.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 PowerShell 环境
        shell: powershell
        run: |
          # 不易：TLS 1.2（PS 5.1 默认 TLS 1.0 已废弃）
          try {
            [Net.ServicePointManager]::SecurityProtocol =
              [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          } catch { }
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Sync 源码到包
        shell: powershell
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          & .\sync-from-source.ps1
          if ($LASTEXITCODE -ne 0) { throw "sync-from-source failed: exit $LASTEXITCODE" }

      - name: 注册 LocalPSRepo + 发布模块
        id: publish
        shell: powershell
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          & .\publish-to-local-repo.ps1
          if ($LASTEXITCODE -ne 0) { throw "publish-to-local-repo failed: exit $LASTEXITCODE" }
          $manifest = Test-ModuleManifest -Path .\tlm-hook-failsafe.psd1
          "version=$($manifest.Version)" >> $env:GITHUB_OUTPUT
          Write-Host "Published v$($manifest.Version) to LocalPSRepo"

      - name: 设置总结
        if: always()
        # 不易：pwsh(PS7) 默认 UTF-8，避免 PS5.1 Windows-1252 解码中文引号陷阱
        shell: pwsh
        run: |
          $result = "${{ job.status }}"
          $version = "${{ steps.publish.outputs.version }}"
          "## LocalPSRepo 注册与发布" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| 项目 | 值 |" >> $env:GITHUB_STEP_SUMMARY
          "|------|-----|" >> $env:GITHUB_STEP_SUMMARY
          "| 模块版本 | $version |" >> $env:GITHUB_STEP_SUMMARY
          "| 状态 | $result |" >> $env:GITHUB_STEP_SUMMARY

  # =====================================================================
  # Job 2: 单元测试（错误码解释层，无 LocalPSRepo 依赖）
  # 【变易】矩阵：PS 5.1 + PS 7；独立于 setup-repo（可并行）
  # 【不易】shell: 字段不可用 matrix（静态验证），故固定 pwsh 外壳 + PS_EXE 选版本
  # =====================================================================
  unit-tests:
    name: 单元测试（错误码解释层）- PS ${{ matrix.ps_label }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ps_label: ['5.1', '7']
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 选择目标 PowerShell 可执行文件
        # 不易：shell: 字段静态验证不支持 matrix，固定 pwsh 作外壳；
        #       通过 GITHUB_ENV 导出 PS_EXE，后续 step 用 & $env:PS_EXE 调用目标版本
        shell: pwsh
        run: |
          try {
            [Net.ServicePointManager]::SecurityProtocol =
              [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          } catch { }
          $psExe = if ('${{ matrix.ps_label }}' -eq '5.1') { 'powershell.exe' } else { 'pwsh.exe' }
          "ps_exe=$psExe" >> $env:GITHUB_ENV
          Write-Host "Outer shell (pwsh): $($PSVersionTable.PSVersion)"
          Write-Host "Test target exe  : $psExe"
          # 验证目标可执行文件可用
          $realVer = & $psExe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          Write-Host "Target PS version : $realVer"

      - name: Sync 源码到包（确保 .psm1 最新）
        shell: pwsh
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          & .\sync-from-source.ps1
          if ($LASTEXITCODE -ne 0) { throw "sync-from-source failed: exit $LASTEXITCODE" }

      - name: 运行错误码解释层单元测试
        shell: pwsh
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          # 不易：用目标 PS 可执行文件运行测试，$PSVersionTable 反映真实版本
          & $env:PS_EXE -NoProfile -ExecutionPolicy Bypass -File .\tests\test_exit_code_resolution.ps1
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed: exit $LASTEXITCODE" }

      - name: 单元测试总结
        if: always()
        shell: pwsh
        run: |
          $result = "${{ job.status }}"
          "## 单元测试结果 (PS ${{ matrix.ps_label }})" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| 项目 | 状态 |" >> $env:GITHUB_STEP_SUMMARY
          "|------|------|" >> $env:GITHUB_STEP_SUMMARY
          "| 错误码解释层 (PS ${{ matrix.ps_label }}) | $result |" >> $env:GITHUB_STEP_SUMMARY

  # =====================================================================
  # Job 3: E2E 测试（团队集成 + 多仓库同步，-CI 模式）
  # 【不易】依赖 setup-repo 提供的 LocalPSRepo；-CI 模式不污染源仓库
  # 【变易】矩阵：PS 5.1 + PS 7（shell 固定 pwsh + PS_EXE 选版本）
  # =====================================================================
  e2e-tests:
    name: E2E 测试 - PS ${{ matrix.ps_label }}
    runs-on: windows-latest
    needs: setup-repo
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ps_label: ['5.1', '7']
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 选择目标 PowerShell 可执行文件
        shell: pwsh
        run: |
          try {
            [Net.ServicePointManager]::SecurityProtocol =
              [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          } catch { }
          $psExe = if ('${{ matrix.ps_label }}' -eq '5.1') { 'powershell.exe' } else { 'pwsh.exe' }
          "ps_exe=$psExe" >> $env:GITHUB_ENV
          Write-Host "Outer shell (pwsh): $($PSVersionTable.PSVersion)"
          Write-Host "Test target exe  : $psExe"

      - name: Sync 源码到包
        shell: pwsh
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          & .\sync-from-source.ps1
          if ($LASTEXITCODE -ne 0) { throw "sync-from-source failed: exit $LASTEXITCODE" }

      - name: 注册 LocalPSRepo + 发布（确保 E2E 测试有安装源）
        shell: pwsh
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          & .\publish-to-local-repo.ps1
          if ($LASTEXITCODE -ne 0) { throw "publish-to-local-repo failed: exit $LASTEXITCODE" }
          Write-Host "LocalPSRepo ready for E2E tests"

      - name: "E2E: 团队集成测试（-CI 模式）"
        shell: pwsh
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          & $env:PS_EXE -NoProfile -ExecutionPolicy Bypass -File .\tests\test_team_integration_e2e.ps1 -CI
          if ($LASTEXITCODE -ne 0) { throw "team integration E2E failed: exit $LASTEXITCODE" }

      - name: "E2E: 多仓库同步测试（-CI 模式）"
        shell: pwsh
        working-directory: packages/tlm-hook-failsafe
        run: |
          $ErrorActionPreference = "Stop"
          & $env:PS_EXE -NoProfile -ExecutionPolicy Bypass -File .\tests\test_multi_repo_sync.ps1 -CI
          if ($LASTEXITCODE -ne 0) { throw "multi-repo sync E2E failed: exit $LASTEXITCODE" }

      - name: E2E 测试总结
        if: always()
        shell: pwsh
        run: |
          $result = "${{ job.status }}"
          "## E2E 测试结果 (PS ${{ matrix.ps_label }})" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| 测试 | 状态 |" >> $env:GITHUB_STEP_SUMMARY
          "|------|------|" >> $env:GITHUB_STEP_SUMMARY
          "| 团队集成 (PS ${{ matrix.ps_label }}) | $result |" >> $env:GITHUB_STEP_SUMMARY
          "| 多仓库同步 (PS ${{ matrix.ps_label }}) | $result |" >> $env:GITHUB_STEP_SUMMARY

  # =====================================================================
  # Job 4: 测试总结与通知
  # =====================================================================
  test-summary:
    name: 测试总结与通知
    runs-on: ubuntu-latest
    needs: [setup-repo, unit-tests, e2e-tests]
    if: always()
    steps:
      - name: 生成测试总结
        run: |
          SETUP_RESULT="${{ needs.setup-repo.result }}"
          UNIT_RESULT="${{ needs.unit-tests.result }}"
          E2E_RESULT="${{ needs.e2e-tests.result }}"
          VERSION="${{ needs.setup-repo.outputs.published-version }}"

          echo "## tlm-hook-failsafe 回归测试总结" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 阶段 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| LocalPSRepo 注册与发布 | ${SETUP_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| 单元测试（PS 5.1 + PS 7） | ${UNIT_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E 测试（PS 5.1 + PS 7） | ${E2E_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "发布版本: ${VERSION}" >> $GITHUB_STEP_SUMMARY

          if [[ "${SETUP_RESULT}" == "failure" ]]; then
            echo "❌ LocalPSRepo 注册/发布失败，E2E 测试可能未执行" >> $GITHUB_STEP_SUMMARY
          elif [[ "${UNIT_RESULT}" == "failure" ]]; then
            echo "❌ 单元测试失败" >> $GITHUB_STEP_SUMMARY
          elif [[ "${E2E_RESULT}" == "failure" ]]; then
            echo "❌ E2E 测试失败" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ 所有测试通过" >> $GITHUB_STEP_SUMMARY
          fi

      - name: PR 评论通知（失败时）
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## ❌ tlm-hook-failsafe 回归测试失败',
                '',
                '**失败阶段**:',
                `- LocalPSRepo 注册与发布: ${{ needs.setup-repo.result }}`,
                `- 单元测试: ${{ needs.unit-tests.result }}`,
                `- E2E 测试: ${{ needs.e2e-tests.result }}`,
                '',
                `**查看详情**: [Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                '**修复建议**:',
                '1. 检查 `sync-from-source.ps1` 是否同步成功（15 函数导出）',
                '2. 检查 `publish-to-local-repo.ps1` 是否注册 LocalPSRepo 成功',
                '3. 检查 E2E 测试脚本的 -CI 模式是否通过'
              ].join('\n')
            })
