# master commit 来源守卫 —— 校验 push 到 master 的 commit 是否为人工发起
# 背景(2026-08-05 复盘): scripts/publish_fix_to_docs.py 用本地 git 身份(nzt47)
#   直接 git commit + push 到 master, 与人工 commit 无法通过 author email 区分。
#   本 workflow 调用 verify_commit_origin.py, 通过"白名单 + GitHub 关联 PR 校验"
#   识别脚本直接 push 的 commit(无关联 PR → 阻断)。
#
# 三阶段灰度上线(【不易】不锁死 master push):
#   阶段 1(本 PR 落地): GUARD_MODE=dry-run, 仅告警不阻断, 不勾选 required status check
#   阶段 2(观察 1-2 周后): 切 GUARD_MODE=enforce, 仍不勾选(push 后才跑, 事后告警)
#   阶段 3(长期): 开启 master 分支保护 + 本 workflow + ci.yml 勾选 required status check
#
# 切换模式: 仓库 Settings → Secrets and variables → Actions → Variables →
#           新增 COMMIT_ORIGIN_GUARD_MODE = enforce(或 dry-run 切回)
name: master commit 来源守卫(verify_commit_origin)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 手动触发, 支持指定 sha/mode

permissions:
  contents: read
  pull-requests: read  # 关键: 查 commit 关联 PR 必需(/commits/{sha}/pulls)

jobs:
  commit-origin-guard:
    name: commit-origin-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # [契约] secrets 不能在 if: 中使用(workflow 解析失败), 映射到 job env 供 step if 判断
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # GUARD_MODE 通过仓库变量切换(默认 dry-run, 灰度期安全)
      # 仓库 Settings → Variables → COMMIT_ORIGIN_GUARD_MODE
      GUARD_MODE: ${{ vars.COMMIT_ORIGIN_GUARD_MODE || 'dry-run' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          # 关键: 默认 fetch-depth=1 拿不到 base..HEAD 范围
          # 需要 git rev-list base..sha 展开 commit 列表
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 检查脚本存在(跨分支/仓库安全)
        id: precheck
        run: |
          if [ ! -f scripts/verify_commit_origin.py ]; then
            echo "::notice::verify_commit_origin.py 不存在, 跳过(跨分支/仓库安全)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 确定 commit SHA 范围
        id: range
        if: steps.precheck.outputs.skip != 'true'
        run: |
          # push 事件: 检查 before..after 范围(排除分支删除/force push)
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            # before 全 0 表示新分支, 只查 after 单个 commit
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "base=" >> "$GITHUB_OUTPUT"
              echo "sha=$AFTER" >> "$GITHUB_OUTPUT"
            else
              echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
              echo "sha=$AFTER" >> "$GITHUB_OUTPUT"
            fi
          else
            # PR 事件: 检查 PR 头 commit
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 运行 commit 来源校验
        if: steps.precheck.outputs.skip != 'true'
        run: |
          # GUARD_MODE=dry-run: 检测到问题仅 ::warning:: 告警, exit 0(不阻断)
          # GUARD_MODE=enforce: 检测到问题 exit 1 → 本步失败 → job 失败
          python scripts/verify_commit_origin.py \
            --sha "${{ steps.range.outputs.sha }}" \
            --base "${{ steps.range.outputs.base }}" \
            --mode "${GUARD_MODE}" \
            --json > commit_origin_report.json

      - name: 解析结果并输出关键字段
        if: steps.precheck.outputs.skip != 'true'
        id: parse
        run: |
          python - <<'PY'
          import json, os
          r = json.load(open("commit_origin_report.json", encoding="utf-8"))
          blocked = [i for i in r["items"] if i["status"] == "BLOCK"]
          print(f"overall_status={r['status']}")
          print(f"mode={r['meta'].get('mode','')}")
          print(f"total={r['total']} blocked={r['blocked']}")
          for b in blocked:
              print(f"::error::BLOCK {b['id']} {b['path']}: {b['detail']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"overall_status={r['status']}\n")
              f.write(f"blocked={r['blocked']}\n")
              f.write(f"mode={r['meta'].get('mode','')}\n")
          PY

      - name: 上传报告(可审计)
        if: always() && steps.precheck.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: commit-origin-report
          path: commit_origin_report.json
          if-no-files-found: ignore

      - name: 汇总到 Job Summary
        if: always() && steps.precheck.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json, os
          r = json.load(open("commit_origin_report.json", encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## master commit 来源校验结果\n\n")
              f.write(f"- **总体**: {r['status'].upper()} (BLOCK={r['blocked']}/{r['total']})\n")
              f.write(f"- **模式**: {r['meta'].get('mode','')}\n")
              f.write(f"- **仓库**: {r['meta'].get('repo','')}\n\n")
              for i in r["items"]:
                  mark = "✅ PASS" if i["status"] == "pass" else "❌ BLOCK"
                  f.write(f"- {mark} `{i['id']}` `{i['path']}`: {i['desc']}\n")
                  f.write(f"  - {i['detail']}\n")
          PY

      # ── Slack 通知(失败场景) ──
      # 仅 enforce 模式下脚本 exit 1 才触发 failure()(dry-run 永远 exit 0)
      # 未配置 SLACK_WEBHOOK_URL secret 时跳过(不产生噪音失败)
      - name: Slack 通知(commit-origin-guard 阻断)
        if: failure() && steps.precheck.outputs.skip != 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ ! -f commit_origin_report.json ]; then
            python scripts/slack_notify.py \
              --title "commit-origin-guard 失败" \
              --text "workflow 在生成报告前失败, 详见 Actions 日志" \
              --repo "${{ github.repository }}" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            python scripts/slack_notify.py --json-file commit_origin_report.json \
              --title "commit-origin-guard 阻断" \
              --repo "${{ github.repository }}" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
