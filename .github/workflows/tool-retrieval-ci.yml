# 工具检索质量 CI — 防止工具描述/索引变更导致 recall 退化
#
# 【不易】保护 recall@5 >= 0.8 验收阈值,工具描述变更不得退化检索质量
# 【变易】触发路径覆盖 tool_index.json + tool_router_hybrid.py + 测试文件
# 【简易】纯 BM25 模式(AGENT_HYBRID_EMBEDDING=0),CI 环境一致性
#
# 关联:
#   - todo3: 评估测试 CI 集成(报告 §5.1 第 3 项)
#   - todo4: 负样本回归测试 CI 集成(预留 job,监控 xfail 数量漂移)

name: 工具检索质量 CI

# 【变易·P2-4】concurrency: 同 workflow 同 ref 连续触发取消旧 run 只留最新。
# 2026-08-08 排队风暴治理延伸: 全项目 workflow 批量统一。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop, 'fix/**', 'feature/**']
    paths:
      # 检索器实现
      - 'agent/tool_router_hybrid.py'
      - 'agent/tool_router.py'
      # 工具索引数据(描述变更会直接影响 recall)
      - 'data/tool_index.json'
      # 测试与 fixture
      - 'tests/unit/test_tool_retrieval_quality.py'
      - 'tests/unit/test_tool_negative_samples.py'
      - 'tests/fixtures/tool_retrieval_eval.json'
      - 'data/tool_negative_samples.json'
      # 本 workflow 自身
      - '.github/workflows/tool-retrieval-ci.yml'
      # 专有名词验证脚本
      - 'scripts/verify_bm25_proper_noun.py'
      # 检索器实现(BM25SkillSearcher 变更影响专有名词匹配)
      - 'agent/skills_mgmt/bm25_searcher.py'
      - 'agent/skills_mgmt/loader.py'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'agent/tool_router_hybrid.py'
      - 'agent/tool_router.py'
      - 'data/tool_index.json'
      - 'tests/unit/test_tool_retrieval_quality.py'
      - 'tests/unit/test_tool_negative_samples.py'
      - 'tests/fixtures/tool_retrieval_eval.json'
      - 'data/tool_negative_samples.json'
      - '.github/workflows/tool-retrieval-ci.yml'
      # 专有名词验证脚本(与 push 触发路径保持一致)
      - 'scripts/verify_bm25_proper_noun.py'
      - 'agent/skills_mgmt/bm25_searcher.py'
      - 'agent/skills_mgmt/loader.py'
  schedule:
    # 每天凌晨 3 点运行(防止 tool_index.json 漂移未被察觉)
    - cron: '0 3 * * *'

env:
  # 强制纯 BM25 模式(CI 环境 SentenceTransformer 不可用,会触发原生崩溃)
  AGENT_HYBRID_EMBEDDING: '0'
  PYTHONIOENCODING: 'utf-8'
  PYTHONPATH: '.'

jobs:
  # ============================================================================
  # todo3: 评估测试 recall@5 回归
  # ============================================================================
  retrieval-quality:
    name: 检索质量回归 (recall@5)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 【不易】pytest.ini 全局配置 asyncio_mode=auto + --strict-config，
          #   pytest 9.1.x 下缺 pytest-asyncio 会报 "Unknown config option: asyncio_mode"
          pip install pytest pytest-timeout pytest-asyncio psutil
          # 安装本项目(允许失败,失败时靠 PYTHONPATH=. 兜底)
          pip install -e . || true

      - name: 验证 BM25 降级模式生效
        run: |
          echo "=== 验证 AGENT_HYBRID_EMBEDDING=0 生效 ==="
          python -c "import os; print('AGENT_HYBRID_EMBEDDING =', os.environ.get('AGENT_HYBRID_EMBEDDING'))"
          test "$AGENT_HYBRID_EMBEDDING" = "0" || { echo "ERROR: AGENT_HYBRID_EMBEDDING 未设置为 0"; exit 1; }

      - name: 运行检索质量评估测试
        run: |
          pytest tests/unit/test_tool_retrieval_quality.py \
                -v --tb=short --timeout=60

      - name: 输出 recall@5 指标摘要
        if: always()
        run: |
          echo "=== 检索质量 CI 摘要 ==="
          echo "测试文件: tests/unit/test_tool_retrieval_quality.py"
          echo "评估 fixture: tests/fixtures/tool_retrieval_eval.json (20 中文 query)"
          echo "验收阈值: recall@5 >= 0.80"
          echo "降级模式: 纯 BM25 (AGENT_HYBRID_EMBEDDING=0)"
          echo ""
          echo "若本 CI 失败,说明工具描述/索引变更导致 recall 退化,"
          echo "请检查最近对 data/tool_index.json 或 agent/tool_router_hybrid.py 的修改。"

  # ============================================================================
  # todo4: 负样本回归测试(xfail 数量漂移监控)
  # ============================================================================
  negative-samples:
    name: 负样本回归 (xfail 漂移监控)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 【不易】pytest.ini 全局配置 asyncio_mode=auto + --strict-config，
          #   pytest 9.1.x 下缺 pytest-asyncio 会报 "Unknown config option: asyncio_mode"
          pip install pytest pytest-timeout pytest-asyncio psutil
          pip install -e . || true

      - name: 运行负样本回归测试
        run: |
          pytest tests/unit/test_tool_negative_samples.py \
                -v --tb=short --timeout=60

      - name: 输出负样本回归 CI 摘要
        if: always()
        run: |
          echo "=== 负样本回归 CI 摘要 ==="
          echo "测试文件: tests/unit/test_tool_negative_samples.py"
          echo "负样本库: data/tool_negative_samples.json (v1.1, 10 组 25 query)"
          echo "预期: 27 passed + 12 xfailed (xfail 从初始 15 降至 12)"
          echo ""
          echo "xfail 漂移监控:"
          echo "- xfail 数量增加:说明工具描述变更引入新的 BM25 缺陷 case"
          echo "- xfail 数量减少:说明工具描述优化或 Reranker 上线修复了 case"
          echo "- 两者都需同步更新 _XFAIL_CASES 字典与 test_xfail_cases_count_is_15 断言"

  # ============================================================================
  # 专有名词精确匹配验证(BM25 对字面缩写优势)
  # 【不易】专有名词(k8s/gitleaks/sqlite-vec/helm)必须精确匹配,依赖语义向量的
  #   检索会漏召回。BM25 对字面 token 匹配强,需持续守护。
  # 【变易】SemanticFakeAdapter 离线模拟向量特性,CI 无需真实模型/网络。
  # 【简易】运行验证脚本,退出码即通过标准。
  # ============================================================================
  proper-noun:
    name: 专有名词匹配验证 (BM25)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout pytest-asyncio psutil pyyaml
          pip install -e . || true

      - name: 运行专有名词匹配验证
        run: |
          echo "=== 运行 BM25 专有名词精确匹配验证 ==="
          python scripts/verify_bm25_proper_noun.py
          echo "=== 专有名词匹配验证通过 ==="

      - name: 输出专有名词验证摘要
        if: always()
        run: |
          echo "=== 专有名词匹配 CI 摘要 ==="
          echo "脚本: scripts/verify_bm25_proper_noun.py"
          echo "验证: BM25 对 k8s/gitleaks/sqlite-vec/helm 字面缩写精确匹配 (期望 100%)"
          echo "对比: 向量检索(模拟)对字面缩写不敏感,易漏召回"
          echo ""
          echo "若本 CI 失败,说明 BM25 或检索融合权重变更削弱了专有名词匹配,"
          echo "请检查对 agent/skills_mgmt/bm25_searcher.py 或检索权重的修改。"
