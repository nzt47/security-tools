# TASK-02 Learning Config Guard — 学习机制接线配置生效守卫
# 每次 PR / 主分支 push 自动运行 scripts/verify_task02_config_effective.py，
# 校验 config.yaml 三开关（reflection_persist / critic_evaluation_enabled / experience_persist）
# 的三层优先级解析（环境变量 > config.yaml > 默认值）及全部组合/边界场景，
# 防止接线代码或配置被后续改动破坏（bool('false') 陷阱 / 优先级回退等）。
# 设计对齐: .github/workflows/config-drift-guard.yml（独立定向 workflow + paths 触发）

name: TASK-02 Learning Config Guard

# 【变易·P2-4】concurrency: 同 workflow 同 ref 连续触发取消旧 run 只留最新
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'config.yaml'
      - 'agent/orchestrator/orchestrator.py'
      - 'planning/core.py'
      - 'scripts/verify_task02_config_effective.py'
      - 'scripts/verify_task02_checklist.py'
      - 'scripts/monitor_task02_observation.py'
      - '.github/workflows/task02-learning-config-guard.yml'
  push:
    branches: [main, master, develop]
    paths:
      - 'config.yaml'
      - 'agent/orchestrator/orchestrator.py'
      - 'planning/core.py'
      - 'scripts/verify_task02_config_effective.py'
      - 'scripts/verify_task02_checklist.py'
      - 'scripts/monitor_task02_observation.py'
      - '.github/workflows/task02-learning-config-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-effective:
    name: 配置生效验证（三层优先级 + 组合矩阵 + 边界）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 运行配置生效验证
        run: |
          # PYTHONPATH=. ：脚本运行时 sys.path[0]=scripts/ 不含仓库根，
          # 显式加入仓库根保证 import agent.orchestrator / planning.core 成功
          # （与 config-drift-guard.yml 同源处理）
          PYTHONPATH=. python scripts/verify_task02_config_effective.py
