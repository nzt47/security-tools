name: Error Reporting System CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 2 * * *'

env:
  ERROR_REPORTING_FILE_LEVEL: error
  ERROR_REPORTING_CONSOLE_LEVEL: warning
  # [CHG-2026-0801] CI/CD 指标推送地址（L2 触发重新注册）
  PUSHGATEWAY_URL: http://monitoring.internal:9091
  # [新增 CHG-2026-0731] cicd_metrics_push.py 日志级别（DEBUG/INFO/WARNING/ERROR/CRITICAL）
  LOG_LEVEL: INFO
  # [修复 CHG-2026-0731] GITHUB_JOB 由 GitHub Actions 自动注入，cicd_metrics_push.py
  # 的 grouping_key={run_id, ci_job} 避免同 run_id 的并行 job 指标互相覆盖

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: grep -v -E 'pywin32|pypiwin32|comtypes' requirements.txt | pip install -r /dev/stdin

      - name: Run Ruff linter
        run: |
          pip install "ruff>=0.4.0"
          ruff check . --output-format=github || true

      - name: Check code formatting
        run: |
          pip install "black>=23.0.0"
          black --check . || true

      - name: Record CI build metrics
        if: always()
        env:
          PUSHGATEWAY_URL: ${{ env.PUSHGATEWAY_URL }}
        run: |
          pip install prometheus_client -q 2>/dev/null || true
          python scripts/cicd_metrics_push.py --stage build ${{ job.status == 'success' && '--success' || '' }}

  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: grep -v -E 'pywin32|pypiwin32|comtypes' requirements.txt | pip install -r /dev/stdin

      - name: Run stress test
        run: python scripts/stress_test_error_reporting.py -c 50 -r 1000 -o ./logs/stress_test

      - name: Upload stress test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stress-test-results
          path: logs/stress_test/
          retention-days: 30

      - name: Check stress test results
        run: |
          if [ -f logs/stress_test/stress_test_report_*.json ]; then
            ERROR_RATE=$(cat logs/stress_test/stress_test_report_*.json | grep -o '"error_rate": [0-9.]*' | grep -o '[0-9.]*$')
            echo "Error rate: $ERROR_RATE%"
            if (( $(echo "$ERROR_RATE > 5" | bc -l) )); then
              echo "Error rate too high!"
              exit 1
            fi
          fi

      - name: Record CI test metrics
        if: always()
        env:
          PUSHGATEWAY_URL: ${{ env.PUSHGATEWAY_URL }}
        run: |
          pip install prometheus_client -q 2>/dev/null || true
          python scripts/cicd_metrics_push.py --stage test ${{ job.status == 'success' && '--success' || '' }}

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          grep -v -E 'pywin32|pypiwin32|comtypes' requirements.txt | pip install -r /dev/stdin
          pip install "pytest==9.0.3" "pytest-timeout>=2.0.0" "pytest-asyncio>=0.21.0"

      # [CHG-2026-0730] 合并测试 + 生成覆盖率报告
      - name: Run tests with coverage
        run: |
          pip install "pytest-cov>=4.0.0" -q
          python -m pytest tests/unit/test_error_reporting.py \
            tests/integration/test_digital_life_integration.py \
            --cov=agent --cov-report=json:coverage.json --cov-fail-under=0 -v --tb=short -m "not skip_ci"

      # [CHG-2026-0730] 从 pytest-cov JSON 提取覆盖率
      - name: Extract coverage
        if: always()
        run: |
          COVERAGE=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 1))" 2>/dev/null || echo "0")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
          echo "测试覆盖率: $COVERAGE%"

      - name: Record CI test metrics
        if: always()
        env:
          PUSHGATEWAY_URL: ${{ env.PUSHGATEWAY_URL }}
        run: |
          pip install prometheus_client -q 2>/dev/null || true
          ARGS="--stage test ${{ job.status == 'success' && '--success' || '' }}"
          if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "0" ]; then
            ARGS="$ARGS --coverage $COVERAGE"
          fi
          python scripts/cicd_metrics_push.py $ARGS

  circuit-breaker-inspection:
    name: Circuit Breaker Inspection (发布前阻断)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          grep -v -E 'pywin32|pypiwin32|comtypes' requirements.txt | pip install -r /dev/stdin
          pip install "pydantic>=2.0.0"

      - name: Run post-deploy inspection
        run: |
          echo "=== 三级熔断器发布前巡检 ==="
          python scripts/post_deploy_inspection.py --verbose
          INSPECTION_EXIT=$?
          if [ $INSPECTION_EXIT -ne 0 ]; then
            echo "::error::巡检失败（退出码 $INSPECTION_EXIT），阻断发布"
            echo "::error::详情参见 docs/DEPLOYMENT_CHECKLIST_circuit_breaker.md"
            exit 1
          fi
          echo "=== 巡检通过，允许发布 ==="

      - name: Upload inspection report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: circuit-breaker-inspection-report
          path: |
            docs/DEPLOYMENT_CHECKLIST_circuit_breaker.md
            docs/RELEASE_NOTES_circuit_breaker.md
          retention-days: 30

      - name: Record CI test metrics
        if: always()
        env:
          PUSHGATEWAY_URL: ${{ env.PUSHGATEWAY_URL }}
        run: |
          pip install prometheus_client -q 2>/dev/null || true
          python scripts/cicd_metrics_push.py --stage test ${{ job.status == 'success' && '--success' || '' }}

  docker-build:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, stress-test]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build

      - name: Run container
        run: docker compose up -d

      - name: Wait for container
        run: sleep 10

      - name: Check container status
        run: docker compose ps

      - name: View logs
        run: docker compose logs --tail=50

      - name: Cleanup
        if: always()
        run: docker compose down

      - name: Record CI build metrics
        if: always()
        env:
          PUSHGATEWAY_URL: ${{ env.PUSHGATEWAY_URL }}
        run: |
          pip install prometheus_client -q 2>/dev/null || true
          python scripts/cicd_metrics_push.py --stage build ${{ job.status == 'success' && '--success' || '' }}

  nightly-full-test:
    name: Nightly Full Test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: grep -v -E 'pywin32|pypiwin32|comtypes' requirements.txt | pip install -r /dev/stdin

      - name: Run full stress test with high concurrency
        run: python scripts/stress_test_error_reporting.py -c 100 -r 5000 -o ./logs/nightly_test

      - name: Run Slack webhook test (dry run)
        run: python slack_config.py --test || true

      - name: Generate deployment report
        run: |
          python -c "
          import json
          import os
          from datetime import datetime

          report = {
            'test_time': datetime.now().isoformat(),
            'test_type': 'nightly_full_test',
            'results': []
          }

          for f in os.listdir('./logs/nightly_test'):
            if f.endswith('.json'):
              with open(f'./logs/nightly_test/{f}') as fp:
                report['results'].append(json.load(fp))

          with open('./logs/nightly_report.json', 'w') as fp:
            json.dump(report, fp, indent=2)
          "

      - name: Upload nightly report
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-report
          path: logs/
          retention-days: 90

  # [CHG-2026-0801] Reranker 热重载 + 无效 variant 回滚追踪验证（任务1/2 CI 集成）
  reranker-hot-reload:
    name: Reranker Hot Reload & Log Verification
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-reranker-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-reranker-

      - name: Install test dependencies
        run: |
          pip install "pytest==9.0.3" "pytest-timeout>=2.0.0" "pytest-asyncio>=0.21.0" -q

      - name: Run reranker unit tests (含日志优化与热重载)
        env:
          SKILLS_OFFLINE: "1"
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p reports
          python -m pytest tests/unit/test_reranker.py tests/unit/test_reranker_hot_reload.py \
            -v --tb=short --junitxml=reports/reranker-test-results.xml

      - name: Run hot reload stability test
        env:
          SKILLS_OFFLINE: "1"
          PYTHONIOENCODING: utf-8
        run: |
          echo "=== 热重载稳定性测试（并发 rerank + 三态 variant 切换）==="
          # [CHG-2026-0801] concurrency 4→8 验证竞态边界；duration 15→20 确保三态循环充分触发
          python scripts/test_hot_reload_stability.py \
            --duration 20 --concurrency 8 --ci-mode

      - name: Verify traceback capture on invalid variant rollback
        env:
          SKILLS_OFFLINE: "1"
          PYTHONIOENCODING: utf-8
        run: |
          echo "=== 验证无效 variant 回滚 traceback 捕获（任务2）==="
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from unittest.mock import patch, MagicMock
          os.environ['SKILLS_OFFLINE']='1'
          os.environ['SKILL_RERANKER_USE_ONNX']='true'
          os.environ['SKILL_RERANKER_ONNX_VARIANT']='model_quantized.onnx'
          os.environ['SKILL_RERANKER_HOT_RELOAD_INTERVAL']='0'
          from agent.skills_mgmt.reranker import SkillReranker
          r = SkillReranker()
          r._onnx_session = MagicMock(); r._onnx_tokenizer = MagicMock()
          r._onnx_input_names = ['input_ids']; r._use_onnx = True; r._load_attempted = True
          def _boom(self, variant):
              raise FileNotFoundError(f'onnx_file_not_found: /fake/{variant}')
          with patch.object(SkillReranker, '_try_load_onnx_variant', _boom):
              os.environ['SKILL_RERANKER_ONNX_VARIANT']='nonexistent.onnx'
              r._maybe_hot_reload()
          assert r._last_load_traceback is not None, 'traceback 未捕获'
          assert 'Traceback' in r._last_load_traceback, 'traceback 格式异常'
          assert 'FileNotFoundError' in r._last_load_traceback, '异常类型未记录'
          print('[P0-CI] traceback 捕获验证通过')
          print('[P0-CI] traceback 片段:', r._last_load_traceback.splitlines()[-1][:120])
          "

      - name: Upload reranker test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reranker-test-results
          path: reports/reranker-test-results.xml
          retention-days: 30

      - name: Record CI test metrics
        if: always()
        env:
          PUSHGATEWAY_URL: ${{ env.PUSHGATEWAY_URL }}
        run: |
          pip install prometheus_client -q 2>/dev/null || true
          python scripts/cicd_metrics_push.py --stage test ${{ job.status == 'success' && '--success' || '' }}

  deployment-ready:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: [stress-test, integration-test, circuit-breaker-inspection, reranker-hot-reload]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # [CHG-2026-0730] 记录部署开始时间戳
      - name: Record deployment start time
        run: echo "DEPLOY_START=$(date +%s)" >> $GITHUB_ENV

      - name: Create deployment summary
        run: |
          echo "# Deployment Verification Summary" > deployment_summary.md
          echo "" >> deployment_summary.md
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deployment_summary.md
          echo "**Commit:** ${{ github.sha }}" >> deployment_summary.md
          echo "**Branch:** main" >> deployment_summary.md
          echo "" >> deployment_summary.md
          echo "All tests passed! The system is ready for deployment." >> deployment_summary.md
          echo "" >> deployment_summary.md
          echo "## Test Results" >> deployment_summary.md
          echo "- Lint and Type Check: PASSED" >> deployment_summary.md
          echo "- Stress Test: PASSED" >> deployment_summary.md
          echo "- Integration Test: PASSED" >> deployment_summary.md
          echo "- Docker Build: PASSED" >> deployment_summary.md
          echo "- Circuit Breaker Inspection: PASSED" >> deployment_summary.md

      - name: Upload deployment summary
        uses: actions/upload-artifact@v7
        with:
          name: deployment-summary
          path: deployment_summary.md

      # [CHG-2026-0730] 计算部署耗时
      - name: Calculate deployment duration
        if: always()
        run: |
          DEPLOY_END=$(date +%s)
          DEPLOY_DURATION=$((DEPLOY_END - ${DEPLOY_START:-$DEPLOY_END}))
          echo "DEPLOY_DURATION=$DEPLOY_DURATION" >> $GITHUB_ENV
          echo "部署耗时: ${DEPLOY_DURATION}s"

      - name: Record deployment metrics
        if: always()
        env:
          PUSHGATEWAY_URL: ${{ env.PUSHGATEWAY_URL }}
        run: |
          pip install prometheus_client -q 2>/dev/null || true
          ARGS="--stage deploy --env production ${{ job.status == 'success' && '--success' || '' }}"
          if [ -n "$DEPLOY_DURATION" ]; then
            ARGS="$ARGS --duration $DEPLOY_DURATION"
          fi
          python scripts/cicd_metrics_push.py $ARGS

      - name: Record rollback on deployment failure
        if: failure()
        env:
          PUSHGATEWAY_URL: ${{ env.PUSHGATEWAY_URL }}
        run: |
          pip install prometheus_client -q 2>/dev/null || true
          python scripts/cicd_metrics_push.py --stage rollback --env production

  post-deploy-alert-check:
    name: Post-Deploy Alert Check (发布后全量告警检查)
    runs-on: ubuntu-latest
    needs: deployment-ready
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          grep -v -E 'pywin32|pypiwin32|comtypes' requirements.txt | pip install -r /dev/stdin
          pip install "pydantic>=2.0.0"

      - name: Run circuit breaker alert check
        run: |
          echo "=== 发布后熔断器告警全量检查 ==="
          python scripts/circuit_breaker_alert.py --verbose
          ALERT_EXIT=$?
          if [ $ALERT_EXIT -ne 0 ]; then
            echo "::warning::发布后告警检查发现异常（退出码 $ALERT_EXIT）"
            echo "::warning::详情参见 scripts/circuit_breaker_alert.py --json 输出"
          fi
          echo "=== 告警检查完成 ==="

      - name: Run failure simulation tests
        run: |
          echo "=== 熔断器异常模拟测试 ==="
          python scripts/simulate_circuit_breaker_failures.py --verbose
          SIM_EXIT=$?
          if [ $SIM_EXIT -ne 0 ]; then
            echo "::error::异常模拟测试失败（退出码 $SIM_EXIT），告警脚本可能存在检测盲区"
            exit 1
          fi
          echo "=== 异常模拟测试通过 ==="

      - name: Generate alert check report
        if: always()
        run: |
          echo "# Post-Deploy Alert Check Report" > alert_report.md
          echo "" >> alert_report.md
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> alert_report.md
          echo "**Commit:** ${{ github.sha }}" >> alert_report.md
          echo "" >> alert_report.md
          echo "## Alert Check" >> alert_report.md
          echo '```' >> alert_report.md
          python scripts/circuit_breaker_alert.py --json >> alert_report.md 2>&1 || true
          echo '```' >> alert_report.md
          echo "" >> alert_report.md
          echo "## Failure Simulation" >> alert_report.md
          echo '```' >> alert_report.md
          python scripts/simulate_circuit_breaker_failures.py --json >> alert_report.md 2>&1 || true
          echo '```' >> alert_report.md

      - name: Upload alert check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: post-deploy-alert-report
          path: alert_report.md
          retention-days: 90
