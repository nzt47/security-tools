name: CI 失败通知

# 触发条件：任何 workflow 失败时
on:
  workflow_run:
    workflows:
      - "部署文档到 GitHub Pages"
      - "云枢系统测试流程"
      - "Error Reporting System CI/CD"
      - "日志性能守护"
      - "硬编码密码扫描（全分支）"
      - "关键字参数冲突扫描 (Docker)"
    types:
      - completed

# 权限：仅需读取 workflow 运行结果
permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: 发送失败通知
    # 仅在失败时触发
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # [修复 CHG-2026-0801] secrets 不能在 if: 中使用，映射到 job env 供 step if 判断
    env:
      DINGTANG_WEBHOOK: ${{ secrets.DINGTANG_WEBHOOK }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备通知内容
        id: prep
        run: |
          echo "workflow_name=${{ github.event.workflow_run.name }}" >> $GITHUB_OUTPUT
          echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          echo "run_url=${{ github.event.workflow_run.html_url }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          echo "commit=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          echo "actor=${{ github.event.workflow_run.actor.login }}" >> $GITHUB_OUTPUT

      # ── 通知渠道 1: 钉钉机器人（推荐，实时） ──
      - name: 发送钉钉通知
        if: ${{ env.DINGTANG_WEBHOOK != '' }}
        uses: visiblelabs/dingtalk-action@v1
        with:
          webhook: ${{ secrets.DINGTANG_WEBHOOK }}
          msgtype: markdown
          title: "CI 失败告警"
          text: |
            ## CI 失败告警

            - Workflow: ${{ steps.prep.outputs.workflow_name }}
            - 分支: ${{ steps.prep.outputs.branch }}
            - 触发者: ${{ steps.prep.outputs.actor }}
            - Commit: ${{ steps.prep.outputs.commit }}
            - 运行详情: [查看日志](${{ steps.prep.outputs.run_url }})

            请尽快处理。
      # ── 通知渠道 2: GitHub Issue（自动创建） ──
      - name: 创建 GitHub Issue
        # 仅在 master 分支失败时创建 Issue，避免 PR 失败产生噪声
        if: ${{ github.event.workflow_run.head_branch == 'master' }}
        uses: actions/github-script@v7
        with:
          script: |
            const workflowName = '${{ steps.prep.outputs.workflow_name }}';
            const runUrl = '${{ steps.prep.outputs.run_url }}';
            const branch = '${{ steps.prep.outputs.branch }}';
            const commit = '${{ steps.prep.outputs.commit }}';
            const actor = '${{ steps.prep.outputs.actor }}';

            // 检查是否已有相同 Issue 开启（避免重复）
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 10
            });

            const existingIssue = issues.data.find(i =>
              i.title.includes(workflowName) && i.title.includes(commit.substring(0, 7))
            );

            if (existingIssue) {
              console.log(`已存在相同 Issue #${existingIssue.number}，跳过创建`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI 失败: ${workflowName} @ ${commit.substring(0, 7)}`,
              body: [
                '## CI 失败详情',
                '',
                '| 项目 | 值 |',
                '|---|---|',
                `| Workflow | ${workflowName} |`,
                `| 分支 | ${branch} |`,
                `| Commit | ${commit} |`,
                `| 触发者 | @${actor} |`,
                `| 时间 | ${new Date().toISOString()} |`,
                '',
                `**运行日志**: ${runUrl}`,
                '',
                '## 修复建议',
                '',
                '1. 点击运行日志链接查看具体失败步骤',
                '2. 本地复现：`git checkout <commit>` 后运行相关测试',
                '3. 修复后推送新 commit，CI 会自动重跑',
                '',
                '---',
                '此 Issue 由 CI 失败通知 workflow 自动创建，修复后请关闭。'
              ].join('\n'),
              labels: ['ci-failure', 'auto-generated']
            });

            console.log(`已创建 Issue #${issue.data.number}`);

      # ── 通知渠道 3: 邮件（GitHub 默认已启用） ──
      # GitHub 默认会向 commit 作者和仓库 watcher 发送失败邮件
      # 无需额外配置，此处仅作日志说明
      - name: 邮件通知说明
        run: |
          echo "✓ 邮件通知已由 GitHub 默认机制处理"
          echo "  收件人: commit 作者 + 仓库 watcher"
          echo "  配置位置: https://github.com/settings/notifications"
          echo ""
          echo "如需自定义邮件规则，访问上述链接调整"

  # ── Docker kwarg 扫描状态变化监控（失败→恢复 才通知，避免每次成功噪声） ──
  # 【不易】只在「上次 failure → 本次 success」时通知,贴合"状态变化"语义
  # 【变易】用 github-script 查历史 run 判断真实变化,非每次 success 都通知
  docker-scan-recover-notify:
    name: Docker 扫描恢复通知
    if: ${{ github.event.workflow_run.name == '关键字参数冲突扫描 (Docker)' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DINGTANG_WEBHOOK: ${{ secrets.DINGTANG_WEBHOOK }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检测状态变化（上次失败→本次成功）
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const currentId = context.payload.workflow_run.id;
            const branch = context.payload.workflow_run.head_branch;
            // 查询同分支该 workflow 最近 5 次 completed run,排除当前 run
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'kwarg-docker-scan.yml',
              branch: branch,
              status: 'completed',
              per_page: 5
            });
            const prevRun = runs.data.workflow_runs.find(r => r.id !== currentId);
            if (!prevRun) {
              core.info('无历史 run,跳过恢复通知');
              core.setOutput('recovered', 'false');
              return;
            }
            core.info(`prev conclusion=${prevRun.conclusion}, current=success`);
            if (prevRun.conclusion !== 'failure') {
              core.info('上次非 failure,非状态变化,不通知');
              core.setOutput('recovered', 'false');
              return;
            }
            core.setOutput('recovered', 'true');
            core.setOutput('prev_url', prevRun.html_url);
            core.setOutput('prev_sha', prevRun.head_sha.substring(0, 7));

      - name: 发送钉钉恢复通知
        if: ${{ steps.detect.outputs.recovered == 'true' && env.DINGTANG_WEBHOOK != '' }}
        uses: visiblelabs/dingtalk-action@v1
        with:
          webhook: ${{ secrets.DINGTANG_WEBHOOK }}
          msgtype: markdown
          title: "✅ Docker kwarg 扫描已恢复"
          text: |
            ## ✅ Docker kwarg 扫描已恢复

            - 分支: ${{ github.event.workflow_run.head_branch }}
            - 本次 Commit: ${{ github.event.workflow_run.head_sha }}
            - 上次失败 Commit: ${{ steps.detect.outputs.prev_sha }}
            - 本次运行: [查看日志](${{ github.event.workflow_run.html_url }})
            - 上次失败: [查看日志](${{ steps.detect.outputs.prev_url }})

            HIGH 风险扫描已从 **失败** 恢复为 **通过**。

      - name: 恢复通知说明（无 webhook 时）
        if: ${{ steps.detect.outputs.recovered == 'true' && env.DINGTANG_WEBHOOK == '' }}
        run: |
          echo "✓ Docker 扫描已从失败恢复,但未配置 DINGTANG_WEBHOOK secret"
          echo "  邮件通知仍由 GitHub 默认机制发送给 commit 作者"
          echo "  配置钉钉 webhook: 仓库 Settings → Secrets → 添加 DINGTANG_WEBHOOK"
