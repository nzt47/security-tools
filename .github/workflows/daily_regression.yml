# =====================================================================
# 每日回归测试 CI/CD 流水线
#
# 【不易】不修改测试代码,仅编排执行顺序和失败通知
# 【变易】支持手动触发(workflow_dispatch) + 每日定时(cron) + PR 触发
#         + nightly 构建完成后自动触发(workflow_run)
# 【简易】三阶段:依赖安装 → 单元测试 → 端到端恢复测试
#
# 触发条件:
#   - nightly 构建完成后自动触发(ci.yml 完成且 conclusion=success)
#   - 每日 UTC 02:00(北京时间 10:00)定时兜底执行
#   - PR 到 master 分支时执行
#   - 手动触发(workflow_dispatch)
# =====================================================================
name: Daily Regression Tests

# 【变易·P2-4】concurrency: 同 workflow 同 ref 连续触发取消旧 run 只留最新。
# 2026-08-08 排队风暴治理延伸: 全项目 workflow 批量统一。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # 【变易】nightly 构建完成后自动触发回归测试
  # 仅当 ci.yml(云枢系统测试流程) 成功完成时触发,避免在失败构建上跑回归
  workflow_run:
    workflows: ["云枢系统测试流程"]
    types: [completed]
    branches: [master, main]
  schedule:
    # UTC 02:00 = 北京时间 10:00(每日)
    # 兜底机制:即使 nightly 构建未触发,回归测试仍定时执行
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: '测试套件(all / unit / e2e / checkpoint)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - e2e
          - checkpoint
  pull_request:
    branches: [ master ]
    paths:
      - 'scripts/finetune_reranker.py'
      - 'agent/tool_router_hybrid.py'
      - 'tests/test_checkpoint_*.py'
      - 'tests/test_lora_checkpoint.py'
      - '.github/workflows/daily_regression.yml'

env:
  PYTHON_VERSION: '3.12'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  # light_loader 性能门禁：阈值 = 基线 × 容差（不设绝对值）。
  # 基线 LIGHT_LOADER_SERIAL_BASELINE_MS = 本机实测 10000 卡串行 1944ms（2026-08-11
  #   workers 拐点扫描，docs/reports/light_loader_workers_scan_20260811.md）。
  # 硬件升级/更换 runner 后：先在目标环境重跑基准校准
  #   python scripts/dev/bench_light_loader_serial_parallel.py --scale 10000
  #   用新基线更新下方两个变量即可，无需改 workflow 逻辑。
  LIGHT_LOADER_SERIAL_BASELINE_MS: '1944'
  LIGHT_LOADER_BENCH_TOLERANCE: '1.5'

jobs:
  # =====================================================================
  # Job 0: nightly 构建成功守卫(workflow_run 触发时检查上游 conclusion)
  # 【不易】非 workflow_run 触发时直接放行,不影响 schedule/PR/dispatch 路径
  # 【简易】单一职责:仅做条件判断,无 step,通过 needs 串联到所有测试 job
  # =====================================================================
  nightly-build-guard:
    name: Nightly Build Guard
    runs-on: ubuntu-latest
    if: always()
    # 【变易】用 output 串联下游,取代 exit 1;cancelled/failure 静默跳过,不发失败邮件
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check upstream conclusion
        id: check
        run: |
          EVENT="${{ github.event_name }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          echo "event_name=${EVENT}"
          echo "workflow_run.conclusion=${CONCLUSION}"
          # 【不易】守卫只做门禁不告警:上游失败由 ci.yml 自身通知,回归"跳过"不算回归"失败"
          # workflow_run 触发时,仅当上游 success 才执行回归;cancelled/failure 静默跳过
          if [[ "${EVENT}" == "workflow_run" ]]; then
            if [[ "${CONCLUSION}" == "success" ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "✅ 上游 nightly 构建成功,继续执行回归测试"
            elif [[ "${CONCLUSION}" == "cancelled" ]]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "⏭️ 上游 nightly 构建被取消,静默跳过回归测试(不触发失败通知)"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "❌ nightly 构建失败(conclusion=${CONCLUSION}),跳过回归测试"
            fi
          else
            # schedule / PR / dispatch 路径直接放行
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "✅ 非 workflow_run 触发,放行回归测试"
          fi

  # =====================================================================
  # Job 1: 单元测试(LoRA checkpoint 保存/加载)
  # =====================================================================
  unit-tests:
    name: Unit Tests (LoRA Checkpoint)
    runs-on: ubuntu-latest
    needs: [nightly-build-guard]
    if: |
      always() && needs.nightly-build-guard.result == 'success'
      && needs.nightly-build-guard.outputs.should_run == 'true'
      && github.event.inputs.test_suite != 'e2e'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install peft accelerate sentence-transformers transformers numpy
          # 安装项目依赖(最小集,避免加载完整 agent)
          pip install pytest pytest-cov pytest-timeout pytest-asyncio

      - name: Run LoRA checkpoint unit tests
        run: |
          python -m unittest tests.test_lora_checkpoint -v
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'

      - name: Run checkpoint resume failure tests
        run: |
          python -m unittest tests.test_checkpoint_resume_failure -v
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            .pytest_cache/
            **/test_*.xml
          retention-days: 7

  # =====================================================================
  # Job 2: 端到端断点续训恢复测试(核心回归套件)
  # =====================================================================
  e2e-recovery-tests:
    name: E2E Recovery Tests
    runs-on: ubuntu-latest
    needs: [nightly-build-guard]
    if: |
      always() && needs.nightly-build-guard.result == 'success'
      && needs.nightly-build-guard.outputs.should_run == 'true'
      && github.event.inputs.test_suite != 'unit'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install peft accelerate sentence-transformers transformers numpy
          pip install pytest pytest-cov pytest-timeout pytest-asyncio

      - name: Run E2E checkpoint recovery tests
        run: |
          python -m unittest tests.test_checkpoint_recovery_e2e -v
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'

      - name: Run LRU cache logging verification
        run: |
          python scripts/verify_lru_cache_logging.py
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          AGENT_HYBRID_EMBEDDING: '0'  # CI 环境不加载真实模型

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: |
            .pytest_cache/
            **/test_*.xml
          retention-days: 7

  # =====================================================================
  # Job 3: light_loader 极端场景压力测试（数千损坏卡 · 并行保序契约）
  # =====================================================================
  # Why 每日守护 P0 内存优化插件: scan_light_cards(parallel=True) 的保序契约
  #   （类型目录序 + 组内 slug 字典序，损坏卡跳过）在数千张损坏卡并存时
  #   不得被线程调度破坏。脚本退出码 0=串行/并行顺序一致，1=回归。
  # 依赖极简: 仅 PyYAML + 标准库，不需要 LoRA/模型依赖（区别于 unit/e2e job）。
  light-loader-stress:
    name: light_loader 并行保序压力测试
    runs-on: ubuntu-latest
    needs: [nightly-build-guard]
    if: |
      always() && needs.nightly-build-guard.result == 'success'
      && needs.nightly-build-guard.outputs.should_run == 'true'
      && github.event.inputs.test_suite != 'unit'
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖（仅 PyYAML）
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 运行极端场景压力测试（5000 卡 · 60% 损坏率）
        run: python scripts/dev/stress_light_loader_parallel.py --n 5000 --corrupt-ratio 0.6

  # =====================================================================
  # Job 4: light_loader 性能门禁（10000 卡串行耗时退化检测）
  # =====================================================================
  # Why 区分「性能退化」与「功能回归」通知：bench 以 10000 卡串行耗时为基线
  #   （本机实测 1944ms），超过 env.LIGHT_LOADER_SERIAL_CAP_MS（1.5x 容差）
  #   判退化 → job 失败；由 test-summary 汇总时归类为 performance 通知
  #   （功能类 job 全过时），区别于功能回归通知。
  light-loader-bench:
    name: light_loader 性能门禁（10000 卡）
    runs-on: ubuntu-latest
    needs: [nightly-build-guard]
    if: |
      always() && needs.nightly-build-guard.result == 'success'
      && needs.nightly-build-guard.outputs.should_run == 'true'
      && github.event.inputs.test_suite != 'unit'
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖（仅 PyYAML）
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 运行性能门禁（基线 ${{ env.LIGHT_LOADER_SERIAL_BASELINE_MS }}ms × 容差 ${{ env.LIGHT_LOADER_BENCH_TOLERANCE }}）
        run: python scripts/dev/bench_light_loader_serial_parallel.py \
          --scale 10000 --rounds 3 \
          --baseline-ms ${{ env.LIGHT_LOADER_SERIAL_BASELINE_MS }} \
          --tolerance ${{ env.LIGHT_LOADER_BENCH_TOLERANCE }}

  # =====================================================================
  # Job 5: 测试汇总与通知（区分功能回归 / 性能退化）
  # =====================================================================
  # 【不易】退出码契约不变；仅通知分类细化：
  #   - 功能回归：unit / e2e / stress 任一失败 → functional 通知（含失败清单）；
  #   - 性能退化：功能类全过但 bench 失败（10000 卡串行耗时超阈值）→ performance 通知；
  #   - 全过：不发送任何失败通知。
  test-summary:
    name: Test Summary & Notification
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-recovery-tests, light-loader-stress, light-loader-bench]
    if: always()
    steps:
      - name: Check test results
        id: results
        run: |
          UNIT_RESULT="${{ needs.unit-tests.result }}"
          E2E_RESULT="${{ needs.e2e-recovery-tests.result }}"
          STRESS_RESULT="${{ needs.light-loader-stress.result }}"
          BENCH_RESULT="${{ needs.light-loader-bench.result }}"
          echo "unit_tests=${UNIT_RESULT}" >> $GITHUB_OUTPUT
          echo "e2e_tests=${E2E_RESULT}" >> $GITHUB_OUTPUT
          echo "stress_tests=${STRESS_RESULT}" >> $GITHUB_OUTPUT
          echo "bench_tests=${BENCH_RESULT}" >> $GITHUB_OUTPUT

          # 功能回归：功能类 job（unit/e2e/stress）任一失败
          if [[ "${UNIT_RESULT}" == "failure" ]] || [[ "${E2E_RESULT}" == "failure" ]] \
             || [[ "${STRESS_RESULT}" == "failure" ]]; then
            echo "overall=failed" >> $GITHUB_OUTPUT
            echo "kind=functional" >> $GITHUB_OUTPUT
            echo "❌ 功能回归失败" >> $GITHUB_STEP_SUMMARY
          elif [[ "${BENCH_RESULT}" == "failure" ]]; then
            # 功能类全过但性能门禁失败 → 性能退化
            echo "overall=failed" >> $GITHUB_OUTPUT
            echo "kind=performance" >> $GITHUB_OUTPUT
            echo "⚠️ 性能退化（10000 卡串行耗时超阈值）" >> $GITHUB_STEP_SUMMARY
          else
            echo "overall=passed" >> $GITHUB_OUTPUT
            echo "kind=passed" >> $GITHUB_OUTPUT
            echo "✅ 所有回归测试通过" >> $GITHUB_STEP_SUMMARY
          fi

          echo "## 回归测试汇总" >> $GITHUB_STEP_SUMMARY
          echo "| 套件 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (LoRA Checkpoint) | ${UNIT_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Recovery Tests | ${E2E_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| light_loader 并行保序压力测试 | ${STRESS_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| light_loader 性能门禁（10000 卡） | ${BENCH_RESULT} |" >> $GITHUB_STEP_SUMMARY

      - name: Send functional regression notification
        if: steps.results.outputs.kind == 'functional'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **回归测试失败（功能回归）**\n\n请检查 [Workflow Run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')\n\n失败套件:\n- Unit Tests: ${{ needs.unit-tests.result }}\n- E2E Recovery Tests: ${{ needs.e2e-recovery-tests.result }}\n- light_loader 并行保序压力测试: ${{ needs.light-loader-stress.result }}'
            })

      - name: Send performance degradation notification
        if: steps.results.outputs.kind == 'performance'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **性能退化告警（light_loader）**\n\n10000 卡串行扫描耗时超过门禁阈值（基线 ${{ env.LIGHT_LOADER_SERIAL_BASELINE_MS }}ms × 容差 ${{ env.LIGHT_LOADER_BENCH_TOLERANCE }}），功能类回归全部通过。\n\n请检查 [Workflow Run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')\n\n建议排查:\n- 解析器是否回退到纯 Python SafeLoader（libyaml C 扩展缺失）\n- 单卡解析成本是否回归（参考 docs/reports/light_loader_serial_parallel_bench_20260811.md）\n- 若为硬件/runner 变更导致误报，按 docs/reports/light_loader_bench_threshold_guide_20260811.md 重新校准基线'
            })

  # =====================================================================
  # Job 6: 代码覆盖率报告(可选)
  # =====================================================================
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install peft accelerate sentence-transformers transformers numpy
          pip install pytest pytest-cov pytest-timeout pytest-asyncio

      - name: Run tests with coverage
        run: |
          python -m pytest tests/test_checkpoint_recovery_e2e.py \
                         tests/test_checkpoint_resume_failure.py \
                         tests/test_lora_checkpoint.py \
                         --cov=scripts/finetune_reranker \
                         --cov-report=xml \
                         --cov-report=term-missing
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
