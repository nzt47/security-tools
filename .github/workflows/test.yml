name: 云枢系统测试流程

# 【变易·P2-4】concurrency: 同 workflow 同 ref 连续触发取消旧 run 只留最新。
# 2026-08-08 排队风暴治理延伸: 全项目 workflow 批量统一。
# 注意: 本 workflow name 与 ci.yml 相同(均为「云枢系统测试流程」), 若共用
# ${{ github.workflow }}-${{ github.ref }} 会与 ci.yml 互相 cancel, 故加 test- 前缀隔离。
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.10'
  COVERAGE_THRESHOLD: 70

jobs:
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ job.status }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 快速安装依赖
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
        continue-on-error: true

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip --timeout=120
          pip install --timeout=120 flake8 black isort mypy pytest pytest-cov || true
          pip install -e .[dev] --timeout=120 || true
        continue-on-error: true

      - name: 代码格式检查
        run: |
          black --check --diff agent/ tests/ || true

      - name: 导入顺序检查
        run: |
          isort --check-only --diff agent/ tests/ || true

      - name: 类型检查
        run: |
          mypy agent/ --ignore-missing-imports || true

      - name: 风格检查
        run: |
          flake8 agent/ --max-line-length=120 --extend-ignore=E203,W503 || true

      - name: 循环依赖守卫
        # Why: 用 AST 扫描 agent/ 顶层双向导入, 发现新增循环时阻断 CI (exit 1).
        # 仅依赖 Python 标准库(ast/os/sys), 无需安装项目依赖.
        # 详见 docs/architecture/circular_dependencies_troubleshooting.md
        run: |
          python scripts/check_circular_deps.py

      - name: 工具脚本测试
        # Why: model_cache_utils.py 是所有下载脚本复用的路径解析工具, 需确保不退化.
        # 覆盖 4 级环境变量优先级 + 跨平台路径分隔符 (18 个测试, ~1 秒).
        # 详见 scripts/model_cache_utils.py 和 tests/unit/test_model_cache_utils.py
        run: |
          python -m pytest tests/unit/test_model_cache_utils.py tests/unit/test_check_circular_deps.py -v --tb=short

  unit-tests:
    name: 单元测试 (Python ${{ matrix.python-version }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 快速安装依赖 (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
        continue-on-error: true

      - name: 安装依赖 (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip --timeout=180
          pip install --timeout=180 pytest pytest-cov pytest-mock pytest-xdist pytest-asyncio pytest-timeout || true
          pip install -e . --timeout=180 || true
        continue-on-error: true

      - name: 快速安装依赖 (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
        continue-on-error: true

      - name: 安装依赖 (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip --timeout=180
          pip install --timeout=180 pytest pytest-cov pytest-mock pytest-xdist pytest-asyncio pytest-timeout || true
          pip install -e .[windows] --timeout=180 || true
        continue-on-error: true

      - name: 创建测试目录
        run: |
          mkdir -p test-results htmlcov

      - name: 运行单元测试
        env:
          # 【CHG-2026-0809】Windows CI 默认 locale cp1252：pytest 打印中文 docstring +
          # 测试内 open() 写中文均报 UnicodeEncodeError。PYTHONUTF8=1 强制 UTF-8 模式
          # （同时覆盖 stdio 与 open() 默认编码），根治 §8 类编码问题。
          PYTHONUTF8: "1"
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=agent \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --maxfail=5 \
            -m "not slow" \
            --junitxml=test-results/unit-test-results.xml \
            --timeout=300 \
            -n auto \
            --dist=loadfile \
            -p no:randomly

      - name: 上传覆盖率报告
        # 【变易·CHG-2026-0811】path 增加 coverage.xml 与 .coverage 数据文件:
        # coverage-check job 的 `coverage combine` 需要数据文件, 此前只上传
        # htmlcov/(纯 HTML)导致 "No data to combine" (run 31459766599 六个
        # coverage-check 全红)。pytest-cov 生成的 .coverage 在仓库根目录。
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            .coverage
            htmlcov/
          retention-days: 30

      - name: 上传测试结果
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-unit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 30

  integration-tests:
    name: 集成测试 (Python ${{ matrix.python-version }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # 【变易·CHG-2026-0811】timeout 20→40:
    # ① 3.12 集成测试在 coverage 下触发 CPython 3.12 tracing 二次复杂度 bug
    #   (python/cpython#127953, 大 code object 的 line-number 查找二次方),
    #   单文件慢 5-30 倍, 实测 20min 内只能跑到 99% (run 31457606205 超时);
    # ② windows runner 整体比 ubuntu 慢 ~50% (3.10-windows 15.3min vs ubuntu 9.7min),
    #    3.11-windows 曾贴线超时。40min 为最慢组合 (3.12-windows) 留足余量。
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 快速安装依赖 (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
        continue-on-error: true

      - name: 安装依赖 (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip --timeout=180
          pip install --timeout=180 pytest pytest-cov pytest-mock pytest-asyncio pytest-timeout || true
          pip install -e . --timeout=180 || true
        continue-on-error: true

      - name: 快速安装依赖 (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
        continue-on-error: true

      - name: 安装依赖 (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip --timeout=180
          pip install --timeout=180 pytest pytest-cov pytest-mock pytest-asyncio pytest-timeout || true
          pip install -e .[windows] --timeout=180 || true
        continue-on-error: true

      - name: 缓存 HuggingFace 模型 (Ubuntu)
        # Why: transformers/sentence_transformers 首次加载会从 HF 下载模型元数据, 网络不可达时超时.
        # 缓存模型 + 离线模式让集成测试在无网络环境下也能通过 (详见 docs/reviews/pep562_migration_retrospective.md 6.2)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/modelscope
          key: hf-cache-${{ matrix.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            hf-cache-${{ matrix.os }}-
        continue-on-error: true

      - name: 缓存 HuggingFace 模型 (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\huggingface
            ~\AppData\Local\modelscope
          key: hf-cache-${{ matrix.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            hf-cache-${{ matrix.os }}-
        continue-on-error: true

      - name: 创建测试目录
        run: |
          mkdir -p test-results

      - name: 运行集成测试
        env:
          # 离线模式: 跳过 HF 网络检查, 用本地缓存 (避免 transformers 下载超时)
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # 【不易】对齐单元测试 job：Windows CI 默认 locale cp1252 解码 git 输出
          # （中文文件名/commit）乱码或 None，曾致 test_git_sync_e2e 失败
          # （AttributeError: 'NoneType' object has no attribute 'strip'）。
          # 与 git_sync._run_git 显式 encoding="utf-8" 双保险（见 integration_s10 计划 H1/H2）。
          PYTHONUTF8: "1"
        run: |
          # 【变易·CHG-2026-0811】3.12 禁用 --cov:
          # CPython 3.12 tracing 二次复杂度 bug (python/cpython#127953) 使 coverage
          # 下 3.12 集成测试慢 5-30 倍 (实测 test_routes_logging_integration.py
          # 3.11=12s vs 3.12=103s, run 31457606205 3.12-ubuntu/windows 双双超时)。
          # 3.12 覆盖率仍由 unit-tests job (--cov=agent) 收集, 无覆盖率盲区。
          # 【不易】3.10/3.11 保持 --cov, 覆盖率契约不变。
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            COV_ARGS=""
          else
            COV_ARGS="--cov=agent --cov-report=xml"
          fi
          pytest tests/integration/ \
            -v \
            --tb=short \
            $COV_ARGS \
            --junitxml=test-results/integration-test-results.xml \
            -m "not slow and not requires_llm and not skip_ci" \
            --timeout=300

      - name: 上传覆盖率数据
        # 【变易·CHG-2026-0811】集成测试覆盖率数据上传:
        # coverage-check 设计语义为「unit + integration 合并覆盖率 ≥70」
        # (needs: [unit-tests, integration-tests]), 此前 integration 从未上传
        # 数据文件, 合并只含 unit (62% < 70) 必然 fail-under。
        # 3.12 集成测试禁用 --cov (CHG-2026-0811 超时修复) 无数据文件, 跳过上传
        # (upload-artifact 对空 path 会报错 "No files were found")。
        if: matrix.python-version != '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            .coverage
          retention-days: 30

      - name: 上传测试结果
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-integration-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 30

  performance-tests:
    name: 性能测试 (Python ${{ matrix.python-version }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 快速安装依赖 (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
        continue-on-error: true

      - name: 安装依赖 (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip --timeout=180
          pip install --timeout=180 pytest pytest-benchmark pytest-asyncio pytest-timeout || true
          pip install -e . --timeout=180 || true
        continue-on-error: true

      - name: 快速安装依赖 (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
        continue-on-error: true

      - name: 安装依赖 (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip --timeout=180
          pip install --timeout=180 pytest pytest-benchmark pytest-asyncio pytest-timeout || true
          pip install -e .[windows] --timeout=180 || true
        continue-on-error: true

      - name: 创建测试目录
        run: |
          mkdir -p test_reports

      - name: 运行性能测试
        run: |
          pytest tests/performance/ \
            -v \
            --timeout=300 \
            --benchmark-only \
            --benchmark-json=test_reports/benchmark.json

      - name: 运行知识库 6000 卡性能回归测试
        # Why: 知识库 CardStore.list 与断链检测在 6000 卡量级下的性能回归护栏，
        #      覆盖「正确性 + 确定性 + 耗时上限 + list 内存缓存加速」四重断言，
        #      防止新增优化/重构引入功能退化或性能回退。
        # 详见 tests/performance/test_knowledge_link_perf.py
        run: |
          pytest tests/performance/test_knowledge_link_perf.py \
            -v \
            --timeout=300 \
            -m performance \
            --junitxml=test_reports/knowledge-link-perf-results.xml

      - name: 运行 L2 性能回归测试
        env:
          # SCHEME 标记用于 CI 日志机器可读，明确区分同步串行方案与其他实验场景
          L2_SCHEME: sync-serial-path-cache
          L2_GUARDRAILS: cold-p99<2s|warm-p99<1s|concurrent-p99<2s|cache-validity
        run: |
          echo "=== L2 性能回归测试 ==="
          echo "SCHEME=${L2_SCHEME}"
          echo "方案: 同步串行 read_fragment + 路径缓存（最优方案）"
          echo "护栏: ${L2_GUARDRAILS}"
          # tee 同时输出到屏幕和日志文件，供 parse_ci_l2_report.py 解析
          pytest tests/performance/test_l2_perf_regression.py \
            -v \
            --timeout=120 \
            -m performance \
            --junitxml=test_reports/l2-perf-results.xml \
            2>&1 | tee test_reports/l2-ci.log

      - name: 解析 L2 性能日志并生成图表
        # Why: 自动从 CI 日志抓取方案标记 + pytest 护栏结果，生成可视化图表供 artifact 下载
        run: |
          pip install --timeout=60 matplotlib numpy || true
          python scripts/parse_ci_l2_report.py \
            --ci-log test_reports/l2-ci.log \
            --output test_reports/l2_perf_report.png

      - name: 转换性能日志为 Markdown
        # Why: 将压测日志转为 Markdown 报告，方便直接粘贴到技术文档/PR 描述
        # 容错：sqlite-vec 不可用时压测会跳过，Markdown 报告相应跳过，不影响 CI 结果
        run: |
          # 运行快速压测生成性能数据（小数据量，约 7 秒）
          python scripts/bench_l2_stress.py --cold-count 30 --category-count 5 --concurrency 5 --rounds 1 > test_reports/bench_ci.log 2>&1 || true
          # 生成性能对比日志（需要压测日志含场景 C/E）
          python scripts/simulate_l2_async_switch.py --bench-log test_reports/bench_ci.log --log-file test_reports/l2_switch_perf_comparison.log || true
          # 转换为 Markdown 报告
          python scripts/convert_perf_log_to_md.py --input test_reports/l2_switch_perf_comparison.log --output test_reports/l2_switch_perf_comparison.md || true

      - name: 上传性能报告
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test_reports/benchmark.json
            test_reports/knowledge-link-perf-results.xml
            test_reports/l2-ci.log
            test_reports/l2_perf_report.png
            test_reports/bench_ci.log
            test_reports/l2_switch_perf_comparison.log
            test_reports/l2_switch_perf_comparison.md
          retention-days: 30

  coverage-check:
    name: 覆盖率检查 (Python ${{ matrix.python-version }} - ${{ matrix.os }})
    # 【变易·CHG-2026-0811】矩阵不含 3.12:
    # 3.12 集成测试禁用 --cov (CHG-2026-0811, CPython 3.12 tracing 二次复杂度
    # bug python/cpython#127953 使 coverage 下集成测试慢 5-30 倍而超时),
    # 无 integration 覆盖率数据 → 合并只剩 unit (62%) 必然 fail-under。
    # 3.12 覆盖率信息仍由 unit-tests job 的 --cov-report=term-missing 输出。
    # 注: 不采用 job 级 `if: matrix...` 排除, 因 job 级 if 上下文仅限
    # github/needs/vars/inputs, 不允许 matrix (actionlint 校验确认)。
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    needs: [unit-tests, integration-tests]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 安装依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          pip install -e .

      - name: 安装依赖 (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          pip install -e .[windows]

      - name: 创建报告目录
        run: |
          mkdir -p test_reports

      - name: 下载单元测试覆盖率
        # 【变易·CHG-2026-0811】下载到独立子目录 coverage-unit/:
        # 与集成测试数据文件同名 (.coverage), 必须隔离存放避免互相覆盖,
        # 再由 `coverage combine coverage-unit coverage-integration` 合并。
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage-unit/

      - name: 下载集成测试覆盖率
        uses: actions/download-artifact@v8
        with:
          name: coverage-integration-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage-integration/

      - name: 检查覆盖率
        # 【变易·CHG-2026-0811】去掉 `|| true`: 此前吞掉 combine 失败导致
        # 后续静默 "No data to report" exit 1, 无法定位根因。数据齐备后
        # combine 失败应直接暴露。coverage combine 接受目录参数, 合并目录内
        # 所有 .coverage* 数据文件 (unit + integration 同版本同平台)。
        run: |
          coverage combine coverage-unit coverage-integration
          coverage report
          coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: 生成覆盖率报告
        run: |
          coverage html -d test_reports/htmlcov
          coverage xml -o test_reports/coverage.xml

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: full-coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test_reports/
          retention-days: 30

  test-summary:
    name: 测试总结
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-tests, coverage-check]
    if: always()
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 下载所有测试结果
        uses: actions/download-artifact@v8
        with:
          path: all-results/

      - name: 创建报告目录
        run: |
          mkdir -p test_reports

      - name: 生成测试报告
        run: |
          cat > test_reports/summary.md << 'EOF'
          # 云枢系统测试报告

          ## 测试执行时间
          $(date)

          ## 测试结果汇总

          ### 单元测试
          - 测试数量: TBD
          - 通过率: TBD
          - 覆盖率: TBD

          ### 集成测试
          - 测试数量: TBD
          - 通过率: TBD

          ### 性能测试
          - 基准测试: TBD
          - 性能趋势: TBD

          ## 兼容性测试
          - Python 版本: 3.10, 3.11, 3.12
          - 平台: Ubuntu, Windows

          ## 建议

          EOF

      - name: 上传测试报告
        uses: actions/upload-artifact@v7
        with:
          name: test-summary-report
          path: test_reports/
          retention-days: 30

      - name: 通知成功
        if: success()
        run: |
          echo "✅ 所有测试通过！"

      - name: 通知失败
        if: failure()
        run: |
          echo "❌ 测试失败，请检查测试报告"
          echo "报告位置: test_reports/"