name: 云枢工具模块测试
# 【变易·P2-4】concurrency: 同 workflow 同 ref 连续触发取消旧 run 只留最新。
# 2026-08-08 实测 36 queued run 竞争 runner 排队 30+ 分钟；本配置缓解排队风暴。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, develop, 'fix/**', 'feature/**']
    paths:
      - 'agent/tools/**'
      - 'agent/system_tools.py'
      - 'agent/pdf_tools.py'
      - 'agent/web/**'
      - 'agent/extensions/**'
      - 'agent/software_manager.py'
      - 'docs/archive/agent_tests_20260810/test_*tools*.py'
      - 'docs/archive/agent_tests_20260810/test_file_tools.py'
  pull_request:
    branches: [main, develop]
    paths:
      - 'agent/tools/**'
      - 'agent/system_tools.py'
      - 'agent/pdf_tools.py'
      - 'agent/web/**'
      - 'agent/extensions/**'
      - 'agent/software_manager.py'

jobs:
  tool-tests:
    name: 工具模块测试 (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 【不易】pytest.ini 全局配置 asyncio_mode=auto + --strict-config，
          #   pytest 9.1.x 下缺 pytest-asyncio 会报 "Unknown config option: asyncio_mode"
          #   （其余 workflow 均已处理此坑，2026-08-08 空提交触发本 workflow 暴露）
          pip install pytest pytest-cov pytest-mock pytest-timeout pytest-asyncio psutil
          pip install -e . || true

      - name: 运行工具模块测试
        # 【不易】必须 shell: bash：pytest 多行命令用 bash 的 \ 续行符，
        # Windows runner 默认 shell 为 PowerShell，\ 被解析为除法运算符 → ParserError
        # （2026-08-10 复现：run 31310871956 develop / 31377751010 归档分支均因此失败）
        shell: bash
        # 【不易】PYTHONPATH 必须指向 workspace：pytest console script 启动不把 cwd 加入
        # sys.path，而 editable 安装（pip install -e . || true）失败被 || true 吞掉 →
        # from agent.xxx import 报 ModuleNotFoundError（2026-08-10 shell:bash 修复后首次
        # 实际运行暴露：6 矩阵组合 28 failed / 15 errors，归档前后行为一致属存量问题）。
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest docs/archive/agent_tests_20260810/test_file_tools.py \
                docs/archive/agent_tests_20260810/test_web_tools.py \
                docs/archive/agent_tests_20260810/test_ext_tools.py \
                docs/archive/agent_tests_20260810/test_pdf_tools.py \
                docs/archive/agent_tests_20260810/test_software_tools.py \
                docs/archive/agent_tests_20260810/test_system_tools.py \
                -v --tb=short --cov=agent.system_tools --cov=agent.pdf_tools \
                --cov=agent.web --cov=agent.extensions.manager \
                --cov=agent.software_manager \
                --cov-report=term-missing \
                --timeout=300

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tool-coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 30
