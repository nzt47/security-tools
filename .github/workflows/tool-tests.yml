name: 云枢工具模块测试
on:
  push:
    branches: [main, develop, 'fix/**', 'feature/**']
    paths:
      - 'agent/tools/**'
      - 'agent/system_tools.py'
      - 'agent/pdf_tools.py'
      - 'agent/web/**'
      - 'agent/extensions/**'
      - 'agent/software_manager.py'
      - 'agent/tests/test_*tools*.py'
      - 'agent/tests/test_file_tools.py'
  pull_request:
    branches: [main, develop]
    paths:
      - 'agent/tools/**'
      - 'agent/system_tools.py'
      - 'agent/pdf_tools.py'
      - 'agent/web/**'
      - 'agent/extensions/**'
      - 'agent/software_manager.py'

jobs:
  tool-tests:
    name: 工具模块测试 (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 【不易】pytest.ini 全局配置 asyncio_mode=auto + --strict-config，
          #   pytest 9.1.x 下缺 pytest-asyncio 会报 "Unknown config option: asyncio_mode"
          #   （其余 workflow 均已处理此坑，2026-08-08 空提交触发本 workflow 暴露）
          pip install pytest pytest-cov pytest-mock pytest-timeout pytest-asyncio psutil
          pip install -e . || true

      - name: 运行工具模块测试
        # 【CHG-2026-0808】Windows runner 默认 shell 是 PowerShell，
        # 不支持 bash 的 "\" 行尾续行，导致多行 pytest 命令解析失败
        # （ParserError: Missing expression after unary operator '--'）。
        # 显式指定 bash：git-bash 随 GitHub Windows runner 预装，行为与 Linux 一致。
        shell: bash
        run: |
          pytest agent/tests/test_file_tools.py \
                agent/tests/test_web_tools.py \
                agent/tests/test_ext_tools.py \
                agent/tests/test_pdf_tools.py \
                agent/tests/test_software_tools.py \
                agent/tests/test_system_tools.py \
                -v --tb=short --cov=agent.system_tools --cov=agent.pdf_tools \
                --cov=agent.web --cov=agent.extensions.manager \
                --cov=agent.software_manager \
                --cov-report=term-missing \
                --timeout=300

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tool-coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 30
