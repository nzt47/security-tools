name: 部署文档到 GitHub Pages

# 触发条件：仅 docs/ 目录变更时触发
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:  # 支持手动触发

# 权限：最小化（仅 Pages 写入 + 内容读取）
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.10'

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 生成性能图表（如脚本存在且数据更新）
        # 仅在 perf-charts 数据变化时重新生成图表
        run: |
          if [ -f scripts/gen_tlm_perf_chart.py ]; then
            echo "[1/3] 检测到图表生成脚本，执行生成..."
            pip install matplotlib --quiet
            python scripts/gen_tlm_perf_chart.py 2>&1 || echo "[WARN] 图表生成失败，继续部署（不影响文档）"
          else
            echo "[1/3] 未找到图表生成脚本，跳过"
          fi

      - name: 准备 Pages 站点目录
        # 将 docs/ 目录内容 + index.html + _config.yml 组装为站点
        run: |
          echo "[2/3] 组装 Pages 站点目录..."
          mkdir -p _site

          # 复制文档目录
          cp -r docs _site/docs

          # 创建首页（重定向到 TLM Overview）
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=docs/TLM_OVERVIEW.md">
              <title>TLM 三层记忆架构总览</title>
          </head>
          <body>
              <p>正在跳转到 <a href="docs/TLM_OVERVIEW.md">TLM Overview</a>...</p>
          </body>
          </html>
          EOF

          # 创建 Jekyll 配置（使用 GitHub Pages 支持的主题）
          cat > _site/_config.yml << 'EOF'
          theme: jekyll-theme-cayman
          markdown: kramdown
          title: TLM 三层记忆架构总览
          description: TLM 架构设计 + P3/P4 优化完整文档
          EOF

          echo "[OK] 站点目录组装完成"
          ls -la _site/

      - name: 上传 Pages 制品
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
