# =============================================================================
# P0 安全验证 Workflow 模板 — 应用示例：Node.js 用户认证服务
# =============================================================================
# 本文件演示如何将 p0-security.template.yml 应用到一个 Node.js 项目。
# 场景：一个基于 Express 的 Node.js 用户认证 API 服务，处理用户密码（bcrypt）、
#       JWT Token、会话等敏感数据，需要验证脱敏逻辑不被回归。
#
# 应用步骤（对应 README.md 的 3 步上线）：
# 1. 复制 p0-security.template.yml 到 .github/workflows/nodejs-auth-p0-security.yml
# 2. 全局替换 11 个 {{占位符}} 为下表的实际值
# 3. 确保依赖产物存在（测试文件、补丁目录、扫描脚本）
#
# 占位符替换对照表（Node.js 认证服务）：
#   {{WORKFLOW_NAME}}             -> Node.js 认证服务 P0 安全验证
#   {{WORKFLOW_FILE_NAME}}        -> nodejs-auth-p0-security
#   {{PYTHON_VERSION}}            -> 20                    # Node.js LTS 版本（setup-node 用）
#   {{REGRESSION_TEST_FILE}}      -> test/security/auth-redaction.test.js
#   {{SCAN_SCRIPT}}               -> scripts/scan-auth-secrets.js
#   {{PATCH_DIR}}                 -> patches/auth_security
#   {{PATCH_FILE}}                -> auth_token_redaction.patch
#   {{EXPECTED_TEST_COUNT}}       -> 42
#   {{CROSS_MODULE_TEST_CLASSES}} -> "(JWTTokenRedaction|PasswordHashRedaction)"  # jest -t 正则
#   {{PATCH_TEST_CLASS_1}}        -> JWTTokenRedaction    # describe 块名（非 class）
#   {{PATCH_TEST_CLASS_2}}        -> PasswordHashRedaction
#
# =============================================================================
# Python → Node.js 关键差异（复用时务必注意）
# =============================================================================
# [差异1] actions: setup-python@v5 → setup-node@v4
# [差异2] 依赖安装: pip install → npm ci（从 package-lock.json 精确安装）
# [差异3] 测试运行器: pytest → jest
#         - pytest --junitxml=xxx.xml → jest + jest-junit reporter（需 devDependency）
#         - pytest --timeout=300（秒）→ jest --testTimeout=300000（毫秒，注意单位）
#         - pytest --collect-only → jest --listTests（仅列文件，用例数需 --json 解析）
# [差异4] 测试组织: class TestXxx + def test_yyy → describe('Xxx') + test('yyy')
#         - 补丁验证 grep "class TestXxx" → grep "describe.*Xxx"
# [差异5] 跨模块测试: pytest file::Class → jest -t "Pattern"（正则匹配测试名）
#         - 多个 describe 块用正则 OR: -t "(JWTTokenRedaction|PasswordHashRedaction)"
# [差异6] 覆盖率: pytest-cov → jest --coverage（内置，无需额外依赖）
# ==============================================================================
# 敏感模块路径（push/pull_request.paths）替换为 Node.js 项目实际文件：
#   - src/auth/routes.js           认证路由（登录/登出端点）
#   - src/auth/tokens.js           JWT Token 签发与校验
#   - src/auth/passwords.js        bcrypt 密码哈希与校验
#   - src/utils/logFilter.js       日志脱敏过滤器（winston/pino transport）
#   - src/utils/secretWiper.js     响应体敏感字段清除中间件
# ==============================================================================

name: Node.js 认证服务 P0 安全验证

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
    paths:
      # === 项目特定的敏感数据模块路径 ===
      - 'src/auth/routes.js'
      - 'src/auth/tokens.js'
      - 'src/auth/passwords.js'
      - 'src/utils/logFilter.js'
      - 'src/utils/secretWiper.js'
      # === 通用触发路径 ===
      - 'test/security/auth-redaction.test.js'
      - 'patches/auth_security/**'
      - 'scripts/scan-auth-secrets.js'
      - '.github/workflows/nodejs-auth-p0-security.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'src/auth/routes.js'
      - 'src/auth/tokens.js'
      - 'src/auth/passwords.js'
      - 'src/utils/logFilter.js'
      - 'src/utils/secretWiper.js'
      - 'test/security/auth-redaction.test.js'
      - 'patches/auth_security/**'
      - 'scripts/scan-auth-secrets.js'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因（可选）'
        required: false
        default: 'manual'

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # Job 1: 静态扫描 — 检测贪婪正则模式（Node.js 版）
  # ============================================================================
  static-scan:
    name: 敏感数据正则静态扫描
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: |
          npm ci || echo "npm ci 失败，继续执行扫描"

      - name: 运行敏感数据正则静态扫描
        run: |
          echo "=== 敏感数据正则静态扫描 ==="
          node scripts/scan-auth-secrets.js --fix-hint || echo "扫描脚本执行完成（可能有警告）"
          echo "=== 静态扫描完成 ==="

  # ============================================================================
  # Job 2: P0 回归测试 — 42 个防复发测试用例（jest）
  # ============================================================================
  p0-security-tests:
    name: P0 Security Regression Test
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖（带重试）
        run: |
          # 重试机制：应对 npm registry 网络瞬时问题
          for i in 1 2 3; do
            npm ci && break
            echo "⚠️ 依赖安装失败，尝试 $i/3，5 秒后重试..."
            sleep 5
          done
          # 验证 jest-junit reporter 已安装（生成 JUnit 报告用）
          if ! npm ls jest-junit >/dev/null 2>&1; then
            echo "⚠️ jest-junit 未安装，安装中..."
            npm install --save-dev jest-junit
          fi

      - name: 运行 P0 安全回归测试
        env:
          JEST_JUNIT_OUTPUT_DIR: test_reports
          JEST_JUNIT_OUTPUT_NAME: p0-security-junit.xml
        run: |
          echo "=== 运行 P0 安全修复防复发回归测试 ==="
          mkdir -p test_reports
          # jest 配置：--testTimeout 毫秒（注意：300秒=300000ms，与 pytest --timeout=300 等价）
          # --reporters=default --reporters=jest-junit 生成 JUnit XML 报告
          npx jest test/security/auth-redaction.test.js \
            --verbose \
            --testTimeout=300000 \
            --reporters=default \
            --reporters=jest-junit \
            --coverage
          echo "=== P0 安全回归测试全部通过 ==="

      - name: 测试结果汇总
        if: always()
        run: |
          echo "=== P0 安全回归测试结果汇总 ==="
          echo "测试文件: test/security/auth-redaction.test.js"
          echo "预期测试数: 42"
          if [ -f test_reports/p0-security-junit.xml ]; then
            echo "--- JUnit 报告 ---"
            head -50 test_reports/p0-security-junit.xml
          else
            echo "⚠️ JUnit 报告不存在（jest-junit reporter 可能未正确配置）"
          fi

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-security-test-results
          path: test_reports/
          retention-days: 30

  # ============================================================================
  # Job 3: 补丁完整性验证
  # ============================================================================
  patch-integrity:
    name: 补丁完整性验证
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 验证补丁文件存在
        run: |
          echo "=== 验证补丁包文件完整性 ==="
          if [ ! -d patches/auth_security ]; then
            echo "patches/auth_security 目录不存在"
            exit 1
          fi
          if [ ! -f patches/auth_security/README.md ]; then
            echo "patches/auth_security/README.md 不存在"
            exit 1
          fi
          if [ ! -f patches/auth_security/auth_token_redaction.patch ]; then
            echo "patches/auth_security/auth_token_redaction.patch 不存在"
            exit 1
          fi
          echo "补丁包文件完整性验证通过"
          echo "--- 补丁包内容 ---"
          ls -la patches/auth_security/

      - name: 验证补丁格式
        run: |
          echo "=== 验证补丁格式 ==="
          if git apply --check patches/auth_security/auth_token_redaction.patch 2>/dev/null; then
            echo "补丁可以正常应用（新环境）"
          elif git apply --check --reverse patches/auth_security/auth_token_redaction.patch 2>/dev/null; then
            echo "补丁已应用（逆向检查通过）"
          else
            echo "警告: 补丁格式检查失败，可能已应用或格式有误"
            echo "补丁内容验证: 检查 patch 文件是否包含预期的 describe 块名"
            # [Node.js 差异] Python 验证 class TestXxx，Node.js 验证 describe('Xxx')
            if grep -qE "describe\s*\(\s*['\"]JWTTokenRedaction" patches/auth_security/auth_token_redaction.patch; then
              echo "补丁包含 JWTTokenRedaction describe 块"
            else
              echo "错误: 补丁缺少预期 describe 块 JWTTokenRedaction"
              exit 1
            fi
            if grep -qE "describe\s*\(\s*['\"]PasswordHashRedaction" patches/auth_security/auth_token_redaction.patch; then
              echo "补丁包含 PasswordHashRedaction describe 块"
            else
              echo "错误: 补丁缺少跨模块一致性 describe 块 PasswordHashRedaction"
              exit 1
            fi
          fi
          echo "补丁格式验证通过"

      - name: 验证测试用例数量
        run: |
          echo "=== 验证 P0 测试用例数量 ==="
          # [Node.js 差异] jest --listTests 只列出测试文件路径，不直接给出用例数
          # 精确统计需 --json 输出解析，这里用 dry-run + grep 统计 test()/it() 数量
          echo "--- 收集测试用例 ---"
          # 方法 1: 统计 test()/it() 调用数量（近似值）
          NUM=$(grep -cE "^\s*(it|test)\s*\(" test/security/auth-redaction.test.js || echo 0)
          echo "实际测试用例数（grep 统计）: $NUM"

          if [ -z "$NUM" ] || [ "$NUM" -lt 42 ]; then
            echo "⚠️ 测试用例数 ($NUM) 少于预期 (42)"
            echo "注意: 数量验证降级为警告，实际测试执行见 P0 安全回归测试 Job"
            echo "本地精确验证: npx jest test/security/auth-redaction.test.js --listTests"
          else
            echo "✅ 测试用例数量验证通过 ($NUM >= 42)"
          fi

  # ============================================================================
  # Job 4: 跨模块一致性验证（jest -t 测试名匹配）
  # ============================================================================
  cross-module-consistency:
    name: 跨模块脱敏一致性验证
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: |
          npm ci || echo "npm ci 失败，尝试继续"

      - name: 运行跨模块一致性测试
        run: |
          echo "=== 运行跨模块脱敏一致性测试 ==="
          # [Node.js 差异] pytest 用 file::Class 引用测试类
          # jest 用 -t "Pattern" 正则匹配 describe/test 名称
          # 多个 describe 块用正则 OR: -t "(JWTTokenRedaction|PasswordHashRedaction)"
          npx jest test/security/auth-redaction.test.js \
            -t "(JWTTokenRedaction|PasswordHashRedaction)" \
            --verbose --testTimeout=300000
          echo "=== 跨模块一致性验证通过 ==="

  # ============================================================================
  # Job 5: 测试总结
  # ============================================================================
  p0-security-summary:
    name: P0 安全验证总结
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [static-scan, p0-security-tests, patch-integrity, cross-module-consistency]
    if: always()
    steps:
      - name: 生成总结报告
        run: |
          echo "=== P0 安全验证总结 ==="
          echo "时间: $(date)"
          echo ""
          echo "| 验证项 | 状态 |"
          echo "|--------|------|"
          echo "| 静态扫描 | ${{ needs.static-scan.result == 'success' && '通过' || '失败' }} |"
          echo "| P0 回归测试 | ${{ needs.p0-security-tests.result == 'success' && '通过' || '失败' }} |"
          echo "| 补丁完整性 | ${{ needs.patch-integrity.result == 'success' && '通过' || '失败' }} |"
          echo "| 跨模块一致性 | ${{ needs.cross-module-consistency.result == 'success' && '通过' || '失败' }} |"
          echo ""
          if [ "${{ needs.static-scan.result }}" == "success" ] && \
             [ "${{ needs.p0-security-tests.result }}" == "success" ] && \
             [ "${{ needs.patch-integrity.result }}" == "success" ] && \
             [ "${{ needs.cross-module-consistency.result }}" == "success" ]; then
            echo "P0 安全验证全部通过！"
          else
            echo "P0 安全验证存在失败项，请检查！"
            exit 1
          fi

      - name: 失败通知
        if: failure()
        run: |
          echo "P0 安全验证失败！"
          echo "请检查以下内容："
          echo "1. JWT Token 是否被完整脱敏（不泄露 payload 到日志/响应）"
          echo "2. bcrypt 密码哈希是否不出现在日志/响应中"
          echo "3. 会话 Cookie 是否被脱敏（避免明文 sessionId）"
          echo "4. 补丁包文件是否完整"
          echo "5. jest-junit reporter 是否已安装（devDependencies）"
          echo "6. Node.js 版本是否为 LTS（推荐 20+）"
          echo ""
          echo "修复指南: 参考 patches/auth_security/README.md"
