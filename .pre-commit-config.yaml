# Pre-commit hooks 配置 — 关键字参数冲突扫描 + 工具定义索引同步
#
# 安装:
#   pip install pre-commit
#   pre-commit install
#
# 手动运行:
#   pre-commit run kwarg-conflict-scan --all-files
#   pre-commit run tool-index-sync --all-files

repos:
  - repo: local
    hooks:
      - id: kwarg-conflict-scan
        name: 关键字参数冲突扫描 (HIGH 风险拦截)
        entry: python scripts/scan_kwarg_conflicts.py --path agent/ --min-risk HIGH
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]
        description: >
          扫描 agent/ 目录中所有 .py 文件，检测
          func(explicit_kwarg=x, **dict) 模式中 dict 含同名键的冲突风险。
          发现 HIGH 风险时阻断提交（exit code 1）。

      - id: kwarg-conflict-scan-medium
        name: 关键字参数冲突扫描 (MEDIUM 风险提醒)
        entry: python scripts/scan_kwarg_conflicts.py --path agent/ --min-risk MEDIUM --format json
        language: system
        pass_filenames: false
        always_run: true
        stages: [push]
        description: >
          扫描 MEDIUM 级别风险，仅提醒不拦截（push 阶段运行）。
          MEDIUM 风险为外部函数签名已知的 **kwargs 转发，建议人工审查。

      - id: tool-index-sync
        name: 工具定义索引同步校验 (YAML → tool_index.json)
        entry: python scripts/sync_tool_index.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]
        description: >
          校验 data/tool_definitions/*.yaml 的 schema 完整性
          （必填字段、semver、JSON-Schema 子集、文件名与 name 一致、
          无重复工具名）。校验失败时阻断提交，确保 YAML 变更与
          data/tool_index.json 保持同步。--check 模式不写索引文件。

      - id: scan-sensitive-data
        name: 敏感信息检测 (API key / 私钥 / 密码)
        entry: python scripts/scan_sensitive_data.py
        language: system
        pass_filenames: true
        always_run: true
        stages: [commit]
        description: >
          扫描暂存文件中的敏感信息（API key / 私钥 / 硬编码密码 /
          数据库连接串 / 敏感文件名）。检测到敏感信息时阻断提交，
          防止敏感数据误进入 Git 历史。支持白名单（测试 mock /
          文档示例 / 部署配置），详见 scripts/scan_sensitive_data.py。

      - id: knowledge-cli-verify
        name: 知识卡片 CLI 全生命周期校验 (32 项断言)
        entry: python scripts/dev/verify_knowledge_cli.py --pre-commit --traceback
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]
        description: >
          在临时目录构造 mock 数据，全量运行知识卡片引擎 CLI 主入口
          （python -m agent.knowledge）的 5 个子命令断言：card-list 列出/
          过滤、card-transition 合法迁移（归档重链）/非法迁移/不存在、
          check-links 断链门禁、orphans 孤儿检测、index-rebuild 落盘，
          以及 subprocess 退出码一致性。任一断言失败 exit 1 阻断提交，
          并自动打印完整调用堆栈（--traceback）到 stderr 供快速定位。
          静默模式（--pre-commit）不污染 hook 输出。
      - id: ps-script-analyzer
        name: PowerShell 静态分析 (PSScriptAnalyzer)
        entry: pwsh -NoProfile -File scripts/dev/run_psscriptanalyzer.ps1
        language: system
        pass_filenames: false
        files: '^scripts/dev/.*\.ps1$'
        stages: [commit]
        description: >
          扫描 scripts/dev/ 下 PowerShell 脚本的静态分析（语法错误、
          不良实践、潜在 bug）。发现 Error 级别问题时阻断提交。
          首次运行自动安装 PSScriptAnalyzer 模块。覆盖 fix_broken_links.ps1
          的 BOM/正则/编码类 bug，防止同类问题复发（2026-08-01 提案）。
