# ════════════════════════════════════════════════════════════
# 云枢测试环境主机清单
# ════════════════════════════════════════════════════════════
# 用法:
#   1. 将 ansible_host 替换为测试机 IP/域名
#   2. 将 ansible_user 替换为有 sudo 权限的部署账号
#   3. 推荐配置 SSH 免密（ssh-copy-id），避免交互
# ════════════════════════════════════════════════════════════

[test]
# 单台测试机（按需横向扩展，所有主机共享 group_vars/test/）
yunshu-test-01 ansible_host=10.0.0.10 ansible_user=deploy

[test:vars]
# 此处仅放连接相关变量；业务变量在 group_vars/test/vars.yml
ansible_python_interpreter=/usr/bin/python3
