# 【生成日志摘要】
# - 生成时间：2026-06-28
# - 版本：v1.0.0
# - 内容：生产级 Prometheus 抓取配置（visibility-exporter + yunshu-app + 自身 + node-exporter + grafana）
# - 生成参数：scrape_interval 15s、evaluation_interval 15s、external_labels environment=production
# - 模型配置：GLM-5.2
# - 关键状态变化：visibility-exporter 30s 抓取（5 分钟刷新足够），与开发环境隔离

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "production"

# Alertmanager 路由 — 告警发送到 alertmanager 服务
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alert_rules.yml"
  - "recording_rules.yml"
  - "embedding_cache_alerts.yml"

scrape_configs:
  # 1. 四层可见性指标导出器（visibility_report.py --serve-metrics）
  #    报告每 5 分钟刷新一次，30s 抓取足够保证时效性
  - job_name: 'visibility-exporter'
    static_configs:
      - targets: ['visibility-exporter:9101']
    metrics_path: /metrics
    scrape_interval: 30s

  # 1b. MCP 日志级别监控导出器（check_mcp_log_level.py --serve）
  #     轻量级: 仅 stdlib, 暴露 mcp_log_level_current / mcp_log_level_fallback
  - job_name: 'mcp-log-monitor'
    static_configs:
      - targets: ['mcp-log-monitor:9102']
    metrics_path: /metrics
    scrape_interval: 15s

  # 2. 云枢应用业务指标（prometheus_flask_exporter）
  - job_name: 'yunshu-app'
    static_configs:
      - targets: ['host.docker.internal:5678']
    metrics_path: /metrics

  # 3. Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 4. Node Exporter 主机指标
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 5. Grafana 内置指标
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # 6. Pushgateway — 用于 verify_alerts_trigger.py 注入测试指标
  #    【变易】告警触发验证专用,生产环境可移除
  #    使用 host.docker.internal 访问宿主机暴露的 9092 端口
  #    (pushgateway-test 容器在默认 bridge 网络,不在 monitoring 网络)
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['host.docker.internal:9092']
    metrics_path: /metrics
    scrape_interval: 15s
