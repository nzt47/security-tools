# 云枢**本机单进程**的 Prometheus 抓取配置（2026-11-11，alarms-global-coverage ②）。
#
# 【与同目录 prometheus.yml 的区别】那一份是 docker-compose 生产编排用的
#   （targets 写 host.docker.internal / 容器名 / node-exporter / grafana）。
#   本机没有那套编排，用这份：只抓两个 target —— 云枢自己 + Prometheus 自身。
#   于是 up{job="yunshu"} / up{job="prometheus"} 才存在，报警器里那 5 条
#   引用 up{} 的规则才**可求值**（不配外部 Prometheus 时它们只能是 no_data）。
#
# 启动（一次性，进程级，不随仓库部署）：
#   prometheus.exe \
#     --config.file="C:/Users/Administrator/agent/deploy/monitoring/prometheus/prometheus.local.yml" \
#     --storage.tsdb.path="C:/Users/Administrator/yunshu-prometheus/data" \
#     --storage.tsdb.retention.time=6h \
#     --web.listen-address=127.0.0.1:9090
# 然后在设置中心把 CP_PROMETHEUS_URL 设为 http://127.0.0.1:9090（热生效：报警器每轮读一次）。
#
# 【为什么不在这里加载 alert_rules.yml】16 条规则由**报警器自己**在本进程求值
#   （agent/alarms/rules.py，§11.89 方案 C）。这里再加载一份 = 两套引擎算同一批规则，
#   没有 Alertmanager 的 Prometheus 只会把告警显示在 /alerts 页面上，徒增第二处真值。
#   本实例的职责单一：**提供 up{} 与 scrape 事实**，供报警器/人工查询。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "local"
    monitor: "yunshu-local"

scrape_configs:
  # 云枢应用（prometheus_flask_exporter 暴露 /metrics；无需令牌，只读）
  - job_name: 'yunshu'
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:5678']
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus 自身（up{job="prometheus"} 由它自报）
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']
