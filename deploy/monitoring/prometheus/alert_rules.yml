# 【生成日志摘要】
# - 生成时间：2026-06-28
# - 版本：v1.0.0
# - 内容：四层可见性告警规则（10 条），覆盖服务存活、报告陈旧、总体失败、层失败、覆盖率不足、违规超限
# - 生成参数：for 持续时间、severity 标签、runbook_url 注解
# - 模型配置：GLM-5.2
# - 关键状态变化：所有规则均带 for + labels + annotations，便于 Alertmanager 路由

groups:
  - name: visibility_alerts
    interval: 30s
    rules:
      # 1. 可见性导出器宕机
      - alert: VisibilityExporterDown
        expr: yunshu_visibility_up == 0
        for: 1m
        labels:
          severity: critical
          category: visibility
          layer: runtime
        annotations:
          summary: "可见性导出器已宕机"
          description: "visibility-exporter 服务（端口 9101）在过去 1 分钟内不可达，yunshu_visibility_up == 0。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/visibility-exporter-down"

      # 2. 可见性报告陈旧（超过 10 分钟未刷新）
      - alert: VisibilityReportStale
        expr: time() - yunshu_visibility_report_timestamp_seconds > 600
        for: 5m
        labels:
          severity: warning
          category: visibility
          layer: runtime
        annotations:
          summary: "可见性报告数据陈旧"
          description: "visibility-report 已超过 10 分钟未刷新（阈值 600s），可能因源码扫描失败或进程卡死。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/visibility-report-stale"

      # 3. 总体状态失败
      - alert: VisibilityOverallFailed
        expr: yunshu_visibility_overall_status == 1
        for: 5m
        labels:
          severity: critical
          category: visibility
          layer: overall
        annotations:
          summary: "四层可见性总体状态失败"
          description: "yunshu_visibility_overall_status == 1（fail）持续 5 分钟，存在阈值违规未修复。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/visibility-overall-failed"

      # 4. 任一层失败
      - alert: VisibilityLayerFailed
        expr: yunshu_visibility_layer_passed == 0
        for: 5m
        labels:
          severity: warning
          category: visibility
          layer: "{{ $labels.layer }}"
        annotations:
          summary: "可见性层 {{ $labels.layer }} 未达标"
          description: "层 {{ $labels.layer }} 的可见性检查持续 5 分钟未通过（yunshu_visibility_layer_passed == 0）。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/visibility-layer-failed"

      # 5. 结构化日志覆盖率过低
      - alert: StructuredLogCoverageLow
        expr: yunshu_visibility_runtime_structured_log_coverage < 30
        for: 10m
        labels:
          severity: warning
          category: visibility
          layer: runtime
        annotations:
          summary: "结构化日志覆盖率过低"
          description: "运行时层结构化日志覆盖率低于 30%（当前 {{ $value }}%），违反可观测性强制约束。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/structured-log-coverage-low"

      # 6. 链路追踪覆盖率过低
      - alert: TraceCoverageLow
        expr: yunshu_visibility_runtime_trace_coverage < 30
        for: 10m
        labels:
          severity: warning
          category: visibility
          layer: runtime
        annotations:
          summary: "链路追踪覆盖率过低"
          description: "运行时层链路追踪覆盖率低于 30%（当前 {{ $value }}%），需补充 trace 注入。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/trace-coverage-low"

      # 7. 测试覆盖率过低
      - alert: TestCoverageLow
        expr: yunshu_visibility_verification_test_coverage < 40
        for: 10m
        labels:
          severity: warning
          category: visibility
          layer: verification
        annotations:
          summary: "测试覆盖率过低"
          description: "验证过程层测试覆盖率低于 40%（当前 {{ $value }}%），需补充单元测试。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/test-coverage-low"

      # 8. 埋点覆盖率过低
      - alert: TrackEventCoverageLow
        expr: yunshu_visibility_business_track_event_coverage < 30
        for: 10m
        labels:
          severity: warning
          category: visibility
          layer: business
        annotations:
          summary: "埋点覆盖率过低"
          description: "业务价值层埋点（trackEvent）覆盖率低于 30%（当前 {{ $value }}%），关键交互点缺失埋点。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/track-event-coverage-low"

      # 9. 架构规则违规过多
      - alert: ArchRuleViolationsHigh
        expr: yunshu_visibility_architecture_rule_violations > 10
        for: 15m
        labels:
          severity: warning
          category: visibility
          layer: architecture
        annotations:
          summary: "架构规则违规数过多"
          description: "架构影响层规则违规数超过 10（当前 {{ $value }}），需排查依赖方向与分层约束。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/arch-rule-violations-high"

      # 10. 阈值违规项数过多
      - alert: ThresholdViolationsIncreased
        expr: yunshu_visibility_threshold_violations_total > 3
        for: 10m
        labels:
          severity: warning
          category: visibility
          layer: overall
        annotations:
          summary: "阈值违规项数过多"
          description: "四层可见性阈值违规项总数超过 3（当前 {{ $value }}），应作为 PR 合并门槛阻断。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/threshold-violations-increased"

  # ════════════════════════════════════════════════════════════
  #  MCP 工具调用 SLO 告警 (同步自 monitoring/prometheus/alert_rules.yml)
  #  阈值来源: config.py ToolSLOConfig / ToolAlertConfig
  #  指标来源: mcp-tool-success-rate.json Grafana 仪表盘
  #  检查窗口: 5m (alert_check_window_minutes)
  #  冷却: 30m (alert_cooldown_minutes, Alertmanager repeat_interval 控制)
  # ════════════════════════════════════════════════════════════
  - name: Yunshu_mcp_slo_alerts
    interval: 30s
    rules:
      # ★ SLO: 首次调用成功率 < 90% (first_call_success_rate >= 0.90)
      - alert: McpToolSuccessRateBelowSLO
        expr: |
          sum(rate(mcp_tool_call_success_total[5m]))
            / clamp_min(sum(rate(mcp_tool_call_total[5m])), 1e-9) < 0.90
        for: 2m
        labels:
          severity: critical
          component: mcp
          slo: first_call_success_rate
        annotations:
          summary: "MCP 工具调用成功率低于 SLO 阈值 (90%)"
          description: "MCP 工具调用成功率 {{ $value | humanizePercentage }} 低于 SLO 下限 90%，持续 2 分钟。请检查 endpoint 可达性、鉴权配置或工具注册状态。"
          runbook_url: "http://localhost:3001/d/mcp-tool-success-rate"
          threshold: "0.90"

      # ★ SLO: P99 延迟 > 5000ms (tool_latency_p99_ms <= 5000)
      - alert: McpToolP99LatencyAboveSLO
        expr: |
          histogram_quantile(0.99, sum by(le, tool)(rate(mcp_tool_call_latency_ms_bucket[5m]))) > 5000
        for: 5m
        labels:
          severity: warning
          component: mcp
          slo: tool_latency_p99_ms
        annotations:
          summary: "MCP 工具 P99 延迟超过 SLO 阈值 (5000ms)"
          description: "工具 {{ $labels.tool }} 的 P99 延迟 {{ $value | humanize }} 超过 SLO 上限 5000ms，持续 5 分钟。可能存在网络抖动或下游服务过载。"
          runbook_url: "http://localhost:3001/d/mcp-tool-success-rate"
          threshold: "5000ms"

      # ★ SLO: 鉴权失败率 > 10%
      - alert: McpToolAuthErrorRateHigh
        expr: |
          sum(rate(mcp_tool_call_total{status="auth_error"}[5m]))
            / clamp_min(sum(rate(mcp_tool_call_total[5m])), 1e-9) > 0.10
        for: 5m
        labels:
          severity: warning
          component: mcp
          slo: auth_error_rate
        annotations:
          summary: "MCP 鉴权失败率异常高 (>10%)"
          description: "MCP 鉴权失败率 {{ $value | humanizePercentage }} 超过 10%，持续 5 分钟。请检查 token 有效性、scope 权限或 endpoint 鉴权策略。"
          runbook_url: "http://localhost:3001/d/mcp-tool-success-rate"
          threshold: "0.10"

      # ★ SLO: 超时率 > 10%
      - alert: McpToolTimeoutRateHigh
        expr: |
          sum(rate(mcp_tool_call_total{status="timeout"}[5m]))
            / clamp_min(sum(rate(mcp_tool_call_total[5m])), 1e-9) > 0.10
        for: 5m
        labels:
          severity: warning
          component: mcp
          slo: timeout_rate
        annotations:
          summary: "MCP 调用超时率异常高 (>10%)"
          description: "MCP 调用超时率 {{ $value | humanizePercentage }} 超过 10%，持续 5 分钟。请检查 endpoint 可达性、网络链路或 timeout 配置。"
          runbook_url: "http://localhost:3001/d/mcp-tool-success-rate"
          threshold: "0.10"

      # ★ SLO: 安全事故零容忍 (zero_safety_incident = True)
      - alert: McpSafetyIncident
        expr: sum(increase(mcp_tool_safety_incident_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
          component: mcp
          slo: zero_safety_incident
        annotations:
          summary: "MCP 安全事故发生 (零容忍)"
          description: "过去 5 分钟内检测到 {{ $value }} 起 MCP 安全事故（dangerous_commands 命中）。零容忍策略, 立即排查。"
          runbook_url: "http://localhost:3001/d/mcp-tool-success-rate"
          threshold: "0"

      # 衍生告警: 10 分钟无调用流量 (服务可能下线)
      - alert: McpToolNoTraffic
        expr: sum(rate(mcp_tool_call_total[5m])) == 0
        for: 10m
        labels:
          severity: info
          component: mcp
          slo: availability
        annotations:
          summary: "MCP 工具 10 分钟无调用流量"
          description: "MCP 工具调用速率为 0, 持续 10 分钟。可能服务未注册、exporter 未抓取或下游完全不可达。"
          runbook_url: "http://localhost:3001/d/mcp-tool-success-rate"

  # ════════════════════════════════════════════════════════════
  #  MCP 日志级别安全告警
  #  指标来源: mcp-log-monitor 服务 (scripts/check_mcp_log_level.py --serve)
  #  指标: mcp_log_level_current / mcp_log_level_fallback
  #  场景: 容器内 MCP_LOG_LEVEL 被恶意修改为 CRITICAL 等非白名单值
  #  参考: docs/PROD_LOG_LEVEL_RUNBOOK.md
  # ════════════════════════════════════════════════════════════
  - name: Yunshu_mcp_log_level_alerts
    interval: 15s
    rules:
      # ★ 安全: 日志级别异常回退(CRITICAL 等恶意值被拒绝)
      - alert: McpLogLevelFallback
        expr: mcp_log_level_fallback == 1
        for: 0m
        labels:
          severity: critical
          component: mcp
          category: security
        annotations:
          summary: "MCP 日志级别异常回退 — 疑似恶意配置"
          description: "容器 {{ $labels.instance }} 的 MCP_LOG_LEVEL 被设为 '{{ $labels.original }}'(非白名单值),已自动回退到 INFO。CRITICAL(50) 会抑制 ERROR(40) 日志,可能用于掩盖错误痕迹。请立即排查容器环境变量是否被篡改。"
          runbook_url: "docs/PROD_LOG_LEVEL_RUNBOOK.md#5-安全防护恶意值自动回退"
          valid_levels: "DEBUG,INFO,WARNING,ERROR"

      # ★ 健康: 日志级别导出器宕机(无法监控日志级别状态)
      - alert: McpLogLevelExporterDown
        expr: absent(mcp_log_level_current) or up{job="mcp-log-monitor"} == 0
        for: 1m
        labels:
          severity: warning
          component: mcp
          category: monitoring
        annotations:
          summary: "MCP 日志级别监控导出器不可达"
          description: "mcp-log-monitor 服务(端口 9102)在过去 1 分钟内不可达,无法监控日志级别回退事件。请检查容器健康状态。"
          runbook_url: "docs/PROD_LOG_LEVEL_RUNBOOK.md#7-故障排查"

      # ★ 异常: 日志级别值为 0(启动失败或级别未知)
      - alert: McpLogLevelUnknown
        expr: mcp_log_level_current == 0
        for: 2m
        labels:
          severity: warning
          component: mcp
          category: anomaly
        annotations:
          summary: "MCP 日志级别未知 — 可能启动异常"
          description: "mcp_log_level_current == 0 表示日志级别无法确定,可能 mcp_executor 模块加载失败或 logger 配置异常。"
          runbook_url: "docs/PROD_LOG_LEVEL_RUNBOOK.md#7-故障排查"
