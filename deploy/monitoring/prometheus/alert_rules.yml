# 【生成日志摘要】
# - 生成时间：2026-06-28
# - 版本：v1.0.0
# - 内容：四层可见性告警规则（10 条），覆盖服务存活、报告陈旧、总体失败、层失败、覆盖率不足、违规超限
# - 生成参数：for 持续时间、severity 标签、runbook_url 注解
# - 模型配置：GLM-5.2
# - 关键状态变化：所有规则均带 for + labels + annotations，便于 Alertmanager 路由

groups:
  - name: visibility_alerts
    interval: 30s
    rules:
      # 1. 可见性导出器宕机
      - alert: VisibilityExporterDown
        expr: yunshu_visibility_up == 0
        for: 1m
        labels:
          severity: critical
          category: visibility
          layer: runtime
        annotations:
          summary: "可见性导出器已宕机"
          description: "visibility-exporter 服务（端口 9101）在过去 1 分钟内不可达，yunshu_visibility_up == 0。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/visibility-exporter-down"

      # 2. 可见性报告陈旧（超过 10 分钟未刷新）
      - alert: VisibilityReportStale
        expr: time() - yunshu_visibility_report_timestamp_seconds > 600
        for: 5m
        labels:
          severity: warning
          category: visibility
          layer: runtime
        annotations:
          summary: "可见性报告数据陈旧"
          description: "visibility-report 已超过 10 分钟未刷新（阈值 600s），可能因源码扫描失败或进程卡死。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/visibility-report-stale"

      # 3. 总体状态失败
      - alert: VisibilityOverallFailed
        expr: yunshu_visibility_overall_status == 1
        for: 5m
        labels:
          severity: critical
          category: visibility
          layer: overall
        annotations:
          summary: "四层可见性总体状态失败"
          description: "yunshu_visibility_overall_status == 1（fail）持续 5 分钟，存在阈值违规未修复。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/visibility-overall-failed"

      # 4. 任一层失败
      - alert: VisibilityLayerFailed
        expr: yunshu_visibility_layer_passed == 0
        for: 5m
        labels:
          severity: warning
          category: visibility
          layer: "{{ $labels.layer }}"
        annotations:
          summary: "可见性层 {{ $labels.layer }} 未达标"
          description: "层 {{ $labels.layer }} 的可见性检查持续 5 分钟未通过（yunshu_visibility_layer_passed == 0）。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/visibility-layer-failed"

      # 5. 结构化日志覆盖率过低
      - alert: StructuredLogCoverageLow
        expr: yunshu_visibility_runtime_structured_log_coverage < 30
        for: 10m
        labels:
          severity: warning
          category: visibility
          layer: runtime
        annotations:
          summary: "结构化日志覆盖率过低"
          description: "运行时层结构化日志覆盖率低于 30%（当前 {{ $value }}%），违反可观测性强制约束。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/structured-log-coverage-low"

      # 6. 链路追踪覆盖率过低
      - alert: TraceCoverageLow
        expr: yunshu_visibility_runtime_trace_coverage < 30
        for: 10m
        labels:
          severity: warning
          category: visibility
          layer: runtime
        annotations:
          summary: "链路追踪覆盖率过低"
          description: "运行时层链路追踪覆盖率低于 30%（当前 {{ $value }}%），需补充 trace 注入。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/trace-coverage-low"

      # 7. 测试覆盖率过低
      - alert: TestCoverageLow
        expr: yunshu_visibility_verification_test_coverage < 40
        for: 10m
        labels:
          severity: warning
          category: visibility
          layer: verification
        annotations:
          summary: "测试覆盖率过低"
          description: "验证过程层测试覆盖率低于 40%（当前 {{ $value }}%），需补充单元测试。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/test-coverage-low"

      # 8. 埋点覆盖率过低
      - alert: TrackEventCoverageLow
        expr: yunshu_visibility_business_track_event_coverage < 30
        for: 10m
        labels:
          severity: warning
          category: visibility
          layer: business
        annotations:
          summary: "埋点覆盖率过低"
          description: "业务价值层埋点（trackEvent）覆盖率低于 30%（当前 {{ $value }}%），关键交互点缺失埋点。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/track-event-coverage-low"

      # 9. 架构规则违规过多
      - alert: ArchRuleViolationsHigh
        expr: yunshu_visibility_architecture_rule_violations > 10
        for: 15m
        labels:
          severity: warning
          category: visibility
          layer: architecture
        annotations:
          summary: "架构规则违规数过多"
          description: "架构影响层规则违规数超过 10（当前 {{ $value }}），需排查依赖方向与分层约束。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/arch-rule-violations-high"

      # 10. 阈值违规项数过多
      - alert: ThresholdViolationsIncreased
        expr: yunshu_visibility_threshold_violations_total > 3
        for: 10m
        labels:
          severity: warning
          category: visibility
          layer: overall
        annotations:
          summary: "阈值违规项数过多"
          description: "四层可见性阈值违规项总数超过 3（当前 {{ $value }}），应作为 PR 合并门槛阻断。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/threshold-violations-increased"

      # 11. 语音接口参数解析前异常（entry_assigned 监控，阶段三，2026-06-26 追加）
      # 依赖指标: routes_chat.py 暴露的 yunshu_voice_entry_unassigned_total（phase=pre_parse）
      # 语义: 10 分钟内参数解析前异常（request.get_json 抛 BadRequest 等）> 3 次则告警
      # for 10m: 依据 alert_threshold_calibration_plan.md 建议（原 2m 过短，防瞬时抖动误报）
      - alert: VoiceEntryUnassignedHigh
        expr: increase(yunshu_voice_entry_unassigned_total[10m]) > 3
        for: 10m
        labels:
          severity: warning
          category: observability
          layer: runtime
        annotations:
          summary: "语音接口异常发生在参数解析前"
          description: "10 分钟内 entry_assigned=false 次数超过 3 次，可能为 BadRequest 或客户端协议异常"
          runbook_url: "https://wiki.internal/yunshu/runbooks/voice-entry-unassigned-high"

      # 12. 熔断器打开（P1 补覆盖，2026-06-26 追加）
      # 依赖指标: business_metrics.py 暴露的 yunshu_circuit_breaker_state（gauge, labels=[breaker_name,state], value=1 表示该状态）
      # 语义: 任一熔断器 state=open 且 value==1 持续 2 分钟即告警（服务已降级/故障隔离）
      - alert: CircuitBreakerOpen
        expr: yunshu_circuit_breaker_state{state="open"} == 1
        for: 2m
        labels:
          severity: critical
          category: stability
          layer: runtime
        annotations:
          summary: "熔断器已打开（{{ $labels.breaker_name }}）"
          description: "熔断器 {{ $labels.breaker_name }} 处于 open 状态持续 2 分钟，下游服务故障隔离中，可能影响整体可用性。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/circuit-breaker-open"

      # 13. HTTP 5xx 错误率过高（P1 补覆盖，2026-06-26 追加）
      # 依赖指标: prometheus_flask_exporter 暴露的 yunshu_http_request_total（counter, labels=[method,status,endpoint]）
      # 语义: 5 分钟窗口内 5xx 请求占比 > 5% 即告警；clamp_min 防除零（分母为 0 时结果=0 不误报）
      - alert: Http5xxRateHigh
        expr: |
          sum(rate(yunshu_http_request_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(yunshu_http_request_total[5m])), 0.0001) > 0.05
        for: 5m
        labels:
          severity: warning
          category: stability
          layer: runtime
        annotations:
          summary: "HTTP 5xx 错误率过高"
          description: "5 分钟窗口内 5xx 请求占比超过 5%（当前 {{ $value | humanizePercentage }}），需排查服务端异常或依赖故障。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/http-5xx-rate-high"

      # 14. 限流触发突增（P2 补覆盖，2026-06-26 追加）
      # 依赖指标: business_metrics.py 暴露的 yunshu_rate_limit_trigger_total（counter, labels=[level,endpoint,user_id,reason]）
      # 语义: 10 分钟内限流触发次数 > 50 即告警（疑似异常流量/攻击/配置过紧）
      - alert: RateLimitTriggerHigh
        expr: increase(yunshu_rate_limit_trigger_total[10m]) > 50
        for: 5m
        labels:
          severity: warning
          category: stability
          layer: runtime
        annotations:
          summary: "限流触发次数突增"
          description: "10 分钟内限流触发超过 50 次（当前 {{ $value }}），疑似异常流量、攻击或限流配置过紧。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/rate-limit-trigger-high"

      # 15. 安全拦截突增（P2 补覆盖，2026-06-26 追加）
      # 依赖指标: routes_chat.py 暴露的 yunshu_security_blocks_total（counter, labels=[rule,level,category]）
      # 语义: 10 分钟内安全拦截 > 10 次即告警（疑似注入/危险命令攻击，或规则误伤）
      - alert: SecurityBlockHigh
        expr: increase(yunshu_security_blocks_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
          category: security
          layer: runtime
        annotations:
          summary: "安全拦截次数突增"
          description: "10 分钟内安全拦截超过 10 次（当前 {{ $value }}），疑似注入/危险命令攻击或规则误伤。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/security-block-high"

      # 16. LLM 调用失败率过高（P2 补覆盖，2026-06-26 追加）
      # 依赖指标: prometheus_monitor.py 暴露的 yunshu_llm_calls_total（counter, labels=[provider,model,status], status=success/error）
      # 语义: 5 分钟窗口内 LLM 调用 error 占比 > 20% 即告警；clamp_min 防除零
      - alert: LlmCallFailureHigh
        expr: |
          sum(rate(yunshu_llm_calls_total{status="error"}[5m]))
          /
          clamp_min(sum(rate(yunshu_llm_calls_total[5m])), 0.0001) > 0.2
        for: 5m
        labels:
          severity: warning
          category: stability
          layer: runtime
        annotations:
          summary: "LLM 调用失败率过高"
          description: "5 分钟窗口内 LLM 调用失败率超过 20%（当前 {{ $value | humanizePercentage }}），需排查模型服务或配置。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/llm-call-failure-high"

      # 17. 任务完成率过低（P2 补覆盖，2026-06-26 追加）
      # 依赖指标: business_metrics.py 暴露的 yunshu_task_completion_rate（gauge, labels=[task_type,complexity], unit=%）
      # 语义: 任务完成率 < 80% 即告警
      - alert: TaskCompletionLow
        expr: yunshu_task_completion_rate < 80
        for: 10m
        labels:
          severity: warning
          category: task
          layer: runtime
        annotations:
          summary: "任务完成率过低（{{ $labels.task_type }}）"
          description: "任务类型 {{ $labels.task_type }} 完成率低于 80%（当前 {{ $value }}%），需排查任务执行失败原因。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/task-completion-low"

      # 18. 记忆搜索命中率过低（P2 补覆盖，2026-06-26 追加）
      # 依赖指标: business_metrics.py 暴露的 yunshu_memory_search_hit_rate（gauge, labels=[memory_type,search_method], unit=%）
      # 语义: 记忆搜索命中率 < 50% 即告警
      - alert: MemoryHitRateLow
        expr: yunshu_memory_search_hit_rate < 50
        for: 10m
        labels:
          severity: warning
          category: knowledge
          layer: runtime
        annotations:
          summary: "记忆搜索命中率过低"
          description: "记忆搜索命中率低于 50%（当前 {{ $value }}%），需优化记忆检索策略。"
          runbook_url: "https://wiki.internal/yunshu/runbooks/memory-hit-rate-low"

  # ═══════════════════════════════════════════════════════════════════════
  # LinkCache 监控（知识检索任务4 性能优化护栏，2026-08-07 追加）
  # 来源: deploy/monitoring/alerts_link_cache.yml（单事实源，ExporterDown
  #   规则已通过 Docker Prometheus 端到端验证：up==0 + for → firing）
  # 依赖指标: exporter_link_cache.py 暴露的 yunshu_link_cache_* 系列
  # ═══════════════════════════════════════════════════════════════════════
  - name: yunshu_link_cache
    interval: 30s
    rules:
      # 内存超阈值（持续 2 分钟才告警，防瞬时抖动误报）
      - alert: LinkCacheMemoryHigh
        expr: yunshu_link_cache_alerted == 1
        for: 2m
        labels:
          severity: critical
          team: knowledge
        annotations:
          summary: "LinkCache 内存超阈值"
          description: "当前 used={{ $value }}（阈值见 exporter 启动参数），请核查知识库规模或缓存策略"

      # 内存异常增长（10 分钟内涨幅超 100MB，趋势类告警，覆盖泄漏场景）
      - alert: LinkCacheMemorySurging
        expr: |
          increase(yunshu_link_cache_used_bytes[10m]) > 100 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
          team: knowledge
        annotations:
          summary: "LinkCache 内存 10 分钟增长超 100MB"
          description: "增量={{ $value | humanize1024 }}B，疑似连接泄漏/缓存膨胀，请介入排查"

      # 指标抓取中断（exporter 宕机 5 分钟）—— 已验证规则逻辑（Docker 端到端）
      - alert: LinkCacheExporterDown
        expr: up{job="yunshu_link_cache"} == 0
        for: 5m
        labels:
          severity: critical
          team: knowledge
        annotations:
          summary: "LinkCache exporter 无指标"
          description: "prometheus 已 5 分钟无法抓取 yunshu_link_cache，监控链中断，请检查 exporter 进程"

      # 告警触发频率异常（24 小时内告警次数 >= 6 次 → 持续性问题，非偶发）
      - alert: LinkCacheAlertStorm
        expr: |
          increase(yunshu_link_cache_alerts_total[24h]) >= 6
        for: 0m
        labels:
          severity: warning
          team: knowledge
        annotations:
          summary: "LinkCache 24 小时告警 >= 6 次"
          description: "告警计数={{ $value }}，高频率触发说明阈值过紧或存在持续性问题"
