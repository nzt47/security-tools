---
# ════════════════════════════════════════════════════════════════════
#  验证步骤（部署后执行）
# ════════════════════════════════════════════════════════════════════
#
#  1. 确认 APIService Available
#     kubectl get apiservice v1beta1.custom.metrics.k8s.io
#
#  2. 先发起请求产生指标数据（Prometheus 需要有数据才能查询）
#     kubectl run curl-test -n production --image=curlimages/curl --rm -it --restart=Never -- \
#       curl -X POST http://skill-retrieval-service:8080/match \
#       -H "Content-Type: application/json" \
#       -d '{"query":"测试查询","top_k":5}'
#
#  3. 等待 30s（Prometheus 采集间隔 + Adapter 缓存）
#
#  4. 验证自定义指标可达
#     kubectl get --raw "/apis/custom.metrics.k8s.io/v1beta1/namespaces/production/pods/*/skill_match_latency_p99"
#     kubectl get --raw "/apis/custom.metrics.k8s.io/v1beta1/namespaces/production/pods/*/skill_match_qps"
#
#  5. 验证 HPA 能读取指标（TARGETS 列应有值）
#     kubectl get hpa skill-retrieval-hpa -n production
#
#  6. 在 Prometheus 中验证原始指标存在
#     kubectl port-forward -n monitoring svc/prometheus-server 9090:9090
#     # 浏览器访问 http://localhost:9090 查询:
#     #   skill_match_latency_ms_bucket
#     #   skill_match_count_total
# ════════════════════════════════════════════════════════════════════
