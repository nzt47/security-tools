# =====================================================================
# Grafana 集群部署（monitoring 命名空间）
#
# 用途：为 intent_layer_semantic_dashboard.json 提供可视化前端。
#   - 数据源 provisioning：Prometheus（cluster）+ Loki（cluster）
#   - 看板 provisioning：自动导入意图层 Semantic 埋点看板（v3）
#
# 应用：
#   1) kubectl apply -f deploy/k8s/grafana.yaml
#   2) 若集群节点无法直连 Docker Hub（国内网络），先本地拉取镜像再导入：
#        docker pull grafana/grafana:10.4.0
#        kind load docker-image grafana/grafana:10.4.0 --name tlm-prod-test
#   3) 访问：http://<node-ip>:30080（默认账号 admin / admin，首次登录可修改）
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: '15s'
          httpMethod: POST
          manageAlerts: false
  loki.yml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-prov
  namespace: monitoring
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'yunshu'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
