# ════════════════════════════════════════════════════════════════════
#  Metrics Server — 生产环境配置（50-200 节点规模）
#
#  【不易】HPA Resource 指标（CPU/Memory）依赖 metrics-server
#         采集间隔 30s，指标延迟 ≤45s，HPA 决策时效 SLO ≤60s
#
#  【变易】适用 50-200 节点生产集群
#         - 采集间隔 30s（平衡时效与负载，参考最佳实践文档）
#         - 资源配额按 2x 频率提升（相对 60s 基线）
#         - 移除 --kubelet-insecure-tls（生产用 CA 证书）
#         - 2 副本高可用（大规模集群分片）
#
#  【简易】官方 metrics-server v0.7.2，APIService v1beta1
#
#  参考: docs/METRICS_SERVER_TUNING_BEST_PRACTICES.md（场景 C: 50-200 节点）
#
#  部署: kubectl apply -f deploy/k8s/metrics-server-production-30s.yaml
#  验证: kubectl top nodes && kubectl top pods -n production
#  验证: kubectl get hpa -n production (ScalingActive 应为 True)
#  回滚: kubectl apply -f deploy/k8s/metrics-server.yaml（恢复 15s/kind 配置）
# ════════════════════════════════════════════════════════════════════

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-server
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:aggregated-metrics-reader
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:metrics-server
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-server-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-server:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:metrics-server
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system

---
apiVersion: v1
kind: Service
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    kubernetes.io/name: metrics-server
spec:
  selector:
    k8s-app: metrics-server
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    k8s-app: metrics-server
    env: production
  annotations:
    # 配置元数据（便于运维审计）
    config.metrics-server/resolution: "30s"
    config.metrics-server/scenario: "50-200-nodes"
    config.metrics-server/doc-ref: "docs/METRICS_SERVER_TUNING_BEST_PRACTICES.md"
spec:
  # 【变易】2 副本高可用（50-200 节点规模，单实例可能瓶颈）
  replicas: 2
  selector:
    matchLabels:
      k8s-app: metrics-server
  strategy:
    rollingUpdate:
      maxUnavailable: 1   # 滚动更新时保留至少 1 副本可用
      maxSurge: 1
  template:
    metadata:
      labels:
        k8s-app: metrics-server
        env: production
    spec:
      serviceAccountName: metrics-server
      # 【不易】反亲和性: 2 副本调度到不同节点
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: k8s-app
                    operator: In
                    values: ["metrics-server"]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: metrics-server
          image: registry.k8s.io/metrics-server/metrics-server:v0.7.2
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=4443
            - --cert-dir=/tmp
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            # ──────────────────────────────────────────────────────────
            # 【不易】采集间隔 30s — 生产环境 50-200 节点推荐值
            # ──────────────────────────────────────────────────────────
            # 依据: docs/METRICS_SERVER_TUNING_BEST_PRACTICES.md 场景 C
            # 指标延迟 ≤45s（30s 采集 + 15s HPA 轮询）
            # HPA 决策时效 SLO ≤60s，30s 间隔留 1 个周期余量
            # 权衡: 2x 采集频率（相对 60s 基线），资源配额按比例提升
            # ──────────────────────────────────────────────────────────
            - --metric-resolution=30s
            # 【不易】生产环境: 移除 --kubelet-insecure-tls，使用 CA 证书
            # kind/开发环境才用 --kubelet-insecure-tls
            # --kubelet-ca-file 需指向集群 CA 证书（通常自动挂载）
            # ──────────────────────────────────────────────────────────
            - --kubelet-request-timeout=10s
          ports:
            - name: https
              containerPort: 4443
              protocol: TCP
          resources:
            # 【变易】30s 采集间隔（2x 频率），资源配额按比例提升
            # 监控: CPU 持续 >80% 或 OOM → 需进一步调优或增加副本
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
          # 【变易】生产环境挂载 CA 证书（替代 --kubelet-insecure-tls）
          volumeMounts:
            - name: ca-certs
              mountPath: /etc/kubernetes/pki
              readOnly: true
      volumes:
        - name: ca-certs
          hostPath:
            path: /etc/kubernetes/pki
            type: DirectoryOrCreate

---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
spec:
  service:
    name: metrics-server
    namespace: kube-system
  group: metrics.k8s.io
  version: v1beta1
  # 【不易】生产环境: insecureSkipTLSVerify 应为 false（需配置 caBundle）
  # 临时兼容: 保留 true，后续应替换为集群 CA 证书
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
