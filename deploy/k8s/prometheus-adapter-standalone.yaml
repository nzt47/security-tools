# ════════════════════════════════════════════════════════════════════
#  Prometheus Adapter 独立部署清单 — 暴露 skill_match 自定义指标给 HPA
#
#  【不易】rules 对齐 prometheus-adapter-config.yaml:
#    - skill_match_latency_ms_bucket → skill_match_latency_p99 (histogram_quantile)
#    - skill_match_count_total → skill_match_qps (rate)
#  【变易】insecureSkipTLSVerify: true（简化部署，不配置 serving cert）
#  【简易】RBAC + ConfigMap + Deployment + Service + APIService 五件套
#
#  部署: kubectl apply -f deploy/k8s/prometheus-adapter-standalone.yaml
#  验证: kubectl get --raw "/apis/custom.metrics.k8s.io/v1beta1/namespaces/production/pods/*/skill_match_latency_p99"
# ════════════════════════════════════════════════════════════════════

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-adapter
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-adapter
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-adapter
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-adapter:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: monitoring

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-rules
  namespace: monitoring
data:
  rules.yaml: |
    rules:
      # ── P99 延迟: skill_match_latency_ms_bucket → skill_match_latency_p99 ──
      - seriesQuery: 'skill_match_latency_ms_bucket{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^(.*)_bucket"
          as: "skill_match_latency_p99"
        metricsQuery: |
          histogram_quantile(0.99,
            sum(rate(<<.Series>>{<<.LabelMatchers>>}[5m])) by (le, <<.GroupBy>>)
          )
      # ── QPS: skill_match_count_total → skill_match_qps ──
      - seriesQuery: 'skill_match_count_total{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^(.*)_total"
          as: "skill_match_qps"
        metricsQuery: |
          sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-adapter
  namespace: monitoring
  labels:
    app: prometheus-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-adapter
  template:
    metadata:
      labels:
        app: prometheus-adapter
    spec:
      serviceAccountName: prometheus-adapter
      containers:
        - name: prometheus-adapter
          image: registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.11.2
          imagePullPolicy: IfNotPresent  # 【变易】本地镜像不拉取
          args:
            - --cert-dir=/tmp
            - --secure-port=6443
            - --prometheus-url=http://prometheus-server.monitoring.svc.cluster.local:9090
            - --v=4
            - --config=/etc/adapter/rules.yaml
          ports:
            - containerPort: 6443
              name: https
          volumeMounts:
            - name: rules
              mountPath: /etc/adapter
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: rules
          configMap:
            name: prometheus-adapter-rules

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-adapter
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: prometheus-adapter
  ports:
    - name: https
      port: 443
      targetPort: 6443

---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.custom.metrics.k8s.io
spec:
  service:
    name: prometheus-adapter
    namespace: monitoring
  group: custom.metrics.k8s.io
  version: v1beta1
  # 【变易】跳过 TLS 验证（简化部署，生产环境应配置 serving cert）
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
