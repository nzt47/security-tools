# ════════════════════════════════════════════════════════════════════
#  扩缩容场景示例
# ════════════════════════════════════════════════════════════════════
#
#  场景 1: 突发流量（QPS 从 200 → 1000）
#  ┌─────────────────────────────────────────────────────┐
#  │ 1. QPS > 200/副本 → HPA 触发扩容                    │
#  │ 2. 30 秒内 +4 副本（2 → 6）                         │
#  │ 3. P99 从 42ms → 15ms（负载分摊）                   │
#  │ 4. 10 分钟后稳定，开始慢速缩容                       │
#  └─────────────────────────────────────────────────────┘
#
#  场景 2: P99 超标（candidate_limit 未启用时）
#  ┌─────────────────────────────────────────────────────┐
#  │ 1. P99 > 40ms → HPA 触发扩容                        │
#  │ 2. 30 秒内 +4 副本（2 → 6）                         │
#  │ 3. 同时触发告警: DegradationNotEnabledButP99High    │
#  │ 4. 建议: 同时启用 candidate_limit=200 降级           │
#  └─────────────────────────────────────────────────────┘
#
#  场景 3: 低谷期缩容
#  ┌─────────────────────────────────────────────────────┐
#  │ 1. QPS < 50, P99 < 25ms, CPU < 40%                  │
#  │ 2. 等待 10 分钟稳定窗口                              │
#  │ 3. 每 2 分钟减 1 副本（6 → 5 → 4 → ... → 2）        │
#  │ 4. 最小保持 2 副本（高可用）                         │
#  └─────────────────────────────────────────────────────┘
