memory:
  max_tokens: 8000
  enable_long_term: false
  summary_threshold: 5000
  retention_days: 30
behavior:
  default_mode: NORMAL
  allow_reflection: true
  max_iterations: 10
  response_timeout: 60
planning:
  # D7 修复：规划引擎接入生产配置（原 false 使引擎"已建未用"）
  # orchestrator 聊天主链路依此开启 planning 分支（lifecycle_manager 读取）
  enabled: true
  max_depth: 5
  timeout_seconds: 30
  enable_chain_of_thought: false
  # TASK-01：规划引擎接入主链路（D7 接线灰度开关）
  # 默认 false（灰度）；true 时复杂任务走 PlanningCore.chat()，异常自动回退 LLM
  # 环境变量 PLANNING_WIRE_ENABLED 覆盖此值（优先级: 环境变量 > config.yaml > 硬编码默认值）
  wire_enabled: false
  # 触发规划的最低复杂度：TRIVIAL / SIMPLE / NORMAL / COMPLEX（复用 enhanced_planner 语义）
  # 环境变量 PLANNING_WIRE_MIN_COMPLEXITY 覆盖此值
  wire_min_complexity: COMPLEX
  # 规划调用超时（秒），超时回退 LLM
  # 环境变量 PLANNING_WIRE_TIMEOUT_SECONDS 覆盖此值
  wire_timeout_seconds: 30
  # D9 规格：SQLite 持久化（默认 data/plans/plans.db；首次启动自动迁移旧 JSON 检查点）
  persist_dir: data/plans
  persist_db: data/plans/plans.db
  # 阶段 3：高优先级任务失败时重规划（Plan B）开关（false 时保持原中断行为）
  replan_on_failure: true
  # 阶段 3：ask_user 等待用户确认超时（秒），超时自动以"用户未确认"结束
  ask_user_timeout_seconds: 300
  # 阶段 3：多维预算（budget.enabled=false 可整体关闭；各维度缺省 = 不限制）
  budget:
    enabled: true
    max_seconds: 30
    token_price_per_1k: 0.002
llm:
  provider: openai
  model: gpt-4
  temperature: 0.7
  max_tokens: 2000
  api_key: ${OPENAI_API_KEY}
learning:
  # TASK(集成): ContextAssembler 旁路注入（D2D3 替代方案 CEL 框架）
  # 观察模式已开启（2026-08-12，集成验证通过后）：system prompt 追加三层记忆组装产物；
  # 组装任何异常均静默降级，主链路零影响。环境变量 LEARNING_CONTEXT_ASSEMBLER_ENABLED 可覆盖
  context_assembler:
    enabled: true
    token_budget: 3000
  # TASK-02：反思产物写入检索面开关（观察模式）
  # 默认 false（观察）：self_reflect 保持现状仅写内存/日志；true 时才额外写入向量检索面
  # 环境变量 LEARNING_REFLECTION_PERSIST 覆盖此值
  reflection_persist: true
  # TASK-02：规划经验/教训落盘开关（观察模式）
  # 默认 false（观察）：execute_plan 收尾仅记录调用意图日志；true 才实际调 learn_from_experience 落盘
  # 环境变量 LEARNING_EXPERIENCE_PERSIST 覆盖此值
  experience_persist: false
  # TASK-03/任务5：学习动作成本预算护栏（把 configs/models.yaml cost_limits 从"声明"变为"可执行"）
  # mode=enforce（任务5 灰度提升，原 warn_only 观察期结束）：超过单次上限/日预算的学习
  #   动作被拒绝并告警（LearningBudgetExceeded），作为任务5 Judge 通道（LLM 型评估）
  #   存在的必要条件（报告 TASK-08 §3.3 否决条件：warn_only 不强制时一律不引入 LLM 型评估角色）
  # scope=learning_actions（作用范围声明，审计可读）：本护栏只被学习动作调用
  #   （LEARNING_ACTION_SCOPE 白名单），enforce 天然不触碰主链路——主链路零 import 零调用
  #   （grep 审计 with_budget|get_learning_budget 全部命中学习侧文件）；MAIN_CHAIN_EXCLUDED
  #   排除清单声明于 agent/learning_budget.py，新增主链路消费方属违规
  # 优先级：环境变量 > config.yaml > models.yaml cost_limits > 硬编码默认值
  budget:
    mode: enforce
    scope: learning_actions
    max_single_action_tokens: 4000
    max_daily_tokens: 1000000
    recovery_seconds: 3600
  # 任务5：LLM-as-Judge 双假设验证 · Judge dry-run 通道（agent/learning/judge_channel.py）
  # 同候选集双通道评估（规则通道 vs LLM Judge），只写 metrics/审计，零干预任何提交/采纳决策；
  # 所有 LLM 调用经 learning.budget 记账（enforce 熔断保护，超限跳过不伪造指标）。
  # 开关优先级：环境变量 LEARNING_JUDGE_* > config.yaml learning.judge > 硬编码默认值
  # 【不变式】enabled 默认 false（默认零 LLM 调用）；dry_run 默认 true；干预模式属远期决策
  #           （报告 §3.3 流程 + 判别结论"支持引入"后才进入评估），本任务绝不启用。
  judge:
    enabled: false
    dry_run: true
    audit_file: ./data/learning/judge_audit.jsonl
    # 判别规则预设（写入任务5判别报告 §3）：
    #   分歧率 < 阈值 → 假设 B（候选质量差）→ 不引入 Judge，转向改进候选生成；
    #   分歧率 ≥ 阈值 且 按 Judge 判定的采纳率 - 规则通道采纳率 ≥ +10pp → 假设 A（评估不精细）
    #     → 支持引入，按报告 §3.3 dry-run 2 周流程评估启用；其余 → 不启用（证据不足，继续采集）
    disagreement_threshold: 0.10
    min_adoption_delta_pp: 10.0
    # 最小判别基数：双通道判定样本 < 该值时判别结论标记 insufficient_data（不进入判别）
    min_candidates: 5
    # 采集周期（周）：2 周（或候选数 ≥ min_candidates，取先到者）
    collection_weeks: 2
    # 单候选 LLM 预估 token 上限（计入 learning.budget 单次上限内）
    max_estimated_tokens_per_candidate: 2000

  # TASK-04：知识→技能沉淀管道调度开关（安全底线，默认关闭）
  # 默认 false：不注册 memory_abstractor 定时沉淀任务；true 才注册（产物仅 DRAFT+审计+KPI，绝不自动注册）
  # 环境变量 LEARNING_PRECIPITATE_ENABLED 覆盖此值
  precipitate_enabled: false
  # TASK-04：沉淀定时任务间隔（小时），默认 24（每日一次）
  # 环境变量 LEARNING_PRECIPITATE_INTERVAL_HOURS 覆盖此值
  precipitate:
    interval_hours: 24
    # 沉淀草稿审计日志（JSONL，质量门控通过的草稿逐条留痕）
    audit_file: ./data/precipitate_audit.jsonl
  # TASK-05：反馈建议自动执行体调度开关（安全底线）
  # true：注册每日反馈建议执行任务（默认 dry-run 只预演，正式写操作需
  # dry_run=false；正式执行前 bump_version 打快照可回滚，动作写审计日志）
  # 环境变量 LEARNING_FEEDBACK_AGENT_ENABLED 覆盖此值
  feedback_agent:
    enabled: true
    # 反馈建议执行任务间隔（小时），默认 24（每日一次）
    interval_hours: 24
    # dry-run 默认 true（不可变约束：默认不产生任何写操作/状态变更）
    dry_run: true
    # 反馈动作审计日志（JSONL：skill_id/action/原因/结果/快照版本）
    audit_file: ./data/feedback_agent_audit.jsonl
  # TASK-05：offline_evolver 周期进化调度开关（安全底线）
  # true：注册周级进化任务（每周一次，默认 dry-run 只预演候选；提交门槛
  # 保持 improvement>=0.05，产 BatchEvolutionReport 审计 + 进化采纳率 KPI）
  # 环境变量 LEARNING_EVOLVER_ENABLED 覆盖此值
  evolver:
    enabled: true
    # 周期进化间隔（天），默认 7（每周一次）
    interval_days: 7
    # dry-run 默认 true（不可变约束：默认零提交/零 KPI/零审计）
    dry_run: true
    # 周期进化批次审计日志（JSONL：BatchEvolutionReport 摘要）
    audit_file: ./data/evolution_schedule_audit.jsonl
  # TASK-05：Skill 生命周期自动淘汰开关（安全底线）
  # true：注册每日生命周期检查任务（零使用 N 天判定器：PUBLISHED 闲置超
  # unused_days → DEPRECATED；DEPRECATED 闲置超 archive_days → ARCHIVED；
  # 默认 dry-run 只报告不迁移，仅状态迁移不删文件）
  # 环境变量 LEARNING_LIFECYCLE_ENABLED 覆盖此值
  lifecycle:
    enabled: true
    # 生命周期检查任务间隔（小时），默认 24（每日一次）
    interval_hours: 24
    # PUBLISHED 闲置天数超阈值 → DEPRECATED（默认 90）
    unused_days: 90
    # DEPRECATED 闲置天数超阈值 → ARCHIVED（默认 180）
    archive_days: 180
    # dry-run 默认 true（不可变约束：默认不迁移/不写审计）
    dry_run: true
    # 生命周期迁移审计日志（JSONL：skill_id/from_status/to_status/闲置天数）
    audit_file: ./data/skill_lifecycle_audit.jsonl
  # 任务3：L2 自进化闭环受控放行（四态放行框架）
  # 三类进化动作（feedback/evolution/lifecycle）统一放行状态机：
  #   dry_run（默认，零副作用）/ observe（真实评估+预演，零提交，写谱系 preview）/
  #   confirm（产物进审批队列，人工批准后提交，提交前回归门禁）/
  #   rollout（按 rollout_ratio 比例命中；KPI 连续恶化自动回退 + 告警）
  # 总开关 LEARNING_ROLLOUT_MASTER_ENABLED（默认 false）：false 时全部强制 dry_run。
  # 环境变量覆盖：LEARNING_ROLLOUT_<ACTION>_MODE / _ROLLOUT_RATIO /
  #   _KPI_ROLLBACK_WINDOW_WEEKS（ACTION=FEEDBACK|EVOLUTION|LIFECYCLE）
  rollout:
    master_enabled: false
    # 回归门禁模式（任务1 接线）：enforce=FAIL/NO_SAMPLES 拦截提交（默认）/
    # warn_only=只读告警不拦截 / off=零调用
    # 环境变量 LEARNING_ROLLOUT_REGRESSION_GATE 覆盖此值
    regression_gate: enforce
    # 放行审计日志（JSONL：action/mode/candidate_id/decision/版本号/回归结果/KPI 快照/回滚命令）
    audit_file: ./data/learning/rollout_audit.jsonl
    feedback:
      mode: dry_run
      rollout_ratio: 0.1
      kpi_rollback_window_weeks: 2
    evolution:
      mode: dry_run
      rollout_ratio: 0.1
      kpi_rollback_window_weeks: 2
    lifecycle:
      mode: dry_run
      rollout_ratio: 0.1
      kpi_rollback_window_weeks: 2
  # TASK-06：感知侧新颖性学习管道开关（安全底线，默认开启——2026-08-14 由观察模式转入正式采集）
  # true（正式采集）：低/中置信 NoveltyEvent → 记忆（novelty_memory.jsonl），高置信 → 审计 + 建议草稿
  # （novelty_suggestions/，仅 DRAFT，绝不注册技能——供 TASK-04 审核链消费）
  # false（观察模式）：ChangeDetector/行为漂移全链路零学习副作用（仅既有日志）
  # 环境变量 SENSOR_LEARNING_ENABLED 覆盖此值
  sensor_learning:
    enabled: false
    # 行为漂移判定阈值（周级基线相对偏差均值；默认 0.3）
    # 环境变量 SENSOR_LEARNING_DRIFT_THRESHOLD 覆盖此值
    drift_threshold: 0.3
    # 行为基线保留周数（~/.Yunshu/baselines/behavior_<周一日期>.json 滚动清理；默认 8）
    # 环境变量 SENSOR_LEARNING_BASELINE_RETENTION_WEEKS 覆盖此值
    baseline_retention_weeks: 8
    # change_log.json 容量上限（~/.Yunshu/changes/，超出滚动删除最旧；默认 10000）
    # 环境变量 SENSOR_LEARNING_CHANGE_LOG_MAX_ENTRIES 覆盖此值
    change_log_max_entries: 10000
    # 建议草稿目录（高置信事件，仅 DRAFT，供 TASK-04 审核链消费）
    # 环境变量 SENSOR_LEARNING_DRAFT_DIR 覆盖此值
    draft_dir: ./data/learning/novelty_suggestions
    # 学习审计日志（JSONL：事件分类/分级/落点）
    # 环境变量 SENSOR_LEARNING_AUDIT_FILE 覆盖此值
    audit_file: ./data/learning/novelty_audit.jsonl
    # 事件记忆目录（JSONL：novelty_memory.jsonl，event=novelty_event 标签）
    # 环境变量 SENSOR_LEARNING_MEMORY_DIR 覆盖此值
    memory_dir: ./data/learning/novelty_memory
  # 任务6：轻量自我进化机制（失败案例回流 + 修复策略库 + 参数联动）
  # 裁剪替代 FATE：无任何训练/微调管线，纯提示词/策略级进化闭环
  # 环境变量 EVOLUTION_ENABLED 覆盖此值
  evolution:
    enabled: true
    # 可选 LLM 候选生成开关（默认开；无 LLM 环境自动降级为规则候选）
    # 环境变量 EVOLUTION_LLM_GENERATE 覆盖此值
    llm_generate: true
    # 策略库/失败案例存储目录
    # 环境变量 EVOLUTION_STORAGE_PATH 覆盖此值
    storage_path: ./data/evolution
  # 任务6：沙箱回放与评估隔离加固（重构计划阶段三）
  # 评估回放隔离层：不可信轨迹/候选产物在全新解释器进程执行（受限 builtins +
  # 危险模块惰性代理 + 环境白名单 + 超时强杀 + 输出/并发上限），fail-closed。
  # 安全底线：默认关闭（false）；显式开启仅限任务1 评估集回归与任务3 observe 态
  # 回放用途；回放样本走 black_box 脱敏管道，明文不出隔离环境。
  # 环境变量 EVAL_REPLAY_* 覆盖对应值；优先级: 环境变量 > config.yaml > 硬编码
  replay:
    # 总开关（默认 false，安全底线）
    # 环境变量 EVAL_REPLAY_ENABLED 覆盖此值
    enabled: false
    # 后端（process | docker；docker 为可选容器化后端，需 docker + 镜像）
    # 环境变量 EVAL_REPLAY_BACKEND 覆盖此值
    backend: process
    # 进程后端执行器（spawn | subprocess；spawn 不可用时回放显式失败，
    # 不会静默降级为同进程执行；受限环境可用 subprocess 文件交换执行器）
    # 环境变量 EVAL_REPLAY_RUNNER 覆盖此值
    runner: spawn
    # 单样本墙钟超时（秒），超时强杀
    # 环境变量 EVAL_REPLAY_TIMEOUT_S 覆盖此值
    timeout_s: 30
    # stdout/stderr 捕获上限（字节，防内存炸弹）
    # 环境变量 EVAL_REPLAY_MAX_OUTPUT_BYTES / EVAL_REPLAY_MAX_STDERR_BYTES 覆盖
    max_output_bytes: 1048576
    max_stderr_bytes: 262144
    # 并发 worker 上限（默认 1 串行，防并发放大/fork 炸弹）
    # 环境变量 EVAL_REPLAY_MAX_CONCURRENT 覆盖此值
    max_concurrent: 1
    # 单 job 样本数上限
    # 环境变量 EVAL_REPLAY_MAX_SAMPLES 覆盖此值
    max_samples: 200
    # scratch 根目录（默认 <系统临时>/yunshu_replay；与生产零共享写路径）
    # 环境变量 EVAL_REPLAY_WORK_DIR 覆盖此值
    work_dir: ""
    # 回放素材只读目录（默认 data/evals；仅作只读素材，绝不写入）
    # 环境变量 EVAL_REPLAY_MATERIAL_DIR 覆盖此值
    material_dir: ./data/evals
    # 回放审计日志（JSONL：replay_id/samples/candidate_id/verdict/duration/
    # resource_usage/evidence(截断)/rollback_command）
    # 环境变量 EVAL_REPLAY_AUDIT_FILE 覆盖此值
    audit_file: ./data/learning/replay_audit.jsonl
    # docker 后端镜像（仅 EVAL_REPLAY_BACKEND=docker 时使用）
    # 环境变量 EVAL_REPLAY_DOCKER_IMAGE 覆盖此值
    docker_image: python:3.12-slim
    # POSIX 内存上限（MB；0=不设；Windows 无 resource 时仅记录不强制）
    # 环境变量 EVAL_REPLAY_MAX_RSS_MB 覆盖此值
    max_rss_mb: 0
  # 任务4：元规则版本化与护栏可执行化（重构计划阶段二，护栏 G1）
  # 只读默认：本段只登记/快照/门控/查询进化参数，不改变任何读取语义；
  # 变更必须走审批链（approval.py），无审批零生效；非法值回退默认
  # 环境变量 META_POLICY_ENABLED / META_POLICY_STORE_DIR /
  #           META_POLICY_APPROVAL_LEVEL / META_POLICY_AUDIT_FILE /
  #           META_POLICY_MIGRATE_DRY_RUN_ONLY 覆盖
  meta_policy:
    # 元规则存储/变更总开关（false 时变更操作全部拒绝，只读可用）
    enabled: true
    # 存储根目录（schema.json/current.json/versions/audit.jsonl）
    store_dir: ./data/learning/meta_policy
    # 变更审批级别（L0/L1/L2；默认 L1=人工批准后系统自动生效）
    approval_level: L1
    # migrate 只做 dry-run（安全底线：默认不迁移任何参数）
    migrate_dry_run_only: true
  # 任务4：护栏状态服务（G1-G5 聚合，只读端点 /api/learning/guards）
  # 环境变量 GUARD_STATUS_ENABLED 覆盖此值
  guard_status:
    enabled: true
  # 任务2：学习 KPI 数据源补齐与触发条件监控（重构计划阶段一）
  # 依赖主线 TASK-03 learning_metrics.py；配置优先级：环境变量 > 本配置 > 硬编码默认值
  metrics:
    # KPI#7 进化采纳率最小候选基数：周候选数 < 该值时该周采纳率标记 insufficient_data，
    # 不参与"连续 4 周"统计（报告 §5.2 触发条件）；默认 5
    # 环境变量 LEARNING_METRICS_MIN_CANDIDATES 覆盖此值
    min_candidates: 5
    # 知识检索（agent/knowledge/search.py）KPI#1 语义查询观察埋点：
    # 默认 true（观察埋点开启，2026-08-23 复查接线）——知识卡片检索与 orchestrator
    # 语义层技能匹配是不同通道，开启后每次 search 计入 record_semantic_query
    # （saved_tokens=0，纯计数零成本，不改 token 复用率口径，异常静默零阻塞）
    # 环境变量 LEARNING_METRICS_OBSERVE_KNOWLEDGE_SEARCH 覆盖此值
    observe_knowledge_search: true
    # SQLite 持久化（TASK-03 设计，2026-08-23 复查按启用路线图 S1 启用；
    # true 时启用落库：I/O 不进锁、DB 失败自动降级为内存聚合（沿用 3f37612d 设计）、
    # 跨重启累积"连续 4 周"统计；回滚：LEARNING_METRICS_PERSIST_ENABLED=false 即时关闭）
    # 环境变量 LEARNING_METRICS_PERSIST_ENABLED / _PATH / _FLUSH_BATCH / _RETENTION_DAYS 覆盖
    persistence:
      enabled: true
      # 持久化 DB 路径（相对仓库根）
      path: ./data/learning_metrics.db
      # 达该事件行数阈值自动批量落库（单事务）
      flush_batch_size: 200
      # 回填保留天数（跨重启恢复窗口）
      retention_days: 90
    # 触发条件监控判定参数（报告 TASK-08 §3.3/§5.2 五条触发条件；窗口/阈值见
    # docs/zh/进化机制重构计划/自进化机制重构计划/任务2_触发条件计算说明.md）
    trigger_monitoring:
      # "连续 N 周"判定窗口（含当前进行周）；默认 4
      window_weeks: 4
      # 沙箱回放覆盖率阈值（< 该值触发 TC-4）；回放统计未接入时 TC-4 为 unknown
      replay_coverage_threshold: 0.5
  # 任务7：复杂度判定源统一（agent/task_planner/complexity_classifier.py）
  # source=wire_v2（2026-08-23 选型结论：200 条人工标注集符合率 62.5% vs wire 55.0%，
  # 显著修正 SIMPLE→TRIVIAL 与 COMPLEX→NORMAL 系统性误判；wire_enabled=false 时
  # 切换仅影响复杂度元数据/KPI#4 维度，不改变任何路由决策）
  # 候选：wire（原默认，可回退）/ enhanced_planner（灰度对比候选）
  # 回退：COMPLEXITY_SOURCE=wire 环境变量一键回退（优先级高于 config）
  # 依据：data/complexity_labeled.jsonl（200 条标注）+ complexity_v2_compare.py --labeled
  #       + 《复杂度判定源选型决策.md》
  # 环境变量 COMPLEXITY_SOURCE 覆盖此值
  complexity:
    source: wire_v2
    # wire_v2 判定参数（WireV2Classifier，环境变量 COMPLEXITY_V2_* 覆盖；
    # 非法值回退默认；仅 source=wire_v2 时生效）
    v2:
      # 复杂指示词命中权重（单次命中累计）
      complex_keyword_weight: 1.0
      # 动作词命中权重
      action_keyword_weight: 0.5
      # 文本长度（字符）超过该值附加长文本权重分
      length_threshold: 60
      length_weight: 0.5
      # 数字/金额/百分比/日期实体每命中附加权重
      numeric_entity_weight: 0.25
      # 步骤连接词（首先/然后/最后/分别…）每命中附加权重
      step_word_weight: 0.5
      # 量词（多个/所有/全部…）每命中附加权重
      quantifier_weight: 0.5
      # 分级阈值（与 wire 同构：≥complex 分档 / ≥normal 分档 / ≥simple 分档）
      complex_threshold: 2.0
      normal_threshold: 1.5
      simple_threshold: 0.5
  # 任务7：课程难度自适应策略（agent/learning/curriculum.py）——默认关闭（观察模式）
  # 默认 false：enabled=false 时策略零建议零审计，路由行为与现状完全一致；
  # 启用决策需基于任务7 对比报告 + 任务2 KPI 监控数据，属后续人工决策
  # 环境变量：LEARNING_CURRICULUM_ENABLED / _MODE / _SUCCESS_BASELINE /
  #           _LOW_FAILURE_THRESHOLD / _MIN_SAMPLES / _MAX_STEP / _WINDOW_WEEKS / _AUDIT_FILE
  curriculum:
    enabled: false
    # 模式：observe（只读建议+审计，默认）/ active（建议生效+审计）
    mode: observe
    # 高复杂度档（NORMAL/COMPLEX）成功率基线：≥ 该值才允许提升路由概率（默认 0.70）
    success_baseline_threshold: 0.7
    # 低复杂度档（TRIVIAL/SIMPLE）失败率门槛：> 该值封锁高复杂度档提升（默认 0.30）
    low_complexity_failure_threshold: 0.3
    # 单档最小样本量（不足标记 insufficient_data，不输出建议）
    min_samples: 5
    # 单档路由概率建议步长上限
    max_step: 0.1
    # 统计窗口周数（读 get_weekly_kpis 最近 N 周）
    window_weeks: 4
    # 调整审计日志（JSONL：decision=preview/apply）
    audit_file: ./data/learning/curriculum_audit.jsonl
tools:
  enabled: true
  timeout: 30
  whitelist:
  - web_search
  - calculator
  - file_read
  - code_execute
# TASK-07：L1-L5 行为自主权分级（聚合视图 + 上下文注入，不改既有机制）
# 分级表见 docs/zh/智能体学习机制重构计划/变更说明/TASK-07_变更说明.md §3；
# 只映射/聚合 permission_system / circuit_breaker / graceful_degrade，不改变其判定语义
# 优先级: 会话级 set_session_level > 环境变量 AUTONOMY_DEFAULT_LEVEL > 本配置 > 默认 L3
autonomy:
  default_level: L3
  # 按等级覆盖策略（键为 L1-L5，值为 LevelPolicy 字段的 dict 子集）
  # 例: per_level_policy: {L2: {confirmation_scope: all}}
  per_level_policy: {}
session:
  auto_save: true
  save_interval: 300
  max_history: 1000
features:
  v2_lifetrace: true
  v2_persona: true
  v2_distillation: false
  v2_lazy_loader: true
  # 验证工程总开关（灰度发布）
  verification_enabled: false
  # Schema 输出校验开关
  schema_validation_enabled: false
  # Critic 质量评审开关
  critic_evaluation_enabled: true
  # 失败分析归档开关
  failure_analysis_enabled: false

# ═══════════════════════════════════════════════════════════════
#  验证工程配置 (Verification Engineering)
# ═══════════════════════════════════════════════════════════════
verification:
  # 全局开关 - 开启保守模式
  enabled: true
  # 灰度发布比例 (0-100) - 10% 流量启用验证
  rollout_percentage: 10
  # 保守模式（仅记录日志，不阻断流程）
  conservative_mode: true
  
  # Schema 输出校验配置
  schema_validation:
    enabled: true
    # 是否启用重试
    enable_retry: true
    # 最大重试次数
    max_retries: 3
    # 严格模式（校验失败直接返回错误）- 保守模式下为 false
    strict_mode: false
    # 支持的输出类型
    supported_types:
      - text_response
      - tool_call
      - summary_report
      - error_message
  
  # Critic 质量评审配置
  critic_evaluation:
    enabled: true
    # 评审模式: rule_based, llm_based
    mode: rule_based
    # 通过阈值 (0-100)
    threshold: 70
    # 是否启用重试
    enable_retry: true
    # 最大重试次数
    max_retries: 2
    # 各维度权重
    dimension_weights:
      factual_accuracy: 0.25
      completeness: 0.25
      relevance: 0.20
      logic: 0.15
      clarity: 0.15
    # LLM 评审模型配置（mode=llm_based 时使用）
    llm_config:
      model: gpt-4
      temperature: 0.3
      max_tokens: 1000
  
  # 失败分析与归档配置
  failure_analysis:
    enabled: true
    # 存储路径
    storage_path: ./data/failures
    # 自动分类
    auto_classify: true
    # 保留天数
    retention_days: 90
    # 是否生成优化建议
    generate_suggestions: true
  
  # 人工确认（HITL）配置
  human_in_the_loop:
    enabled: true
    # 低风险操作自动批准
    auto_approve_low_risk: true
    # 高风险操作需人工确认
    require_confirmation_for_high_risk: true
    # 确认超时时间（秒）
    confirmation_timeout: 300
    # 超时策略: reject, approve, degrade
    timeout_strategy: degrade
  # TASK-07：输出验证门控（OutputGuard 之后追加，不替换）
  # mode: rule_based（默认，零 Token）/ llm_based（接口预留，需配 critic_evaluation.llm_config）
  # conservative_mode=true（默认）：只记录 metrics/审计，不拦截不重试，用户响应零影响
  output_validator:
    enabled: true
    mode: rule_based
    conservative_mode: true
    max_output_length: 8000
    enable_retry: true
    max_retries: 1

# ═══════════════════════════════════════════════════════════════
#  日志配置 (Logging)
# ═══════════════════════════════════════════════════════════════
logging:
  # 全局日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO
  # 是否启用调试模式（启用后所有模块为 DEBUG 级别）
  debug_mode: false
  
  # 控制台输出配置
  console:
    enabled: true
    level: INFO
    # 格式化配置
    format: "%(asctime)s [%(levelname)8s] %(name)-30s: %(message)s"
    date_format: "%H:%M:%S"
  
  # 文件输出配置
  file:
    enabled: true
    # 主日志文件路径
    main_file: ./logs/agent.log
    # 错误日志文件路径（独立文件，仅记录 ERROR 及以上）
    error_file: ./logs/errors.log
    # 审计日志文件路径（独立文件，记录安全操作）
    audit_file: ./logs/audit.log
    # 扩展系统日志文件路径（独立文件，记录扩展相关操作）
    extensions_file: ./logs/extensions.log
    level: INFO
    format: "%(asctime)s [%(levelname)8s] %(name)-30s %(process)d:%(thread)d: %(message)s"
    date_format: "%Y-%m-%d %H:%M:%S"
  
  # 日志轮转配置
  rotation:
    # 单个日志文件最大大小（MB）
    max_file_size_mb: 50
    # 保留的备份文件数量
    backup_count: 10
    # 是否使用基于时间的轮转（按天）
    use_timed_rotation: false
    # 时间轮转单位: midnight, D(天), H(小时), M(分钟)
    when: midnight
    # 轮转间隔
    interval: 1
    # 是否使用 UTC 时间
    utc: false
  
  # 各模块日志级别配置
  modules:
    agent.extensions: INFO
    agent.server_routes: INFO
    agent.guardrails: INFO
    agent.cognitive: INFO
    agent.human_in_the_loop: INFO
    agent.digital_life: INFO
    agent.behavior_controller: INFO
    agent.permission_system: INFO
    agent.safety_guard: INFO
    agent.system_tools: INFO
    agent.tools: INFO
    agent.planning: INFO
    # 第三方库日志级别（降低噪音）
    urllib3: WARNING
    httpx: WARNING
    httpcore: WARNING
    anthropic: WARNING
    openai: WARNING

# ═══════════════════════════════════════════════════════════════
#  扩展系统配置 (Extensions)
# ═══════════════════════════════════════════════════════════════
extensions:
  # 是否启用扩展系统
  enabled: true
  
  # 扩展管理器配置
  manager:
    # 自动发现本地扩展
    auto_discover: true
    # 扩展安装目录
    install_dir: ./extensions
    # 配置文件路径
    config_file: ./extensions/extensions.json
  
  # 扩展市场配置
  market:
    # 是否启用社区市场
    community_enabled: true
    # 是否启用 GitHub 搜索
    github_search_enabled: true
    # 社区索引 URL
    community_index_url: ""
    # GitHub 搜索 API（可选）
    github_api_token: ""
  
  # 高危操作配置（HITL - Human in the Loop）
  hitl:
    # 是否启用人工确认
    enabled: true
    # 自动批准低风险操作
    auto_approve_low_risk: true
    # 拒绝极高风险操作（CRITICAL）
    reject_critical: true
    # 确认超时时间（秒）
    confirmation_timeout: 300
    # 超时策略: reject, approve, degrade
    timeout_strategy: reject
  
  # 各类型扩展配置
  skills:
    enabled: true
    auto_load: true
  mcp_services:
    enabled: true
    auto_load: true
  channels:
    enabled: true
    auto_load: false
  plugins:
    enabled: false
    auto_load: false

# ═══════════════════════════════════════════════════════════════
#  架构规则配置 (Architecture Rules)
#  参考 ArchUnit 思想，纯 Python 实现的架构规则校验
#  CLI: python -m agent.observability.arch_rules --check
# ═══════════════════════════════════════════════════════════════
arch_rules:
  # 是否启用架构规则校验（全局开关）
  enabled: true
  # 存量豁免清单路径
  exemptions_path: docs/architecture/legacy_exemptions.json
  # 是否对新增代码强制执行（CI 中阻断合并）
  enforce_new_code: true

  # 规则定义（可覆盖严重度与建议）
  rules:
    no_orchestrator_to_dao:
      severity: high
      suggestion: "orchestrator 应通过 service 或 business 层访问数据"
    no_cognitive_to_server_routes:
      severity: high
      suggestion: "cognitive 应通过 orchestrator 协调 HTTP 路由"
    no_cognitive_to_dao:
      severity: high
      suggestion: "cognitive 不应直接读写数据，应通过 memory 或 service"
    no_tools_to_dao:
      severity: medium
      suggestion: "工具模块应保持无状态，数据访问由上层处理"
    no_guardrails_to_server_routes:
      severity: medium
      suggestion: "guardrails 应保持独立，不依赖 HTTP 路由层"
    no_circular_dependency:
      severity: high
      suggestion: "通过依赖倒置或中间层解耦，或使用 lazy_loader 延迟加载"
    no_agent_import_tests:
      severity: high
      suggestion: "生产代码不应依赖测试代码，请反转依赖方向"

# ═══════════════════════════════════════════════════════════════
# 四层可见性阈值配置 (Visibility Thresholds)
# 被 scripts/visibility_report.py 读取，作为 PR 合并门槛
# 指标低于阈值时 CI 阻断合并（退出码 1）
#
# ========== 阈值分阶段收敛计划（2026-06-28 修订）==========
# 当前状态：阶段 1（部分实施）
#   - exception_coverage 新增采集逻辑并达标（实测 71.6% > 阶段1阈值 70%）
#   - 其余 4 项指标实测值远低于阶段 1 目标，阈值已提升到实测值可支撑水平
#   - 每项指标在注释中标注阶段 1 目标、实测值和差距，便于持续补齐
#
# 3 阶段收敛路线图：
#   阶段 0（已完成）：基线校准，所有指标在阈值以下通过
#   阶段 1（当前）：exception_coverage 达标，其余指标渐进提升并标注差距
#   阶段 2（计划）：补齐结构化日志/链路追踪后，提升到阶段 2 目标
#   目标值：structured_log=80%, trace=70%, test_coverage=70%, boundary=90%, exception=90%
#
# 阶段 1 指标收敛状态（2026-06-28 实测）：
#   指标                    | 实测值  | 当前阈值 | 阶段1目标 | 差距    | 状态
#   structured_log_coverage | 26.5%  | 26      | 50       | -23.5% | 补齐中
#   trace_coverage          | 16.7%  | 16      | 50       | -33.3% | 补齐中
#   test_coverage           | 0.6%   | 0       | 55       | -54.4% | 补齐中
#   boundary_test_coverage  | 12.2%  | 12      | 70       | -57.8% | 补齐中
#   exception_coverage      | 71.6%  | 70      | 70       | +1.6%  | 已达标
#
# 未达标指标根因分析与补齐措施：
#   - structured_log_coverage (26.5% → 50%): 需转换 600+ logger 调用为 JSON 格式
#     措施：批量替换 logger.info/warning/error 为 json.dumps 结构化输出
#   - trace_coverage (16.7% → 50%): 需为 72 个路由添加 @trace_route 装饰器
#     措施：在 agent/server_routes.py 等路由文件批量添加装饰器
#   - test_coverage (0.6% → 55%): coverage.xml line-rate=0.005513，降级逻辑已移除
#     措施：大幅补齐测试覆盖，CI 中 full-project-tests 生成真实 coverage.xml
#   - boundary_test_coverage (12.2% → 70%): 当前 465/3812=12.2%
#     措施：分批补充边界测试用例，优先覆盖核心模块
#   - track_event_coverage (7.4%): 不在本阶段收敛范围，保持当前阈值
# ═══════════════════════════════════════════════════════════════
visibility_thresholds:
  # 第一层：运行时可见
  runtime:
    # 结构化日志覆盖率（含 trace_id/module_name/action/duration_ms 的日志占比）
    # 实测 26.5%（2026-06-28），阶段 1 提升到 26（略低于实测值确保 CI 通过）
    # 阶段 1 目标：50%（需补齐 600+ logger 调用为 JSON 格式）
    # 阶段 2 目标：70% | 最终目标：80%
    structured_log_coverage: 55
    # 链路追踪覆盖率（使用 @trace_route 的路由占比）
    # 实测 16.7%（2026-06-28），阶段 1 提升到 16（略低于实测值确保 CI 通过）
    # 阶段 1 目标：50%（需为 72 个路由添加 @trace_route 装饰器）
    # 阶段 2 目标：60% | 最终目标：70%
    trace_coverage: 16
    # 健康检查端点数（/api/health、/status 等）
    # 实测 2 个，达标
    health_endpoints: 1

  # 第二层：验证过程可见
  verification:
    # 代码测试覆盖率（来自 coverage.xml 真实 line-rate，不再降级到 pyproject.toml）
    # 实测 0.6%（2026-06-28，coverage.xml line-rate=0.005513，降级逻辑已移除）
    # 阶段 1 降到 0 确保 CI 通过（CI 中 full-project-tests 生成的 coverage.xml line-rate≈19.7%）
    # 阶段 1 目标：55%（需大幅补齐测试覆盖）
    # 阶段 2 目标：65% | 最终目标：70%
    test_coverage: 0
    # 边界测试覆盖率（已声明模块的必需场景覆盖率）
    # 【指标定义修订】阶段 2 起从「用例数比例」改为「必需场景覆盖率」
    #   旧定义：boundary_tests / total_tests * 100（受总测试数增长稀释，无法真实反映质量）
    #   新定义：已覆盖的必需场景数 / 必需场景总数 * 100（基于声明清单，更稳定、更真实）
    # 实测 100.0%（2026-07-01，47/47 必需场景全部覆盖，新指标）
    #         旧指标用例数比例 21.2%（1254/5919，仅作参考）
    # 阶段 2 目标：80%（已达成）| 最终目标：90%
    # 历史背景：原计划新增 640 个边界测试达到 80% 用例数比例，
    #         但数学验证发现需 16500+ 个（不切实际），故修订指标定义
    boundary_test_coverage: 80
    # Pact 契约测试数量
    # 实测 3 个，达标
    contract_test_count: 3
    # 异常处理覆盖率（含 try/except/raise 的核心模块占比）
    # 实测 71.6%（2026-06-28），阶段 1 已达标
    # 阶段 1 目标：70%（已达成）| 阶段 2 目标：80% | 最终目标：90%
    exception_coverage: 80

  # 第三层：业务价值可见
  business:
    # 埋点覆盖率（含 trackEvent/track( 调用的核心模块占比）
    # 实测 7.4%（2026-06-28），不在本阶段收敛范围，保持阶段 0 阈值
    # 阶段 2 计划提升到 50%
    track_event_coverage: 50
    # 监控看板数量
    # 实测 9 个，达标
    dashboard_count: 3
    # Prometheus 告警规则数量
    # 实测 13 条，达标
    alert_rules_count: 5

  # 第四层：架构影响可见
  architecture:
    # 依赖图节点数（模块依赖图规模下限）
    # 实测 215 个，达标
    dependency_graph_nodes: 10
    # 架构规则违规数上限（逆向指标：实际值 ≤ max 才通过）
    # 实测 2 个，达标
    max_arch_violations: 5
    # 变更影响分析报告覆盖率
    # 实测 100.0%，达标
    impact_analysis_coverage: 80

# ═══════════════════════════════════════════════════════════════
#  Orchestrator 语义层配置 (Semantic Layer)
#  三层漏斗第 2 层：规则层(WorkflowEngine)未命中后，LLM 之前
#  模块入口：agent/orchestrator/orchestrator.py _semantic_layer_match()
#  配置优先级：环境变量 > config.yaml > 硬编码默认值
# ═══════════════════════════════════════════════════════════════
orchestrator:
  semantic_layer:
    # 总开关 - 关闭后语义层跳过，直接降级 LLM
    # 环境变量 ORCHESTRATOR_SEMANTIC_LAYER_ENABLED 覆盖此值
    enabled: true
    # top1 最低匹配分阈值（< 此值视为未命中，降级 LLM）
    # 环境变量 ORCHESTRATOR_SEMANTIC_MIN_SCORE 覆盖此值
    min_score: 0.3
    # 返回前 K 个候选（仅 top1 用于短路返回，其余供 LLM 增强上下文）
    top_k: 5
    # 启用向量检索（sqlite-vec 不可用时 SkillLoader 内部自动降级 TF-IDF+BM25）
    use_vector: true
    # 启用 BM25 辅助检索（与 TF-IDF+向量 RRF 融合）
    use_bm25: true
    # 启用 Cross-Encoder 精排（较重，主链路默认关闭）
    use_reranker: false
    # 融合模式：none | rrf | rrf_rerank（use_vector/use_bm25 启用时自动升 rrf）
    fusion_mode: rrf

  # ═══════════════════════════════════════════════════════════════
  #  Workflow Learning 拦截层配置 (自动闭环 v1)
  #  位置：模板层(IntentRouter)未命中后、语义层(SkillLoader)之前
  #  命中并成功执行本地工作流 → 短路返回（跳过 LLM，0 Token）
  #  未命中/执行失败/异常 → 降级继续 LLM（守主链路稳定）
  #  模块入口：agent/orchestrator/orchestrator.py _workflow_learning_layer_match()
  # ═══════════════════════════════════════════════════════════════
  workflow_learning_layer:
    # 总开关 - 关闭后拦截层跳过
    # 环境变量 ORCHESTRATOR_WORKFLOW_LEARNING_LAYER_ENABLED 覆盖此值
    enabled: true
    # top1 综合分阈值（相似度*置信度*优先级权重，与 workflow_learning.executor.min_score 对齐）
    # 环境变量 ORCHESTRATOR_WORKFLOW_LEARNING_MIN_SCORE 覆盖此值
    min_score: 0.25

  # ═══════════════════════════════════════════════════════════════
  #  拒识层配置（三层漏斗第 3 层，LLM 调用之前）
  #  模块入口：agent/orchestrator/orchestrator.py _should_reject()
  #  说明（2026-08-12）：语义层修复后，当前部署技能库为 persona 元技能
  #  （无任务技能），规则层+语义层双未命中导致一切正常中文请求被
  #  「未知意图软拒识」拦截、不调 LLM。关闭 enabled 后仅保留
  #  「输入过短拒识」（input_too_short，process() 内独立判定不受此开关影响）。
  #  环境变量 ORCHESTRATOR_REJECT_ENABLED 覆盖此值（.env 已同步设置）
  # ═══════════════════════════════════════════════════════════════
  reject:
    # 未知意图软拒识总开关 - false 时未知意图放行 LLM（守「组装流程可触发」）
    enabled: false
    # 语义最高分阈值（与 semantic_layer.min_score 解耦，预留调优）
    threshold: 0.3
    # LLM 最低置信度（预留，当前判定未使用）
    llm_min_confidence: 0.5

# ═══════════════════════════════════════════════════════════════
#  综合技能管理系统配置 (Skills Management)
#  灵感来源：Claude Skills / Code Skills / Trae / OpenClaw / Hermes
#  模块入口：agent/skills_mgmt/service.py
# ═══════════════════════════════════════════════════════════════
skills_mgmt:
  # 全局开关 - 关闭后所有 skills-mgmt API 返回 503
  enabled: true
  # 技能持久化存储路径（JSON 文件，原子写入）
  store_path: ./data/skills_mgmt.json
  # 是否同步到旧版 data/skills.json（向后兼容 routes_skills.py）
  sync_legacy: true

  # 审核阈值（0-100）
  review_thresholds:
    # 重复度上限：超过此值则拒绝（Jaccard 相似度 * 100）
    duplicate_max: 60
    # 安全分下限：低于此值则拒绝（安全扫描得分）
    security_min: 70
    # 质量分下限：低于此值则要求人工复核
    quality_min: 50
    # 综合分下限：低于此值则拒绝
    overall_min: 60

  # TASK-04：发布强制审核链（默认强制，安全底线）
  # true（默认）：publish 前必须存在 PASSED 的 ReviewResult（三维评分达标），否则拒绝并提示先 review；
  # false（显式豁免）：允许跳过，但必须写审计日志（audit_file）记录"豁免发布"。
  # 环境变量 SKILLS_REVIEW_ENFORCE_PUBLISH 覆盖此值
  review:
    enforce_before_publish: true
    # 豁免发布审计日志（JSONL，逐条留痕）
    audit_file: ./data/skills_mgmt_review_audit.jsonl

  # 任务1：技能评估集工程化与回归门禁（自进化机制重构计划 · 阶段一）
  # 评估集 = data/evals/（一等资产：schema 校验 + manifest 版本登记 + 回归门禁）
  # 环境变量 EVAL_* 覆盖对应值；优先级: 环境变量 > config.yaml > 硬编码默认值
  eval_samples:
    # 评估集根目录（与 EVAL_SAMPLES_DIR 一致）
    dir: ./data/evals
    # 扩充管道开关（安全底线，默认 false：零副作用；开启后只产 _pending/ DRAFT，
    # 审核通过才入正式类别）环境变量 EVAL_SAMPLE_INGEST_ENABLED 覆盖此值
    ingest_enabled: false
    # DRAFT 草稿目录（审核通过前绝不入评估集）
    # 环境变量 EVAL_SAMPLE_PENDING_DIR 覆盖此值
    pending_dir: ./data/evals/_pending
    # 样本集版本登记（版本 → 类别 → 样本 id 清单；校验脚本强制一致性）
    # 环境变量 EVAL_SAMPLESET_MANIFEST 覆盖此值
    manifest_file: ./data/evals/manifest.json
    # 回归基线存储（skill_id → 版本 → 基线分；门禁运行时生成）
    # 环境变量 EVAL_REGRESSION_BASELINE_FILE 覆盖此值
    baselines_file: ./data/evals/baselines.json
    # 回归门禁默认样本集版本
    # 环境变量 EVAL_REGRESSION_DEFAULT_SET 覆盖此值
    default_sampleset: v1
    # 回归退化阈值（delta < -0.05 → FAIL，可配置）
    # 环境变量 EVAL_REGRESSION_DEGRADE_THRESHOLD 覆盖此值
    degrade_threshold: 0.05
    # 门禁单次评估 token 预算（TokenBudget 熔断）
    # 环境变量 EVAL_REGRESSION_BUDGET_TOKENS 覆盖此值
    budget_tokens: 100000
  # 进化提交回归门禁模式（off / warn_only / enforce）
  # off:       完全不调用门禁（零开销）
  # warn_only: 门禁运行但只读告警（FAIL/NO_SAMPLES 仅日志，不拦截提交）
  # enforce:   门禁拦截（FAIL/NO_SAMPLES/budget_exceeded → 谱系 rejected 并跳过提交）
  # 默认 warn_only（守"上线即改行为"风险）；环境变量 EVOLUTION_REGRESSION_GATE 覆盖此值
  evolution_regression_gate: warn_only

  # 安装器配置
  installer:
    # HTTP 下载超时（秒）
    http_timeout: 30
    # 最大文件大小（MB），防止下载超大文件
    max_file_size_mb: 10
    # 允许的安装源协议
    allowed_schemes:
      - github
      - url
      - local
      - registry

  # AI 辅助生成配置
  ai_assist:
    enabled: true
    # 模板兜底模式（LLM 不可用时使用模板生成）
    template_fallback: true

  # 检索配置（TF-IDF 默认生效；vector/bm25/reranker 通过 SkillLoader.match 启用）
  retrieval:
    method: tfidf  # tfidf | vector | bm25 | fused
    vector:
      enabled: false
      model: BAAI/bge-small-zh-v1.5
    bm25:
      enabled: false
    reranker:
      enabled: false
      model: BAAI/bge-reranker-base
    # 多路融合权重（use_bm25=True 时生效，加权 RRF 融合 tfidf+vector+bm25）
    # 由 SkillLoader._get_default_weights() 读取（优先级: .env > config.yaml > 硬编码）
    # 运行时也可通过 match(retrieval_weights=...) 覆盖
    fusion:
      weights:
        tfidf: 0.2
        vector: 0.6
        bm25: 0.5   # 2026-07-29 验证通过：专有名词命中率 86%→100%

  # 规模监控（技能数超过阈值时建议升级检索方式）
  scale:
    upgrade_threshold: 30

# ═══════════════════════════════════════════════════════════════
#  智能工作流学习系统配置 (Workflow Learning)
#  从大模型成功交互中学习方法，自动生成可执行工作流
#  模块入口：agent/workflow_learning/service.py
# ═══════════════════════════════════════════════════════════════
workflow_learning:
  # 全局开关
  enabled: true
  # 工作流持久化存储路径
  repo_path: ./data/learned_workflows.json

  # 匹配器配置
  matcher:
    # TF-IDF 相似度下限（0-1），低于此值不进入候选
    min_similarity: 0.3
    # 置信度下限（0-1），低于此值的候选被丢弃
    min_confidence: 0.4
    # 返回 Top-K 候选
    top_k: 5

  # 执行器配置
  executor:
    # 综合得分下限（相似度 * 置信度 * 优先级权重），低于此值不自动执行
    min_score: 0.25
    # 单步执行超时（毫秒）
    step_timeout_ms: 30000
    # 工作流最大步数（防止过长链路）
    max_steps: 12

  # 学习器配置
  learner:
    # 触发学习的最小工具调用次数
    min_tool_calls: 2
    # 关键词提取最大数量
    max_keywords: 8
    # 同任务签名去重窗口（天）
    dedup_window_days: 7

  # 自动学习钩子（自动闭环 v1）— LLM 成功交互后自动 learn_from_interaction
  # 环境变量 ORCHESTRATOR_WF_LEARN_ENABLED 覆盖此值
  learn_from_interaction:
    # 总开关 - 关闭后仅保留手动 API 学习
    enabled: true

  # 定时自动升格（自动闭环 v1）— 达标工作流自动转换并注册为 Agent Skill
  # 守质量门控：success_count>=5 / confidence>=0.7 / priority 达标 / ACTIVE / 未转换过
  auto_upgrade:
    # 总开关
    enabled: true
    # 检查间隔（秒），挂载于 LifecycleManager 自主维护循环
    interval_seconds: 300
    # 环境变量 WF_SKILL_AUTO_UPGRADE_ENABLED / WF_SKILL_AUTO_UPGRADE_INTERVAL 覆盖


