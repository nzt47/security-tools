# ════════════════════════════════════════════════════════════════════════════════
#  config.yaml 的**接线状态**说明（2026-10-03 复核，方法见 docs/closeout/交付报告_20261003.md §12）
#
#  这份文件**不是**统一配置源，也**不是**死文件，而是**部分接线**：
#   · 中心配置 config.py（Config / ConfigModel）**从不解析 YAML** —— 取值链只有
#     DEFAULT → 环境变量 → overrides；memory / planning / behavior / features 等节在运行态
#     来自**代码常量**，改本文件对它们无效。
#   · 另有一批子系统**各自直读**本文件（env > config.yaml > 代码默认），改了就生效：
#     autonomy.* / retention.* / slo_report.* / learning.*（budget、sensor_learning、evolver、
#     lifecycle、precipitate、feedback_agent、experience_persist）/ skills_mgmt.*（assess、cleanup、
#     scale）/ features.* / orchestrator.*（semantic_layer、reject、workflow_learning_layer、learning）/
#     planning.wire_* / llm.model、llm.fallback_chain / workflow_learning.matcher / arch_rules.* /
#     verification.output_validator.*
#   · 开关中心 agent/settings/resolver.py 也是真读本文件（只读、按 mtime 缓存、**永不写**）；
#     登记表里 121 个键声明了 config_path，实测当前 64 个由 config 层供值。
#   · 未核实到直读点的段：session / logging / extensions / visibility_thresholds / tools
#     —— 需要以它们为准之前，请先按 §12 的方法核实，不要凭段落名推断。
#
#  结论：要改「上下文/内存三旋钮」请用界面或环境变量（见 memory 段顶部横幅），
#        改本文件对它们**无效**。
# ════════════════════════════════════════════════════════════════════════════════
memory:
  # ⚠️【2026-10-03 复核结论：本段目前**没有任何运行时读取点**，改它不生效】
  #   · 中心配置 config.py（Config / ConfigModel）的取值链是 DEFAULT → 环境变量 → overrides，
  #     **从不解析 YAML**（源码内无 `import yaml`；本文件只被部分子系统**各自直读**）；
  #   · 实测：把 agent.settings.resolver.read_config_yaml 谎报成 {'memory':{'token_limit':65536}}，
  #     Config().get('memory')['token_limit'] 仍返回 131072；而 Config(overrides=...) 注入即时生效
  #     —— 面板/接口改的就是后一条（运行时覆盖，重启回落**代码默认值**）。
  #   ⇒ 本段（含 token_limit）**只是意图文档**；真正的口径是 config.py 的
  #     MEMORY_TOKEN_LIMIT_DEFAULT / PER_MESSAGE_*_LIMIT_DEFAULT 常量，可被环境变量或运行时覆盖。
  #   守门用例：tests/unit/test_config_yaml_wiring.py（若将来有人把本段接进运行时，它会红，
  #   提示同步更新此处说明与 plugins/memory.py 的 RESTART_FALLBACK_NOTE）。
  max_tokens: 8000
  enable_long_term: false
  summary_threshold: 5000
  retention_days: 30
  # ── 记忆压缩触发上限 + 编排窗口（2026-09-13 立规，2026-10-02 用实测数据收口）──
  # 语义：最近 200 条消息的 token 合计 ≥ token_limit × 0.8 时触发一次压缩
  #      （`memory/memory_manager.py:286,428` + `memory/summarizer.py::should_compress`）；
  #      同时它就是**编排窗口**本身 —— `get_context(token_limit=...)` 用它决定
  #      "超限丢最旧消息"的边界。所以本键**一个值管两件事**（压缩触发 + 组装窗口）。
  #
  # 【2026-10-03 更正来源】原注释写"`lifecycle_manager.py:283-289` 读本键写入
  #   `orchestrator._memory_token_limit`" —— **与实现不符**：该处取的是 config.py 的常量
  #   （`MEMORY_TOKEN_LIMIT_DEFAULT`）与环境变量，**不读本文件**。保留本键是为了留下
  #   决策依据（见下），但请勿据此认为改它有效。
  #
  # 【为什么显式写出来】此前**没有这个键** ⇒ 代码取硬编码默认 4096，触发点仅 ≈3276。
  # 而一次大工具输出（如 `list_directory` 返回 195 项）就约 14k tokens
  # ⇒ **每次大工具输出都必然触发一次压缩**：既产生额外 LLM 摘要调用（钱+延迟），
  #   又把**刚拿到的上下文压掉**（2026-09-13 实测"真机一次会话压缩 5 次"即源于此）。
  #
  # 【2026-10-02：原定"先实测模型真实窗口"已完成，故 32768 → 131072】
  # 实测（`GET https://api.deepseek.com/v1/models`，本机 provider 直答）：
  #   deepseek-flash = DeepSeek-V4.1-Flash，context_window=1048576、
  #   max_output_tokens=393216；并用 max_tokens=200000 的请求实测被接受（HTTP 200）。
  # 于是原注释里两条顾虑都不再成立：
  #   ① `config.py` 校验器的 512..32768 值域已放宽到 512..1048576（否则本键根本写不进去）；
  #   ② "窗口从未验证过"已由上面的实测回答，131072 只是模型的 **1/8**，不构成超窗风险。
  # 取 131072（而非直接吃满 1M）是成本取舍：窗口每 ×4，每轮 prompt 上限也 ×4。
  # 【仍未做（保留立项）】把**工具结果**从压缩触发口径里单独计量 ——
  #   否则"一次大工具输出 = 一次压缩"的行为不变。
  token_limit: 131072
behavior:
  default_mode: NORMAL
  allow_reflection: true
  max_iterations: 10
  response_timeout: 60
planning:
  # D7 修复：规划引擎接入生产配置（原 false 使引擎"已建未用"）
  # orchestrator 聊天主链路依此开启 planning 分支（lifecycle_manager 读取）
  enabled: true
  max_depth: 5
  timeout_seconds: 30
  enable_chain_of_thought: false
  # TASK-01：规划引擎接入主链路（D7 接线灰度开关）
  # 默认 false（灰度）；true 时复杂任务走 PlanningCore.chat()，异常自动回退 LLM
  # 环境变量 PLANNING_WIRE_ENABLED 覆盖此值（优先级: 环境变量 > config.yaml > 硬编码默认值）
  wire_enabled: false
  # 触发规划的最低复杂度：TRIVIAL / SIMPLE / NORMAL / COMPLEX（复用 enhanced_planner 语义）
  # 环境变量 PLANNING_WIRE_MIN_COMPLEXITY 覆盖此值
  wire_min_complexity: COMPLEX
  # 规划调用超时（秒），超时回退 LLM
  # 环境变量 PLANNING_WIRE_TIMEOUT_SECONDS 覆盖此值
  wire_timeout_seconds: 30
  # D9 规格：SQLite 持久化（默认 data/plans/plans.db；首次启动自动迁移旧 JSON 检查点）
  persist_dir: data/plans
  persist_db: data/plans/plans.db
  # 阶段 3：高优先级任务失败时重规划（Plan B）开关（false 时保持原中断行为）
  replan_on_failure: true
  # 阶段 3：ask_user 等待用户确认超时（秒），超时自动以"用户未确认"结束
  ask_user_timeout_seconds: 300
  # 阶段 3：多维预算（budget.enabled=false 可整体关闭；各维度缺省 = 不限制）
  budget:
    enabled: true
    max_seconds: 30
    token_price_per_1k: 0.002
llm:
  provider: openai
  model: gpt-4
  temperature: 0.7
  max_tokens: 2000
  api_key: ${OPENAI_API_KEY}
learning:
  # TASK(集成): ContextAssembler 旁路注入（D2D3 替代方案 CEL 框架）
  # 观察模式已开启（2026-08-12，集成验证通过后）：system prompt 追加三层记忆组装产物；
  # 组装任何异常均静默降级，主链路零影响。环境变量 LEARNING_CONTEXT_ASSEMBLER_ENABLED 可覆盖
  context_assembler:
    enabled: true
    token_budget: 3000
    # ── 经验库注入（方案「把 DSH 的历史会话提炼成经验库」P4）──
    # 【安全底线 · 默认关】开启会**改变 system prompt 组成**（尾部追加【相关经验】段），
    # 属通用硬约束"既有公开行为不变"的例外，故必须由部署侧显式打开。
    # 环境变量 CP_EXPERIENCE_INJECT_ENABLED=1/0 覆盖此值。
    #
    # 开启前请确认：
    #   1) 语料已就位：data/experience/samples.ndjson（由 yunshu learn extract 产出）；
    #   2) 已跑过 yunshu learn eval；
    #   3) 已按 设计思路/人工抽检操作手册.md 做过人工抽检（这是唯一能判断
    #      "注入内容是否真有用"的手段，自动指标做不到）。
    #
    # ⚠️⚠️ 【2026-09-27 决策记录 · 开启前必读】⚠️⚠️
    #   相关性下限（CP_EXPERIENCE_MIN_SCORE，默认 30）的标定依据**已被独立复核证伪**：
    #     原以为"正题 36.4~363.0 / 负题 8.9~24.9 完全可分"，实为**查询长度差异**
    #     —— BM25 原始分是查询词上的求和、不做长度归一；同一份语料、同一个期望条目，
    #     只把查询截短就跌破阈值（实测 8 词元 71.92 → 4 词元 24.02 → 2 词元 7.34）。
    #     真实自然提问分布 7.4~19.3，落在离题提问 8.9~24.9 的**内部**
    #     ⇒ **不存在任何单一阈值能同时放行自然提问与拦截离题提问**。
    #
    #   因此当前配置的**实际效果**是：本开关即便打开，对真实短提问也会判"未命中"、
    #   **注入恒空（开了等于没开）**；而 eval 报的 recall@5=100% 来自"查询与文档同源"
    #   的题集，**不可外推**。
    #
    #   【2026-09-27 二次复核：三条路线全部实测否决 —— 本开关**确定保持关**】
    #     复核脚本都在 eval/，可重跑：
    #       A. 分数长度归一        → 只治标，文档侧偏置仍在（未消除）
    #       B. 改用向量余弦做闸门   → **实测余弦全挤在 0.45~0.58**，正例（0.518~0.656）
    #                                与离题（0.521~0.578）重叠；且开启向量腿后 top1 常被
    #                                "两腿都上榜但 BM25 更低"的条目顶掉 ⇒ 比不开更差
    #       C. 取消闸门总是注入     → eval/gate_feasibility.py 测 7 个信号，
    #                                **无一 AUC>=0.80**（最佳 logcontrast 0.698；
    #                                raw 0.573 / gap 0.399 / cluster 0.537）
    #     更关键的一条：原始 BM25 分与"有没有用"是**负相关**——
    #       去重语料上有同族兄弟的查询 top1 中位数 53.1，无同族的反而 392.0。
    #       因为 48.1% 的样本 task>=800 字（子代理任务书/提示词堆），长文档天然攒分。
    #       ⇒ 闸门不是"没标定好"，而是**方向就是反的**，不存在调参出路。
    #
    #   【检索质量本身（eval/loo_dedup.py，真值=改动文件集 Jaccard>=0.5）】
    #       排除同任务指纹副本：recall@1 9.4% / recall@5 31.2% / MRR@10 0.188（n=32）
    #       不排除（生产实况）：recall@1 47.4% / recall@5 73.7%（n=114）
    #     两个数都记在案。**但 n 太小（32~114），不足以支撑打开自动注入。**
    #
    #   【本次决定：维持 false，并给出复评条件】
    #     1) 语料增长后（建议 >=2000 条唯一任务）重跑 eval/loo_dedup.py 与
    #        eval/gate_feasibility.py，以同一真值对比；
    #     2) 若届时仍无 AUC>=0.8 的信号，则应放弃"自动注入"，改为**显式工具**
    #        （模型自己决定何时回忆相似经验），把"干不干净"的判断权交还给调用方；
    #     3) 已完成的语料修复：extract 增加"同任务+同文件集"去重（实测 505→484）。
    #     依据仍是方案硬约束⑤「宁可少，不要脏」—— 在判不了命中时开启，等于每轮
    #     往 system prompt 尾部塞不确定内容。
    experience_enabled: false
    # 注入条数上限（方案要求 top-3~5）。路线 C 若被采纳，建议收到 2 条。
    experience_top_k: 3
    # 是否启用向量腿。**默认 false**：启用需加载 BGE-m3（冷启动约 16s，模型 4.25GB），
    # 不适合放在编排热路径。注意：向量余弦对自然提问与离题提问同样**不可分**
    #（实测相关 0.518~0.656 vs 离题 0.521~0.578），故它也**不是**路线 A 的替代。
    experience_use_vector: false
  # TASK-02：反思产物写入检索面开关（观察模式）
  # 默认 false（观察）：self_reflect 保持现状仅写内存/日志；true 时才额外写入向量检索面
  # 环境变量 LEARNING_REFLECTION_PERSIST 覆盖此值
  reflection_persist: true
  # TASK-02：规划经验/教训落盘开关（观察模式）
  # 默认 false（观察）：execute_plan 收尾仅记录调用意图日志；true 才实际调 learn_from_experience 落盘
  # 环境变量 LEARNING_EXPERIENCE_PERSIST 覆盖此值
  experience_persist: false
  # TASK-03：学习动作成本预算护栏（把 configs/models.yaml cost_limits 从"声明"变为"可执行"）
  # mode=warn_only（默认，宽松）：超限仅记录 WARNING 不拦截，防止上线即改行为；
  # mode=enforce：超过单次上限/日预算的学习动作被拒绝并告警（LearningBudgetExceeded）
  # 优先级：环境变量 > config.yaml > models.yaml cost_limits > 硬编码默认值
  budget:
    mode: warn_only
    max_single_action_tokens: 4000
    max_daily_tokens: 1000000
    recovery_seconds: 3600
  # TASK-04：知识→技能沉淀管道调度开关（安全底线，默认关闭）
  # 默认 false：不注册 memory_abstractor 定时沉淀任务；true 才注册（产物仅 DRAFT+审计+KPI，绝不自动注册）
  # 环境变量 LEARNING_PRECIPITATE_ENABLED 覆盖此值
  precipitate_enabled: false
  # TASK-04：沉淀定时任务间隔（小时），默认 24（每日一次）
  # 环境变量 LEARNING_PRECIPITATE_INTERVAL_HOURS 覆盖此值
  precipitate:
    interval_hours: 24
    # 沉淀草稿审计日志（JSONL，质量门控通过的草稿逐条留痕）
    audit_file: ./data/precipitate_audit.jsonl
  # TASK-05：反馈建议自动执行体调度开关（安全底线）
  # true：注册每日反馈建议执行任务（默认 dry-run 只预演，正式写操作需
  # dry_run=false；正式执行前 bump_version 打快照可回滚，动作写审计日志）
  # 环境变量 LEARNING_FEEDBACK_AGENT_ENABLED 覆盖此值
  feedback_agent:
    enabled: true
    # 反馈建议执行任务间隔（小时），默认 24（每日一次）
    interval_hours: 24
    # dry-run 默认 true（不可变约束：默认不产生任何写操作/状态变更）
    dry_run: true
    # 反馈动作审计日志（JSONL：skill_id/action/原因/结果/快照版本）
    audit_file: ./data/feedback_agent_audit.jsonl
  # TASK-05：offline_evolver 周期进化调度开关（安全底线）
  # true：注册周级进化任务（每周一次，默认 dry-run 只预演候选；提交门槛
  # 保持 improvement>=0.05，产 BatchEvolutionReport 审计 + 进化采纳率 KPI）
  # 环境变量 LEARNING_EVOLVER_ENABLED 覆盖此值
  evolver:
    enabled: true
    # 周期进化间隔（天），默认 7（每周一次）
    interval_days: 7
    # dry-run 默认 true（不可变约束：默认零提交/零 KPI/零审计）
    dry_run: true
    # 周期进化批次审计日志（JSONL：BatchEvolutionReport 摘要）
    audit_file: ./data/evolution_schedule_audit.jsonl
  # TASK-05：Skill 生命周期自动淘汰开关（安全底线）
  # true：注册每日生命周期检查任务（零使用 N 天判定器：PUBLISHED 闲置超
  # unused_days → DEPRECATED；DEPRECATED 闲置超 archive_days → ARCHIVED；
  # 默认 dry-run 只报告不迁移，仅状态迁移不删文件）
  # 环境变量 LEARNING_LIFECYCLE_ENABLED 覆盖此值
  lifecycle:
    enabled: true
    # 生命周期检查任务间隔（小时），默认 24（每日一次）
    interval_hours: 24
    # PUBLISHED 闲置天数超阈值 → DEPRECATED（默认 90）
    unused_days: 90
    # DEPRECATED 闲置天数超阈值 → ARCHIVED（默认 180）
    archive_days: 180
    # dry-run 默认 true（不可变约束：默认不迁移/不写审计）
    dry_run: true
    # 生命周期迁移审计日志（JSONL：skill_id/from_status/to_status/闲置天数）
    audit_file: ./data/skill_lifecycle_audit.jsonl
  # TASK-06：感知侧新颖性学习管道开关（安全底线，默认开启——2026-08-14 由观察模式转入正式采集）
  # true（正式采集）：低/中置信 NoveltyEvent → 记忆（novelty_memory.jsonl），高置信 → 审计 + 建议草稿
  # （novelty_suggestions/，仅 DRAFT，绝不注册技能——供 TASK-04 审核链消费）
  # false（观察模式）：ChangeDetector/行为漂移全链路零学习副作用（仅既有日志）
  # 环境变量 SENSOR_LEARNING_ENABLED 覆盖此值
  sensor_learning:
    enabled: false
    # 行为漂移判定阈值（周级基线相对偏差均值；默认 0.3）
    # 环境变量 SENSOR_LEARNING_DRIFT_THRESHOLD 覆盖此值
    drift_threshold: 0.3
    # 行为基线保留周数（~/.Yunshu/baselines/behavior_<周一日期>.json 滚动清理；默认 8）
    # 环境变量 SENSOR_LEARNING_BASELINE_RETENTION_WEEKS 覆盖此值
    baseline_retention_weeks: 8
    # change_log.json 容量上限（~/.Yunshu/changes/，超出滚动删除最旧；默认 10000）
    # 环境变量 SENSOR_LEARNING_CHANGE_LOG_MAX_ENTRIES 覆盖此值
    change_log_max_entries: 10000
    # 建议草稿目录（高置信事件，仅 DRAFT，供 TASK-04 审核链消费）
    # 环境变量 SENSOR_LEARNING_DRAFT_DIR 覆盖此值
    draft_dir: ./data/learning/novelty_suggestions
    # 学习审计日志（JSONL：事件分类/分级/落点）
    # 环境变量 SENSOR_LEARNING_AUDIT_FILE 覆盖此值
    audit_file: ./data/learning/novelty_audit.jsonl
    # 事件记忆目录（JSONL：novelty_memory.jsonl，event=novelty_event 标签）
    # 环境变量 SENSOR_LEARNING_MEMORY_DIR 覆盖此值
    memory_dir: ./data/learning/novelty_memory
  # 任务6：轻量自我进化机制（失败案例回流 + 修复策略库 + 参数联动）
  # 裁剪替代 FATE：无任何训练/微调管线，纯提示词/策略级进化闭环
  # 环境变量 EVOLUTION_ENABLED 覆盖此值
  evolution:
    enabled: true
    # 可选 LLM 候选生成开关（默认开；无 LLM 环境自动降级为规则候选）
    # 环境变量 EVOLUTION_LLM_GENERATE 覆盖此值
    llm_generate: true
    # 策略库/失败案例存储目录
    # 环境变量 EVOLUTION_STORAGE_PATH 覆盖此值
    storage_path: ./data/evolution
tools:
  enabled: true
  timeout: 30
  whitelist:
  - web_search
  - calculator
  - file_read
  - code_execute
# TASK-07：L1-L5 行为自主权分级（聚合视图 + 上下文注入，不改既有机制）
# 分级表见 docs/zh/智能体学习机制重构计划/变更说明/TASK-07_变更说明.md §3；
# 只映射/聚合 permission_system / circuit_breaker / graceful_degrade，不改变其判定语义
# 优先级: 会话级 set_session_level > 环境变量 AUTONOMY_DEFAULT_LEVEL > 本配置 > 默认 L3
autonomy:
  default_level: L3
  # 按等级覆盖策略（键为 L1-L5，值为 LevelPolicy 字段的 dict 子集）
  # 例: per_level_policy: {L2: {confirmation_scope: all}}
  per_level_policy: {}
session:
  auto_save: true
  save_interval: 300
  max_history: 1000
features:
  v2_lifetrace: true
  v2_persona: true
  v2_distillation: false
  v2_lazy_loader: true
  # 验证工程总开关（灰度发布）
  verification_enabled: false
  # Schema 输出校验开关
  schema_validation_enabled: false
  # Critic 质量评审开关
  critic_evaluation_enabled: true
  # 失败分析归档开关
  failure_analysis_enabled: false

  # ── 【TASK-03 · 2026-09-18 阶段特性开关族】──────────────────────────────
  # 本段是"能力层重构"各阶段的**灰度开关**：默认全部 false ⇒ 重构代码即使
  # 已合并也不改变现网行为，可随时翻 true 做灰度、翻回 false 一键回退
  # （读路径每次重新求值，**不需要重启**，见 agent/settings/feature_flags.py）。
  # 统一求值入口：agent.settings.feature_flags.feature_enabled("<name>")；
  # 环境变量覆盖：YUNSHU_FEATURE_<NAME> / YUNSHU_FEATURE_<NAME>_ROLLOUT。
  # 规范：docs/rfc/特性开关规范.md；守卫：tests/unit/test_feature_flags.py。
  # 注意：这些开关对应的功能**尚未实现**——它们先是"登记 + 守卫跑通"，
  #   真正的接线由 TASK-04~08 各自完成（每个任务只允许开自己的那一个）。
  capability_spec_v2: false            # TASK-04 能力规格 v2 字段集
  capability_registry: false           # TASK-05 能力统一 Registry
  capability_non_llm_entry: false      # TASK-05 非 LLM 入口（默认 10% 灰度）
  tool_confirm_levels: false           # TASK-06 工具侧 L0-L3 确认分级
  sandbox_unified: false               # TASK-07 安全接线统一收口
  hot_path_load_tool_meta_cache: false # TASK-08 load_tool_meta 热路径缓存（P0-1）

# ═══════════════════════════════════════════════════════════════
#  验证工程配置 (Verification Engineering)
# ═══════════════════════════════════════════════════════════════
verification:
  # 全局开关 - 开启保守模式
  enabled: true
  # 灰度发布比例 (0-100) - 10% 流量启用验证
  rollout_percentage: 10
  # 保守模式（仅记录日志，不阻断流程）
  conservative_mode: true
  
  # Schema 输出校验配置
  schema_validation:
    enabled: true
    # 是否启用重试
    enable_retry: true
    # 最大重试次数
    max_retries: 3
    # 严格模式（校验失败直接返回错误）- 保守模式下为 false
    strict_mode: false
    # 支持的输出类型
    supported_types:
      - text_response
      - tool_call
      - summary_report
      - error_message
  
  # Critic 质量评审配置
  critic_evaluation:
    enabled: true
    # 评审模式: rule_based, llm_based
    mode: rule_based
    # 通过阈值 (0-100)
    threshold: 70
    # 是否启用重试
    enable_retry: true
    # 最大重试次数
    max_retries: 2
    # 各维度权重
    dimension_weights:
      factual_accuracy: 0.25
      completeness: 0.25
      relevance: 0.20
      logic: 0.15
      clarity: 0.15
    # LLM 评审模型配置（mode=llm_based 时使用）
    llm_config:
      model: gpt-4
      temperature: 0.3
      max_tokens: 1000
  
  # 失败分析与归档配置
  failure_analysis:
    enabled: true
    # 存储路径
    storage_path: ./data/failures
    # 自动分类
    auto_classify: true
    # 保留天数
    retention_days: 90
    # 是否生成优化建议
    generate_suggestions: true
  
  # 人工确认（HITL）配置
  human_in_the_loop:
    enabled: true
    # 低风险操作自动批准
    auto_approve_low_risk: true
    # 高风险操作需人工确认
    require_confirmation_for_high_risk: true
    # 确认超时时间（秒）
    confirmation_timeout: 300
    # 超时策略: reject, approve, degrade
    timeout_strategy: degrade
  # TASK-07：输出验证门控（OutputGuard 之后追加，不替换）
  # mode: rule_based（默认，零 Token）/ llm_based（接口预留，需配 critic_evaluation.llm_config）
  # conservative_mode=true（默认）：只记录 metrics/审计，不拦截不重试，用户响应零影响
  output_validator:
    enabled: true
    mode: rule_based
    conservative_mode: true
    max_output_length: 8000
    enable_retry: true
    max_retries: 1

# ═══════════════════════════════════════════════════════════════
#  日志配置 (Logging)
# ═══════════════════════════════════════════════════════════════
logging:
  # 全局日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO
  # 是否启用调试模式（启用后所有模块为 DEBUG 级别）
  debug_mode: false
  
  # 控制台输出配置
  console:
    enabled: true
    level: INFO
    # 格式化配置
    format: "%(asctime)s [%(levelname)8s] %(name)-30s: %(message)s"
    date_format: "%H:%M:%S"
  
  # 文件输出配置
  file:
    enabled: true
    # 主日志文件路径
    main_file: ./logs/agent.log
    # 错误日志文件路径（独立文件，仅记录 ERROR 及以上）
    error_file: ./logs/errors.log
    # 审计日志文件路径（独立文件，记录安全操作）
    audit_file: ./logs/audit.log
    # 扩展系统日志文件路径（独立文件，记录扩展相关操作）
    extensions_file: ./logs/extensions.log
    level: INFO
    format: "%(asctime)s [%(levelname)8s] %(name)-30s %(process)d:%(thread)d: %(message)s"
    date_format: "%Y-%m-%d %H:%M:%S"
  
  # 日志轮转配置
  rotation:
    # 单个日志文件最大大小（MB）
    max_file_size_mb: 50
    # 保留的备份文件数量
    backup_count: 10
    # 是否使用基于时间的轮转（按天）
    use_timed_rotation: false
    # 时间轮转单位: midnight, D(天), H(小时), M(分钟)
    when: midnight
    # 轮转间隔
    interval: 1
    # 是否使用 UTC 时间
    utc: false
  
  # 各模块日志级别配置
  modules:
    agent.extensions: INFO
    agent.server_routes: INFO
    agent.guardrails: INFO
    agent.cognitive: INFO
    agent.human_in_the_loop: INFO
    agent.digital_life: INFO
    agent.behavior_controller: INFO
    agent.permission_system: INFO
    agent.safety_guard: INFO
    agent.system_tools: INFO
    agent.tools: INFO
    agent.planning: INFO
    # 第三方库日志级别（降低噪音）
    urllib3: WARNING
    httpx: WARNING
    httpcore: WARNING
    anthropic: WARNING
    openai: WARNING

# ═══════════════════════════════════════════════════════════════
#  扩展系统配置 (Extensions)
# ═══════════════════════════════════════════════════════════════
extensions:
  # 是否启用扩展系统
  enabled: true
  
  # 扩展管理器配置
  manager:
    # 自动发现本地扩展
    auto_discover: true
    # 扩展安装目录
    install_dir: ./extensions
    # 配置文件路径
    config_file: ./extensions/extensions.json
  
  # 扩展市场配置
  market:
    # 是否启用社区市场
    community_enabled: true
    # 是否启用 GitHub 搜索
    github_search_enabled: true
    # 社区索引 URL
    community_index_url: ""
    # GitHub 搜索 API（可选）
    github_api_token: ""
  
  # 高危操作配置（HITL - Human in the Loop）
  hitl:
    # 是否启用人工确认
    enabled: true
    # 自动批准低风险操作
    auto_approve_low_risk: true
    # 拒绝极高风险操作（CRITICAL）
    reject_critical: true
    # 确认超时时间（秒）
    confirmation_timeout: 300
    # 超时策略: reject, approve, degrade
    timeout_strategy: reject
  
  # 各类型扩展配置
  skills:
    enabled: true
    auto_load: true
  mcp_services:
    enabled: true
    auto_load: true
  channels:
    enabled: true
    auto_load: false
  plugins:
    enabled: false
    auto_load: false

# ═══════════════════════════════════════════════════════════════
#  架构规则配置 (Architecture Rules)
#  参考 ArchUnit 思想，纯 Python 实现的架构规则校验
#  CLI: python -m agent.observability.arch_rules --check
# ═══════════════════════════════════════════════════════════════
arch_rules:
  # 是否启用架构规则校验（全局开关）
  enabled: true
  # 存量豁免清单路径
  exemptions_path: docs/architecture/legacy_exemptions.json
  # 是否对新增代码强制执行（CI 中阻断合并）
  enforce_new_code: true

  # 规则定义（可覆盖严重度与建议）
  rules:
    no_orchestrator_to_dao:
      severity: high
      suggestion: "orchestrator 应通过 service 或 business 层访问数据"
    no_cognitive_to_server_routes:
      severity: high
      suggestion: "cognitive 应通过 orchestrator 协调 HTTP 路由"
    no_cognitive_to_dao:
      severity: high
      suggestion: "cognitive 不应直接读写数据，应通过 memory 或 service"
    no_tools_to_dao:
      severity: medium
      suggestion: "工具模块应保持无状态，数据访问由上层处理"
    no_guardrails_to_server_routes:
      severity: medium
      suggestion: "guardrails 应保持独立，不依赖 HTTP 路由层"
    no_circular_dependency:
      severity: high
      suggestion: "通过依赖倒置或中间层解耦，或使用 lazy_loader 延迟加载"
    no_agent_import_tests:
      severity: high
      suggestion: "生产代码不应依赖测试代码，请反转依赖方向"

# ═══════════════════════════════════════════════════════════════
# 四层可见性阈值配置 (Visibility Thresholds)
# 被 scripts/visibility_report.py 读取，作为 PR 合并门槛
# 指标低于阈值时 CI 阻断合并（退出码 1）
#
# ========== 阈值分阶段收敛计划（2026-06-28 修订）==========
# 当前状态：阶段 1（部分实施）
#   - exception_coverage 新增采集逻辑并达标（实测 71.6% > 阶段1阈值 70%）
#   - 其余 4 项指标实测值远低于阶段 1 目标，阈值已提升到实测值可支撑水平
#   - 每项指标在注释中标注阶段 1 目标、实测值和差距，便于持续补齐
#
# 3 阶段收敛路线图：
#   阶段 0（已完成）：基线校准，所有指标在阈值以下通过
#   阶段 1（当前）：exception_coverage 达标，其余指标渐进提升并标注差距
#   阶段 2（计划）：补齐结构化日志/链路追踪后，提升到阶段 2 目标
#   目标值：structured_log=80%, trace=70%, test_coverage=70%, boundary=90%, exception=90%
#
# 阶段 1 指标收敛状态（2026-06-28 实测）：
#   指标                    | 实测值  | 当前阈值 | 阶段1目标 | 差距    | 状态
#   structured_log_coverage | 26.5%  | 26      | 50       | -23.5% | 补齐中
#   trace_coverage          | 16.7%  | 16      | 50       | -33.3% | 补齐中
#   test_coverage           | 0.6%   | 0       | 55       | -54.4% | 补齐中
#   boundary_test_coverage  | 12.2%  | 12      | 70       | -57.8% | 补齐中
#   exception_coverage      | 71.6%  | 70      | 70       | +1.6%  | 已达标
#
# 未达标指标根因分析与补齐措施：
#   - structured_log_coverage (26.5% → 50%): 需转换 600+ logger 调用为 JSON 格式
#     措施：批量替换 logger.info/warning/error 为 json.dumps 结构化输出
#   - trace_coverage (16.7% → 50%): 需为 72 个路由添加 @trace_route 装饰器
#     措施：在 agent/server_routes.py 等路由文件批量添加装饰器
#   - test_coverage (0.6% → 55%): coverage.xml line-rate=0.005513，降级逻辑已移除
#     措施：大幅补齐测试覆盖，CI 中 full-project-tests 生成真实 coverage.xml
#   - boundary_test_coverage (12.2% → 70%): 当前 465/3812=12.2%
#     措施：分批补充边界测试用例，优先覆盖核心模块
#   - track_event_coverage (7.4%): 不在本阶段收敛范围，保持当前阈值
# ═══════════════════════════════════════════════════════════════
visibility_thresholds:
  # 第一层：运行时可见
  runtime:
    # 结构化日志覆盖率（含 trace_id/module_name/action/duration_ms 的日志占比）
    # 实测 26.5%（2026-06-28），阶段 1 提升到 26（略低于实测值确保 CI 通过）
    # 阶段 1 目标：50%（需补齐 600+ logger 调用为 JSON 格式）
    # 阶段 2 目标：70% | 最终目标：80%
    structured_log_coverage: 55
    # 链路追踪覆盖率（使用 @trace_route 的路由占比）
    # 实测 16.7%（2026-06-28），阶段 1 提升到 16（略低于实测值确保 CI 通过）
    # 阶段 1 目标：50%（需为 72 个路由添加 @trace_route 装饰器）
    # 阶段 2 目标：60% | 最终目标：70%
    trace_coverage: 16
    # 健康检查端点数（/api/health、/status 等）
    # 实测 2 个，达标
    health_endpoints: 1

  # 第二层：验证过程可见
  verification:
    # 代码测试覆盖率（来自 coverage.xml 真实 line-rate，不再降级到 pyproject.toml）
    # 实测 0.6%（2026-06-28，coverage.xml line-rate=0.005513，降级逻辑已移除）
    # 阶段 1 降到 0 确保 CI 通过（CI 中 full-project-tests 生成的 coverage.xml line-rate≈19.7%）
    # 阶段 1 目标：55%（需大幅补齐测试覆盖）
    # 阶段 2 目标：65% | 最终目标：70%
    test_coverage: 0
    # 边界测试覆盖率（已声明模块的必需场景覆盖率）
    # 【指标定义修订】阶段 2 起从「用例数比例」改为「必需场景覆盖率」
    #   旧定义：boundary_tests / total_tests * 100（受总测试数增长稀释，无法真实反映质量）
    #   新定义：已覆盖的必需场景数 / 必需场景总数 * 100（基于声明清单，更稳定、更真实）
    # 实测 100.0%（2026-07-01，47/47 必需场景全部覆盖，新指标）
    #         旧指标用例数比例 21.2%（1254/5919，仅作参考）
    # 阶段 2 目标：80%（已达成）| 最终目标：90%
    # 历史背景：原计划新增 640 个边界测试达到 80% 用例数比例，
    #         但数学验证发现需 16500+ 个（不切实际），故修订指标定义
    boundary_test_coverage: 80
    # Pact 契约测试数量
    # 实测 3 个，达标
    contract_test_count: 3
    # 异常处理覆盖率（含 try/except/raise 的核心模块占比）
    # 实测 71.6%（2026-06-28），阶段 1 已达标
    # 阶段 1 目标：70%（已达成）| 阶段 2 目标：80% | 最终目标：90%
    exception_coverage: 80

  # 第三层：业务价值可见
  business:
    # 埋点覆盖率（含 trackEvent/track( 调用的核心模块占比）
    # 实测 7.4%（2026-06-28），不在本阶段收敛范围，保持阶段 0 阈值
    # 阶段 2 计划提升到 50%
    track_event_coverage: 50
    # 监控看板数量
    # 实测 9 个，达标
    dashboard_count: 3
    # Prometheus 告警规则数量
    # 实测 13 条，达标
    alert_rules_count: 5

  # 第四层：架构影响可见
  architecture:
    # 依赖图节点数（模块依赖图规模下限）
    # 实测 215 个，达标
    dependency_graph_nodes: 10
    # 架构规则违规数上限（逆向指标：实际值 ≤ max 才通过）
    # 实测 2 个，达标
    max_arch_violations: 5
    # 变更影响分析报告覆盖率
    # 实测 100.0%，达标
    impact_analysis_coverage: 80

# ═══════════════════════════════════════════════════════════════
#  Orchestrator 语义层配置 (Semantic Layer)
#  三层漏斗第 2 层：规则层(WorkflowEngine)未命中后，LLM 之前
#  模块入口：agent/orchestrator/orchestrator.py _semantic_layer_match()
#  配置优先级：环境变量 > config.yaml > 硬编码默认值
# ═══════════════════════════════════════════════════════════════
orchestrator:
  semantic_layer:
    # 总开关 - 关闭后语义层跳过，直接降级 LLM
    # 环境变量 ORCHESTRATOR_SEMANTIC_LAYER_ENABLED 覆盖此值
    enabled: true
    # 语义层最低命中分阈值（< 此值视为未命中，降级 LLM）
    # 环境变量 ORCHESTRATOR_SEMANTIC_MIN_SCORE 覆盖此值
    #
    # 【P0-1 · 2026-09-28 语义订正（值未变，只有**职责**变了）】
    #   改前：它被当成**两条检索腿的候选过滤器**用（loader 里直接传给 _tfidf_scan /
    #     adapter.search）。那是量纲/职责混用 —— 它比的是 H/N_q（query token 命中率，
    #     与 query 长度成反比，不是相似度）⇒ 长中文 query 的正解在进闸前就被删掉，
    #     实测中文召回 4/8（同语义英文 8/8）。
    #   改后：两条腿改用**召回地板** loader._RRF_LEG_MIN_SCORE（只管"有没有命中"），质量由
    #     loader 的标定闸门判定：`有界相似度 >= loader._RRF_QUALITY_MIN(0.3)` 或
    #     `BM25 rank1 + 裕度 >= 1.2 + 证据非单点偶然`；闸门判过之后编排层**不再**用本值复判。
    #   现状：RRF 路径上本值仍作为调用方阈值传给 loader（保持接口/配置兼容），但决定"收不收"
    #     的是上面那套标定判据；非 RRF 的单路 fallback 路径仍按原语义过滤。
    min_score: 0.3
    # 返回前 K 个候选（仅 top1 用于短路返回，其余供 LLM 增强上下文）
    top_k: 5
    # 启用向量检索（sqlite-vec 不可用时 SkillLoader 内部自动降级 TF-IDF+BM25）
    use_vector: true
    # 启用 BM25 辅助检索（与 TF-IDF+向量 RRF 融合）
    use_bm25: true
    # 启用 Cross-Encoder 精排（较重，主链路默认关闭）
    use_reranker: false
    # 融合模式：none | rrf | rrf_rerank（use_vector/use_bm25 启用时自动升 rrf）
    fusion_mode: rrf

  # ═══════════════════════════════════════════════════════════════
  #  Workflow Learning 拦截层配置 (自动闭环 v1)
  #  位置：模板层(IntentRouter)未命中后、语义层(SkillLoader)之前
  #  命中并成功执行本地工作流 → 短路返回（跳过 LLM，0 Token）
  #  未命中/执行失败/异常 → 降级继续 LLM（守主链路稳定）
  #  模块入口：agent/orchestrator/orchestrator.py _workflow_learning_layer_match()
  # ═══════════════════════════════════════════════════════════════
  workflow_learning_layer:
    # 总开关 - 关闭后拦截层跳过
    # 环境变量 ORCHESTRATOR_WORKFLOW_LEARNING_LAYER_ENABLED 覆盖此值
    enabled: true
    # top1 综合分阈值（相似度*置信度*优先级权重）
    # 【F11-C-1 更正】原文写「与 workflow_learning.executor.min_score 对齐」——
    #   该键**全仓无读取点**（死键），把一个不生效的键说成了对齐源；该键已删除。
    #   本键是**唯一真相源**：orchestrator.py:1935 读取、:2030 每次显式传给
    #   svc.try_execute(min_score=...)，即工作流自动执行的真实门槛。
    # 环境变量 ORCHESTRATOR_WORKFLOW_LEARNING_MIN_SCORE 覆盖此值
    min_score: 0.25

  # ═══════════════════════════════════════════════════════════════
  #  拒识层配置（三层漏斗第 3 层，LLM 调用之前）
  #  模块入口：agent/orchestrator/orchestrator.py _should_reject()
  #  说明（2026-08-12）：语义层修复后，当前部署技能库为 persona 元技能
  #  （无任务技能），规则层+语义层双未命中导致一切正常中文请求被
  #  「未知意图软拒识」拦截、不调 LLM。关闭 enabled 后仅保留
  #  「输入过短拒识」（input_too_short，process() 内独立判定不受此开关影响）。
  #  环境变量 ORCHESTRATOR_REJECT_ENABLED 覆盖此值（.env 已同步设置）
  # ═══════════════════════════════════════════════════════════════
  reject:
    # 未知意图软拒识总开关 - false 时未知意图放行 LLM（守「组装流程可触发」）
    enabled: false
    # 语义最高分阈值（与 semantic_layer.min_score 解耦，预留调优）
    threshold: 0.3
    # LLM 最低置信度（预留，当前判定未使用）
    llm_min_confidence: 0.5

# ═══════════════════════════════════════════════════════════════
#  综合技能管理系统配置 (Skills Management)
#  灵感来源：Claude Skills / Code Skills / Trae / OpenClaw / Hermes
#  模块入口：agent/skills_mgmt/service.py
# ═══════════════════════════════════════════════════════════════
skills_mgmt:
  # 全局开关 - 关闭后所有 skills-mgmt API 返回 503
  enabled: true
  # 技能持久化存储路径（JSON 文件，原子写入）
  store_path: ./data/skills_mgmt.json
  # 是否同步到旧版 data/skills.json（向后兼容 routes_skills.py）
  sync_legacy: true

  # 审核阈值（0-100）
  review_thresholds:
    # 重复度上限：超过此值则拒绝（Jaccard 相似度 * 100）
    duplicate_max: 60
    # 安全分下限：低于此值则拒绝（安全扫描得分）
    security_min: 70
    # 质量分下限：低于此值则要求人工复核
    quality_min: 50
    # 综合分下限：低于此值则拒绝
    overall_min: 60

  # TASK-04：发布强制审核链（默认强制，安全底线）
  # true（默认）：publish 前必须存在 PASSED 的 ReviewResult（三维评分达标），否则拒绝并提示先 review；
  # false（显式豁免）：允许跳过，但必须写审计日志（audit_file）记录"豁免发布"。
  # 环境变量 SKILLS_REVIEW_ENFORCE_PUBLISH 覆盖此值
  review:
    enforce_before_publish: true
    # 豁免发布审计日志（JSONL，逐条留痕）
    audit_file: ./data/skills_mgmt_review_audit.jsonl

  # 安装器配置
  installer:
    # HTTP 下载超时（秒）
    http_timeout: 30
    # 最大文件大小（MB），防止下载超大文件
    max_file_size_mb: 10
    # 允许的安装源协议
    allowed_schemes:
      - github
      - url
      - local
      - registry

  # AI 辅助生成配置
  ai_assist:
    enabled: true
    # 模板兜底模式（LLM 不可用时使用模板生成）
    template_fallback: true

  # 检索配置（TF-IDF 默认生效；vector/bm25/reranker 通过 SkillLoader.match 启用）
  retrieval:
    method: tfidf  # tfidf | vector | bm25 | fused
    vector:
      enabled: false
      model: BAAI/bge-small-zh-v1.5
    bm25:
      enabled: false
    reranker:
      enabled: false
      model: BAAI/bge-reranker-base
    # 多路融合权重（use_bm25=True 时生效，加权 RRF 融合 tfidf+vector+bm25）
    # 由 SkillLoader._get_default_weights() 读取（优先级: .env > config.yaml > 硬编码）
    # 运行时也可通过 match(retrieval_weights=...) 覆盖
    fusion:
      weights:
        tfidf: 0.2
        vector: 0.6
        bm25: 0.5   # 2026-07-29 验证通过：专有名词命中率 86%→100%

  # 规模监控（技能数超过阈值时建议升级检索方式）
  scale:
    upgrade_threshold: 30

  # 自动清理（技能中心：清除无用技能/孤儿残留；默认关闭 + dry-run 保守）
  # 模块入口：agent/skills_mgmt/cleanup.py + cleanup_scheduler.py
  # env 覆盖：SKILL_CLEANUP_*（见 cleanup_scheduler.py 配置说明）
  cleanup:
    # 总开关 - true 时注册周期清理任务（调度触发默认仍 dry-run 只报告）
    enabled: false
    # 周期（小时）
    interval_hours: 24
    # 孤儿残留清理 dry-run（true=只报告；false=真正清除主轨已无的脏数据）
    orphans_dry_run: true
    # 无用技能物理删除 dry-run（true=只报告；false=真正删除）
    unused_dry_run: true
    # 停用零使用超此天数视为无用候选
    unused_days: 90
    # 已归档超此天数可物理删除
    archived_days: 180

# ═══════════════════════════════════════════════════════════════
#  智能工作流学习系统配置 (Workflow Learning)
#  从大模型成功交互中学习方法，自动生成可执行工作流
#  模块入口：agent/workflow_learning/service.py
# ═══════════════════════════════════════════════════════════════
workflow_learning:
  # ── 【F11-C-1 · 2026 死键清理】逐键取证见 docs/audit_skill_governance/F11C1.md ──
  # 原 `enabled` / `repo_path` 两键**全仓无任何读取点**，已删除；真实开关/路径：
  #   · 拦截层执行开关 → orchestrator.workflow_learning_layer.enabled
  #     （env ORCHESTRATOR_WORKFLOW_LEARNING_LAYER_ENABLED 覆盖）
  #   · 自动学习开关   → 本段 learn_from_interaction.enabled（下方，**已接线**）
  #   · 持久化路径     → 代码常量 agent/workflow_learning/repository.py:16
  #     （模块相对的绝对路径 <仓库根>/data/learned_workflows.json）。此处若写相对
  #     路径会把存储位置绑到进程 CWD（换个目录启动就等于换一份空仓库），故不再提供
  #     该键；确需改路径请用 WorkflowLearningService(repo_path=...)。

  # 匹配器配置（【F11-C-1】三键**已接线**：agent/workflow_learning/service.py
  #   _load_workflow_learning_config 读取并下发；缺失/非法 → 逐键回落改前生效值）
  matcher:
    # TF-IDF 相似度下限（0-1），低于此值不进入候选
    # 改前：死键（真实生效值 = WorkflowMatcher.__init__ 构造默认 0.3）
    min_similarity: 0.3
    # 置信度下限（0-1），低于此值的候选被丢弃
    # 改前：死键（真实生效值 = 构造默认 0.4）
    # ⚠️ 与 learner 的初始置信度常量 0.4（learner.py 的 LearnedWorkflow(confidence=0.4)）
    #    耦合：本键若 > 0.4，新学到的条目将无法进入候选（冷启动死锁会复现）。
    min_confidence: 0.4
    # 候选池深度（相似度 Top-K）
    # 改前：死键 —— WorkflowExecutor.try_execute 里**硬编码 top_k=3**，本键写 5
    #       却从未被读。现由 WorkflowExecutor(top_k=...) 读取。
    # 注：try_execute 只消费候选池的 top1 ⇒ 本键只影响池深与候选计数观测，
    #     不改变"命中/不命中"判定（F11C1.md §6 有 3 vs 5 的差分实测）。
    top_k: 5

  # 执行器配置
  # 【F11-C-1 · 整块三键已删除】原 min_score/step_timeout_ms/max_steps 全仓无读取点：
  #   · `min_score: 0.25` —— 死键，且与代码构造默认 **0.3 漂移**。真实生效的执行
  #     门槛是上面 orchestrator.workflow_learning_layer.min_score（唯一真相源）。
  #     接线本键 = 把服务级默认门槛 0.3 降到 0.25 ⇒ **更多工作流被自动执行**
  #     （HTTP /api/.../try-execute 与不带 min_score 的调用方），属行为变更，
  #     故本卡删除而不接线；确需改门槛请改 orchestrator.workflow_learning_layer.min_score
  #     （env ORCHESTRATOR_WORKFLOW_LEARNING_MIN_SCORE 可热覆盖）。
  #   · `step_timeout_ms: 30000` —— 执行器**没有**单步超时机制（无实现），接线 =
  #     新增能力（会改变执行语义：长步骤被中断），另立项。
  #   · `max_steps: 12` —— 执行器**没有**步数上限（准入侧只有 admission.MIN_STEPS=2
  #     下限；分支>3/步骤>10 只是转 Agent 模式，不是截断）。新增上限会**减少**可执行
  #     工作流（行为变更），另立项。

  # 学习器配置
  # 【F11-C-1 · 整块三键已删除】learner.{min_tool_calls,max_keywords,dedup_window_days}
  # 全仓无读取点，且**没有可注入的实现口**：
  #   · WorkflowLearner **无 __init__**（构造无参），无法从构造函数下发；
  #   · 触发学习的真实闸门在 orchestrator._learn_workflow_from_interaction（工具调用
  #     序列**非空**即可，无次数下限）+ 准入 admission.MIN_STEPS=2（<2 步落草稿态）；
  #   · 关键词/触发词的真实截断常量在 learner.py（SIGNATURE_MAX_TOKENS=32 /
  #     TRIGGER_TOKENS_MAX=5），本卡禁改该文件；
  #   · F11 的同任务去重是**同签名无限期去重**（canonical_signature，与时间无关），
  #     加"7 天窗口"会改变去重语义（老条目会重新变成重复项）⇒ 行为变更。
  # 如需"最小工具调用数"闸门（会**减少**学习产出）或去重时间窗，属行为变更，另立项。

  # 自动学习钩子（自动闭环 v1）— LLM 成功交互后自动 learn_from_interaction
  # 环境变量 ORCHESTRATOR_WF_LEARN_ENABLED 覆盖此值
  learn_from_interaction:
    # 总开关 - 关闭后仅保留手动 API 学习
    enabled: true

  # 定时自动升格（自动闭环 v1）— 达标工作流自动转换并注册为 Agent Skill
  # 守质量门控：success_count>=5 / confidence>=0.7 / priority 达标 / ACTIVE / 未转换过
  auto_upgrade:
    # 总开关
    enabled: true
    # 检查间隔（秒），挂载于 LifecycleManager 自主维护循环
    interval_seconds: 300
    # 环境变量 WF_SKILL_AUTO_UPGRADE_ENABLED / WF_SKILL_AUTO_UPGRADE_INTERVAL 覆盖


# ── SLO 指标周报定时生成（2026-09-13 起开启）──────────────────────────
# 由 TaskScheduler 每周一 09:00 自动生成 §6.7 指标周报并存档，
# 供运营期"与 W0 基线和上周对比"。也可用 CP_SLO_SCHEDULE_* 环境变量覆盖。
#
# 【开启理由（2026-09-13）】周报是运营期的**连续可比序列**（漏周即无法与 W0 对比），
# 靠人工记得跑不可靠；周报生成本身也是云枢真实运行的一部分（会写审计 + 事件）。
# 任务只读事件流/台账并写 docs/zh/周报存档/，不触发任何自动化改动 ⇒ 无副作用风险。
# 【留意】slo_report 段落此前只是"占位默认关闭"，从未真正注册过任务；
# 若需临时停掉：改回 false 并重启，或置 CP_SLO_SCHEDULE_ENABLED=false。
slo_report:
  enabled: true           # true 时注册周报定时任务（等价 CP_SLO_SCHEDULE_ENABLED=true）
  day_of_week: 0          # 0=周一 … 6=周日（Python weekday() 语义）
  hour: 0                 # 触发小时（0-23）
  minute: 0               # 触发分钟（0-59）
  days: 7                 # 周报窗口天数（1-90）
  # out_dir: docs/zh/周报存档                    # 缺省即此目录
  # audit_file: data/slo_report_audit.jsonl      # 每次运行追加审计


# ── 数据生命周期治理（TASK-S8-01，2026-09-13；**默认全部关闭**）──────────
# 保留策略 = 「留多久 / 怎么归档 / 能不能删」的成文规则，机器可读同源版本见
# agent/retention/policy.py::DEFAULT_CLASSES，成文版见 docs/zh/数据生命周期策略.md。
#
# 【安全底线（S8 批次总表 §二）】
#   · enabled 默认 false ⇒ 不注册任何调度任务；
#   · delete_source 默认 false ⇒ **只归档不删除**（唯一可删类 digestion_drafts 也需显式开启）；
#   · 无论 dry_run 取何值，**本进程首跑强制 dry-run**（先列清单与体积，第二次才落盘）；
#   · 审计链 / 每日 Merkle 根为红线类：PurgeGuard 一律拦截，永久保留、只归档不删。
#
# 【开启方式】enabled: true（等价 CP_RETENTION_ENABLED=true），重启后生效。
# 【停掉方式】enabled: false 并重启，或置 CP_RETENTION_ENABLED=false。
retention:
  enabled: false          # true 时注册每周归档任务（等价 CP_RETENTION_ENABLED=true）
  dry_run: true           # true=只列清单与体积、不落盘（首跑强制 dry-run 不受此值影响）
  delete_source: false    # true=归档后删除源（仍需过 PurgeGuard；默认只归档不删除）
  day_of_week: 6          # 0=周一 … 6=周日（缺省周日）
  hour: 3                 # 触发小时（0-23）
  minute: 0               # 触发分钟（0-59）
  # archive_dir: data/archive                    # 缺省即此目录
  # classes: events,policy_decisions             # 缺省＝全部 12 类
  # classes_override:                            # 逐类覆盖（非法值一律回退默认）
  #   events:
  #     cold_days: 90


