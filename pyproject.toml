[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Yunshu"
version = "2.0.0"
description = "云枢 - 一个拥有完整感知-认知-行动闭环的数字生命体"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Yunshu Team", email = "team@Yunshu.ai" }
]
maintainers = [
  { name = "Yunshu Team", email = "team@Yunshu.ai" }
]
# 【校准 2026-08-28】依赖 numpy>=2.0/scipy>=1.13 在 3.10 上解析到 numpy 2.4.6/scipy 1.17.1
# （均要求 >=3.11，无 3.10 wheel）→ 3.10 无法安装。声明与依赖实际兼容性对齐，下限升至 3.11。
requires-python = ">=3.11,<3.13"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = ["AI", "digital-life", "agent", "cognitive"]
dependencies = [
  "psutil>=7.2.2,<8.0.0",
  "openai>=2.0.0,<3.0.0",
  "anthropic>=0.40.0,<1.0.0",
  "tiktoken>=0.7.0,<1.0.0",
  "pyyaml>=6.0,<7.0",
  # ══ 【TASK-03 · 2026-09-18 依赖真相源对齐】═════════════════════════════════
  # Why 以下 11 项的上限被放宽（旧值见 docs/closeout/BASELINE_20260918.md 附录 A）：
  #   scripts/audit_dependency_drift.py 实测发现 pyproject 的区间**同时排除**了
  #   "requirements.txt 钉的版本"与"本机生产实装版本"。而 CI 只读本文件
  #   （.github/workflows/ci.yml:56 `pip install -e .`），生产只跑实装环境
  #   ⇒ CI 测的依赖 ≠ 生产跑的依赖，这是最贵的一类假绿。
  # 取值口径（三方对齐）：
  #   下限 = requirements.txt 钉的版本（本机实装若更高则以实装为准）
  #   上限 = 下一大版本（沿用本仓既有 pin 风格）
  # Why 以"本机实装"为生产实况证据：start_yunshu.bat:21 不做依赖安装，直接
  #   `python app_server.py`，运行时就是这台机器的 Python 3.12 环境
  #   （快照 _ci_logs/pip_freeze_20260918.txt，333 包）。而 requirements.txt
  #   已实测**残缺**（缺 flask/waitress/lxml 等 9 个直接依赖；
  #   .github/workflows/observability-ci.yml:548 也记载了同一缺口）
  #   ⇒ 它不能单独充当"生产实况"的证据源。
  # 为什么否决反向选择（以旧 pyproject 为准、让生产重装）：chromadb 0.4 → 1.5
  #   与 sentence-transformers 2.x → 5.x 是跨大版本迁移，历史上已经咬过人
  #   （仓库存有 chromadb_windows_compatibility_migration_guide.md 与
  #   "chromadb 0.5.x downgrade" 文档），且重装 torch 需重新验证数 GB 权重加载。
  # Why 这三个的上界只收到「下一**小**版本」而不是「下一大版本」（与本文件其余项不同）：
  #   实测 `pip install --dry-run -e .` 的结果差异 ——
  #     上界 <3.0.0 / <1.0.0 / <3.0.0 → 解析器选 **torch 2.14.0 + torchvision 0.29.0**，
  #        即比生产锁定的 torch 2.12.0 与本机正在跑的 2.13.0+cpu **都新**；
  #     上界 <2.14.0 / <0.29.0 / <2.13.0 → **torch 保持 2.13.0+cpu 不变**，
  #        只新增 torchvision 0.28.0 + torchaudio 2.11.0。
  #   这正是本任务要修的问题本身（"CI 测的依赖 ≠ 生产跑的依赖"）—— 用大版本上界
  #   会把它原样搬回来。torchvision 0.29 会**钉住 torch==2.14**，是升级的传导源。
  #   代价：torch 2.14 发布后 CI 不会自动用上，需要一次显式改版（可接受，且是好事）。
  "torch>=2.12.0,<2.14.0",
  "torchvision>=0.27.0,<0.29.0",
  "torchaudio>=2.11.0,<2.13.0",
  "opencv-python-headless>=4.8.0,<5.0.0",
  "chromadb>=1.5.9,<2.0.0",
  "sentence-transformers>=5.5.1,<6.0.0",
  # transformers：此前**完全未声明**，只作为 sentence-transformers 的传递依赖
  #   出现在 requirements.txt:383。Why 必须显式声明：agent/ 与 memory/ 直接
  #   `import transformers`，把它交给传递闭包等于"上游改一次依赖树就静默失效"。
  #   下限取 requirements.txt 钉的 5.9.0；本机实装 5.13.1 落在区间内。
  "transformers>=5.9.0,<6.0.0",
  "numpy>=2.0.0,<3.0.0",
  # 【S11-10 · R9-e】原生栈四件套显式声明（此前是"未声明但被依赖"的隐式件）。
  # Why 必须声明：`agent/utils/native_preimport.py` 的原生栈固化顺序是
  #   `numpy → pyarrow → pandas → sklearn`，四者缺一不可——Windows 上 pyarrow 的
  #   原生初始化（arrow.dll）若晚于 torch/onnxruntime/sklearn 等重型原生库，会触发
  #   0xC0000005 ACCESS_VIOLATION（进程直接消失，无 traceback）；而真实依赖链正是
  #   `sklearn/utils/fixes.py:19 import pandas → pandas/compat/pyarrow.py:12 import pyarrow`。
  #   守卫用例 `tests/unit/test_native_preimport.py` 对四者逐一断言"预导入不得失败"。
  # 为什么此前在 CI 上必然红：CI 单元测试只执行 `pip install -e .`（**不读
  #   requirements*.txt**，口径见仓库自己的 CI_FAILURE_FIX_REPORT.md:22）。其中
  #   numpy 已声明；pyarrow 与 pandas **既未声明、也不在任何依赖的传递闭包内**
  #   （pandas 甚至不在锁文件里）；sklearn 仅经 sentence-transformers 传递得到。
  #   实测收敛过程佐证：只补 pyarrow 后 Shard 5 由 2 条失败降为 **1 条**，
  #   且失败项由 "No module named 'pyarrow'" 变为 "No module named 'pandas'"
  #   ⇒ 说明"逐个补齐显式声明"确为该断言的满足条件。
  # 版本下限：取本机实测通过的版本（numpy 2.4.6 / pyarrow 24.0.0 / pandas 3.0.3 /
  #   scikit-learn 1.9.0），不对更早版本做未经验证的假设；上限沿用本仓
  #   "≤ 下一大版本" 的 pin 风格。已核对无解析冲突：chromadb 只要 numpy>=1.22.5、
  #   sentence-transformers 只要 scikit-learn>=0.22.0、pandas 只要 numpy>=1.26.0，
  #   且**没有任何已声明依赖要求 pandas**。
  "pyarrow>=24.0.0,<26.0.0",
  "pandas>=2.2.0,<4.0.0",
  "scikit-learn>=1.3.0,<2.0.0",
  "pyttsx3>=2.99,<3.0.0",
  "SpeechRecognition>=3.16.1,<4.0.0",
  "pyautogui>=0.9.53,<0.9.60",
  "pygetwindow>=0.0.9,<0.0.10",
  "pyperclip>=1.11.0,<2.0.0",
  "selenium>=4.44.0,<5.0.0",
  "lxml>=6.1.0,<7.0.0",
  "keyboard>=0.13.5,<0.14.0",
  "mouse>=0.7.1,<0.8.0",
  "pydub>=0.25.1,<0.26.0",
  "watchdog>=6.0.0,<7.0.0",
  "GPUtil>=1.4.0,<1.5.0",
  "pynvml>=13.0.1,<14.0.0",
  # 上限按 §2.6 的"无上限依赖"处置项补齐（flask / waitress / gunicorn 三项）。
  # Why 加 <下一大版本：无上限依赖会让 CI 某天静默拉到不兼容的大版本，
  #   而这类漂移在"门禁全绿"的假象下不会被任何现有检查拦住。
  "flask>=3.0.0,<4.0.0",
  "prometheus-flask-exporter>=0.23.0,<1.0.0",
  # gunicorn：判定为**保留不删**。Why：它被 deploy/k8s/deployment.yaml 与
  #   gunicorn_config.py 引用，直接删除会让这两处配置悬空（属于"删文件没做
  #   引用检查"）；但当前 Windows 生产运行时确实是 waitress
  #   （app_server.py 末尾），gunicorn 属"非当前运行时路径"——已在
  #   docs/closeout/DEAD_CONFIG_20260918.md 登记为待判定债务。
  "gunicorn>=21.2.0,<24.0.0",
  "waitress>=3.0.0,<4.0.0",
  "cryptography>=42.0.0",
  "jsonschema>=4.0.0,<5.0.0",
  # pypdf 上限原为 <6.0.0，但本机生产实装 6.14.2（audit 的 [4] 类）
  #   ⇒ 旧上限把正在跑的版本排除在外。下限抬到实装值。
  "pypdf>=6.14.2,<7.0.0",
  "cssselect>=1.2.0,<2.0.0",
  "pdfplumber>=0.10.0,<0.12.0",
  # Windows-only 依赖（pyttsx3 的间接依赖）。
  # 使用 PEP 508 platform markers，在 Linux/macOS 上自动跳过，
  # 替代 CI workflow 中的 `grep -v 'pywin32|pypiwin32|comtypes'` 过滤方案。
  # 详见 docs/observability/ci_yml_workflow_fix_commit_record.md 附录 A
  "pywin32>=305; sys_platform == 'win32'",
  "pypiwin32>=223; sys_platform == 'win32'",
  "comtypes>=1.4.0; sys_platform == 'win32'",
  "wmi>=1.5.0,<1.6.0; sys_platform == 'win32'",
  "pydantic>=2.0.0,<3.0.0",
  "prometheus-client>=0.20.0",
  "httpx>=0.27.0,<1.0.0",
  "requests>=2.31.0,<3.0.0",
  "scipy>=1.13.0,<2.0.0",
  # 技能 BM25 检索（TLM L1 确定性锚点匹配，纯 Python 无 native 依赖）
  "rank-bm25==0.2.2",
  # sqlite-vec：**直接依赖漏声明**（audit_dependency_drift 的 [2a] 类）。
  # Why 必须补：requirements.txt:330 已用 `# via Yunshu (TLM L3 向量存储后端)`
  #   明确标注它是项目**直接**依赖，但 pyproject 里没有 ⇒ CI 的
  #   `pip install -e .` 不装它，而 tests/unit/test_vector_store_sqlite_vec.py
  #   依赖它决定 L3 向量后端选型（装不上就整组跳过 ⇒ 覆盖率假高）。
  #   下限对齐 requirements.txt 的 >=0.1.9（本机实装 0.1.9）。
  "sqlite-vec>=0.1.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-mock>=3.10.0",
  "pytest-xdist>=3.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-timeout>=2.0.0",
  "flake8>=6.0.0",
  "black>=23.0.0",
  "ruff>=0.4.0",
  "isort>=5.12.0",
  "mypy>=1.0.0",
  "bandit>=1.7.0",
  "safety>=2.3.0",
  "pip-audit>=2.0.0",
  "import-linter>=2.0.0"
]

[tool.setuptools.packages.find]
# 【TASK-05 新增 "cloudshu"】`python -m cloudshu` 是能力层的**非 LLM CLI 入口**
#   （v1.4 战略判据的"人"那一半）。**不登记在这里 ⇒ `pip install -e .` 之后
#   `python -m cloudshu` 会 ModuleNotFoundError** —— "本地能跑、装完就没了"。
where = ["agent", "sensor", "memory", "planning", "persona", "core", "cognitive", "lifetrace", "utils", "cloudshu"]
include = ["*"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
py_version = 310
include_trailing_comma = true
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
strict = false
warn_no_return = true       # 检测缺少 return 的函数（防止 f8a457f2 回归重演）
warn_return_any = true      # 检测返回 Any 类型的函数

# 关键模块严格模式（单例工厂 / 配置管理 —— 缺少 return 曾导致 P1 故障）
# 注：不使用 strict=true 避免跟踪导入的其他模块误报，仅启用 return 相关检查
# Why network_config 加入: 该模块大量调用 EnvConfigManager.set/delete，
#   若内部工厂方法（如 _save_secure 返回值）出现 return 缺失会引发同类 P1 故障。
#   2026-07-29 v1.2.1-fix-secure-manager-return 修复后纳入预防范围。
# 现状: env_config_manager CI 阻塞; network_config 非阻塞（29 个历史类型债，
#   详见 .github/workflows/ci.yml TODO 与 docs/dashboards/ci_health_dashboard.md）
[[tool.mypy.overrides]]
module = "agent.env_config_manager"
warn_no_return = true
warn_return_any = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "agent.network_config"
warn_no_return = true
warn_return_any = true
follow_imports = "silent"

# ══ 【TASK-03 · 2026-09-18 死配置清理】══════════════════════════════════════
# 此处原有 `[tool.pytest.ini_options]`（testpaths / addopts / filterwarnings）。
# Why 删除：pytest 的配置发现顺序是 `pytest.ini` > `pyproject.toml`
#   ([tool.pytest.ini_options]) > `tox.ini` > `setup.cfg`，根目录存在
#   `pytest.ini` ⇒ pyproject 这一段**从未生效**。实测证据（本机 pytest 9.1.1）：
#       $ python -m pytest tests/unit/test_settings_registry.py --collect-only -q
#       rootdir: C:\Users\Administrator\agent
#       configfile: pytest.ini (WARNING: ignoring pytest config in pyproject.toml!)
#   两条真相源最容易骗人的地方就在这里——改了 pyproject 却毫无效果，而人会以为
#   自己改了配置。按"二选一、保留真正生效者"的纪律删除死配置，保留 `pytest.ini`
#   （它含 11 条 `--ignore=`、`--timeout`、`--import-mode=importlib` 等真实生效项）。
#   注：`pytest.ini` 里的 `[coverage:run]` / `[coverage:report]` 两节同样是死配置
#   ——coverage.py 只读 `.coveragerc` / `setup.cfg` / `tox.ini` / `pyproject.toml`，
#   不读 `pytest.ini`；实际生效的是本文件下方的 `[tool.coverage.*]`。登记为债务，
#   见 docs/closeout/DEAD_CONFIG_20260918.md。
# ═════════════════════════════════════════════════════════════════════════════

[tool.coverage.run]
# ══ 【D1 · 2026-09-19 覆盖率口径统一】权威口径 = 下面的 9 个包 + 行覆盖 ══
# 本文件是覆盖率的**唯一真相源**：`pytest.ini` 里原有的 `[coverage:*]` 三节是
# 死配置（coverage.py 不读 pytest.ini），已删除，详见该文件末尾的说明。
#
# ⚠️ 换口径不是改这里就够了（实测机制，务必先读）：
#   coverage 的"未执行文件"是**采集期**由 tracer 的文件定位器扫描 `--cov=` 指定
#   的目录得到的；报告期 `coverage report` 会读本文件的 `source`，但**不会再补扫**
#   这些目录。最小复现（裸 coverage，2026-09-19）：
#       # pyproject: source = ["pkg_a", "pkg_b"]
#       coverage run runner.py               # 只 import pkg_a
#       coverage report   →  pkg_a 100% / pkg_b 0%     ← pkg_b 进了分母
#       coverage run --source=pkg_a runner.py
#       coverage report   →  只有 pkg_a                 ← pkg_b 完全消失
#   ⇒ **分母由采集期的 `--cov=` 决定，不由这里的 `source` 决定。**
#   本仓实测后果：只写 `--cov=agent` 时，这里的 9 包声明会静默退化成 1 包
#   （9 包分母 135,272 行 vs agent 单包 120,754 行）。
#   ⇒ 采集时必须逐个展开成 `--cov=<pkg>`：
#       · 权威命令：scripts/run_authoritative_coverage.py（自动读本文件，不会分叉）
#       · CI：.github/workflows/ci.yml 的 unit-tests 分片步骤（已按 9 包展开）
#       · 守卫测试：tests/unit/test_coverage_scope_consistency.py
#   【TASK-05】"cloudshu" 是能力层 CLI 包，**不是**被测业务包，故**不**加入
#   coverage source（加进来会稀释分母且无测试价值）。此处刻意保持 9 包不变。
source = ["agent", "sensor", "memory", "planning", "persona", "core", "cognitive", "lifetrace", "utils"]
# 【不易·P3-1】omit 口径：排除非业务代码，保证全项目覆盖率门禁聚焦 agent 业务层。
#   - */tests/*：测试代码自身不应计入分母。
#     必须用 */tests/*（fnmatch 中 * 可跨目录）而非 tests/*：
#     coverage .data 存的是运行时刻完整路径，CI 下为绝对路径
#     /home/runner/work/security-tools/security-tools/tests/...，
#     前缀模式 tests/* 无法匹配绝对路径 → omit 失效（2026-08-09 实测 38.02% 未排除）。
#   - */scripts/*：CI/运维/工具脚本层，387 个文件仅 28 个有测试覆盖（覆盖率 6.9%，
#     占 43.8% 有效行却严重稀释业务覆盖率）；已有 .coveragerc_scripts 独立跟踪体系
#   - 效果（基于 6-shard 合并数据模拟）：37.96% → 67.92%
#   - 注意：CI shard 的 --cov=scripts 数据将不再进入全项目 coverage.xml，
#     脚本层质量由 .coveragerc_scripts 的架构影响检查独立把关
omit = [
  "*/tests/*",
  "*/scripts/*",
]

[tool.coverage.report]
show_missing = true
# 【变易】fail_under=0：单文件/单模块测试（如 --cov=agent.knowledge 仅测 distill）
# 整体覆盖率必然偏低（34%），若按 40% 门槛会误报失败。真正的覆盖率门禁
# 由 .github/workflows/ci.yml 的 coverage-check job 对合并后的全量数据
# 以 --fail-under=40（env.COVERAGE_THRESHOLD）统一断言，此处不再重复设门槛。
# 【D1 · 2026-09-19 已确认这是"两处阈值"的口径分歧，本任务**故意未改**】：
#   分歧：本文件写 0，ci.yml 写 40（另有 test.yml 写 70、web-module-tests 写 100、
#         scripts/check_scripts_coverage.py 默认 50、observability-ci.yml:373 的
#         注释还声称"pyproject 里的 fail_under=40"——该注释已过期失真）。
#   为什么不能简单地把这里改成 40：pytest-cov 在没有显式 `--cov-fail-under` 时会
#         **继承** coverage 配置的 fail_under（实测源码
#         site-packages/pytest_cov/plugin.py:270-271），而仓库存量存在多个只写
#         `--cov=`、不写 `--cov-fail-under=` 的 job（如 tool-tests.yml:77、
#         daily_regression.yml:444）⇒ 改成 40 会让这些**子集** job 全部变红，
#         属于"改一处、炸多处"且本机不可验证的改动。
#   统一建议（含迁移步骤与守卫测试）见 docs/closeout/COVERAGE_SCOPE_20260919.md §5。
fail_under = 0