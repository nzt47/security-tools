[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Yunshu"
version = "2.0.0"
description = "云枢 - 一个拥有完整感知-认知-行动闭环的数字生命体"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Yunshu Team", email = "team@Yunshu.ai" }
]
maintainers = [
  { name = "Yunshu Team", email = "team@Yunshu.ai" }
]
requires-python = ">=3.10,<3.13"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = ["AI", "digital-life", "agent", "cognitive"]
dependencies = [
  "psutil>=5.9.0,<6.0.0",
  "openai>=1.0.0,<2.0.0",
  "anthropic>=0.30.0,<0.40.0",
  "tiktoken>=0.5.0,<0.7.0",
  "pyyaml>=6.0,<7.0",
  "torch>=2.0.0,<2.5.0",
  "torchvision>=0.15.0,<0.20.0",
  "torchaudio>=2.0.0,<2.5.0",
  "opencv-python-headless>=4.8.0,<5.0.0",
  "chromadb>=0.4.0,<0.5.0",
  "sentence-transformers>=2.2.0,<3.0.0",
  "numpy>=1.24.0,<2.0.0",
  "pyttsx3>=2.90,<2.92",
  "SpeechRecognition>=3.10.0,<3.11.0",
  "pyautogui>=0.9.53,<0.9.60",
  "pygetwindow>=0.0.9,<0.0.10",
  "pyperclip>=1.8.2,<1.9.0",
  "selenium>=4.15.0,<4.20.0",
  "lxml>=5.0.0,<6.0.0",
  "keyboard>=0.13.5,<0.14.0",
  "mouse>=0.7.1,<0.8.0",
  "pydub>=0.25.1,<0.26.0",
  "watchdog>=3.0.0,<4.0.0",
  "GPUtil>=1.4.0,<1.5.0",
  "pynvml>=11.0.0,<12.0.0",
  "flask>=3.0.0",
  "prometheus-flask-exporter>=0.23.0",
  "gunicorn>=21.2.0",
  "waitress>=3.0.0",
  "cryptography>=42.0.0",
  "jsonschema>=4.0.0,<5.0.0",
  "pypdf>=4.0.0,<6.0.0",
  "cssselect>=1.2.0,<2.0.0",
  "pdfplumber>=0.10.0,<0.12.0",
  # Windows-only 依赖（pyttsx3 的间接依赖）。
  # 使用 PEP 508 platform markers，在 Linux/macOS 上自动跳过，
  # 替代 CI workflow 中的 `grep -v 'pywin32|pypiwin32|comtypes'` 过滤方案。
  # 详见 docs/observability/ci_yml_workflow_fix_commit_record.md 附录 A
  "pywin32>=305; sys_platform == 'win32'",
  "pypiwin32>=223; sys_platform == 'win32'",
  "comtypes>=1.4.0; sys_platform == 'win32'",
  "wmi>=1.5.0,<1.6.0; sys_platform == 'win32'",
  "pythoncom>=0.0.1; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-mock>=3.10.0",
  "pytest-xdist>=3.0.0",
  "pytest-asyncio>=0.21.0",
  "flake8>=6.0.0",
  "black>=23.0.0",
  "isort>=5.12.0",
  "mypy>=1.0.0",
  "bandit>=1.7.0",
  "safety>=2.3.0",
  "pip-audit>=2.0.0",
  "import-linter>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["agent", "sensor", "memory", "planning", "persona", "core", "cognitive", "lifetrace", "utils"]
include = ["*"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
py_version = 310
include_trailing_comma = true
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
show_error_codes = true
strict = false
warn_no_return = true       # 检测缺少 return 的函数（防止 f8a457f2 回归重演）
warn_return_any = true      # 检测返回 Any 类型的函数

# 关键模块严格模式（单例工厂 / 配置管理 —— 缺少 return 曾导致 P1 故障）
# 注：不使用 strict=true 避免跟踪导入的其他模块误报，仅启用 return 相关检查
# Why network_config 加入: 该模块大量调用 EnvConfigManager.set/delete，
#   若内部工厂方法（如 _save_secure 返回值）出现 return 缺失会引发同类 P1 故障。
#   2026-07-29 v1.2.1-fix-secure-manager-return 修复后纳入预防范围。
# 现状: env_config_manager CI 阻塞; network_config 非阻塞（29 个历史类型债，
#   详见 .github/workflows/ci.yml TODO 与 docs/dashboards/ci_health_dashboard.md）
[[tool.mypy.overrides]]
module = "agent.env_config_manager"
warn_no_return = true
warn_return_any = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "agent.network_config"
warn_no_return = true
warn_return_any = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning"
]

[tool.coverage.run]
source = ["agent", "sensor", "memory", "planning", "persona", "core", "cognitive", "lifetrace", "utils"]

[tool.coverage.report]
show_missing = true
fail_under = 40