# ════════════════════════════════════════════════════════════════════════════
# [2026-10-02] 指标名对齐修复（(a) 类：代码里有相近但名字不同的指标）
# 【为什么改】原 expr 用 Yunshu_alert_total（大写 Y 开头），该指标在本部署从未注册：
#   agent/monitoring/prometheus.py:132 的 PrometheusMetricsExporter(namespace="Yunshu")
#   虽定义了它，但该 exporter 无生产实例化点（只有 routes_logging.py:93 的懒加载工厂
#   与测试引用）⇒ /metrics 上不存在该序列 ⇒ 两条告警恒不触发。
# 【映射依据】改成 app_server.py:542-546 直接暴露并被 job="yunshu" 采集的
#   yunshu_security_blocks_total（labels: rule/level/category），语义同为「按级别的安全拦截数」。
#   这与本仓既有修复保持一致：monitoring/alerts.yml:208-210 与
#   monitoring/recording_rules.yml:80-82 已做过同一替换。
#   写入点：plugins/chat.py:253-259（命中危险操作时 .labels(...).inc()）⇒ 可真正触发。
# 【回退方式】git checkout -- monitoring/prometheus/alert_rules.yml
#
# 【本文件其余未改动规则 —— 已核实为「本部署结构性恒空」，保留不删，原因如下】
#   Yunshu_v2_module_load_total / Yunshu_v2_module_load_duration_seconds / Yunshu_v2_module_enabled
#     (ModuleLoadFailure / ModuleLoadSlow / V2ModuleDisabled)：仅由上述从未实例化的
#     PrometheusMetricsExporter 定义，代码里没有小写或其它等价指标 ⇒ 无可用替代名。
#     属于「旧 V2 命名体系的遗留规则」；要让它们生效必须先给 exporter 接线（或改指向新埋点）。
#   Yunshu_interaction_total / Yunshu_interaction_duration_seconds_bucket
#     (InteractionRateHigh / InteractionTimeout)：
#     agent/monitoring/business_metrics.py:71 有 yunshu_interaction_total(单数)，
#     但业务指标只经 /api/business/prometheus 暴露，而该端点**不在任何 scrape 配置中**
#     （prometheus.yml 只有 yunshu/prometheus 两个 job）⇒ 换成小写名同样恒空，
#     故本次不做「换一个死名字」的假修复。histogram 侧更没有 _bucket（业务收集器只导出
#     _sum/_count/quantile 标签，见 business_metrics.py:1336-1347）⇒ histogram_quantile 永不成立。
#   Yunshu_memory_count (MemoryCountHigh)：同样只在未实例化的 exporter 中定义，无等价指标。
# ════════════════════════════════════════════════════════════════════════════
groups:
  - name: Yunshu_v2_security_alerts
    rules:
      # Critical 级别告警 - 危险操作拦截
      - alert: CriticalAlertDetected
        # 修复：原 Yunshu_alert_total{level="critical"} 从未注册；改用已采集且有写入点的真实指标。
        expr: sum(yunshu_security_blocks_total{level="critical"}) > 0
        for: 0m
        labels:
          severity: critical
          level: critical
        annotations:
          summary: "检测到危险操作被拦截"
          description: "云枢 V2 检测到危险操作（如 rm -rf /）被拦截，请立即检查系统状态。"
          value: "{{ $value }}"
          runbook_url: "http://localhost:3000/d/Yunshu-v2-dashboard"

      # Warning 级别告警 - 可疑操作检测
      - alert: WarningAlertDetected
        # 修复：同上，Yunshu_alert_total -> yunshu_security_blocks_total（level 标签语义一致）。
        expr: sum(yunshu_security_blocks_total{level="warning"}) > 5
        for: 5m
        labels:
          severity: warning
          level: warning
        annotations:
          summary: "检测到多个可疑操作"
          description: "云枢 V2 在过去 5 分钟内检测到超过 5 个可疑操作，请关注系统状态。"
          value: "{{ $value }}"

      # 模块加载失败告警
      - alert: ModuleLoadFailure
        expr: sum(rate(Yunshu_v2_module_load_total{status="failure"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          component: v2_modules
        annotations:
          summary: "V2 模块加载失败"
          description: "V2 模块（{{ $labels.module }}）加载失败，请检查模块依赖和配置。"
          value: "{{ $value }}"
          runbook_url: "http://localhost:3000/d/Yunshu-v2-dashboard"

  - name: Yunshu_v2_performance_alerts
    rules:
      # 模块加载耗时过长
      - alert: ModuleLoadSlow
        expr: histogram_quantile(0.95, sum(rate(Yunshu_v2_module_load_duration_seconds_bucket[5m])) by (le, module)) > 0.5
        for: 2m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "V2 模块加载耗时过长"
          description: "V2 模块 {{ $labels.module }} 加载耗时超过 500ms，可能影响系统性能。"
          value: "{{ $value | humanizeDuration }}"

      # 交互响应超时
      - alert: InteractionTimeout
        expr: histogram_quantile(0.95, sum(rate(Yunshu_interaction_duration_seconds_bucket[5m])) by (le)) > 3
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "交互响应超时"
          description: "95% 的交互响应时间超过 3 秒，可能存在性能瓶颈。"
          value: "{{ $value | humanizeDuration }}"

      # 交互速率异常
      - alert: InteractionRateHigh
        expr: sum(rate(Yunshu_interaction_total[5m])) > 50
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "交互速率异常高"
          description: "交互速率超过 50 次/秒，可能存在异常流量或系统压力过大。"
          value: "{{ $value }}"

  - name: Yunshu_v2_memory_alerts
    rules:
      # 记忆数量过多
      - alert: MemoryCountHigh
        expr: Yunshu_memory_count > 10000
        for: 10m
        labels:
          severity: warning
          component: memory
        annotations:
          summary: "记忆数量过多"
          description: "记忆数量超过 10000 条，建议进行记忆压缩或清理。"
          value: "{{ $value }}"

      # V2 模块状态异常
      - alert: V2ModuleDisabled
        expr: Yunshu_v2_module_enabled == 0
        for: 5m
        labels:
          severity: warning
          component: v2_modules
        annotations:
          summary: "V2 模块被禁用"
          description: "V2 模块 {{ $labels.module }} 当前被禁用，请检查模块配置和依赖。"
          value: "{{ $value }}"