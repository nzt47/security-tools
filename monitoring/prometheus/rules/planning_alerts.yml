# Prometheus Alert Rules — 规划引擎（阶段5 C1 灰度）
#
# 挂载位置: monitoring/prometheus/rules/planning_alerts.yml
# 来源: docs/zh/规划模块重构计划/阶段5_灰度上线监控大盘配置_20260813.md §四
#
# 【2026-08-30 修正】原文档化规则含 6 条告警，其中 4 条引用未注册指标：
#   planning.cost_total / planning.duration_ms / planning.plans.failed|total
#   —— PromQL 指标名不允许含 "."，且这些指标从未注册为 Prometheus 指标
#   （08-13 文档 §五.3 已自述"另立小任务"）。promtool check 实测报
#   "parse error: unexpected character: '.'"。因此本文件落地为
#   **引用真实已注册指标（agent/monitoring/prometheus.py 的
#   yunshu_intent_layer_total）的 2 条告警**；4 条成本/耗时/失败率告警
#   待指标注册后按文档补回（见清理报告 §21）。
#
# 验证命令:
#   promtool check rules monitoring/prometheus/rules/planning_alerts.yml

groups:
  - name: planning_alerts
    interval: 30s
    rules:
      # 错误率（引用已注册指标 yunshu_intent_layer_total，orchestrator 埋点 layer=llm/llm_error）
      - alert: PlanningLLMErrorRateHigh
        expr: sum(rate(yunshu_intent_layer_total{layer="llm_error"}[10m])) / sum(rate(yunshu_intent_layer_total{layer="llm"}[10m])) > 0.05
        for: 15m
        labels: {severity: warning, category: planning, layer: llm}
        annotations:
          summary: "LLM 错误率超过 5%（回退护栏）"
      # 流量异常（引用已注册指标，orchestrator 埋点 layer=planning）
      - alert: PlanningTrafficDrop
        expr: sum(rate(yunshu_intent_layer_total{layer="planning"}[10m])) < 0.1
        for: 30m
        labels: {severity: warning, category: planning, layer: traffic}
        annotations:
          summary: "规划引擎流量消失（回滚动作异常）"

  # 【挂起，待指标注册】以下 4 条按 08-13 文档定义，待 cost/duration/失败计数
  # 注册为合法 Prometheus 指标（business_metrics.py 另立小任务）后补回：
  #   - PlanningCostZero:    planning.cost_total == 0 and on() (sum(rate(yunshu_intent_layer_total{layer="planning"}[10m])) > 0.1)  for 30m
  #   - PlanningCostSpike:   increase(planning.cost_total[5m]) > 0.1  for 10m
  #   - PlanningDurationHigh: quantile(0.99, planning.duration_ms) > 30000  for 15m
  #   - PlanningFailureRateHigh: planning.plans.failed / planning.plans.total > 0.1  for 10m
