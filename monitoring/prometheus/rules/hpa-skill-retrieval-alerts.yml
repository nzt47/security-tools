# ════════════════════════════════════════════════════════════════════
#  HPA 技能检索服务告警规则 — CPU 使用率 + P99 延迟
#
#  生成时间: 2026-07-31
#  对齐配置:
#    - deploy/k8s/hpa.yaml: CPU 50% 扩容 / P99 40ms 扩容 / minReplicas=3, max=10
#    - monitoring/grafana/dashboards/skill-hpa-monitor.json
#    - deploy/k8s/prometheus-adapter-config.yaml
#
#  【不易】指标命名对齐:
#    - skill_match_latency_ms_bucket (prometheus_client Histogram, 代码定义)
#    - skill_match_count_total (prometheus_client Counter, 代码定义)
#    - container_cpu_usage_seconds_total (cAdvisor 标准)
#    - kube_pod_container_resource_limits / kube_deployment_status_replicas (kube-state-metrics)
#  【变易】分级告警: warning（HPA 触发线）/ critical（严重超标）
#  【简易】每条告警含 runbook_url 指向 Grafana 面板
#
#  部署: kubectl apply -f monitoring/prometheus/rules/hpa-skill-retrieval-alerts.yml
#         或拷贝到 Prometheus rules 目录 + reload
# ════════════════════════════════════════════════════════════════════

groups:
  # ════════════════════════════════════════════════════════════════════
  #  组 1: P99 延迟告警（核心业务指标）
  # ════════════════════════════════════════════════════════════════════
  - name: hpa_skill_p99_latency_alerts
    rules:
      # P99 超过 HPA 扩容阈值（40ms）— warning
      # 触发时 HPA 应已开始扩容，若副本数未增加需排查 Adapter
      - alert: SkillMatchP99High
        expr: histogram_quantile(0.99, sum(rate(skill_match_latency_ms_bucket{namespace="production"}[1m])) by (le, pod)) > 40
        for: 1m
        labels:
          severity: warning
          component: skill-retrieval
          metric_type: latency
          threshold: hpa-trigger
        annotations:
          summary: "技能检索 P99 延迟超过 HPA 扩容阈值 (40ms)"
          description: "Pod {{ $labels.pod }} P99 = {{ $value }}ms > 40ms，HPA 应已触发扩容。若副本数未增加，检查 Prometheus Adapter 指标可达性: kubectl get --raw /apis/custom.metrics.k8s.io/v1beta1/namespaces/production/pods/*/skill_match_latency_p99"
          value: "{{ $value }}ms"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"

      # P99 严重超标（80ms）— critical
      # 可能 HPA 扩容不足 / candidate_limit 未启用 / Pod 资源不足
      - alert: SkillMatchP99Critical
        expr: histogram_quantile(0.99, sum(rate(skill_match_latency_ms_bucket{namespace="production"}[1m])) by (le, pod)) > 80
        for: 2m
        labels:
          severity: critical
          component: skill-retrieval
          metric_type: latency
        annotations:
          summary: "技能检索 P99 延迟严重超标 (80ms)"
          description: "Pod {{ $labels.pod }} P99 = {{ $value }}ms > 80ms，持续 2 分钟。可能原因: (1) HPA 扩容不足 → kubectl get hpa -n production; (2) candidate_limit 未启用 → 检查 ConfigMap SKILLS_CANDIDATE_LIMIT=200; (3) Pod 资源不足 → kubectl top pods -n production"
          value: "{{ $value }}ms"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"

  # ════════════════════════════════════════════════════════════════════
  #  组 2: CPU 使用率告警
  # ════════════════════════════════════════════════════════════════════
  - name: hpa_skill_cpu_alerts
    rules:
      # CPU 超过 HPA 扩容阈值（50%）— warning
      # 对齐调整后的 hpa.yaml averageUtilization: 50
      - alert: SkillServiceCPUHigh
        expr: |
          sum(rate(container_cpu_usage_seconds_total{namespace="production",pod=~"skill-retrieval.*"}[1m])) by (pod)
          /
          sum(kube_pod_container_resource_limits{resource="cpu",namespace="production",pod=~"skill-retrieval.*"}) by (pod)
          > 0.5
        for: 2m
        labels:
          severity: warning
          component: skill-retrieval
          metric_type: cpu
          threshold: hpa-trigger
        annotations:
          summary: "技能检索服务 CPU 使用率超过 HPA 扩容阈值 (50%)"
          description: "Pod {{ $labels.pod }} CPU = {{ $value | humanizePercentage }} > 50%，持续 2 分钟。HPA 应已触发扩容。若未扩容，检查 Metrics Server: kubectl top pods -n production"
          value: "{{ $value | humanizePercentage }}"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"

      # CPU 严重过载（80%）— critical
      - alert: SkillServiceCPUCritical
        expr: |
          sum(rate(container_cpu_usage_seconds_total{namespace="production",pod=~"skill-retrieval.*"}[1m])) by (pod)
          /
          sum(kube_pod_container_resource_limits{resource="cpu",namespace="production",pod=~"skill-retrieval.*"}) by (pod)
          > 0.8
        for: 3m
        labels:
          severity: critical
          component: skill-retrieval
          metric_type: cpu
        annotations:
          summary: "技能检索服务 CPU 严重过载 (80%)"
          description: "Pod {{ $labels.pod }} CPU = {{ $value | humanizePercentage }} > 80%，持续 3 分钟。可能 HPA 扩容已达 maxReplicas 或 Pod 资源 limit 过低。检查: kubectl get hpa -n production; kubectl describe pod {{ $labels.pod }} -n production"
          value: "{{ $value | humanizePercentage }}"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"

  # ════════════════════════════════════════════════════════════════════
  #  组 3: HPA 扩容状态告警
  # ════════════════════════════════════════════════════════════════════
  - name: hpa_status_alerts
    rules:
      # HPA 达到 maxReplicas — 容量上限
      # 持续 5 分钟达 maxReplicas=10 说明流量超预期，需扩容集群或优化服务
      - alert: HPAMaxReplicasReached
        expr: kube_deployment_status_replicas{deployment="skill-retrieval-service",namespace="production"} >= 10
        for: 5m
        labels:
          severity: warning
          component: hpa
          metric_type: capacity
        annotations:
          summary: "HPA 已达 maxReplicas 上限 (10)"
          description: "skill-retrieval-service 副本数持续 5 分钟达到 maxReplicas=10，无法继续扩容。可能流量超预期，需: (1) 扩容集群节点; (2) 优化服务降低单副本负载; (3) 提高 maxReplicas（需评估集群容量）"
          value: "{{ $value }} replicas"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"

      # HPA 扩容停滞 — desired > current 持续 5m
      # 说明 Pod 创建失败（资源不足/镜像拉取失败/调度失败）
      - alert: HPAScaleUpStalled
        expr: |
          kube_hpa_status_current_replicas{hpa="skill-retrieval-hpa",namespace="production"}
          <
          kube_hpa_status_desired_replicas{hpa="skill-retrieval-hpa",namespace="production"}
        for: 5m
        labels:
          severity: warning
          component: hpa
          metric_type: scaling
        annotations:
          summary: "HPA 扩容停滞（desired > current 持续 5m）"
          description: "HPA desired replicas > current replicas 持续 5 分钟，Pod 创建可能失败。检查: kubectl get pods -n production -l app=skill-retrieval-service; kubectl describe pod -n production -l app=skill-retrieval-service"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"

      # Pod 非 Ready 持续 2m
      - alert: SkillServicePodNotReady
        expr: |
          kube_deployment_status_replicas{deployment="skill-retrieval-service",namespace="production"}
          -
          kube_deployment_status_ready_replicas{deployment="skill-retrieval-service",namespace="production"}
          > 0
        for: 2m
        labels:
          severity: critical
          component: skill-retrieval
          metric_type: availability
        annotations:
          summary: "技能检索服务有 Pod 未就绪"
          description: "skill-retrieval-service 有 {{ $value }} 个 Pod 未就绪持续 2 分钟。可能原因: 模型加载超时 / 健康检查失败 / OOMKilled。检查: kubectl describe pod -n production -l app=skill-retrieval-service; kubectl logs -n production -l app=skill-retrieval-service --tail=50"
          value: "{{ $value }} pods not ready"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"

  # ════════════════════════════════════════════════════════════════════
  #  组 4: 检索质量告警
  # ════════════════════════════════════════════════════════════════════
  - name: hpa_skill_quality_alerts
    rules:
      # 检索错误率高（>5%）
      - alert: SkillMatchErrorRateHigh
        expr: |
          sum(rate(skill_match_count_total{namespace="production",success="false"}[1m]))
          /
          sum(rate(skill_match_count_total{namespace="production"}[1m]))
          > 0.05
        for: 2m
        labels:
          severity: warning
          component: skill-retrieval
          metric_type: error_rate
        annotations:
          summary: "技能检索错误率超过 5%"
          description: "检索错误率 = {{ $value | humanizePercentage }} > 5%，持续 2 分钟。检查: (1) 向量后端可用性 sqlite-vec; (2) 模型加载状态; (3) Pod 日志: kubectl logs -n production -l app=skill-retrieval-service --tail=100"
          value: "{{ $value | humanizePercentage }}"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"

      # QPS 突降（可能服务异常）
      # 当前 QPS < 5 分钟前 QPS 的 50%
      - alert: SkillMatchQPSDrop
        expr: |
          sum(rate(skill_match_count_total{namespace="production"}[1m]))
          <
          sum(rate(skill_match_count_total{namespace="production"}[1m] offset 5m])) * 0.5
          and
          sum(rate(skill_match_count_total{namespace="production"}[1m] offset 5m])) > 10
        for: 3m
        labels:
          severity: warning
          component: skill-retrieval
          metric_type: traffic
        annotations:
          summary: "技能检索 QPS 突降（<5分钟前的 50%）"
          description: "当前 QPS 相比 5 分钟前下降超过 50%，可能服务异常或流量被拦截。检查: kubectl get svc skill-retrieval-service -n production; kubectl get pods -n production -l app=skill-retrieval-service"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"
