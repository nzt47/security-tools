# ════════════════════════════════════════════════════════════════════
#  HPA 技能检索服务告警规则 — CPU 使用率 + P99 延迟
#
#  生成时间: 2026-07-31
#  对齐配置:
#    - deploy/k8s/hpa.yaml: CPU 50% 扩容 / P99 40ms 扩容 / minReplicas=3, max=10
#    - monitoring/grafana/dashboards/skill-hpa-monitor.json
#    - deploy/k8s/prometheus-adapter-config.yaml
#
#  【不易】指标命名对齐:
#    - skill_match_latency_ms_bucket (prometheus_client Histogram, 代码定义)
#    - skill_match_count_total (prometheus_client Counter, 代码定义)
#    - container_cpu_usage_seconds_total (cAdvisor 标准)
#    - kube_pod_container_resource_limits / kube_deployment_status_replicas (kube-state-metrics)
#
#  ⚠️⚠️ [2026-10-02 核实] 本部署**未部署** kube-state-metrics / cAdvisor ⚠️⚠️
#    ⇒ 下列 6 个指标名在本仓与运行栈中【完全不存在】，引用它们的 5 条告警在本部署
#       **结构性恒空、永不触发**。本次**不删除**这些规则（保留供 K8s 生产集群复用），
#       仅就地标注，避免下一个人再查一遍。判定依据（实测，非阅读推断）：
#        1) monitoring/prometheus.yml 的 scrape_configs 只有 2 个 job：yunshu、prometheus
#           （无 cadvisor / kube-state-metrics / node-exporter）。
#        2) 全仓 .py 非注释代码 0 处定义这些名字；仅在 docs/ 与 security-tools/ 的
#           镜像副本里作为文本出现（脚本 scripts/k8s_preflight_check.sh:154-163 亦以
#           "未找到 kube-state-metrics" 为预期分支，佐证本仓默认无该组件）。
#        3) 本文件第 8 行自述的部署方式（kubectl apply 到 K8s 集群）与本仓 docker-compose
#           栈不是同一套环境；这些规则只在真正具备 kube-state-metrics/cAdvisor 的集群里有效。
#    缺失指标名清单（6 个）：
#      container_cpu_usage_seconds_total, kube_pod_container_resource_limits,
#      kube_deployment_status_replicas, kube_deployment_status_ready_replicas,
#      kube_hpa_status_current_replicas, kube_hpa_status_desired_replicas
#    受影响告警（5 条）：SkillServiceCPUHigh, SkillServiceCPUCritical,
#      HPAMaxReplicasReached, HPAScaleUpStalled, SkillServicePodNotReady
#    【回退方式】git checkout -- monitoring/prometheus/rules/hpa-skill-retrieval-alerts.yml
#      （本次对该文件仅新增注释，expr 一字未改）
#  【变易】分级告警: warning（HPA 触发线）/ critical（严重超标）
#  【简易】每条告警含 runbook_url 指向 Grafana 面板
#
#  部署: kubectl apply -f monitoring/prometheus/rules/hpa-skill-retrieval-alerts.yml
#         或拷贝到 Prometheus rules 目录 + reload
# ════════════════════════════════════════════════════════════════════

groups:
  # ════════════════════════════════════════════════════════════════════
  #  组 1: P99 延迟告警（核心业务指标）
  # ════════════════════════════════════════════════════════════════════
  - name: hpa_skill_p99_latency_alerts
    rules:
      # P99 超过 HPA 扩容阈值（40ms）— warning
      # 触发时 HPA 应已开始扩容，若副本数未增加需排查 Adapter
      - alert: SkillMatchP99High
        expr: histogram_quantile(0.99, sum(rate(skill_match_latency_ms_bucket{namespace="production"}[1m])) by (le, pod)) > 40
        for: 1m
        labels:
          severity: warning
          component: skill-retrieval
          metric_type: latency
          threshold: hpa-trigger
        annotations:
          summary: "技能检索 P99 延迟超过 HPA 扩容阈值 (40ms)"
          description: "Pod {{ $labels.pod }} P99 = {{ $value }}ms > 40ms，HPA 应已触发扩容。若副本数未增加，检查 Prometheus Adapter 指标可达性: kubectl get --raw /apis/custom.metrics.k8s.io/v1beta1/namespaces/production/pods/*/skill_match_latency_p99"
          value: "{{ $value }}ms"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"

      # P99 严重超标（80ms）— critical
      # 可能 HPA 扩容不足 / candidate_limit 未启用 / Pod 资源不足
      - alert: SkillMatchP99Critical
        expr: histogram_quantile(0.99, sum(rate(skill_match_latency_ms_bucket{namespace="production"}[1m])) by (le, pod)) > 80
        for: 2m
        labels:
          severity: critical
          component: skill-retrieval
          metric_type: latency
        annotations:
          summary: "技能检索 P99 延迟严重超标 (80ms)"
          description: "Pod {{ $labels.pod }} P99 = {{ $value }}ms > 80ms，持续 2 分钟。可能原因: (1) HPA 扩容不足 → kubectl get hpa -n production; (2) candidate_limit 未启用 → 检查 ConfigMap SKILLS_CANDIDATE_LIMIT=200; (3) Pod 资源不足 → kubectl top pods -n production"
          value: "{{ $value }}ms"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"

  # ════════════════════════════════════════════════════════════════════
  #  【2026-10-02 已删除】组 2「CPU 使用率告警」与组 3「HPA 状态告警」
  #
  #  删掉的 5 条：SkillServiceCPUHigh / SkillServiceCPUCritical /
  #              HPAMaxReplicasReached / HPAScaleUpStalled / SkillServicePodNotReady
  #
  #  【为什么删】它们**全部**依赖本部署不存在的采集器：
  #    · container_cpu_usage_seconds_total / kube_pod_container_resource_limits
  #      ⇒ cAdvisor + kube-state-metrics（本仓无任何 k8s 采集配置）
  #    · kube_deployment_status_replicas / _ready_replicas
  #      / kube_hpa_status_current_replicas / _desired_replicas
  #      ⇒ kube-state-metrics
  #    实测：这些名字拿去全仓 .py 非注释行搜索，命中 **0**；prometheus.yml 也无对应 job。
  #  ⇒ 留着不是「严格」，而是**假的覆盖率**：它们红/绿都不反映任何真实状态，
  #    却会让人以为「技能检索服务的 CPU 与 HPA 已被监控」。
  #
  #  【保留了什么】组 1（P99 延迟）与组 4（检索质量）**未动** ——
  #    其指标 skill_match_latency_ms_bucket / skill_match_count_total 由
  #    agent/monitoring/prometheus.py:664/673 真实定义，且实测存在于 /metrics。
  #
  #  【要恢复怎么办】从 git 历史取回本段，**并同时**部署 kube-state-metrics / cAdvisor
  #    （采集面与规则一起上线），否则恢复回来的仍是恒不触发的规则。
  # ════════════════════════════════════════════════════════════════════
  # ════════════════════════════════════════════════════════════════════
  #  组 4: 检索质量告警
  # ════════════════════════════════════════════════════════════════════
  - name: hpa_skill_quality_alerts
    rules:
      # 检索错误率高（>5%）
      - alert: SkillMatchErrorRateHigh
        expr: |
          sum(rate(skill_match_count_total{namespace="production",success="false"}[1m]))
          /
          sum(rate(skill_match_count_total{namespace="production"}[1m]))
          > 0.05
        for: 2m
        labels:
          severity: warning
          component: skill-retrieval
          metric_type: error_rate
        annotations:
          summary: "技能检索错误率超过 5%"
          description: "检索错误率 = {{ $value | humanizePercentage }} > 5%，持续 2 分钟。检查: (1) 向量后端可用性 sqlite-vec; (2) 模型加载状态; (3) Pod 日志: kubectl logs -n production -l app=skill-retrieval-service --tail=100"
          value: "{{ $value | humanizePercentage }}"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"

      # QPS 突降（可能服务异常）
      # 当前 QPS < 5 分钟前 QPS 的 50%
      - alert: SkillMatchQPSDrop
        expr: |
          sum(rate(skill_match_count_total{namespace="production"}[1m]))
          <
          sum(rate(skill_match_count_total{namespace="production"}[1m] offset 5m)) * 0.5
          and
          sum(rate(skill_match_count_total{namespace="production"}[1m] offset 5m)) > 10
        for: 3m
        labels:
          severity: warning
          component: skill-retrieval
          metric_type: traffic
        annotations:
          summary: "技能检索 QPS 突降（<5分钟前的 50%）"
          description: "当前 QPS 相比 5 分钟前下降超过 50%，可能服务异常或流量被拦截。检查: kubectl get svc skill-retrieval-service -n production; kubectl get pods -n production -l app=skill-retrieval-service"
          runbook_url: "http://localhost:3000/d/skill-hpa-monitor"
