# Prometheus Alert Rules — 运行时锁看门狗（C2）
#
# 挂载位置: monitoring/prometheus/rules/lock_watchdog_alerts.yml
# 指标来源 (agent/monitoring/lock_watchdog.py):
#   - yunshu_lock_hold_timeouts_total{lock_name}   (counter, 持锁超时次数)
#   - yunshu_lock_wait_timeouts_total{lock_name}   (counter, 锁等待超时次数)
#   - yunshu_lock_hold_duration_ms{lock_name}      (histogram, 持锁时长分布)
#
# 设计语义（不易）:
#   - 计数 > 0 即违规: 持锁超时/等待超时在正常路径应为 0（锁纪律护栏）
#   - 阈值可经 .env 调整: LOCK_WATCHDOG_HOLD_MS / LOCK_WATCHDOG_WAIT_MS
#
# 验证命令:
#   promtool check rules monitoring/prometheus/rules/lock_watchdog_alerts.yml

# ── 【2026-10-02 · 交付报告 §10 A-4】本文件的两条规则**仅在看门狗开启后有效** ──
#   LOCK_WATCHDOG_ENABLED 默认 0（关闭）时 LockWatchdog 根本不运行，而
#   yunshu_lock_hold_timeouts_total / yunshu_lock_wait_timeouts_total 这两个名字是
#   **由看门狗在运行时注册**的 ⇒ 默认部署下 /metrics 里连名字都没有 ⇒ 两条规则恒不触发。
#   这不是缺陷（默认关闭 = 生产零开销，是有意设计），但**不要让规则条数被当成活的覆盖率**：
#   这里 2 条属于「开关打开才有意义」的规则。
#   开启：.env 里 LOCK_WATCHDOG_ENABLED=1 后重启；阈值 LOCK_WATCHDOG_HOLD_MS / LOCK_WATCHDOG_WAIT_MS。
groups:
  - name: lock_watchdog_alerts
    interval: 30s
    rules:
      # 持锁超时 = 锁纪律违规（锁内出现 I/O/阻塞调用），critical 立即处理
      - alert: LockHoldTimeout
        expr: increase(yunshu_lock_hold_timeouts_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
          category: concurrency
        annotations:
          summary: "持锁超时（锁纪律违规）"
          description: "检测到持锁时长超过 LOCK_WATCHDOG_HOLD_MS 阈值的锁 {{ $labels.lock_name }}。持锁期间疑似执行了 I/O/阻塞操作，需按持锁纪律修复。"

      # 锁等待超时 = 潜在死锁/饥饿，warning 关注
      - alert: LockWaitTimeout
        expr: increase(yunshu_lock_wait_timeouts_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
          category: concurrency
        annotations:
          summary: "锁等待超时（潜在死锁/饥饿）"
          description: "锁 {{ $labels.lock_name }} 的等待时长超过 LOCK_WATCHDOG_WAIT_MS 阈值，存在死锁或线程饥饿风险，请检查锁获取顺序与持有时间。"
