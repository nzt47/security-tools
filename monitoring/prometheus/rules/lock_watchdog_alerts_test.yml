# promtool test rules 单元测试 — lock_watchdog_alerts
#
# 运行: promtool test rules monitoring/prometheus/rules/lock_watchdog_alerts_test.yml
# 覆盖：LockHoldTimeout / LockWaitTimeout 的触发（increase>0 + for:5m）与不触发场景。
# 语义说明（与真实 Prometheus 一致）：
#   - 输入序列 values 按 interval=5m 逐点采样（eval_time=30m → 7 个点）；
#   - 触发用例用**持续递增**计数（0,0,1,2,3,4,5）：任意 10m 窗口 increase>=1
#     恒真，与首个采样点落在 t=0 还是 t=interval 无关（promtool 实测对时序
#     偏移敏感），30m 处必然已满足 for:5m 转为 firing；
#   - 不触发用例计数恒 0，increase 恒 0。
#
# 2026-08-30 新增（Issue #681 本地验证加固；CI 由 promtool 校验步骤执行）。
# 2026-08-30 修正：触发用例 values 由 '0 0 0 0 0 1 1' 改为递增序列（实测
#   got:[]——单次 0→1 的 increase 窗口随求值滚动滑出，且采样点起点偏移使
#   pending 未满 5m；递增计数保证语义稳健）。

rule_files:
  - lock_watchdog_alerts.yml

evaluation_interval: 5m

tests:
  # ── LockHoldTimeout：计数持续递增触发（critical） ──
  - name: LockHoldTimeout_fires
    interval: 5m
    input_series:
      - series: 'yunshu_lock_hold_timeouts_total{lock_name="test_lock"}'
        values: '0 0 1 2 3 4 5'
    alert_rule_test:
      - eval_time: 30m
        alertname: LockHoldTimeout
        exp_alerts:
          - exp_labels:
              lock_name: test_lock
              severity: critical
              category: concurrency
            exp_annotations:
              summary: "持锁超时（锁纪律违规）"
              description: "检测到持锁时长超过 LOCK_WATCHDOG_HOLD_MS 阈值的锁 test_lock。持锁期间疑似执行了 I/O/阻塞操作，需按持锁纪律修复。"

  # ── LockHoldTimeout：计数恒 0 不触发 ──
  - name: LockHoldTimeout_no_fire
    interval: 5m
    input_series:
      - series: 'yunshu_lock_hold_timeouts_total{lock_name="test_lock"}'
        values: '0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 30m
        alertname: LockHoldTimeout
        exp_alerts: []

  # ── LockWaitTimeout：计数持续递增触发（warning） ──
  - name: LockWaitTimeout_fires
    interval: 5m
    input_series:
      - series: 'yunshu_lock_wait_timeouts_total{lock_name="test_lock"}'
        values: '0 0 1 2 3 4 5'
    alert_rule_test:
      - eval_time: 30m
        alertname: LockWaitTimeout
        exp_alerts:
          - exp_labels:
              lock_name: test_lock
              severity: warning
              category: concurrency
            exp_annotations:
              summary: "锁等待超时（潜在死锁/饥饿）"
              description: "锁 test_lock 的等待时长超过 LOCK_WATCHDOG_WAIT_MS 阈值，存在死锁或线程饥饿风险，请检查锁获取顺序与持有时间。"

  # ── LockWaitTimeout：计数恒 0 不触发 ──
  - name: LockWaitTimeout_no_fire
    interval: 5m
    input_series:
      - series: 'yunshu_lock_wait_timeouts_total{lock_name="test_lock"}'
        values: '0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 30m
        alertname: LockWaitTimeout
        exp_alerts: []
