# Prometheus Alert Rules — v6 Query 模式识别监控
#
# 适用版本: v6 query_pattern (commit 244b49d7)
# 维护责任人: skills_mgmt 模块 owner
# 挂载位置: /etc/prometheus/rules/yunshu-v6-query-pattern-alerts.yml
#
# 告警分级:
#   P0 (critical): 立即处理（ PagerDuty / 电话通知）
#   P1 (warning):  1 小时内处理（IM 通知）
#   P2 (info):     观察记录（日报汇总）
#
# 指标来源:
#   - skill_match_count_total{method="query_pattern"}  (gauge, v6 命中时上报 value=0)
#   - skill_match_count_total{method="rrf_rerank"}       (gauge, 走 RRF 时上报)
#   - yunshu_skill_match_latency_ms                      (histogram)
#   - yunshu_query_pattern_hits_total{category="..."}    (counter, v6.1 建议新增)
#   - yunshu_query_pattern_duration_ms                   (histogram, v6.1 建议新增)
#
# 日志来源（ELK/Loki 查询）:
#   action="match.query_pattern.rejected"  (loader.py L306)
#   action="match.rrf_fallback_to_tfidf"   (loader.py L411)
#   action="match.extension_not_implemented" (loader.py L472)
#
# 验证命令:
#   promtool check rules yunshu-v6-query-pattern-alerts.yml
#   promtool test rules test-yunshu-v6-alerts.yml

groups:
  # ── 【2026-10-02 · 交付报告 §10 A-3】P0 组已**删除**（该组只有 1 条）──
  #   删的是 YunshuV6PositivePrecisionDropped：它依赖 yunshu_skill_retrieval_precision_at_k，
  #   而该指标**没有任何产出方** —— emit 只在 report_retrieval_observability(precision_at_k=...)
  #   里被调用，而 4 处调用点（loader 3 + context_injector 1）都没传该参数 ⇒ 指标从不出现。
  #   【为什么"让 eval 脚本发一下"不行】/api/business/prometheus 读的是**本进程内**的单例
  #   BusinessMetricsCollector，而 scripts/eval_rrf_fusion.py 是**离线进程**，它发的指标到不了线上端点。
  #   恢复路径：先让**服务进程内**的评估路径算出 P@K（需要带标注的评估集）并调用 emit，
  #   再用 `git show <删除本次的提交>^:monitoring/prometheus/rules/yunshu-v6-query-pattern-alerts.yml`
  #   取回本组。删掉它的理由很简单：恒不触发的规则会让"告警覆盖率"变成假的。

  # ════════════════════════════════════════════════════════════
  #  P1 级告警（warning）— 1 小时内处理
  # ════════════════════════════════════════════════════════════
  - name: yunshu_v6_query_pattern_p1
    interval: 30s
    rules:
      # ── P1-1: 某类别命中率归零（规则可能失效）──
      # 条件: 某 category 30 分钟内 0 命中
      - alert: YunshuV6RRFDegradationSurge
        expr: |
          (
            sum(rate(skill_match_count_total{method="rrf_rerank"}[5m]))
            /
            clamp_min(
              avg_over_time(sum(rate(skill_match_count_total{method="rrf_rerank"}[5m]))[1h:5m]),
              0.001
            )
          ) > 2.0
        for: 10m
        labels:
          severity: warning
          level: P1
          team: skills_mgmt
          runbook: docs/V6_MONITORING_CONFIG_CHECKLIST.md
        annotations:
          summary: "v6 RRF 降级次数激增（基线 200%+）"
          description: |
            query_pattern 可能失效，导致大量请求回退到 RRF+Reranker 路径。
            影响: GPU 占用上升，延迟增加（580ms vs 5ms）。
            排查:
              1. 检查 SKILL_QUERY_PATTERN_ENABLED 是否被禁用
              2. 检查 _QUERY_PATTERNS 是否被误删
              3. 检查调用方是否未传 use_reranker=True

  # ════════════════════════════════════════════════════════════
  #  P2 级告警（info）— 观察记录
  # ════════════════════════════════════════════════════════════
  - name: yunshu_v6_query_pattern_p2
    interval: 5m
    rules:
      # ── P2-1: 单类别占比异常（可能规则过宽）──
      # 条件: 某 category 占比 > 60%，持续 30 分钟
      - alert: YunshuV6FallbackFrequent
        expr: |
          # [2026-10-02] 原选择器 reason="extension_not_implemented" 在现行代码中已不存在
          #   （该 action 只在 refactor_archive，且 tests/unit/test_skills_mgmt.py:441-455
          #    明确断言「不应再出现 extension_not_implemented」）⇒ 改用 reason=~".+" 命中任意降级原因。
          sum(rate(yunshu_skill_match_fallback_total{reason=~".+"}[10m])) > 0.167
        for: 10m
        labels:
          severity: info
          level: P2
          team: skills_mgmt
          runbook: docs/V6_MONITORING_CONFIG_CHECKLIST.md
        annotations:
          summary: "v6 extension_not_implemented 频繁（>10 次/分钟）"
          description: |
            调用方可能误传 use_vector/use_reranker=True 但未传 fusion_mode。
            排查:
              kubectl logs -n yunshu <pod> | grep "match.extension_not_implemented" | jq -r '.intent' | head -20


  # ── 【2026-10-02 · 交付报告 §10 A-2/A-3】整组 yunshu_v62_negative_intent_alerts（5 条）已**删除** ──
  #   ① 结构性死（3 条）：YunshuV62NegativeIntentFalseReject / YunshuV62HitRateSurged / YunshuV62Disabled
  #      都用 skill_match_count_total{method="negative_intent"}，而 method 的真实取值只有
  #      tfidf / vector / rrf / rrf_rerank（loader.py:785/980/2140/2215）⇒ 该标签值**从不出现**，
  #      无论系统怎么跑都不会触发。
  #   ② 有指标没数据（2 条）：YunshuV62DetectorDegrading / YunshuV62LatencyHigh 用的
  #      yunshu_negative_intent_detector_failed_total / yunshu_negative_intent_duration_ms 虽已登记，
  #      但 NegativeIntentDetector 在本仓**没有生产调用方**（loader 里的懒加载钩子随 commit 1159d88f 被删）
  #      ⇒ 永远没有增量。
  #   （原 P2-3「环境变量被禁用」的注释也一并删除：它描述的就是上面第 3 条规则，
  #     且 SKILL_NEGATIVE_INTENT_ENABLED 在本仓同样没有读取方。）
  #   恢复路径：① 按 docs/refactor_archive/loader_v6_query_patterns_1159d88f-prior.py 把检测器接线回
  #   loader（并补 SKILL_NEGATIVE_INTENT_ENABLED 的读取），② 再用
  #   `git show <删除本次的提交>^:monitoring/prometheus/rules/yunshu-v6-query-pattern-alerts.yml` 取回本组。
