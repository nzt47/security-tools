# ── 【2026-10-02 · 交付报告 §10 B-1/E-1】本文件是**失效的历史快照**，请勿用它起栈 ──
#   两份能用的是仓库根目录的 docker-compose.monitoring.yml（及 .aliyun.yml 变体）。
#   本文件为什么不能用：它是从仓库根执行时把 ./monitoring/... 解析成 monitoring/monitoring/...
#   （挂载路径不存在）；且 Grafana 看板挂的是已不再被加载的 monitoring/grafana_dashboards/。
#   回退=删除本注释；恢复使用=把挂载路径改成仓库根相对路径，并同步 rule_files 的 14 个文件。
version: '3.8'

services:
  # Prometheus 指标采集器
  prometheus:
    image: prom/prometheus:latest
    container_name: Yunshu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana 可视化仪表盘
  grafana:
    image: grafana/grafana:latest
    container_name: Yunshu-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana_dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana_datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
