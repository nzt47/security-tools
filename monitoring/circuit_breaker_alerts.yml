# 三级熔断器 Prometheus 告警规则
#
# 指标来源（agent/monitoring/business_metrics.py）：
#   - yunshu_circuit_breaker_trigger_total (counter)
#       labels: breaker_name, from_state, to_state, reason
#   - yunshu_circuit_breaker_state (gauge)
#       labels: breaker_name, state
#   - yunshu_degrade_trigger_total (counter)
#       labels: module, level, reason
#   - yunshu_rate_limit_trigger_total (counter)
#       labels: level, endpoint, user_id, reason
#
# 对应部署检查清单第六章「上线后监控」
# 技术文档：docs/circuit_breaker_and_log_redaction.md
# 发布说明：docs/RELEASE_NOTES_circuit_breaker.md

groups:
  # ── 1. 熔断器状态告警 ──────────────────────────────────────
  - name: circuit_breaker_state
    interval: 30s
    rules:
      # 1.1 GLOBAL 级熔断触发（影响全局，需立即处理）
      - alert: CircuitBreakerGlobalTriggered
        expr: |
          increase(yunshu_circuit_breaker_trigger_total{to_state="open"}[5m]) > 0
          and on()
          yunshu_circuit_breaker_state{state="open"} > 0
        for: 0m
        labels:
          severity: critical
          category: stability
          scope: global
          service: circuit_breaker
        annotations:
          summary: "GLOBAL 级熔断器已触发"
          description: "熔断器 {{ $labels.breaker_name }} 进入 OPEN 状态，影响全局工具调用"
          runbook_url: "docs/circuit_breaker_and_log_redaction.md#熔断器状态转换"
          impact: "全局工具调用被拒绝，影响所有用户"
          action: "1. 检查下游依赖健康状态 2. 查看 tool_trace 日志定位故障工具 3. 必要时执行 git revert c19f0cf7 回滚"

      # 1.2 熔断器频繁触发（5 分钟内 > 3 次）
      - alert: CircuitBreakerFrequentTrigger
        expr: increase(yunshu_circuit_breaker_trigger_total[5m]) > 3
        for: 1m
        labels:
          severity: warning
          category: stability
          service: circuit_breaker
        annotations:
          summary: "熔断器频繁触发"
          description: "熔断器 {{ $labels.breaker_name }} 在 5 分钟内触发 {{ $value | printf \"%.0f\" }} 次"
          runbook_url: "docs/circuit_breaker_and_log_redaction.md#级联短路触发"
          impact: "工具调用稳定性下降，可能影响用户体验"
          action: "检查 {{ $labels.breaker_name }} 对应的下游服务，分析 from_state/to_state 转换路径"

      # 1.3 熔断器长时间处于 OPEN 状态（> 10 分钟未恢复）
      - alert: CircuitBreakerStuckOpen
        expr: |
          yunshu_circuit_breaker_state{state="open"} == 1
          and on(breaker_name)
          (time() - yunshu_circuit_breaker_state{state="open"}) > 600
        for: 0m
        labels:
          severity: warning
          category: stability
          service: circuit_breaker
        annotations:
          summary: "熔断器长时间未恢复"
          description: "熔断器 {{ $labels.breaker_name }} 处于 OPEN 状态超过 10 分钟"
          runbook_url: "docs/circuit_breaker_and_log_redaction.md#三状态转换"
          impact: "工具持续不可用，冷却恢复机制可能失效"
          action: "1. 检查 recovery_timeout 配置 2. 验证半开探测是否正常执行 3. 手动触发探测请求"

      # 1.4 熔断器恢复失败循环（HALF_OPEN → OPEN 反复切换）
      - alert: CircuitBreakerRecoveryLoop
        expr: |
          increase(yunshu_circuit_breaker_trigger_total{from_state="half_open", to_state="open"}[10m]) > 3
        for: 2m
        labels:
          severity: warning
          category: stability
          service: circuit_breaker
        annotations:
          summary: "熔断器恢复失败循环"
          description: "熔断器 {{ $labels.breaker_name }} 在 HALF_OPEN → OPEN 之间循环 {{ $value | printf \"%.0f\" }} 次"
          runbook_url: "docs/circuit_breaker_and_log_redaction.md#半开探测"
          impact: "熔断器无法恢复正常状态，工具持续不可用"
          action: "1. 检查半开探测请求是否正确执行 2. 验证下游服务是否真正恢复 3. 考虑手动重置熔断器"

  # ── 2. USER 级熔断告警 ────────────────────────────────────
  - name: circuit_breaker_user_level
    interval: 30s
    rules:
      # 2.1 USER 级熔断触发（单用户高危工具冷却）
      - alert: CircuitBreakerUserLevelTriggered
        expr: |
          increase(yunshu_circuit_breaker_trigger_total{breaker_name=~".*user.*"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          category: stability
          scope: user
          service: circuit_breaker
        annotations:
          summary: "USER 级熔断器触发"
          description: "用户级熔断器 {{ $labels.breaker_name }} 触发，原因: {{ $labels.reason }}"
          runbook_url: "docs/circuit_breaker_and_log_redaction.md#级联短路触发"
          impact: "单用户高危工具调用被拒绝，冷却 300s"
          action: "检查用户操作历史，确认是否为异常行为"

  # ── 3. 降级与限流告警 ─────────────────────────────────────
  - name: circuit_breaker_degrade_ratelimit
    interval: 30s
    rules:
      # 3.1 降级频繁触发（5 分钟内 > 5 次）
      - alert: DegradeFrequentTrigger
        expr: increase(yunshu_degrade_trigger_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
          category: stability
          service: degrade
        annotations:
          summary: "降级频繁触发"
          description: "模块 {{ $labels.module }} 在 5 分钟内触发降级 {{ $value | printf \"%.0f\" }} 次"
          impact: "系统容错能力下降，部分功能不可用"
          action: "检查模块 {{ $labels.module }} 的依赖健康状态"

      # 3.2 限流频繁触发（5 分钟内 > 10 次）
      - alert: RateLimitFrequentTrigger
        expr: increase(yunshu_rate_limit_trigger_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
          category: stability
          service: rate_limit
        annotations:
          summary: "限流频繁触发"
          description: "端点 {{ $labels.endpoint }} 在 5 分钟内触发限流 {{ $value | printf \"%.0f\" }} 次"
          impact: "用户请求被拒绝，影响用户体验"
          action: "1. 检查流量是否异常 2. 评估是否需要调整限流阈值 3. 考虑扩容"

  # ── 4. 配置漂移检测（基于指标缺失）────────────────────────
  - name: circuit_breaker_config_drift
    interval: 60s
    rules:
      # 4.1 熔断器指标缺失（配置可能被移除）
      #
      # 【2026-10-03 修 · 表达式缺陷】原式为
      #     expr: absent(yunshu_circuit_breaker_state) or absent(yunshu_circuit_breaker_trigger_total)
      #   【为什么它是错的】`or` 的语义是"任一边非空即非空"，于是把"其中一条序列**天然**缺席"
      #   误当成"熔断器指标缺失"。而 yunshu_circuit_breaker_trigger_total 是 **counter**：
      #   埋点侧（agent/monitoring/business_metrics.py::_on_circuit_breaker_state）只在
      #   `old_state is not None`（= 真的发生了一次状态转换）时才写它 ⇒ 一个健康的熔断器
      #   长期停在 CLOSED、可能几天不转换 ⇒ 这条序列**可以几天不存在**。
      #   后果：只要它不存在，`or` 的结果就恒为 1 ⇒ 告警一旦 firing 就**永远不会 resolved**。
      #   实测（C-2 3.97h 长跑 docs/closeout/监控清理_evidence_20261002/c2_longrun_report.md §3.3）：
      #     pending @T+89.7s → firing @T+389.7s → 窗口末（最后一个样本 T+14370.9s）仍 firing，
      #     而应用早在 T+269.7s 就恢复了（up{job="yunshu"}=1、业务端点可抓）。
      #   【为什么改成 and】`A and B` 只返回"两边都有匹配元素"的那些元素 ⇒ 只有
      #   **两条序列都不存在**才算"未采集到熔断器指标"，这与本规则 description / action 的字面
      #   意图（config.py 里 circuit_breaker 字段被移除、模块未加载、/metrics 无输出）一致。
      #   【回归防线】monitoring/prometheus/rules/circuit_breaker_alerts_test.yml：
      #     用例 1（状态序列在、计数序列缺席 ⇒ 期望不告警）修前 FAILED、修后 SUCCESS；
      #     用例 2（整族都不存在 ⇒ 期望 firing）修前修后都 SUCCESS（真阳性没被修没）。
      #   【埋点侧已于本次接通 · 2026-10-03】实测（C-2 报告 §3.3.3 证据 1）在**正在运行**的应用里，
      #     GET /api/business/prometheus 里这两条指标只有 # HELP/# TYPE、**0 条样本**；根因是
      #     **没有任何生产路径会无条件调用 get_circuit_breaker()**（tool_calling.py 只 import 不使用，
      #     其余调用点都要走到具体业务分支；跑了 45 分钟真实流量后这两条序列仍是 0 条样本，
      #     见 agent/circuit_breaker.py::get_circuit_breaker 尾注）⇒ 上面改 `and` 只解决"计数序列
      #     天然缺席"，单靠它**不足以**让 C-2 那一次告警 resolved。
      #     ⇒ 本次在**应用启动路径**上补上这一次无条件发布（链路逐级可追）：
      #         app_server.py::_publish_circuit_breaker_states()（模块级调用，启动即执行）
      #           → agent/monitoring/business_metrics.py::publish_deployed_circuit_breaker_states()
      #           → agent.circuit_breaker.get_circuit_breaker(<真实名字>)（同一访问点的
      #             _notify_state_observer(name, None, state)，circuit_breaker.py:686）
      #           → update_circuit_breaker_state() → yunshu_circuit_breaker_state（set_gauge 幂等）
      #     分层：由**组合根** app_server 驱动 monitoring（上层）→ circuit_breaker（下层），
      #       不让底层反向 import 上层（守 tests/unit/test_circuit_breaker_layering.py 与 .importlinter）。
      #     只发布**真实存在**的熔断器：名字逐个取自生产调用点
      #       guardrails.egress_chain / learning_budget / critic / schema_validation；
      #       直接构造、**不在全局注册表里**的实例（capregistry.{kind}、prometheus-exporter）
      #       刻意不发布 —— 用同名去注册表取会拿到另一个对象，那条序列会是**假的**。
      #     不改 export_prometheus() 的"空族只出 HELP/TYPE"契约（**不伪造样本**，
      #       否则"没有数据"与"数据是 0"又会被混为一谈）。
      #     【验证方式】`python -c "import app_server"` 后导出文本里能搜到形如
      #       yunshu_circuit_breaker_state{breaker_name="critic",state="closed"} 1.0 的**样本行**
      #       （实测 4 条，见 docs/closeout/熔断器状态序列接通_20261003.md）；
      #       回归防线 tests/unit/test_circuit_breaker_state_publication.py（5 条，含幂等与空族契约对照）。
      #   【剩余边界 · 必读，别把这条规则当成"已经彻底好了"】
      #     ① 应用**根本没起来 / 端点抓不到**（进程未启动、up{job="yunshu-business"}=0、
      #        /api/business/prometheus 不可达）时这两条序列依然不存在 ⇒ 本式**仍会 firing**——
      #        这正是本规则的本意（真阳性）。此时该修的是"应用没起来"，不是这条规则。
      #     ② 本次只发布**本部署真实存在**的那几个熔断器：将来新增了熔断器却漏登记，新熔断器
      #        不会有自己的序列（但已有熔断器的序列仍在 ⇒ 本式不会触发）—— 这是"漏登记"的
      #        可见性缺口，需要靠登记表守卫那一族测试补，不能靠这条规则兜。
      #     ③ yunshu_circuit_breaker_trigger_total 仍然是 counter，仍然只在**真的发生状态转换**
      #        时才诞生 —— 这是它的正确语义，不要为了"让告警能清"给它预置 0；本次的 `and` 已使
      #        "只有它缺席"不再单独钉死告警，两处配合才成立。
      #   【怎么回滚】表达式回滚：把下面 expr 里的 `and` 改回 `or`（并删掉本段注释）。
      #     埋点侧回滚：删掉 app_server.py 的 `_publish_circuit_breaker_states` 函数与紧随其后的
      #     那一行调用即可（一处；两处都能被上面的测试发现 —— 源码守卫会立刻转红）。
      - alert: CircuitBreakerMetricsMissing
        expr: absent(yunshu_circuit_breaker_state) and absent(yunshu_circuit_breaker_trigger_total)
        for: 5m
        labels:
          severity: warning
          category: config
          service: circuit_breaker
        annotations:
          summary: "熔断器指标缺失"
          description: "过去 5 分钟未采集到熔断器指标，配置可能被移除或模块未加载"
          runbook_url: "docs/DEPLOYMENT_CHECKLIST_circuit_breaker.md#一配置项检查"
          impact: "无法监控熔断器状态"
          action: "1. 检查 config.py 中 circuit_breaker 字段是否存在 2. 验证 BusinessMetricsCollector 是否正常初始化 3. 查看 /metrics 端点输出"
