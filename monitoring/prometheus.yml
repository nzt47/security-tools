global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ⚠️ 权威 job 名（S6 2026-09-20 起）
#   本文件是 docker-compose.monitoring.yml 实际挂载到 /etc/prometheus/prometheus.yml 的 scrape 配置，
#   yunshu 应用的 job 名以【下方 scrape_configs 里的 job_name】为唯一基准 = "yunshu"。
#   仓库中另有多份未被挂载的历史副本（monitoring/prometheus/prometheus.yml 用 'Yunshu-v2'、
#   deploy/monitoring/... 用 'yunshu-app'），它们只是快照，不得作为 job 名依据。
#   所有规则文件（alerts.yml / health_*.yml / recording_rules.yml 等）中的 job="..." 均按 "yunshu" 书写。
#   回退方式：改 job 名时必须同时改本文件的 job_name 和所有规则文件里的 job="..."，两者不一致 =
#   up{} 序列为空 = 依赖 job 的规则永不触发（这正是本次修复的缺陷）。
# ── 【2026-10-02 · 交付报告 §10 C-1】告警**投递**链路：已验证可用，但默认未启用 ──
#   现状：本文件**没有** alerting 段、两份 monitoring compose 也**没有** Alertmanager 服务
#   ⇒ 规则能求值、能在 /alerts 里看到 firing，但**没有任何通知发得出去**（这是"有告警没人知道"的经典形态）。
#   验证（2026-10-02 已做，非推断）：起 prom/alertmanager:v0.27.0 + 一条恒为真的测试规则 + 本机
#   webhook 接收器，实测 Prometheus(firing) → Alertmanager(/api/v2/alerts 可见) → webhook(POST 收到) 全通，
#   证据 docs/closeout/监控清理_evidence_20261002/alertmanager_delivery_received.jsonl。
#   启用方式（三处一起改，缺一处通知永远发不出）：
#     ① monitoring/alertmanager.example.yml → monitoring/alertmanager.yml（填入真实接收方）
#     ② docker-compose.monitoring.yml 里取消注释 alertmanager 服务（现成块已备好）
#     ③ 取消下面这段 alerting 的注释
#   注意：目标要写**服务名** alertmanager:9093（compose 网络按服务名解析）；
#   实测踩过"写成容器名 ⇒ 目标查不到 ⇒ 告警静默丢失"。
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

rule_files:
  # 路径解析说明：Prometheus 按【主配置文件所在目录】解析 rule_files 相对路径，此处即 /etc/prometheus/。
  # 因此下面的每一项都必须与 docker-compose.monitoring.yml 的挂载目标逐一对齐，否则规则静默不加载。
  - "alerts.yml"
  # [S6 2026-09-20] 路径修正：原为 "prometheus/rules/lock_watchdog_alerts.yml"，会解析成
  # /etc/prometheus/prometheus/rules/...，而 compose 实际只把该目录挂在 /etc/prometheus/rules
  # ⇒ 该文件从未被加载（CHG-2026-0729 想挂子目录规则，但路径前缀与挂载点不一致，未生效）。
  - "rules/lock_watchdog_alerts.yml"
  # 健康度评估体系规则（记录规则 + 告警规则）
  - "health_recording_rules.yml"
  - "health_alerts.yml"
  # ── [S6 2026-09-20] 补齐此前未加载的规则文件 ────────────────────────────────
  # 原 rule_files 仅列 4 个文件，仓库内另有 10 个格式合法、同属本套配置的规则文件从未加载
  # （合计 88 条 alert + 11 条 record）。纳入后：规则文件 4 → 14，告警 34 → 122，记录规则 22 → 33。
  # 未纳入的两个文件及原因见 docs/perf/可观测性实测.md 与本次交付说明：
  #   alerts_production.bak.20260730_010425.yml（时间戳备份件，与 alerts_production.yml 内容完全同构，
  #     同时加载会重复注册同名组 yunshu_alerts）、prometheus/rules/lock_watchdog_alerts_test.yml
  #     （promtool 单测文件，只有 tests: 无 groups:，加载必然报错）。
  # 回退方式：删除以下 10 行新增项即可精确回到修复前状态（原 4 个文件不受影响）。
  - "recording_rules.yml"
  - "alerts_production.yml"
  # 【2026-10-02 · 交付报告 §10 A-1】**已删除** "alerts_safe_file_reader.yml"（原 9 条）：
  #   它依赖 yunshu_safe_file_reader_* 指标，而发射方 utils/file_reader.py 的 SafeFileReader
  #   在非测试代码里**没有任何调用方**（历史读取已改走 agent/jsonl_history.py 的尾部窗口）
  #   ⇒ 指标恒为 0 ⇒ 9 条规则一条都不会触发。恒不触发的规则会让"告警覆盖率"变成假的，故删除。
  #   【2026-10-03 追加】那 5 个 yunshu_safe_file_reader_* 指标定义**也已删除**
  #   （agent/monitoring/prometheus.py + 唯一引用它们的 agent/server_routes/routes_logging.py
  #     两文件同改；/metrics 上不再出现这 5 个恒 0 的空名字）。恢复时须连指标定义一起恢复
  #   （git show <删除提交>^:agent/monitoring/prometheus.py），而不只是把规则捞回来。
  #   规则文件、本 rule_files 项、两份 compose 的挂载已**同时**移除 —— Prometheus 对 rule_files 里
  #   列了、容器内却不存在的文件会直接启动失败，三处必须同进同退。
  #   恢复路径：`git show <删除本次的提交>^:monitoring/alerts_safe_file_reader.yml`，并同时补回
  #   本文件的 rule_files 项与两份 compose 的挂载；**先接线**（真的有人调用 SafeFileReader）才值得恢复。
  - "circuit_breaker_alerts.yml"
  - "skill_retrieval_alerts.yml"
  - "alert_rules.yml"
  - "rules/reranker-alerts.yml"
  - "rules/hpa-skill-retrieval-alerts.yml"
  - "rules/yunshu-v6-query-pattern-alerts.yml"
  - "rules/planning_alerts.yml"

scrape_configs:
  - job_name: 'yunshu'
    static_configs:
      - targets: ['host.docker.internal:5678']
    metrics_path: '/metrics'
    scrape_interval: 5s
    
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── [2026-10-02 新增] 云枢**业务指标**采集目标 ──────────────────────────
  # 【为什么必须单独一个 job】业务指标不在 /metrics 上，而在云枢自己的
  #   GET /api/business/prometheus（app_server.py:1623 的注释本就写着
  #   「Prometheus 告警依赖 /api/business/prometheus」）—— 但**此前没有任何 job 抓它**，
  #   加上业务指标整层没接线（见交付报告 §9.18），导致：引用业务指标的告警是死规则、
  #   用 absent() 写的那条（CircuitBreakerMetricsMissing）长期误报。
  # 【鉴权】该端点只在 CP_API_AUTH_ALLOW 的豁免清单里（与 /metrics 同口径）⇒
  #   这里**不需要** bearer_token，也就不会把令牌写进监控配置文件（那比豁免只读端点更差）。
  # 【回退】删掉本 job：业务指标不再进 Prometheus，相关告警回到「永不触发」。
  - job_name: 'yunshu-business'
    static_configs:
      - targets: ['host.docker.internal:5678']
    metrics_path: '/api/business/prometheus'
    scrape_interval: 30s

  # ── [2026-10-02 新增] Grafana 采集目标 ──────────────────────────────────
  # 【为什么之前没有 / 为什么现在必须有】
  #   `monitoring/alerts.yml` 的 `GrafanaDown` 规则用的是 `up{job="grafana"} == 0`，
  #   但本文件此前**没有** grafana job ⇒ 该序列为空 ⇒ **这条规则永远不可能触发**：
  #   Grafana 真挂了也不会有人收到告警（是「死规则」，不是「误报」）。
  # 【为什么以前不敢补】（此前的推断已被实测推翻，记录下来免得又被理由劝退）
  #   旧注释称「compose 未设 GF_METRICS_ENABLED=true ⇒ /metrics 返回 404 ⇒ 补了会持续误报」。
  #   **2026-10-02 起真栈实测**：grafana/grafana:10.4.0 的 `GET /metrics` 返回 **HTTP 200**
  #   （116,556 字节完整指标文本），**不需要**该环境变量；随后临时补本 job 实测
  #   `target=up`、`up{job="grafana"}=1`、`up{job="grafana"} == 0` 返回 **0 条**
  #   ⇒ 补 job **不会**造成误报。旧的「404」前提是错的。
  # 【为什么用 grafana:3000 而不是 localhost】两份 monitoring compose 都把 grafana 起在
  #   同一自定义网络 `yunshu-monitoring` 上（服务名 grafana、容器端口 3000）⇒ 容器内按服务名解析。
  # 【顺带】两份 compose 现已显式写 GF_METRICS_ENABLED=true —— 实测默认就是开，
  #   写出来是为了**钉住行为**，防将来 Grafana 版本改默认值后本 job 静默失效。
  # 【回退】删掉本 job 即回到原状（GrafanaDown 重新变成永不触发的死规则）。
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s
