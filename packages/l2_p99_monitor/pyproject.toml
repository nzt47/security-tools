[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l2-p99-monitor"
version = "1.0.1"
description = "通用 P99 监控告警包：解析性能日志 + 阈值检查 + 多渠道告警"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Yunshu Team"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

[project.scripts]
l2-p99-monitor = "l2_p99_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/nzt47/security-tools/tree/master/packages/l2_p99_monitor"
Repository = "https://github.com/nzt47/security-tools"

[tool.setuptools.packages.find]
include = ["l2_p99_monitor*"]
