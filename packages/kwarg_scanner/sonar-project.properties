# SonarQube 项目配置 — 用于上传 kwarg-scanner 外部问题
# 复制到 CI 工作区或项目根目录使用
#
# 用法（与 .github/workflows/kwarg-sonarqube.yml 配合）:
#   1. 生成 GIIF 报告: docker run --rm -v "$(pwd):/project" -e OUTPUT_FORMAT=sonarqube kwarg-scanner
#   2. 运行 sonar-scanner: sonar-scanner -Dsonar.host.url=... -Dsonar.token=...
#
# 参考:
#   https://docs.sonarqube.org/latest/analyzing-source-code/importing-external-issues/

# 项目唯一标识
sonar.projectKey=kwarg-scanner

# 项目名称与版本
sonar.projectName=kwarg-scanner
sonar.projectVersion=1.0.0

# 源码目录（被扫描的代码位置）
sonar.sources=agent,packages

# 排除目录
sonar.exclusions=**/tests/**,**/backup/**,**/node_modules/**

# 外部问题报告路径（kwarg-scanner 生成的 GIIF JSON）
sonar.externalIssuesReportPaths=kwarg-sonar-issues.json

# Python 支持
sonar.python.version=3

# 编码
sonar.sourceEncoding=UTF-8
