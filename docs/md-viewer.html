<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown 预览（表格 + 代码高亮）</title>
  <!-- 渲染样式：GitHub Markdown（浅色）+ highlight.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-light.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css">
  <style>
    body { margin: 0; background: #f6f8fa; }
    .markdown-body { max-width: 900px; margin: 24px auto; padding: 24px 32px; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; }
    code.hljs { background: #f6f8fa; border-radius: 6px; }
  </style>
</head>
<body class="markdown-body">
  <article id="content"><p>加载中…</p></article>

  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <!-- 注意：必须用 UMD 浏览器构建（@highlightjs/cdn-assets），lib/common.min.js 是 CommonJS，浏览器加载后 hljs 未定义 -->
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
  <script>
    // 用法: md-viewer.html?file=wiki/system-log.openapi.md
    var params = new URLSearchParams(location.search)
    var file = params.get('file') || 'wiki/system-log.openapi.md'

    var md = window.markdownit({
      html: true,
      highlight: function (str, lang) {
        // 防御：hljs 未加载时降级为转义输出，避免整页渲染失败
        if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
          try { return '<pre class="hljs"><code>' + hljs.highlight(str, { language: lang }).value + '</code></pre>' } catch (e) {}
        }
        return '<pre class="hljs"><code>' + md.utils.escapeHtml(str) + '</code></pre>'
      }
    })

    fetch(file)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status + ' - ' + file); return r.text() })
      .then(function (text) { document.getElementById('content').innerHTML = md.render(text) })
      .catch(function (err) {
        document.getElementById('content').innerHTML = '<p style="color:#cf222e">加载失败: ' + err.message + '</p>'
      })
  </script>
</body>
</html>
