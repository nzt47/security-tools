# 使用阿里云镜像源的 Docker Compose 配置
# 适用于中国大陆地区用户

# 【2026-10-02 删除 version: '3.8'】Compose V2 已废弃该字段，每次 compose 命令都会打印
#   `the attribute `version` is obsolete, it will be ignored` —— 纯噪音，且会淹没真正的警告。
#   删除它不改变任何行为（V2 本就忽略它）。回滚：把 version: '3.8' 加回本行位置。

services:
  prometheus:
    # 使用网易镜像加速器
    image: hub-mirror.c.163.com/prom/prometheus:latest
    container_name: yunshu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      # ── [2026-10-01] 补齐与 docker-compose.monitoring.yml 对齐的规则文件挂载 ──────
      # 【为什么必须补】monitoring/prometheus.yml 的 rule_files 已从 4 条扩到 14 条，
      #   而 Prometheus 把 rule_files 的相对路径按【/etc/prometheus】解析 ——
      #   凡是在配置里列了、容器内却不存在的规则文件，都会导致 Prometheus
      #   **启动/热加载失败（no such file）**，比不写更糟。
      #   本文件此前只挂 prometheus.yml + alerts.yml ⇒ 若线上用这份起栈，
      #   12 条新增 rule_files 全部找不到，**监控会直接起不来**。
      #   两份 compose 必须保持挂载一致（本文件是阿里云镜像变体，仅镜像源不同）。
      # 【回退】与 monitoring/prometheus.yml 中新增的 rule_files 成对删除。
      #   rules/ 前缀的 4 个文件由下面这一条目录挂载统一覆盖，无需逐个单挂。
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./monitoring/health_recording_rules.yml:/etc/prometheus/health_recording_rules.yml:ro
      - ./monitoring/health_alerts.yml:/etc/prometheus/health_alerts.yml:ro
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./monitoring/alerts_production.yml:/etc/prometheus/alerts_production.yml:ro
      - ./monitoring/alerts_safe_file_reader.yml:/etc/prometheus/alerts_safe_file_reader.yml:ro
      - ./monitoring/circuit_breaker_alerts.yml:/etc/prometheus/circuit_breaker_alerts.yml:ro
      - ./monitoring/alerts/skill_retrieval_alerts.yml:/etc/prometheus/skill_retrieval_alerts.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped
    networks:
      - yunshu-monitoring
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    # 使用网易镜像加速器
    image: hub-mirror.c.163.com/grafana/grafana:latest
    container_name: yunshu-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # 【2026-10-02 新增】显式打开 /metrics。
      #   实测 grafana/grafana:10.4.0 **默认就是开**（GET /metrics -> HTTP 200，116,556 字节），
      #   写出来是为了**钉住行为**：prometheus.yml 的 `job_name: grafana` 与 alerts.yml 的
      #   `GrafanaDown` 都依赖这个端点，一旦将来 Grafana 改默认值，本 job 会静默失效
      #   （target down ⇒ GrafanaDown 恒触发，但那时你至少会看到告警而不是静默）。
      - GF_METRICS_ENABLED=true
      # 时区设置
      - TZ=Asia/Shanghai
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - yunshu-monitoring
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  yunshu-monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# 说明：
# 1. 使用阿里云镜像源，无需配置 Docker 镜像加速器
# 2. 镜像地址格式：registry.cn-hangzhou.aliyuncs.com/组织/镜像名:版本
# 3. 如果阿里云镜像不可用，可尝试以下替代源：
#    - hub-mirror.c.163.com/prom/prometheus:latest
#    - mirror.baidubce.com/prom/prometheus:latest
#    - registry.docker-cn.com/prom/prometheus:latest
