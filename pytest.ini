[pytest]
testpaths = tests

# 【变易】--import-mode=importlib 下 pytest 不把测试目录加入 sys.path，导致
# tests/unit/test_orchestrator_reject.py 的 `from conftest import` 找不到模块。
# 显式将 tests/unit 加入 sys.path（pytest 7+ pythonpath 选项），让共享工具函数可复用。
# 【不易】已确认全 tests/ 仅 test_orchestrator_reject.py 一个文件用 `from conftest import`，无跨套件同名冲突。
pythonpath = tests/unit

python_files = test_*.py *_test.py
python_functions = test_* verify_*
python_classes = Test* *Test*

# asyncio 模式: auto — 所有 async def test_ 自动识别为 asyncio 测试
# 【变易】从 strict 升级到 auto，省去 @pytest.mark.asyncio 装饰器（保留亦无害）
# 【不易】已确认 43 个 async 测试文件均无 event_loop fixture 冲突、无 asyncio.run 嵌套
asyncio_mode = auto

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --strict-config
    --import-mode=importlib
    --maxfail=0
    # 【变易】2026-08-31 污染治理 P1：60s → 120s。
    # 根因：--timeout-method=thread 下超时的测试线程不被回收，长跑中累积成
    # 资源耗竭 → 后续测试 setup 级联失败（全量 22072 errors 主放大器之一）。
    # 模型加载/重 IO 测试在资源竞争下偶超 60s；放宽到 120s 减少误杀。
    # 极慢测试应显式 @pytest.mark.timeout(N) 覆盖，不要依赖全局默认。
    # 【D2 · 2026-09-19 补充】必须知道 thread 法的**真实代价**：
    #   超时不是"这条测试失败"，而是 `pytest_timeout.py:505 timeout_timer()`
    #   → `finally: os._exit(1)` **杀掉整个 pytest 进程** ⇒ 同批里排在后面的
    #   测试文件**一个都不执行**，且不输出结束摘要（rc 只有 1，与"有测试失败"无法区分）。
    #   实测代价：TASK-03 第 8 块 63 个文件里 **14 个从未执行**
    #   （_ci_logs/task03/chunk08_missing.txt）。
    # Why 不能改成 --timeout-method=signal：Windows 无 signal.SIGALRM，
    #   实测显式传入会 `AttributeError: module 'signal' has no attribute 'SIGALRM'`
    #   → pytest INTERNALERROR、**0 个测试运行**（比 thread 更糟）。
    #   CI 是 Linux，用 signal 没问题（ci.yml:457）；本地/生产是 Windows，只能 thread。
    # ⇒ 兜底在**调用层**：scripts/run_full_pytest.py 现在会逐块校验"是否正常收尾"，
    #   发现未跑完的块就把该块文件逐个独立进程补跑，并点名报出真正元凶。
    #   完整机制、复现与实测见 docs/closeout/TEST_TIMEOUT_20260919.md
    #   最小复现入口：python scripts/repro_timeout_batch_loss.py
    --timeout=120
    --timeout-method=thread
    --continue-on-collection-errors
    --ignore=tests/benchmark
    --ignore=memory/tests
    --ignore=cognitive/test_cognitive
    --ignore=tests/performance
    --ignore=tests/stress
    --ignore=tests/e2e
    --ignore=tests/integration/check_targets.py
    --ignore=tests/integration/check_baseline.py
    --ignore=tests/integration/check_5xx_source.py
    --ignore=tests/unit/temp
    # 【变易】2026-08-02 全量测试 IO 超时临时跳过：
    #   - tests/test_digital_life.py: WMI Win32_Service 查询偶发阻塞（本地 Windows 环境）
    #   - tests/unit/test_utils_index_manager.py: importlib _fill_cache 文件系统扫描卡顿
    #   root cause 详见 docs/CI_GIT_PULL_REBASE_FIX.md；恢复运行前先执行
    #   scripts/cleanup_io_cache.ps1（清理 WMI ADAP 缓存 + Python 缓存）
    --ignore=tests/test_digital_life.py
    --ignore=tests/unit/test_utils_index_manager.py

markers =
    unit: 单元测试 - 测试单个模块或函数
    integration: 集成测试 - 测试模块间的交互
    e2e: 端到端测试 - 测试完整业务流程
    performance: 性能测试 - 性能基准测试
    stress: 压力测试 - 极限负载测试
    security: 安全测试 - 安全相关测试
    slow: 慢速测试 - 执行时间较长的测试
    quick: 快速测试 - 快速执行的测试
    critical: 关键测试 - 必须通过的测试
    p0: P0优先级测试
    p1: P1优先级测试
    p2: P2优先级测试 - 并发/跨平台/兼容性测试
    p3: P3优先级测试 - 边界/异常/恢复测试
    skip_ci: CI环境中跳过
    requires_llm: 需要LLM服务的测试
    chaos: 混沌测试 - 故障注入与极端场景稳定性验证
    asyncio: asyncio 异步测试标记（需配合 pytest-asyncio 插件使用）
    forked_incompatible: 与 pytest-forked --forked 不兼容的测试（mock os.path.abspath 会导致 coverage trace 失败）
    eval: 技能检索评估测试 - Precision/Recall 阈值守卫（test_skills_mgmt.py 使用）
    serial: 需串行执行的测试（日志采集类断言，pytest-xdist 并行时全局 logging 状态竞争导致偶发失败）

log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# ════════════════════════════════════════════════════════════
# 固定 seed 验证逻辑（P0 任务清单 T-4，2026-08-13）
# ════════════════════════════════════════════════════════════
# 目的：顺序污染回归的可复现验证入口。默认行为不强制固定 seed（保留随机探测能力）。
# 用法（在项目根目录执行）：
#   1) 全量固定 seed 回归：   python -m pytest tests/ -q --randomly-seed=20260813
#   2) 抽样稳定（3 个 seed）： python -m pytest tests/ -q --randomly-seed=1
#                            python -m pytest tests/ -q --randomly-seed=2
#                            python -m pytest tests/ -q --randomly-seed=3
#   3) 禁用随机（对照基线）：  python -m pytest tests/ -q -p no:randomly
# 判定：固定 seed 下 0 failed / 0 errors（skipped/xfailed 不计）即顺序污染已收敛；
#       出现失败时用 failures_baseline.txt 比对，确认是否新增顺序污染回归。
# 已知基线（2026-08-13 全量 -p no:randomly）：68 failed / 14359 passed / 10 errors，
#       失败清单见 failures_baseline.txt（T-0 固化）。
# 【2026-08-14 补充】本地随机跑法暴露的 2 个顺序依赖 flaky：
#   - tests/unit/test_optimized_storage.py::test_create_optimized_storage（模块重复导入致 isinstance 误判）
#   - tests/unit/test_skill_index_cache.py 性能延迟断言
#   已验证 seed=20260813 下两者（连同 test_memory_vector_store）67 用例全部通过；
#   CI 全量入口（ci.yml unit 分片、coverage-ci.yml）已固定 -p no:randomly 不漂移，
#   本地全量回归请用入口 1）固定 seed 复现，避免随机 seed 漂移引入假失败。
# 【2026-08-31 污染治理 P1】Windows 本地直接跑 pytest 前必须启用解释器 UTF-8 模式：
#   PowerShell:  $env:PYTHONUTF8="1"; $env:PYTHONIOENCODING="utf-8"; python -m pytest ...
#   根因：中文 Windows 默认 GBK 代码页下，测试向 stdout/stderr 写入 GBK 字节，
#   pytest capture 以 UTF-8 读回回放 tmpfile → UnicodeDecodeError（teardown 级联
#   放大器之一，实测 test_extensions/test_routes_config 批量 1 failed+1 error 根因）。
#   推荐入口：python scripts/run_full_pytest.py（已内置 PYTHONUTF8/PYTHONIOENCODING）。


# ════════════════════════════════════════════════════════════════════════════
# 【D1 · 2026-09-19 覆盖率口径统一】此处原有 `[coverage:run]` / `[coverage:report]`
# / `[coverage:html]` 三节（`branch = True` / `parallel = True` /
# `source = agent, core, memory, persona, planning, lifetrace` / omit / exclude_lines）。
# **三节全部是死配置，已删除。**
#
# 为什么必须删而不是留着：coverage.py 的配置发现顺序是
#     .coveragerc → .coveragerc.toml → setup.cfg → tox.ini → pyproject.toml
# **不含 pytest.ini**。本机实测（coverage 7.15.4）：
#     $ python -m coverage debug config
#     config_file: C:\Users\Administrator\agent\pyproject.toml
#     config_files_attempted: .coveragerc / .coveragerc.toml / setup.cfg / tox.ini / pyproject.toml
#     branch: False        ← pytest.ini 写的是 True，未生效
#     parallel: False      ← pytest.ini 写的是 True，未生效
#     source: agent sensor memory planning persona core cognitive lifetrace utils  ← 9 个
#                          ← pytest.ini 写的是 6 个，未生效
# ⇒ 留着它等于在仓库里放**第三份互相矛盾的口径声明**（6 包 / branch 开），
#   而读代码的人会以为 branch 覆盖是开的。删掉后口径只剩一份真相源：
#   `pyproject.toml` 的 `[tool.coverage.*]`。
# 覆盖率口径说明与"覆盖率不得下降"断言见：
#   docs/closeout/COVERAGE_SCOPE_20260919.md
#   scripts/run_authoritative_coverage.py（权威采集，口径自动读 pyproject）
#   scripts/check_coverage_regression.py（基线比对 + 口径一致性硬校验）
# 注：那三节里的 `exclude_lines`（def __repr__ / raise NotImplementedError /
#   if __name__ == "__main__" / @abstractmethod / pragma: no cover）**同样从未生效**，
#   而历史 49.08% / 77.20% 两个数字都是在"没有这些 exclude"的口径下测出来的。
#   ⇒ 本次**不把它补进 pyproject**：补进去会让分母变小、覆盖率凭空上升，
#     属于口径变更而非修复，且会让新数字与历史基线不可比。
#   若确需启用，必须同时重建基线（登记为债务，见上述文档 §6）。
# ════════════════════════════════════════════════════════════════════════════